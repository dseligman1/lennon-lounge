name: FPL Data Sync

on:
  schedule:
    # During active gameweeks: every 30 min Sat 12:00-23:00 and Sun 12:00-23:00 (UK time = UTC+1 BST)
    - cron: '*/30 11-22 * * 6,0'
    # Daily refresh at 6am UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch: # "Run workflow" button in the Actions tab — for an on-demand sync

jobs:
  sync-fpl:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch FPL data and write to Firebase
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID }}
        run: |
          node - << 'EOF'
          const https = require('https');

          const LEAGUE_ID = process.env.FPL_LEAGUE_ID;
          const DB_URL = process.env.FIREBASE_DB_URL;
          const SERVICE_KEY = JSON.parse(process.env.FIREBASE_SERVICE_KEY);

          // Mirrors the TEAMS array in index.html (id/name/owner/fplName only — that's all
          // matching needs). If you rename a team, an owner, or add/replace a manager there,
          // copy the same change here so server-side matching stays in sync with the app.
          const TEAMS = [
            {id:'selig', name:"Selig's Shakers",     owner:'Daniel',   fplName:'Daniel Seligman'},
            {id:'rowez', name:'Inter Rowe-Z',         owner:'Jack',     fplName:'Jack Rowe'},
            {id:'murov', name:'The Murovers',         owner:'Alex',     fplName:'Alex Murawa'},
            {id:'fride', name:'Fride FC',             owner:'Benjamin', fplName:'Benjamin Finestein'},
            {id:'round', name:'Roundabout Rangers',   owner:'Adam',     fplName:'Adam Bowers'},
            {id:'dunny', name:'DUNNEY MONSTERS',      owner:'James',    fplName:'James Hodari'},
            {id:'adder', name:'The Adders FC',        owner:'Jacob',    fplName:'Jacob Adshead'},
            {id:'kapil', name:'KapilaMockingbirds',   owner:'Sam',      fplName:'Sam Kapila'},
            {id:'blank', name:'Blanks Bruisers',      owner:'Simon',    fplName:'Simon Blank'},
            {id:'henry', name:"Henry's Heroes",       owner:'Ben',      fplName:'Ben Annis'},
            {id:'disco', name:"Disco Dave's Dodgers", owner:'Jason',    fplName:'Jason Stein'},
            {id:'huxle', name:'HUXLEY',               owner:'Ryan',     fplName:'Ryan Silvester'},
          ];

          // Same precedence as matchTeamName() in index.html: the manager's real name first
          // (fixed — protects against an in-season FPL team rename breaking the mapping),
          // then the FPL team name as a fallback.
          function matchTeamName(str) {
            const s = (str || '').toLowerCase().trim();
            if (!s) return null;
            let t = TEAMS.find(t => t.fplName.toLowerCase() === s); if (t) return t.id;
            t = TEAMS.find(t => t.owner.toLowerCase() === s); if (t) return t.id;
            t = TEAMS.find(t => t.name.toLowerCase() === s); if (t) return t.id;
            t = TEAMS.find(t => t.name.toLowerCase().includes(s) || s.includes(t.name.toLowerCase())); if (t) return t.id;
            const words = s.split(/\s+/).filter(w => w.length > 3);
            t = TEAMS.find(t => words.some(w => t.fplName.toLowerCase().includes(w))); if (t) return t.id;
            t = TEAMS.find(t => words.some(w => t.name.toLowerCase().includes(w)));
            return t ? t.id : null;
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              const opts = {
                headers: {
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'application/json',
                }
              };
              https.get(url, opts, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { reject(new Error('Parse error: ' + data.slice(0,200))); }
                });
              }).on('error', reject);
            });
          }

          async function getAccessToken(serviceKey) {
            // Generate a JWT for Firebase service account. The downloaded JSON uses snake_case
            // field names (private_key, client_email) — mapped to camelCase locals here.
            const { private_key: privateKey, client_email: clientEmail } = serviceKey;
            const now = Math.floor(Date.now() / 1000);
            const payload = {
              iss: clientEmail, sub: clientEmail,
              aud: 'https://oauth2.googleapis.com/token',
              iat: now, exp: now + 3600,
              scope: 'https://www.googleapis.com/auth/firebase.database https://www.googleapis.com/auth/userinfo.email'
            };
            const { createSign } = require('crypto');
            const header = Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url');
            const body = Buffer.from(JSON.stringify(payload)).toString('base64url');
            const sign = createSign('RSA-SHA256');
            sign.update(`${header}.${body}`);
            const sig = sign.sign(privateKey, 'base64url');
            const jwt = `${header}.${body}.${sig}`;

            return new Promise((resolve, reject) => {
              const postData = `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`;
              const req = https.request({
                hostname: 'oauth2.googleapis.com', path: '/token', method: 'POST',
                headers: {'Content-Type':'application/x-www-form-urlencoded','Content-Length':postData.length}
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d).access_token); } catch(e) { reject(e); } });
              });
              req.on('error', reject);
              req.write(postData);
              req.end();
            });
          }

          function readFirebase(path, token) {
            const dbHost = DB_URL.replace('https://','').replace(/\/$/, '');
            return new Promise((resolve, reject) => {
              https.get({
                hostname: dbHost, path: `/${path}.json`,
                headers: { 'Authorization': `Bearer ${token}` }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { resolve(null); } });
              }).on('error', () => resolve(null));
            });
          }

          function writeToFirebase(path, data, token) {
            const dbHost = DB_URL.replace('https://','').replace(/\/$/, '');
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(data);
              const req = https.request({
                hostname: dbHost, path: `/${path}.json`,
                method: 'PATCH',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'Authorization': `Bearer ${token}`
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { console.log(`PATCH ${path}: ${res.statusCode}`); resolve(d); });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            if (!LEAGUE_ID) { console.log('No FPL_LEAGUE_ID set — skipping'); return; }

            console.log(`Fetching FPL league ${LEAGUE_ID}...`);
            const token = await getAccessToken(SERVICE_KEY);

            const bootstrap = await fetchJson('https://draft.premierleague.com/api/bootstrap-static');
            // bootstrap.events is {current, data:[...]} on the draft API, not a bare array.
            const evList = Array.isArray(bootstrap.events) ? bootstrap.events : ((bootstrap.events && bootstrap.events.data) || []);

            // Live in-play points for the current gameweek, for the "in-play" odds/results view.
            const currentEvent = evList.find(e => e.is_current);
            const liveScores = {};
            if (currentEvent) {
              try {
                const picks = await fetchJson(`https://draft.premierleague.com/api/event/${currentEvent.id}/live`);
                liveScores[currentEvent.id] = { live: true, scores: picks };
              } catch(e) {
                console.log('Could not fetch live scores:', e.message);
              }
            }

            const fplPatch = { leagueId: LEAGUE_ID, liveScores, lastSync: Date.now() };

            // Full sync — the same computation the in-app "Sync FPL" button runs (ingestFpl in
            // index.html), just running server-side so it isn't blocked by the FPL API's CORS
            // policy the way a direct browser fetch is. Pulls the season's full fixture list,
            // finished results (→ history, powers the odds engine), and the team/manager
            // mapping. Safe to (and expected to) run on every trigger — it's a full rebuild
            // from the latest FPL data each time, same as clicking "Sync FPL" repeatedly.
            let details = null;
            try { details = await fetchJson(`https://draft.premierleague.com/api/league/${LEAGUE_ID}/details`); }
            catch(e) { console.log('Could not fetch league details:', e.message); }

            if (details && details.league_entries && details.matches) {
              const existingFpl = (await readFirebase('lennon-lounge/fpl', token)) || {};
              // "Hold back last N GWs" (Back Office → FPL Settings) — a testing toggle that
              // treats the most recent N already-finished real gameweeks as if still upcoming,
              // for trying out the live betting flow against real historical data. Should be 0
              // for a genuinely live season; honoured here so an automated run can't change the
              // behaviour the admin configured in-app.
              const holdbackRaw = await readFirebase('lennon-lounge/sim/holdback', token);
              const hb = Math.max(0, Number(holdbackRaw) || 0);

              const entryMap = { ...(existingFpl.entryMap || {}) };
              const unmatched = [];
              details.league_entries.forEach(en => {
                const playerName = ((en.player_first_name || '') + ' ' + (en.player_last_name || '')).trim();
                const tid = matchTeamName(playerName) || matchTeamName(en.entry_name || '');
                if (tid) entryMap[en.id] = tid;
                else if (en.entry_name) unmatched.push(`${en.entry_name} (${playerName || 'no manager name'})`);
              });

              const history = [], fplFixtures = {}, simEvents = {};
              const finished = details.matches.filter(m => m.finished);
              const maxEv = finished.length ? Math.max(...finished.map(m => m.event)) : 0;
              const simFrom = maxEv - hb + 1;
              details.matches.forEach(m => {
                const a = entryMap[m.league_entry_1], b = entryMap[m.league_entry_2];
                if (!a || !b) return;
                if (m.finished) {
                  if (hb > 0 && m.event >= simFrom) {
                    (simEvents[m.event] = simEvents[m.event] || []).push({a, b, ap: m.league_entry_1_points, bp: m.league_entry_2_points});
                    (fplFixtures[m.event] = fplFixtures[m.event] || []).push({home: a, away: b});
                  } else {
                    history.push({event: m.event, a, b, ap: m.league_entry_1_points, bp: m.league_entry_2_points});
                  }
                } else {
                  (fplFixtures[m.event] = fplFixtures[m.event] || []).push({home: a, away: b});
                }
              });

              const events = { ...(existingFpl.events || {}) };
              evList.forEach(ev => { events[ev.id] = { deadline: ev.deadline_time ? new Date(ev.deadline_time).getTime() : null, name: ev.name }; });

              Object.assign(fplPatch, { entryMap, events });
              await writeToFirebase('lennon-lounge', { history, fplFixtures }, token);
              // sim.events isn't touched here deliberately — it's only ever populated when
              // holdback > 0 (a deliberate testing setup) and the admin's own in-app sync
              // already owns rebuilding it in that mode.
              if (hb > 0) await writeToFirebase('lennon-lounge/sim', { events: simEvents }, token);

              if (unmatched.length) console.log('Unmatched FPL entries:', unmatched.join(', '));
              console.log(`Full sync: ${history.length} history result(s), ${Object.keys(fplFixtures).length} gameweek(s) with fixtures, ${unmatched.length} unmatched entr(y/ies)`);
            } else {
              console.log('League details unavailable this run — synced live scores only.');
            }

            await writeToFirebase('lennon-lounge/fpl', fplPatch, token);
            console.log('FPL sync complete');
          }

          main().catch(e => { console.error('FPL sync failed:', e); process.exit(1); });
          EOF
