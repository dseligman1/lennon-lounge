name: FPL Data Sync

on:
  # Fires every hour, every day — cheap to declare and, thanks to the self-throttle at the top of
  # main() below, cheap to run: most of these ticks do one lightweight fetch, decide nothing on
  # FPL could have changed, and exit in a couple of seconds with zero Firebase writes. The full
  # sync only actually runs within 2h before / 1h after a gameweek deadline, or on a day real PL
  # fixtures are being played — using FPL's own live deadline/fixture data rather than a
  # hardcoded matchday guess, so it self-corrects every week even when fixtures get rearranged.
  # workflow_dispatch (the "Run workflow" button / Back Office → FPL Sync shortcut) always forces
  # a full sync regardless of the throttle.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-fpl:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch FPL data and write to Firebase
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          node - << 'EOF'
          const https = require('https');

          const LEAGUE_ID = process.env.FPL_LEAGUE_ID;
          const DB_URL = process.env.FIREBASE_DB_URL;
          const SERVICE_KEY = JSON.parse(process.env.FIREBASE_SERVICE_KEY);

          // Mirrors the TEAMS array in index.html (id/name/owner/fplName only — that's all
          // matching needs). If you rename a team, an owner, or add/replace a manager there,
          // copy the same change here so server-side matching stays in sync with the app.
          const TEAMS = [
            {id:'selig', name:"Selig's Shakers",     owner:'Daniel',   fplName:'Daniel Seligman'},
            {id:'rowez', name:'Inter Rowe-Z',         owner:'Jack',     fplName:'Jack Rowe'},
            {id:'murov', name:'The Murovers',         owner:'Alex',     fplName:'Alex Murawa'},
            {id:'fride', name:'Fride FC',             owner:'Benjamin', fplName:'Benjamin Finestein'},
            {id:'round', name:'Roundabout Rangers',   owner:'Adam',     fplName:'Adam Bowers'},
            {id:'dunny', name:'DUNNEY MONSTERS',      owner:'James',    fplName:'James Hodari'},
            {id:'adder', name:'The Adders FC',        owner:'Jacob',    fplName:'Jacob Adshead'},
            {id:'kapil', name:'KapilaMockingbirds',   owner:'Sam',      fplName:'Sam Kapila'},
            {id:'blank', name:'Blanks Bruisers',      owner:'Simon',    fplName:'Simon Blank'},
            {id:'henry', name:"Henry's Heroes",       owner:'Ben',      fplName:'Ben Annis'},
            {id:'disco', name:"Disco Dave's Dodgers", owner:'Jason',    fplName:'Jason Stein'},
            {id:'huxle', name:'HUXLEY',               owner:'Ryan',     fplName:'Ryan Silvester'},
          ];

          // Same precedence as matchTeamName() in index.html: the manager's real name first
          // (fixed — protects against an in-season FPL team rename breaking the mapping),
          // then the FPL team name as a fallback.
          function matchTeamName(str) {
            const s = (str || '').toLowerCase().trim();
            if (!s) return null;
            let t = TEAMS.find(t => t.fplName.toLowerCase() === s); if (t) return t.id;
            t = TEAMS.find(t => t.owner.toLowerCase() === s); if (t) return t.id;
            t = TEAMS.find(t => t.name.toLowerCase() === s); if (t) return t.id;
            t = TEAMS.find(t => t.name.toLowerCase().includes(s) || s.includes(t.name.toLowerCase())); if (t) return t.id;
            const words = s.split(/\s+/).filter(w => w.length > 3);
            t = TEAMS.find(t => words.some(w => t.fplName.toLowerCase().includes(w))); if (t) return t.id;
            t = TEAMS.find(t => words.some(w => t.name.toLowerCase().includes(w)));
            return t ? t.id : null;
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              const opts = {
                headers: {
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'application/json',
                }
              };
              https.get(url, opts, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { reject(new Error('Parse error: ' + data.slice(0,200))); }
                });
              }).on('error', reject);
            });
          }

          async function getAccessToken(serviceKey) {
            // Generate a JWT for Firebase service account. The downloaded JSON uses snake_case
            // field names (private_key, client_email) — mapped to camelCase locals here.
            const { private_key: privateKey, client_email: clientEmail } = serviceKey;
            const now = Math.floor(Date.now() / 1000);
            const payload = {
              iss: clientEmail, sub: clientEmail,
              aud: 'https://oauth2.googleapis.com/token',
              iat: now, exp: now + 3600,
              scope: 'https://www.googleapis.com/auth/firebase.database https://www.googleapis.com/auth/userinfo.email'
            };
            const { createSign } = require('crypto');
            const header = Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url');
            const body = Buffer.from(JSON.stringify(payload)).toString('base64url');
            const sign = createSign('RSA-SHA256');
            sign.update(`${header}.${body}`);
            const sig = sign.sign(privateKey, 'base64url');
            const jwt = `${header}.${body}.${sig}`;

            return new Promise((resolve, reject) => {
              const postData = `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`;
              const req = https.request({
                hostname: 'oauth2.googleapis.com', path: '/token', method: 'POST',
                headers: {'Content-Type':'application/x-www-form-urlencoded','Content-Length':postData.length}
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d).access_token); } catch(e) { reject(e); } });
              });
              req.on('error', reject);
              req.write(postData);
              req.end();
            });
          }

          function readFirebase(path, token) {
            const dbHost = DB_URL.replace('https://','').replace(/\/$/, '');
            return new Promise((resolve, reject) => {
              https.get({
                hostname: dbHost, path: `/${path}.json`,
                headers: { 'Authorization': `Bearer ${token}` }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { resolve(null); } });
              }).on('error', () => resolve(null));
            });
          }

          function writeToFirebase(path, data, token) {
            const dbHost = DB_URL.replace('https://','').replace(/\/$/, '');
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(data);
              const req = https.request({
                hostname: dbHost, path: `/${path}.json`,
                method: 'PATCH',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'Authorization': `Bearer ${token}`
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { console.log(`PATCH ${path}: ${res.statusCode}`); resolve(d); });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          // POST = Firebase's "push" semantics (server generates a unique child key). Used only for
          // the admin notification below — everything else in this file is a targeted PATCH merge.
          function pushToFirebase(path, data, token) {
            const dbHost = DB_URL.replace('https://','').replace(/\/$/, '');
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(data);
              const req = https.request({
                hostname: dbHost, path: `/${path}.json`,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'Authorization': `Bearer ${token}`
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { console.log(`POST ${path}: ${res.statusCode}`); resolve(d); });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }
          async function pushNotif(teamId, type, msg, token) {
            // Mirrors pushNotif() in index.html field-for-field: {id, type, msg, ts, read}, pushed
            // to lennon-lounge-notifs/{teamId}. Written directly via the REST POST above since this
            // Action has no Firebase SDK, only the same service-account REST calls used everywhere
            // else in this file.
            const notif = { id: Date.now() + '_' + Math.random().toString(36).slice(2), type, msg, ts: Date.now(), read: false };
            return pushToFirebase(`lennon-lounge-notifs/${teamId}`, notif, token);
          }
          function asArr(x) { return Array.isArray(x) ? x : (x ? Object.values(x) : []); }

          /* ================================================================
             BATCH 52 — PORT of index.html's recalibrated deep odds model, pure-scoring/pricing half
             only. This is a hand-maintained PORT, not a shared module: index.html has no build step
             and this Action runs in Node with no access to the browser file at all, so the only way
             to reuse the model here is to copy the pure math across, same "mirrors field for field"
             convention ingestFplSquads()'s own header comment already establishes for this file.
             MUST be kept in sync by hand with index.html's MODEL/ODDS_EDGE/formReliability/
             projectTeams/fairMatchProbs/houseEdgePct/recOdds/suggestSpecialOdds/edgedOdds/
             extremeScoreProbs any time a future batch changes the model there — nothing here
             recalibrates itself. Batch 52 replaced the old "form × squad multiplier" + invented
             evidence-shrink + raw-tie-rate-draw model with: a blend (not multiply) of squad and
             form deviations, an empirical-Bayes formReliability() shrink measured off the league's
             own data, a DRAW_BASE/DRAW_TILT house-anchored draw band, and a GAP_SOFTCAP tanh squash
             on the priced gap — see index.html's MODEL const and the block comment above it for the
             full reasoning; ported verbatim here, values and all.
             Deliberately NOT ported: specialMarketDefaultLine() (only used when the admin first
             CREATES a market in the Loader UI — this Action only ever resets the .odds on markets
             that already exist, exactly like rerecommend()/rerecommendMarket() in the app, never
             their .line), teamAvg()/the "avg" display figure (display-only, not used in pricing),
             matchPricingRationale() (Bet Builder "why these odds?" explainer — UI-only, reads DOM/
             squad-viewer helpers this Action has no equivalent of, and is never called from here). */
          const MODEL = {
            FORM_DECAY: 0.82, FORM_PRIOR_W: 1.5, FORM_BLEND: 0.30, FDR_SENS: 0.075,
            DOUBLE_MULT: 1.8, MIN_MINUTES_SHARE: 0.35, SQUAD_W: 0.70, FORM_W: 0.30,
            SQUAD_REL_MIN: 0.75, SQUAD_REL_MAX: 1.30, SQUAD_TRANSFER: 0.45,
            SCORE_SD: 15, TALENT_SD_MIN: 2, TALENT_SD_MAX: 6, BASE_NOISE_VAR: 16,
            PROJ_DEV_MAX: 0.14, DRAW_BASE: 0.068, DRAW_PRIOR_N: 20, DRAW_TILT: 0.10,
            DRAW_SPREAD: 10, DRAW_P_MIN: 0.050, DRAW_P_MAX: 0.070, GAP_SOFTCAP: 4.2, XI: 11
          };
          const SD = 15;
          const SD_DIFF = SD * Math.SQRT2;
          const phi = x => 1 / (1 + Math.exp(-1.702 * x));
          const pOver = (line, avg) => 1 - phi((line - avg) / SD);
          const ODDS_EDGE = { MIN: 10, MID: 16.3, MAX: 28 };
          const FPL_AVAIL = { a: 1, d: 0.6, i: 0, s: 0, u: 0, n: 0 };

          function edgedOdds(fairP, edgePct) {
            const k = 1 - edgePct / 100;
            const pMax = Math.min(.97, k / 1.05);
            const fair = 1 / Math.min(pMax, Math.max(.03, fairP));
            return Math.max(1.05, Math.floor(fair * k * 100) / 100);
          }
          function houseEdgePct(settings) {
            let s = Math.round(Number(settings && settings.oddsCompetitiveness));
            if (isNaN(s)) s = 10;
            s = Math.max(1, Math.min(20, s));
            const e = s <= 10 ? ODDS_EDGE.MAX - (s - 1) * (ODDS_EDGE.MAX - ODDS_EDGE.MID) / 9
                              : ODDS_EDGE.MID - (s - 10) * (ODDS_EDGE.MID - ODDS_EDGE.MIN) / 10;
            return Math.max(ODDS_EDGE.MIN, Math.min(ODDS_EDGE.MAX, Math.round(e * 10) / 10));
          }
          function squadIds(state, teamId) { return asArr(((state.fpl || {}).squads || {})[teamId]); }
          function lineupIds(state, teamId) { return asArr(((state.fpl || {}).lineups || {})[teamId]); }
          function plFixturesFor(state, ev) { return asArr(((state.fpl || {}).plFixtures || {})[ev]); }
          function clubFixture(state, plTeamId, ev) {
            if (!plTeamId || !ev) return null;
            const list = plFixturesFor(state, ev).filter(f => f && (f.h === plTeamId || f.a === plTeamId));
            if (!list.length) return null;
            const f = list[0], home = f.h === plTeamId;
            return { home, fdr: Number(home ? f.hd : f.ad) || 0, count: list.length };
          }
          function teamResults(state, tid, beforeEvent) {
            const out = [];
            const gws = asArr(state.gameweeks);
            const localEvents = new Set(gws.filter(g => g && g.event && asArr(g.matches).some(m => m.result)).map(g => g.event));
            asArr(state.history).forEach(h => {
              if (localEvents.has(h.event)) return;
              if (h.a === tid) out.push({ event: Number(h.event) || 0, pts: h.ap });
              if (h.b === tid) out.push({ event: Number(h.event) || 0, pts: h.bp });
            });
            gws.forEach(g => asArr(g.matches).forEach(m => {
              if (!m.result) return;
              if (m.home === tid) out.push({ event: Number(g.event) || 0, pts: m.result.homePts });
              if (m.away === tid) out.push({ event: Number(g.event) || 0, pts: m.result.awayPts });
            }));
            const cut = Number(beforeEvent) || 0;
            return out.filter(r => !cut || !r.event || r.event < cut).sort((a, b) => (b.event || 0) - (a.event || 0));
          }
          function teamFormProj(state, tid, beforeEvent) {
            const res = teamResults(state, tid, beforeEvent);
            const base = (state.stats && state.stats[tid] && state.stats[tid].base) || 50;
            let sw = MODEL.FORM_PRIOR_W, sx = base * MODEL.FORM_PRIOR_W, w1 = 0, w2 = 0;
            res.forEach((r, i) => { const wt = Math.pow(MODEL.FORM_DECAY, i); sw += wt; w1 += wt; w2 += wt * wt; sx += wt * (Number(r.pts) || 0); });
            return { proj: sx / sw, weight: w1, n: res.length,
                     neff: w2 > 0 ? (w1 * w1) / w2 : 0, att: w1 > 0 ? w1 / (w1 + MODEL.FORM_PRIOR_W) : 0 };
          }
          // Batch 52 — empirical-Bayes/James-Stein shrink on the recency-weighted form deviation.
          // Reads the league's own data: observed cross-team variance of form levels minus the mean
          // sampling variance of those levels = tau^2 (the REAL spread of manager talent); each
          // team's deviation is then believed in the ratio tau^2/(tau^2 + its own sampling
          // variance). See index.html's formReliability() header comment for the full derivation —
          // ported verbatim, no new tuning constants beyond MODEL.SCORE_SD/TALENT_SD_MIN/MAX/
          // BASE_NOISE_VAR already carried across above.
          function formReliability(ids, form) {
            const rows = ids.filter(t => form[t]);
            if (!rows.length) return { mu: 50, tau2: MODEL.TALENT_SD_MIN * MODEL.TALENT_SD_MIN, r: {} };
            const mu = rows.reduce((s, t) => s + form[t].proj, 0) / rows.length;
            const varObs = rows.reduce((s, t) => s + Math.pow(form[t].proj - mu, 2), 0) / rows.length;
            const noiseOf = t => {
              const f = form[t], a = f.att;
              const res = f.neff > 0 ? (MODEL.SCORE_SD * MODEL.SCORE_SD) / f.neff : 0;
              return a * a * res + (1 - a) * (1 - a) * MODEL.BASE_NOISE_VAR;
            };
            const meanNoise = rows.reduce((s, t) => s + noiseOf(t), 0) / rows.length;
            const lo = MODEL.TALENT_SD_MIN * MODEL.TALENT_SD_MIN, hi = MODEL.TALENT_SD_MAX * MODEL.TALENT_SD_MAX;
            const tau2 = Math.max(lo, Math.min(hi, varObs - meanNoise));
            const r = {};
            rows.forEach(t => { const nv = noiseOf(t); r[t] = nv > 0 ? tau2 / (tau2 + nv) : 1; });
            return { mu, tau2, r, varObs, meanNoise };
          }
          function playerAvailability(p) {
            const st = (p && p.st) || 'a';
            if (st === 'i' || st === 's' || st === 'u' || st === 'n') return 0;
            const cp = (p && p.cp != null) ? Number(p.cp) : null;
            if (cp != null && !isNaN(cp)) return Math.max(0, Math.min(1, cp / 100));
            return FPL_AVAIL[st] != null ? FPL_AVAIL[st] : 1;
          }
          function squadMinutesContext(state) {
            const P = (state.fpl && state.fpl.players) || {};
            let max = 0; Object.keys(P).forEach(k => { const m = Number(P[k] && P[k].mn) || 0; if (m > max) max = m; });
            return { maxMinutes: max, games: max > 0 ? Math.max(1, Math.round(max / 90)) : 0 };
          }
          function playerStartShare(p, ctx) {
            if (!ctx || !ctx.games) return 1;
            const mn = Number(p && p.mn) || 0;
            return Math.max(MODEL.MIN_MINUTES_SHARE, Math.min(1, mn / (90 * ctx.games)));
          }
          function playerFixtureMult(state, club, ev) {
            if (!ev) return 1;
            const fx = clubFixture(state, club, ev);
            if (!fx) return 0;
            let m = 1 + (3 - (Number(fx.fdr) || 3)) * MODEL.FDR_SENS;
            if (fx.count > 1) m *= MODEL.DOUBLE_MULT;
            return Math.max(0.5, m);
          }
          function squadExpected(state, tid, ev) {
            const P = (state.fpl && state.fpl.players) || {};
            const ids = squadIds(state, tid);
            if (!ids.length) return null;
            const ctx = squadMinutesContext(state);
            const haveFx = ev ? plFixturesFor(state, ev).length > 0 : false;
            const named = new Set(lineupIds(state, tid).map(Number));
            const rows = ids.map(id => {
              const p = P[id] || P[String(id)]; if (!p) return null;
              const form = Number(p.f) || 0, ppg = Number(p.ppg) || 0;
              const basePts = form > 0 ? MODEL.FORM_BLEND * form + (1 - MODEL.FORM_BLEND) * ppg : ppg;
              const av = playerAvailability(p);
              const fm = haveFx ? playerFixtureMult(state, Number(p.t) || 0, ev) : 1;
              return { id: Number(id), xp: Math.max(0, basePts * av * playerStartShare(p, ctx) * fm), av };
            }).filter(Boolean);
            if (!rows.length) return null;
            const namedRows = rows.filter(r => named.has(r.id));
            const xi = namedRows.length >= MODEL.XI ? namedRows : rows.slice().sort((a, b) => b.xp - a.xp).slice(0, MODEL.XI);
            return { xp: xi.reduce((s, r) => s + r.xp, 0), n: xi.length, squadSize: rows.length,
                     doubts: rows.filter(r => r.av > 0 && r.av < 1).length, out: rows.filter(r => r.av === 0).length };
          }
          function projectTeams(state, ev) {
            const ids = asArr(state.teams).map(t => t.id);
            const form = {}, sq = {};
            ids.forEach(tid => { form[tid] = teamFormProj(state, tid, ev); sq[tid] = squadExpected(state, tid, ev); });
            const REL = formReliability(ids, form);
            const level = REL.mu || 50;
            const withSq = ids.filter(tid => sq[tid]);
            const sqMean = withSq.length ? withSq.reduce((s, tid) => s + sq[tid].xp, 0) / withSq.length : 0;
            const cap = MODEL.PROJ_DEV_MAX * level;
            const out = {};
            ids.forEach(tid => {
              const f = form[tid];
              let rel = 1;
              const haveSq = sqMean > 0 && !!sq[tid];
              if (haveSq) rel = Math.max(MODEL.SQUAD_REL_MIN, Math.min(MODEL.SQUAD_REL_MAX, sq[tid].xp / sqMean));
              const r = (REL.r && REL.r[tid] != null) ? REL.r[tid] : 0;
              const devSquad = (rel - 1) * MODEL.SQUAD_TRANSFER * level;
              const devForm = (f.proj - level) * r;
              const wS = haveSq ? MODEL.SQUAD_W : 0, wF = MODEL.FORM_W, wSum = wS + wF;
              const dev = wSum > 0 ? (wS * devSquad + wF * devForm) / wSum : 0;
              out[tid] = { proj: Math.max(5, level + Math.max(-cap, Math.min(cap, dev))),
                           formProj: f.proj, weight: f.weight, n: f.n, squad: sq[tid] || null, squadRel: rel,
                           level, formRel: r, devSquad, devForm, dev };
            });
            return out;
          }
          function leagueDrawRate(state) {
            let d = 0, n = 0;
            const gws = asArr(state.gameweeks);
            const localEvents = new Set(gws.filter(g => g && g.event && asArr(g.matches).some(m => m.result)).map(g => g.event));
            asArr(state.history).forEach(h => { if (localEvents.has(h.event)) return; n++; if (h.ap === h.bp) d++; });
            gws.forEach(g => asArr(g.matches).forEach(m => { if (!m.result) return; n++; if (m.result.homePts === m.result.awayPts) d++; }));
            return (d + MODEL.DRAW_BASE * MODEL.DRAW_PRIOR_N) / (n + MODEL.DRAW_PRIOR_N);
          }
          function fairMatchProbs(state, homeId, awayId, ev, projMap) {
            const P = projMap || projectTeams(state, ev);
            const a = P[homeId] || { proj: 50 }, b = P[awayId] || { proj: 50 };
            const raw = a.proj - b.proj;
            // Batch 52 — soft cap on the priced gap (the evidence shrink moved into
            // projectTeams()/formReliability() above, where it's measured, not invented; applying
            // it here too would shrink twice). tanh saturates at +-GAP_SOFTCAP so small gaps pass
            // through unchanged and large ones are treated as mostly model error.
            const cap = MODEL.GAP_SOFTCAP;
            const D = cap * Math.tanh(raw / cap);
            // Batch 52 — DRAW_BASE is the house's policy anchor; the league's own measured tie rate
            // (leagueDrawRate) may only tilt it by +-DRAW_TILT, then the taper (DRAW_SPREAD) and the
            // DRAW_P_MIN/MAX clamp keep the published draw inside the house's 12-16 band.
            const anchor = Math.max(MODEL.DRAW_BASE * (1 - MODEL.DRAW_TILT),
                           Math.min(MODEL.DRAW_BASE * (1 + MODEL.DRAW_TILT), leagueDrawRate(state)));
            const pD = Math.max(MODEL.DRAW_P_MIN, Math.min(MODEL.DRAW_P_MAX,
                        anchor * Math.exp(-Math.pow(D / MODEL.DRAW_SPREAD, 2) / 2)));
            const pHrel = phi(D / SD_DIFF);
            return { home: (1 - pD) * pHrel, draw: pD, away: (1 - pD) * (1 - pHrel),
                     diff: D, rawDiff: raw, shrink: (raw ? D / raw : 1), projHome: a.proj, projAway: b.proj };
          }
          function recOdds(state, homeId, awayId, ev, projMap) {
            const p = fairMatchProbs(state, homeId, awayId, ev, projMap);
            const edge = houseEdgePct(state.settings);
            return { home: edgedOdds(p.home, edge), draw: edgedOdds(p.draw, edge), away: edgedOdds(p.away, edge) };
          }
          function extremeScoreProbs(projs, sign) {
            const mus = projs.map(m => sign * m);
            if (!mus.length) return [];
            const lo = Math.min.apply(null, mus) - 4 * SD, hi = Math.max.apply(null, mus) + 4 * SD, steps = 160, h = (hi - lo) / steps;
            const out = mus.map(() => 0);
            const dens = (x, mu) => Math.exp(-Math.pow((x - mu) / SD, 2) / 2) / (SD * Math.sqrt(2 * Math.PI));
            for (let k = 0; k <= steps; k++) {
              const x = lo + k * h, wt = (k === 0 || k === steps) ? 0.5 : 1;
              const cdf = mus.map(mu => Math.min(1 - 1e-9, Math.max(1e-9, phi((x - mu) / SD))));
              let prod = 1; for (let i = 0; i < cdf.length; i++) prod *= cdf[i];
              for (let i = 0; i < mus.length; i++) out[i] += wt * h * dens(x, mus[i]) * (prod / cdf[i]);
            }
            const tot = out.reduce((a, b) => a + b, 0);
            return tot > 0 ? out.map(v => v / tot) : out.map(() => 1 / out.length);
          }
          // Minimal template lookup: only the pricing inputs suggestSpecialOdds() actually reads
          // (tpl.kind, tpl.dir) — it never reads tpl.line/tpl.lineOffset (those only feed
          // specialMarketDefaultLine(), the admin's market-CREATION helper, deliberately not
          // ported — see the block comment above). Mirrors index.html's SPECIAL_MARKET_TEMPLATES
          // ids/kinds/dirs; add an entry here if a future batch adds a template there.
          const SPECIAL_MARKET_KIND = {
            top_scorer: { kind: 'top_score' }, bottom_scorer: { kind: 'bottom_score' },
            haul_35: { kind: 'haul' }, haul_45: { kind: 'haul' }, haul_55: { kind: 'haul' }, haul_65: { kind: 'haul' },
            pts_over: { kind: 'team_pts', dir: 'over' }, pts_under: { kind: 'team_pts', dir: 'under' },
            form_spike: { kind: 'team_pts', dir: 'over' }, off_day: { kind: 'team_pts', dir: 'under' },
            shootout: { kind: 'match_total', dir: 'over' }, stalemate: { kind: 'match_total', dir: 'under' },
            banker: { kind: 'haul' }, beat_par: { kind: 'team_pts', dir: 'over' },
            disaster: { kind: 'team_pts', dir: 'under' }, blowout: { kind: 'match_total', dir: 'over' }
          };
          function suggestSpecialOdds(state, gwObj, tpl, params) {
            const ev = gwObj ? gwObj.event : null;
            const edge = houseEdgePct(state.settings);
            const fixtures = gwObj ? asArr(gwObj.matches).filter(m => m.home && m.away) : [];
            const P = projectTeams(state, ev);
            const pr = tid => (P[tid] && P[tid].proj) || 50;
            if (tpl.kind === 'top_score' || tpl.kind === 'bottom_score') {
              const tids = [...new Set(fixtures.flatMap(m => [m.home, m.away]))];
              if (!tids.length || !params.teamId) return null;
              const idx = tids.indexOf(params.teamId);
              if (idx < 0) return null;
              const ps = extremeScoreProbs(tids.map(pr), tpl.kind === 'top_score' ? 1 : -1);
              return edgedOdds(ps[idx], edge);
            }
            if (tpl.kind === 'haul') {
              if (!params.teamId || params.line == null) return null;
              return edgedOdds(pOver(params.line - 0.5, pr(params.teamId)), edge);
            }
            if (tpl.kind === 'team_pts') {
              if (!params.teamId || params.line == null) return null;
              const proj = pr(params.teamId);
              const p = tpl.dir === 'under' ? 1 - pOver(params.line, proj) : pOver(params.line, proj);
              return edgedOdds(p, edge);
            }
            if (tpl.kind === 'match_total') {
              if (params.line == null) return null;
              const m = fixtures.find(x => x.id === params.matchId);
              if (!m) return null;
              const tot = pr(m.home) + pr(m.away);
              const p = tpl.dir === 'under' ? phi((params.line - tot) / SD_DIFF) : 1 - phi((params.line - tot) / SD_DIFF);
              return edgedOdds(p, edge);
            }
            return null;
          }
          // Resets one draft gameweek's match + special-market odds to the model's current output —
          // the Node equivalent of clicking "↺ Reset all to recommended" (rerecommend() in
          // index.html). Only ever touches .odds fields; ids/results/lines/labels/status untouched.
          function recomputeGwOdds(state, g) {
            const PJ = projectTeams(state, g.event);
            const matches = asArr(g.matches).map(m => ({ ...m, odds: recOdds(state, m.home, m.away, g.event, PJ) }));
            const specialMarkets = asArr(g.specialMarkets).map(m => {
              const tpl = SPECIAL_MARKET_KIND[m.templateId];
              if (!tpl) return m;
              const sug = suggestSpecialOdds(state, g, tpl, { teamId: m.teamId, matchId: m.matchId, line: m.line });
              return { ...m, odds: Math.max(1.05, Number(sug) || 1.05) };
            });
            return { matches, specialMarkets };
          }

          /* ================================================================
             BATCH 50 — 21h-before-cutoff odds auto-suggest window
             ================================================================
             "21 hours before cutoff" at hourly-cron granularity (±30min per the spec) is widened to
             a 2h band (20-22h out) rather than a single instant, so the existing hourly schedule (see
             the self-throttle note at the top of this file) reliably lands inside it at least once —
             typically twice — even if one tick is late or skipped. oddsAutoSuggestedAt makes a second
             hit in the same window a no-op, so the wider band costs nothing but a couple of extra
             hourly full-sync runs per gameweek that would previously have been skipped outright (this
             window sits well outside the existing 2h-before/1h-after deadline throttle) — see the
             schedule block below and PROGRESS.md for the added GitHub Actions cost this implies. */
          const ODDS_AUTOSUGGEST_WINDOW_START_H = 22; // window opens this many hours before cutoff
          const ODDS_AUTOSUGGEST_WINDOW_END_H = 20;   // window closes this many hours before cutoff
          function nearestDraftGw(gws) {
            return asArr(gws).filter(g => g && g.status === 'draft' && g.deadline).sort((a, b) => (a.event || 0) - (b.event || 0))[0] || null;
          }
          function oddsWindowDue(g, now) {
            if (!g || g.oddsAutoSuggestedAt) return false;
            const hoursOut = (g.deadline - now) / 3600000;
            return hoursOut <= ODDS_AUTOSUGGEST_WINDOW_START_H && hoursOut >= ODDS_AUTOSUGGEST_WINDOW_END_H;
          }
          // Locates the Firebase child key for a gameweek by its `id` field, without assuming
          // `gameweeks` is a contiguous JSON array — RTDB can return a sparse list as an object
          // keyed by string index instead. Getting this wrong would PATCH the wrong gameweek.
          function gwFirebaseKey(rawGameweeks, gwId) {
            if (Array.isArray(rawGameweeks)) {
              const i = rawGameweeks.findIndex(x => x && x.id === gwId);
              return i >= 0 ? String(i) : null;
            }
            const keys = Object.keys(rawGameweeks || {});
            return keys.find(k => rawGameweeks[k] && rawGameweeks[k].id === gwId) || null;
          }
          async function maybeAutoSuggestOdds(token) {
            const state = await readFirebase('lennon-lounge', token);
            if (!state) { console.log('Odds auto-suggest: could not read app state, skipping.'); return; }
            const rawGws = state.gameweeks;
            const g = nearestDraftGw(rawGws);
            if (!g) { console.log('Odds auto-suggest: no draft gameweek with a deadline — nothing to do.'); return; }
            const now = Date.now();
            if (g.oddsAutoSuggestedAt) {
              console.log(`Odds auto-suggest: ${g.name || g.id} already auto-suggested at ${new Date(g.oddsAutoSuggestedAt).toISOString()} — skipping.`);
              return;
            }
            if (!oddsWindowDue(g, now)) {
              const hoursOut = ((g.deadline - now) / 3600000).toFixed(1);
              console.log(`Odds auto-suggest: nearest draft ${g.name || g.id} is ${hoursOut}h from cutoff — outside the ${ODDS_AUTOSUGGEST_WINDOW_END_H}-${ODDS_AUTOSUGGEST_WINDOW_START_H}h window, skipping.`);
              return;
            }
            const key = gwFirebaseKey(rawGws, g.id);
            if (key == null) { console.log('Odds auto-suggest: could not re-locate gameweek by id, skipping.'); return; }
            const { matches, specialMarkets } = recomputeGwOdds(state, g);
            const stampedAt = Date.now();
            // Targeted PATCH to just this gameweek's odds fields — never touches `status`, never
            // touches any other gameweek. Draft stays draft; nothing becomes bettable.
            await writeToFirebase(`lennon-lounge/gameweeks/${key}`, { matches, specialMarkets, oddsAutoSuggestedAt: stampedAt }, token);
            console.log(`Odds auto-suggest: recomputed ${matches.length} match(es) and ${specialMarkets.length} special market(s) for ${g.name || g.id}, cutoff in ${((g.deadline - now) / 3600000).toFixed(1)}h — status stays 'draft'.`);
            // Admin-only notification. ADMIN_TEAM_IDS mirrors TEAMS[].admin===true in index.html
            // (selig/rowez) — keep in sync by hand if the admin roster ever changes there.
            const ADMIN_TEAM_IDS = ['selig', 'rowez'];
            for (const teamId of ADMIN_TEAM_IDS) {
              await pushNotif(teamId, 'odds_auto_suggested', `🤖 Odds auto-suggested for ${g.name || g.id} — review before publishing (cutoff ${new Date(g.deadline).toISOString()}).`, token);
            }
          }

          async function main() {
            if (!LEAGUE_ID) { console.log('No FPL_LEAGUE_ID set — skipping'); return; }

            console.log(`Fetching FPL league ${LEAGUE_ID}...`);
            const token = await getAccessToken(SERVICE_KEY);

            const bootstrap = await fetchJson('https://draft.premierleague.com/api/bootstrap-static');
            // bootstrap.events is {current, data:[...]} on the draft API, not a bare array.
            const evList = Array.isArray(bootstrap.events) ? bootstrap.events : ((bootstrap.events && bootstrap.events.data) || []);

            // Self-throttle: on a scheduled (not manual) run, only pay for the full sync — the
            // per-team lineup fetches and every Firebase write below — when it can actually
            // matter: within 2h before/1h after a gameweek deadline, or on a day real PL
            // fixtures kick off. Uses live FPL data (this event's own deadlines, the classic
            // API's fixture kickoff times) rather than a hardcoded matchday/deadline schedule,
            // so it stays correct even when fixtures get rearranged mid-season. Deliberately
            // errs toward syncing if the fixture check itself fails.
            if ((process.env.TRIGGER_EVENT || 'schedule') === 'schedule') {
              const now = Date.now();
              const deadlines = evList.map(e => e.deadline_time ? new Date(e.deadline_time).getTime() : null).filter(Boolean);
              const nextDeadline = deadlines.filter(d => d >= now).sort((a, b) => a - b)[0];
              const prevDeadline = deadlines.filter(d => d < now).sort((a, b) => b - a)[0];
              const nearDeadline = (nextDeadline && nextDeadline - now <= 2 * 3600000) || (prevDeadline && now - prevDeadline <= 1 * 3600000);

              let isMatchday = true; // fail-open: an unknown fixture state syncs rather than silently going stale
              try {
                const fixtures = await fetchJson('https://fantasy.premierleague.com/api/fixtures/');
                const todayStr = new Date(now).toISOString().slice(0, 10);
                isMatchday = (Array.isArray(fixtures) ? fixtures : []).some(f => {
                  if (!f.kickoff_time) return false;
                  const ko = new Date(f.kickoff_time).getTime();
                  return new Date(ko).toISOString().slice(0, 10) === todayStr || (ko <= now && now - ko <= 3 * 3600000 && !f.finished);
                });
              } catch (e) { console.log('Matchday check failed, syncing anyway to be safe:', e.message); }

              // Batch 50: 21h-before-cutoff odds auto-suggest sits well outside the 2h-before/1h-
              // after deadline window above and isn't a matchday signal either, so without this it
              // would never get a chance to fire — every scheduled tick in that window would just
              // skip with zero writes. One small extra Firebase GET, same cost class as the fixtures
              // check just above; only actually triggers a full sync during the ~2h/gameweek window
              // where a draft gameweek is genuinely due and hasn't already been auto-suggested.
              let oddsDue = false;
              try {
                const gws = await readFirebase('lennon-lounge/gameweeks', token);
                oddsDue = oddsWindowDue(nearestDraftGw(gws), now);
              } catch (e) { console.log('Odds auto-suggest window check failed, treating as not due:', e.message); }

              if (!nearDeadline && !isMatchday && !oddsDue) {
                console.log('Not near a deadline, no fixtures today, and no draft gameweek in its odds auto-suggest window — skipping this scheduled run, no Firebase writes.');
                return;
              }
              console.log(`Proceeding with full sync (nearDeadline=${!!nearDeadline}, isMatchday=${isMatchday}, oddsDue=${oddsDue}).`);
            }

            // Live in-play points for the current gameweek, for the "in-play" odds/results view.
            const currentEvent = evList.find(e => e.is_current);
            const liveScores = {};
            if (currentEvent) {
              try {
                const picks = await fetchJson(`https://draft.premierleague.com/api/event/${currentEvent.id}/live`);
                liveScores[currentEvent.id] = { live: true, scores: picks };
              } catch(e) {
                console.log('Could not fetch live scores:', e.message);
              }
            }

            const fplPatch = { leagueId: LEAGUE_ID, liveScores, lastSync: Date.now() };

            // Full sync — the same computation the in-app "Sync FPL" button runs (ingestFpl in
            // index.html), just running server-side so it isn't blocked by the FPL API's CORS
            // policy the way a direct browser fetch is. Pulls the season's full fixture list,
            // finished results (→ history, powers the odds engine), and the team/manager
            // mapping. Safe to (and expected to) run on every trigger — it's a full rebuild
            // from the latest FPL data each time, same as clicking "Sync FPL" repeatedly.
            let details = null;
            try { details = await fetchJson(`https://draft.premierleague.com/api/league/${LEAGUE_ID}/details`); }
            catch(e) { console.log('Could not fetch league details:', e.message); }

            if (details && details.league_entries && details.matches) {
              const existingFpl = (await readFirebase('lennon-lounge/fpl', token)) || {};
              // "Hold back last N GWs" (Back Office → FPL Settings) — a testing toggle that
              // treats the most recent N already-finished real gameweeks as if still upcoming,
              // for trying out the live betting flow against real historical data. Should be 0
              // for a genuinely live season; honoured here so an automated run can't change the
              // behaviour the admin configured in-app.
              const holdbackRaw = await readFirebase('lennon-lounge/sim/holdback', token);
              const hb = Math.max(0, Number(holdbackRaw) || 0);

              const entryMap = { ...(existingFpl.entryMap || {}) };
              // Batch 33 fix: league_entries carries two different ids per manager -- `id` (the
              // league-scoped id entryMap above is keyed by, matching matches[].league_entry_1/2)
              // and `entry_id` (FPL's global/classic entry id). element-status' `owner` field
              // (used below to build squads) turns out to be `entry_id`, verified directly
              // against the live API on 2026-08-19 -- the squad section previously assumed
              // `owner` was the league-scoped id and looked it up in entryMap, which silently
              // matched zero players on every single run. entryIdMap fixes that: entry_id -> teamId.
              const entryIdMap = { ...(existingFpl.entryIdMap || {}) };
              const unmatched = [];
              details.league_entries.forEach(en => {
                const playerName = ((en.player_first_name || '') + ' ' + (en.player_last_name || '')).trim();
                const tid = matchTeamName(playerName) || matchTeamName(en.entry_name || '');
                if (tid) {
                  entryMap[en.id] = tid;
                  if (en.entry_id != null) entryIdMap[en.entry_id] = tid;
                }
                else if (en.entry_name) unmatched.push(`${en.entry_name} (${playerName || 'no manager name'})`);
              });

              const history = [], fplFixtures = {}, simEvents = {};
              const finished = details.matches.filter(m => m.finished);
              const maxEv = finished.length ? Math.max(...finished.map(m => m.event)) : 0;
              const simFrom = maxEv - hb + 1;
              details.matches.forEach(m => {
                const a = entryMap[m.league_entry_1], b = entryMap[m.league_entry_2];
                if (!a || !b) return;
                if (m.finished) {
                  if (hb > 0 && m.event >= simFrom) {
                    (simEvents[m.event] = simEvents[m.event] || []).push({a, b, ap: m.league_entry_1_points, bp: m.league_entry_2_points});
                    (fplFixtures[m.event] = fplFixtures[m.event] || []).push({home: a, away: b});
                  } else {
                    history.push({event: m.event, a, b, ap: m.league_entry_1_points, bp: m.league_entry_2_points});
                  }
                } else {
                  (fplFixtures[m.event] = fplFixtures[m.event] || []).push({home: a, away: b});
                }
              });

              const events = { ...(existingFpl.events || {}) };
              evList.forEach(ev => { events[ev.id] = { deadline: ev.deadline_time ? new Date(ev.deadline_time).getTime() : null, name: ev.name }; });

              Object.assign(fplPatch, { entryMap, entryIdMap, events });
              await writeToFirebase('lennon-lounge', { history, fplFixtures }, token);
              // sim.events isn't touched here deliberately — it's only ever populated when
              // holdback > 0 (a deliberate testing setup) and the admin's own in-app sync
              // already owns rebuilding it in that mode.
              if (hb > 0) await writeToFirebase('lennon-lounge/sim', { events: simEvents }, token);

              if (unmatched.length) console.log('Unmatched FPL entries:', unmatched.join(', '));
              console.log(`Full sync: ${history.length} history result(s), ${Object.keys(fplFixtures).length} gameweek(s) with fixtures, ${unmatched.length} unmatched entr(y/ies)`);
            } else {
              console.log('League details unavailable this run — synced live scores only.');
            }

            // ================= Batch 29: Squad Viewer data =================
            // Three new things the app's squad-on-pitch / fixture-comparison popups need, none of
            // which existed before this batch: player master data, per-manager 15-man squads, and
            // Fixture Difficulty Ratings. All of it is fetched HERE, server-side, rather than in
            // the browser — that's the whole point: FDR only exists on the CLASSIC FPL API
            // (fantasy.premierleague.com), which the app's optional Cloudflare Worker proxy does
            // NOT whitelist, so doing it in-app would force every user to hand-edit their Worker.
            // Running it in this Action means it works for everyone with zero extra setup.
            // Every step below is individually try/caught and non-fatal: a failure here must never
            // break the fixtures/results/standings sync above, which is the load-bearing part.
            try {
              const entryMap = fplPatch.entryMap || (await readFirebase('lennon-lounge/fpl/entryMap', token)) || {};
              const entryIdMap = fplPatch.entryIdMap || (await readFirebase('lennon-lounge/fpl/entryIdMap', token)) || {};

              // The draft bootstrap's events live at events.data[] with the current gameweek id at
              // events.current (NOT an is_current flag on each event — that's the classic API's
              // shape). Pre-season, events.current is null, so fall back to the earliest unfinished
              // gameweek by deadline.
              const focusEvent = (bootstrap.events && bootstrap.events.current)
                || (evList.filter(e => !e.finished)
                          .sort((a, b) => new Date(a.deadline_time) - new Date(b.deadline_time))[0] || {}).id
                || null;

              // (1) Real-life Premier League clubs. Verified against both APIs on 2026-08-19: the
              // draft and classic bootstraps carry an IDENTICAL 20-team list with identical ids, so
              // elements[].team from the draft API indexes straight into the classic fixtures'
              // team_h/team_a with no translation table needed.
              const plTeams = {};
              (bootstrap.teams || []).forEach(t => { plTeams[t.id] = { n: t.name, s: t.short_name }; });

              // (2) Per-manager squads. league/{id}/element-status is the draft API's ownership map;
              // its `owner` field is FPL's global/classic entry_id (verified directly against the
              // live API on 2026-08-19) — a DIFFERENT number from the league-scoped id entryMap is
              // keyed by, despite both being small integers in the same rough range. entryIdMap
              // (built above, entry_id -> teamId) is the correct lookup. Returns exactly 15 players
              // per owner, and works even before a gameweek's picks exist (unlike the
              // entry/.../event/... endpoint used in step 5).
              const squads = {};
              const ownedIds = new Set();
              try {
                const es = await fetchJson(`https://draft.premierleague.com/api/league/${LEAGUE_ID}/element-status`);
                (es.element_status || []).forEach(r => {
                  const tid = (r.owner != null) ? entryIdMap[r.owner] : null;
                  if (!tid) return;
                  (squads[tid] = squads[tid] || []).push(r.element);
                  ownedIds.add(r.element);
                });
              } catch (e) { console.log('Could not fetch element-status:', e.message); }

              // (3) Player master data, slimmed hard and scoped to ONLY the ~180 players actually
              // owned in this league (not all ~600 in the game). The app keeps this inside its
              // single Firebase state blob, which the debounced save() rewrites in full — so this
              // has to stay tens of KB, not the ~900KB the raw elements[] array is.
              const players = {};
              (bootstrap.elements || []).forEach(el => {
                if (!ownedIds.has(el.id)) return;
                // Batch 48: `cp` and `mn` feed the deep odds model (playerAvailability() /
                // playerStartShare() in index.html). chance_of_playing_this_round is 0/25/50/75/100
                // or null; between gameweeks FPL populates next_round instead, so fall back to it.
                // Season-total minutes is the rotation-risk proxy — deliberately NOT a per-gameweek
                // minutes history, which would cost ~180 extra API calls per run.
                const cp = el.chance_of_playing_this_round != null ? el.chance_of_playing_this_round
                         : (el.chance_of_playing_next_round != null ? el.chance_of_playing_next_round : null);
                players[el.id] = {
                  n: el.web_name, t: el.team, p: el.element_type,
                  f: Number(el.form) || 0, tp: el.total_points || 0, ep: el.event_points || 0,
                  ppg: Number(el.points_per_game) || 0, st: el.status || 'a',
                  cp: cp, mn: el.minutes != null ? (Number(el.minutes) || 0) : null
                };
              });

              // (4) Fixture Difficulty Rating (1-5 per side, per fixture). The one call in this
              // whole workflow that hits fantasy.premierleague.com rather than draft.premierleague.com
              // — FDR simply is not exposed by the draft API at all.
              const plFixtures = {};
              try {
                const fixtures = await fetchJson('https://fantasy.premierleague.com/api/fixtures/');
                (Array.isArray(fixtures) ? fixtures : []).forEach(f => {
                  if (!f.event) return;
                  (plFixtures[f.event] = plFixtures[f.event] || []).push({
                    h: f.team_h, a: f.team_a,
                    hd: f.team_h_difficulty, ad: f.team_a_difficulty,
                    k: f.kickoff_time ? new Date(f.kickoff_time).getTime() : null
                  });
                });
              } catch (e) { console.log('Could not fetch classic fixtures (FDR):', e.message); }

              // (5) Starting XI vs bench — best effort only. entry/{entry_id}/event/{ev} returns
              // {picks:[{element, position, ...}]} with positions 1-11 the starters and 12-15 the
              // bench. It 404s with "No pick history" until that gameweek's picks actually exist,
              // so this is deliberately optional: the app renders a perfectly good pitch from the
              // 15-man squad alone whenever `lineups` is missing. Note this endpoint keys on
              // league_entries[].entry_id (the global FPL entry id), NOT the .id used everywhere
              // else above — the two are different numbers.
              const lineups = {};
              if (focusEvent && details && details.league_entries) {
                for (const en of details.league_entries) {
                  const tid = entryMap[en.id];
                  if (!tid || !en.entry_id) continue;
                  try {
                    const p = await fetchJson(`https://draft.premierleague.com/api/entry/${en.entry_id}/event/${focusEvent}`);
                    const start = ((p && p.picks) || []).filter(x => x.position <= 11).map(x => x.element);
                    if (start.length) lineups[tid] = start;
                  } catch (e) { /* no picks published for this entry/event yet — expected */ }
                }
              }

              Object.assign(fplPatch, {
                plTeams, players, squads, plFixtures,
                // null deletes the key on a Firebase PATCH, which is what we want when picks
                // aren't available — better a missing `lineups` than a stale one from last week.
                lineups: Object.keys(lineups).length ? lineups : null,
                squadEvent: focusEvent, squadSync: Date.now()
              });
              console.log(`Squad data: ${Object.keys(squads).length} squad(s), ${Object.keys(players).length} owned player(s), ${Object.keys(plFixtures).length} gameweek(s) of FDR, ${Object.keys(lineups).length} lineup(s), focus GW ${focusEvent}`);
            } catch (e) {
              console.log('Squad/FDR sync step failed (non-fatal, rest of the sync stands):', e.message);
            }

            await writeToFirebase('lennon-lounge/fpl', fplPatch, token);

            // ================= Batch 50: odds auto-suggest =================
            // Runs at the end of every full sync (whichever condition triggered it — near-deadline,
            // matchday, odds-window, or a manual workflow_dispatch). Self-gates on the same window +
            // oddsAutoSuggestedAt idempotency check regardless of why this run happened, so a manual
            // "Run workflow" click outside the window is a safe no-op, not a forced early fire.
            // Never fatal to the sync above: fixtures/results/standings/squads already landed.
            try { await maybeAutoSuggestOdds(token); }
            catch (e) { console.log('Odds auto-suggest step failed (non-fatal, rest of sync stands):', e.message); }

            console.log('FPL sync complete');
          }

          main().catch(e => { console.error('FPL sync failed:', e); process.exit(1); });
          EOF
