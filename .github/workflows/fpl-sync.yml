name: FPL Data Sync

on:
  # Fires every hour, every day — cheap to declare and, thanks to the self-throttle at the top of
  # main() below, cheap to run: most of these ticks do one lightweight fetch, decide nothing on
  # FPL could have changed, and exit in a couple of seconds with zero Firebase writes. The full
  # sync actually runs within 2h before / 1h after a gameweek deadline, on a day real PL fixtures
  # are being played, OR (added 2026-09-22, see gwPendingSync below) any hour there's still an
  # open, FPL-linked gameweek whose deadline passed 6h+ ago but whose scores haven't landed in
  # local history yet — that last one is what keeps retrying past a missed/delayed hourly tick
  # instead of permanently stranding a finished gameweek. Uses FPL's own live deadline/fixture
  # data rather than a hardcoded matchday guess, so it self-corrects every week even when
  # fixtures get rearranged. workflow_dispatch (the "Run workflow" button / Back Office → FPL
  # Sync shortcut) always forces a full sync regardless of the throttle.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-fpl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch FPL data and write to Firebase
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: node scripts/sync-fpl.cjs
