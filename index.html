async function fplFetch(url){ const r=await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
// Tries a direct browser fetch first (works if the FPL API's CORS policy ever loosens, or if
// this is ever run somewhere CORS doesn't apply), then falls back to S.fpl.proxyUrl if the
// admin has set one (Back Office → FPL Sync → "Proxy URL") — a small self-hosted passthrough
// (see SETUP.md) that adds the CORS headers the browser needs. Without a proxy configured,
// this just throws, same as before, and callers fall back to the GitHub Action / paste box.
async function fplFetchAny(path){
  const direct='https://draft.premierleague.com/api/'+path;
  try{ return await fplFetch(direct); }
  catch(e){
    if(S.fpl.proxyUrl){
      const proxied=S.fpl.proxyUrl.replace(/\/$/,'')+'/'+path;
      return await fplFetch(proxied);
    }
    throw e;
  }
}
// Batch 29: the classic FPL API (fantasy.premierleague.com) — a genuinely DIFFERENT host from the
// draft API everything else here uses, and the only source of Fixture Difficulty Ratings, which
// draft.premierleague.com does not expose in any form. The Cloudflare Worker in SETUP.md Step 6
// Option B only proxies draft.premierleague.com, so this will normally fail in a browser; the
// GitHub Action is the supported, zero-setup path for FDR and every caller here treats a failure
// as non-fatal. If the admin has upgraded their Worker to the optional two-host version in
// SETUP.md Step 8, its classic route lives at /fpl/ alongside the existing /api/ — derived here
// rather than stored as a second setting, so there's still only one Proxy URL to maintain.
async function fplFetchClassic(path){
  try{ return await fplFetch('https://fantasy.premierleague.com/api/'+path); }
  catch(e){
    const p=(S.fpl.proxyUrl||'').trim();
    if(/\/api\/?$/.test(p)) return await fplFetch(p.replace(/\/api\/?$/,'/fpl/')+path);
    throw e;
  }
}
// Pulls the squad-viewer data set in-app: player master data + per-manager 15-man squads from the
// draft API (both already reachable through the existing fplFetchAny direct→proxy path, so no
// change to anyone's Worker is needed), plus FDR from the classic API on a best-effort basis.
// Batch 33: this also now runs automatically at the end of every syncAndStage() weekly sync (see
// that function), reusing this same ingestFplSquads() path — kept as its own standalone button
// too, for an on-demand pull between weekly syncs (e.g. right after a waiver deadline) without
// needing to re-run the full gameweek-staging flow.
async function fplSyncSquads(){
  if(!requireAdmin()) return false;
  const inp=document.getElementById('fplLeagueId');
  const id=((inp?inp.value:'')||S.fpl.leagueId||'').trim();
  if(!id){ toast('Enter your draft league ID first',true); return false; }
  if(!Object.keys(S.fpl.entryIdMap||{}).length){ toast('Run "Sync & stage gameweeks" first — squads are matched via the entry map that builds',true); return false; }
  toast('Pulling squads…');
  let boot=null, es=null;
  try{
    boot=await fplFetchAny('bootstrap-static');
    es=await fplFetchAny('league/'+id+'/element-status');
  }catch(e){
    toast('Browser can\'t reach the draft API (CORS). Run the FPL Data Sync GitHub Action instead — it also pulls fixture difficulty, which a browser can never get.',true);
    return false;
  }
  let fixtures=null;
  try{ fixtures=await fplFetchClassic('fixtures/'); }catch(e){ /* expected without the two-host proxy */ }
  return ingestFplSquads(boot, es, fixtures);
}
// Mirrors, field for field, the "Batch 29: Squad Viewer data" block in .github/workflows/fpl-sync.yml —
// keep the two in step if either is changed. Writes only the fpl/audit keys via saveFields() for
// the same stale-tab-clobbering reason ingestFpl() does.
function ingestFplSquads(boot, es, fixtures){
  if(!requireAdmin()) return false;
  // Batch 33 fix: element-status' `owner` field is FPL's global/classic entry_id, NOT the
  // league-scoped id S.fpl.entryMap is keyed by — they're both small integers in the same rough
  // range and easy to assume are the same thing (a prior version of this code did exactly that
  // and silently matched zero players on every run). S.fpl.entryIdMap (built in ingestFpl(),
  // which must run at least once — via "Sync & stage gameweeks" — before this can match anyone)
  // is keyed the right way: entry_id -> teamId.
  const eim=S.fpl.entryIdMap||{};
  const plTeams={};
  ((boot&&boot.teams)||[]).forEach(t=>{ plTeams[t.id]={n:t.name, s:t.short_name}; });
  const squads={}, owned=new Set();
  ((es&&es.element_status)||[]).forEach(r=>{
    const tid=(r&&r.owner!=null)?eim[r.owner]:null;
    if(!tid) return;
    (squads[tid]=squads[tid]||[]).push(r.element);
    owned.add(r.element);
  });
  if(!Object.keys(squads).length){ toast('No squads matched — run "Sync & stage gameweeks" first if you haven\'t recently, then try again',true); return false; }
  const players={};
  ((boot&&boot.elements)||[]).forEach(el=>{
    if(!owned.has(el.id)) return;
    // Batch 48 added `cp` and `mn`, both consumed by the odds model (playerAvailability() /
    // playerStartShare()): chance_of_playing_this_round (0/25/50/75/100, null when FPL has nothing
    // to say — falling back to next_round, which is what's populated between gameweeks) is a much
    // finer injury-doubt signal than the single `st` letter, and season-total minutes is the only
    // rotation-risk proxy available without ~180 extra per-player API calls. Both are stored as
    // null-when-unknown rather than 0, because 0 is a meaningful value for each of them.
    const cp = el.chance_of_playing_this_round!=null ? el.chance_of_playing_this_round
             : (el.chance_of_playing_next_round!=null ? el.chance_of_playing_next_round : null);
    players[el.id]={n:el.web_name, t:el.team, p:el.element_type, f:Number(el.form)||0,
                    tp:el.total_points||0, ep:el.event_points||0, ppg:Number(el.points_per_game)||0, st:el.status||'a',
                    cp:cp, mn:el.minutes!=null?Number(el.minutes)||0:null};
  });
  S.fpl.plTeams=plTeams; S.fpl.players=players; S.fpl.squads=squads;
  let fdrGws=0;
  if(Array.isArray(fixtures)&&fixtures.length){
    const fx={};
    fixtures.forEach(f=>{ if(!f||!f.event) return;
      (fx[f.event]=fx[f.event]||[]).push({h:f.team_h, a:f.team_a, hd:f.team_h_difficulty, ad:f.team_a_difficulty,
                                          k:f.kickoff_time?new Date(f.kickoff_time).getTime():null}); });
    S.fpl.plFixtures=fx; fdrGws=Object.keys(fx).length;
  }
  // Same "which gameweek is current" derivation the Action uses: the draft bootstrap keeps it at
  // events.current (null pre-season) rather than an is_current flag on each event, so fall back to
  // the earliest unfinished event by deadline.
  const evs=(boot&&(Array.isArray(boot.events)?boot.events:(boot.events&&boot.events.data)))||[];
  S.fpl.squadEvent=(boot&&boot.events&&boot.events.current)
    ||(evs.filter(e=>e&&!e.finished).sort((a,b)=>new Date(a.deadline_time)-new Date(b.deadline_time))[0]||{}).id||null;
  S.fpl.squadSync=Date.now();
  audit('FPL squads', Object.keys(squads).length+' squad(s), '+Object.keys(players).length+' player(s), FDR '+(fdrGws?fdrGws+' GW(s)':'not available in-browser'));
  saveFields({fpl:S.fpl, audit:S.audit});
  render();
  toast('✅ Squads pulled — '+Object.keys(squads).length+' squads'+(fdrGws?' + fixture difficulty':' (no FDR — run the GitHub Action for that)'));
  return true;
}

function saveHoldback(){
  // Standalone save so this setting doesn't require a successful FPL sync to persist — on
  // GitHub Pages the in-app sync button always CORS-fails, so gating this on ingestFpl()
  // running meant it could never actually be changed from here in practice.

// Writes only fpl/history/fplFixtures/sim/audit — never the rest of S — for the same
// stale-tab-clobbering reason saveFields() exists (see its comment). This is the function
// that owns the FPL-derived fields, so it's the most important one to harden: a blanket
// save() here is exactly what silently wiped a prior sync's entryMap/holdback once already.
function ingestFpl(det,boot){
  if(!requireAdmin()) return false;
  if(!det||!det.league_entries||!det.matches){ toast('Does not look like league details JSON',true); return false; }
  const hbInp=document.getElementById('fplHoldback');
  if(hbInp) S.sim.holdback=Math.max(0,parseInt(hbInp.value)||0);
  const unmatched=[];
  if(!S.fpl.entryIdMap) S.fpl.entryIdMap={};
  det.league_entries.forEach(en=>{
    // Match on the manager's real name first (fixed, anchors login/mapping), falling back
    // to the FPL team name only if that fails — protects against an owner renaming their
    // FPL team mid-season and silently breaking the sync.
    const playerName=((en.player_first_name||'')+' '+(en.player_last_name||'')).trim();
    const tid=matchTeamName(playerName)||matchTeamName(en.entry_name||'');
    if(tid){
      S.fpl.entryMap[en.id]=tid;
      // Batch 33 fix: league_entries carries TWO different ids per manager — `id` (the
      // league-scoped id that entryMap above is keyed by, and that matches[].league_entry_1/2
      // use) and `entry_id` (FPL's global/classic entry id). They're both small integers in the
      // same rough range, easy to assume are the same thing — they are not. element-status'
      // `owner` field (used to build squads) turns out to be `entry_id`, verified directly
      // against the live API — a prior version of this code looked it up in entryMap (keyed by
      // `id`) and silently matched zero players, every single sync. This second map is what
      // fixes that.
      if(en.entry_id!=null) S.fpl.entryIdMap[en.entry_id]=tid;
    } else if(en.entry_name) unmatched.push(en.entry_name+' ('+(playerName||'no manager name')+')');
  });
  const em=S.fpl.entryMap;
  S.history=[]; S.fplFixtures={}; S.sim.events={};
  const finished=det.matches.filter(m=>m.finished);
  const maxEv=finished.length?Math.max(...finished.map(m=>m.event)):0;
  const simFrom=maxEv-S.sim.holdback+1;
  det.matches.forEach(m=>{
    const a=em[m.league_entry_1],b=em[m.league_entry_2];
    if(!a||!b) return;
    if(m.finished){
      if(S.sim.holdback>0&&m.event>=simFrom){
        (S.sim.events[m.event]=S.sim.events[m.event]||[]).push({a,b,ap:m.league_entry_1_points,bp:m.league_entry_2_points});
        (S.fplFixtures[m.event]=S.fplFixtures[m.event]||[]).push({home:a,away:b});
      } else {
        S.history.push({event:m.event,a,b,ap:m.league_entry_1_points,bp:m.league_entry_2_points});
      }
    } else {
      (S.fplFixtures[m.event]=S.fplFixtures[m.event]||[]).push({home:a,away:b});
    }
  });
  const evList=boot?(Array.isArray(boot.events)?boot.events:(boot.events&&boot.events.data)||[]):[];
  evList.forEach(ev=>{ S.fpl.events[ev.id]={deadline:ev.deadline_time?new Date(ev.deadline_time).getTime():null,name:ev.name}; });
  S.fpl.lastSync=Date.now();
  audit('FPL sync','league '+S.fpl.leagueId+': '+S.history.length+' results'+(unmatched.length?' · UNMATCHED: '+unmatched.join(', '):''));
  saveFields({history:S.history, fplFixtures:S.fplFixtures, sim:S.sim, fpl:S.fpl, audit:S.audit});
  render();
  toast('✅ FPL synced — '+S.history.length+' results powering the odds'+(unmatched.length?' · unmatched: '+unmatched.join(', '):''));
  return true;
}
// Builds and stages (as drafts, for Odds Setter review) every gameweek that has FPL fixtures
// pulled in but no gameweek object yet — the whole remaining fixture list, not just the next
// one, so players can see what's coming. Deliberately doesn't auto-publish any of them:
// publishing (opening betting) stays a manual admin action in Odds Setter. Odds on far-future
// drafts are whatever recOdds() says today — they're locked/unbettable until published, and
// Odds Setter only surfaces the nearest one for review, so stale-by-then odds on a GW that's
// months away is expected, not a bug (re-run this closer to the time to refresh them).
// Pure read of already-synced state — no network call — so it's useful even when a fetch
// failed and this is running off whatever a prior GitHub Action run already wrote.
function stageAllGameweeks(){
  if(!requireAdmin()) return 0;
  const loaded=new Set(S.gameweeks.map(g=>g.event).filter(Boolean));
  const evs=Object.keys(S.fplFixtures).map(Number).filter(ev=>!loaded.has(ev)).sort((a,b)=>a-b);
  if(!evs.length) return 0;
  const maxFixtures=Math.max(1,Math.floor(S.teams.length/2));
  const short=[];
  evs.forEach(ev=>{
    const fixtures=(S.fplFixtures[ev]||[]).filter(f=>f.home&&f.away);
    if(!fixtures.length) return;
    if(fixtures.length<maxFixtures) short.push(ev);
    const info=S.fpl.events[ev];
    // FPL's own deadline_time is (by convention, confirmed against real fixture kickoff
    // times) exactly 90 min before the gameweek's first kickoff — so true kickoff =
    // deadline_time + 90min. This house's cutoff rule is 80 min before that same kickoff,
    // i.e. deadline_time + 10min. If FPL hasn't published a deadline yet, fall back to a
    // holding value far enough out that it won't accidentally cut betting off early.
    const kickoff=info&&info.deadline?info.deadline+90*60000:Date.now()+3*86400000+80*60000;
    const deadline=kickoff-80*60000;
    const g={id:nid('gw'),name:'GW '+ev,deadline,kickoff,event:ev,status:'draft',
      matches:fixtures.map(f=>({id:nid('m'),home:f.home,away:f.away,odds:recOdds(S,f.home,f.away,ev),result:null}))};
    S.gameweeks.push(g);
  });
  if(short.length) toast('⚠ GW '+short.join(', ')+' had fewer fixtures than expected — check FPL Sync for unmatched entries',true);
  audit('gameweeks staged',evs.length+' gameweek(s): GW'+evs[0]+'–GW'+evs[evs.length-1]);
  saveFields({gameweeks:S.gameweeks, audit:S.audit});
  return evs.length;
}
// The one button in Back Office: refreshes FPL data (fixtures/results/standings), then stages
// every gameweek that isn't loaded yet. If the browser can't reach FPL directly (CORS) and no
// proxy is configured, it still stages from whatever's already in Firebase — e.g. from a
// GitHub Action run — so this button is always useful, not just when the fetch works.
async function syncAndStage(){
  if(!requireAdmin()) return;
  const inp=document.getElementById('fplLeagueId');
  const id=((inp?inp.value:'')||S.fpl.leagueId||'').trim();
  if(!id){ toast('Enter your draft league ID first',true); return; }
  S.fpl.leagueId=id; saveFields({fpl:S.fpl});
  toast('Syncing…');
  const finish=(n,prefix)=>{ render(); toast((prefix?prefix+' ':'')+(n?n+' gameweek(s) staged — review the next one in Odds Setter 🎯':'No new gameweeks to stage — you\'re caught up'),!!prefix); if(n) go('odds'); };
  try{
    const det=await fplFetchAny('league/'+id+'/details');
    let boot=null;
    try{ boot=await fplFetchAny('bootstrap-static'); }catch(e){}
    if(ingestFpl(det,boot)){
      // Batch 33: piggyback squads onto this same weekly click, reusing the bootstrap-static
      // payload already fetched above (it's the same draft-API response the squad pull needs —
      // no second fetch) rather than requiring a separate manual "pull squads" step nobody
      // actually remembers to run. Best-effort and silent on failure: if this fails the main
      // sync above has already succeeded and gameweeks still stage normally — squads just won't
      // be fresh until the next sync. FDR (fixture difficulty) opportunistically tries the
      // classic API too (works if the two-host proxy is set up) but falls back to whatever the
      // GitHub Action last wrote otherwise — ingestFplSquads() never clears plFixtures when
      // fixtures is null, so a prior Action run's FDR data is never lost by this path.
      if(boot && Object.keys(S.fpl.entryMap||{}).length){
        try{
          const es=await fplFetchAny('league/'+id+'/element-status');
          let fixtures=null;
          try{ fixtures=await fplFetchClassic('fixtures/'); }catch(e){ /* expected without the two-host proxy */ }
          ingestFplSquads(boot, es, fixtures);
        }catch(e){ /* squads just won't be fresh this time — not fatal to the main sync */ }
      }
      finish(stageAllGameweeks());
    }
  }catch(e){
    const fb=document.getElementById('fplFallback'); if(fb) fb.style.display='block';
    finish(stageAllGameweeks(),(S.fpl.proxyUrl?'Direct + proxy fetch both blocked — staged from last-synced data instead.':'Direct fetch blocked (CORS) — staged from last-synced data instead.'));
  }
}
// Clears gameweeks/bets/promos/rewards only. Leaves FPL sync state, settings, teams and the
// audit log untouched (unlike Reset everything, which wipes the whole database). Uses
// saveFields() rather than the debounced save() — a plain save() re-serializes the WHOLE
// local S, so if this tab's copy of S.fpl/S.sim was ever stale (e.g. a GitHub Action sync
// landed while this tab sat idle), clicking this would silently overwrite that fresh data
// with the stale copy. saveFields() only ever touches the keys listed here.
function clearTestData(){
  if(!requireAdmin()) return;
  if(!confirm('Clear all gameweeks, bets, promos and reward ledgers? FPL sync data, settings and teams are kept.')) return;
  audit('data cleared','gameweeks/bets/promos/rewards wiped');
  saveFields({gameweeks:[], bets:[], promos:[], rewardGrants:[], rewards:{}, audit:S.audit});
  render(); toast('Cleared');
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='lennon-lounge-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
// Batch 26: restore the whole database from either an exportData() download or a
// backups/YYYY-MM-DD.json file written by .github/workflows/backup.yml — both dump the same
// shape (the full ROOT node). Reuses the FileReader pattern already used elsewhere (attachShot)
// for local file reads, and migrate() to normalise Firebase's array-as-object encoding — a raw
// Action dump straight off the REST API hasn't been through startListener()'s migrate() call the
// way S normally has, so without this, saveFields() would write plain objects where the rest of
// the app expects real arrays (.filter/.map/.forEach) and silently break everything downstream.
function restoreBackupPick(input){
  if(!requireAdmin()){ input.value=''; return; }
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    let raw;
    try{ raw=JSON.parse(e.target.result); }
    catch(err){ toast('Could not parse that file as JSON',true); input.value=''; return; }
    if(!raw||typeof raw!=='object'||!('gameweeks' in raw)||!('bets' in raw)||!('teams' in raw)){
      toast('Does not look like a Lennon Lounge backup file',true); input.value=''; return;
    }
    const data=migrate(raw);
    if(!confirm('⚠️ RESTORE FROM BACKUP\n\nThis will OVERWRITE current gameweeks, bets, promos, rewards and history/standings with the contents of "'+f.name+'". Anything placed or settled since that snapshot was taken will be LOST. This cannot be undone except by restoring an even older backup.\n\nContinue?')){
      input.value=''; return;
    }
    // Retarget S.audit to the incoming (older) log first, then log the restore itself onto the
    // END of it, so the "a restore happened" trail survives even though the rest of the audit
    // history was just rolled back — and it goes out in the SAME write as the rest of the
    // restored state, not a separate one that could land out of order.
    S.audit=Array.isArray(data.audit)?data.audit:[];
    audit('backup restored', 'from file '+f.name+' — overwrote gameweeks/bets/promos/rewards/history/standings');
    data.audit=S.audit;
    saveFields(data).then(()=>{
      render();
      toast('Restored from backup: '+f.name);
    }).catch(()=>{ toast('Restore failed — see console',true); });
    input.value='';
  };
  r.onerror=()=>{ toast('Could not read that file',true); input.value=''; };
  r.readAsText(f);
}
function resetAll(){
  if(!requireAdmin()) return;
  if(!confirm('Wipe ALL gameweeks, bets, promos and settings?')) return;
  db.ref(ROOT).remove().then(()=>{ S=freshState(); save(); render(); toast('Fresh start'); });
}

/* ================================================================
   RENDER & NAVIGATION
   ================================================================ */
function needsActionCount(){ if(!me||!S) return 0; return (S.bets||[]).filter(b=>b.teamId===me.id&&b.status==='counter_house').length; }
function reviewCount(){ if(!S) return 0; return (S.bets||[]).filter(b=>['pending','counter_user'].includes(b.status)).length; }

function render(){
  if(!me||!S) return;
  const {pnl}=computePnl(S);
  const p=pnl[me.id]||0;
  const pnlEl=document.getElementById('myPnl');
  if(pnlEl) pnlEl.innerHTML=`P&L <span class="${p>0?'pos':p<0?'neg':''} mono">${GBP(p)}</span>`;
  const tabs=navTabs();
  const navEl=document.getElementById('nav');
  if(navEl) navEl.innerHTML=tabs.map(t=>`<button class="${t.house?'houseTab':''} ${activeTab===t.id?'active':''}" onclick="go('${t.id}')">${t.label}${t.badge?`<span class="badge">${t.badge}</span>`:''}</button>`).join('');
  const views={home:vHome,builder:vBuilder,mybets:vMyBets,results:vResults,insights:vInsights,usettings:vUserSettings,
    review:vReview,loader:vLoader,odds:vOddSetter,settler:vSettler,promos:vPromos,office:vOffice,
    // Batch 28: reached only via the "🏆 Season Bets" summary card's click-through (Home/Builder)
    // or the bet-detail modal's duplicate-bet flow — deliberately not in navTabs()'s tab list,
    // same precedent as 'loader' above.
    seasonbets:vSeasonBets};
  const viewEl=document.getElementById('view');
  if(viewEl) viewEl.innerHTML=(views[activeTab]||vHome)();
  const cb=document.getElementById('chatBox'); if(cb) cb.scrollTop=cb.scrollHeight;
  // Batch 12: live-ticking countdown for the home hero's gw-deadline item. Always clear any
  // previous timer first (covers navigating away from Home, or re-rendering Home itself),
  // then — only when Home is the active tab and there's a relevant deadline — start a 1s
  // interval that updates just the #heroCountdown text node directly, no full re-render.
  clearInterval(window._homeHeroTimer);
  if(activeTab==='home'){
    const hu=urgentActions();
    if(hu.soonestGw){
      const deadline=hu.soonestGw.deadline;
      const tickHero=()=>{
        const el=document.getElementById('heroCountdown');
        if(!el){ clearInterval(window._homeHeroTimer); return; }
        const rem=deadline-Date.now();
        el.textContent=fmtCountdown(rem);
        if(rem<=0) clearInterval(window._homeHeroTimer);
      };
      tickHero();
      window._homeHeroTimer=setInterval(tickHero,1000);
    }
  }
  // Mobile bottom nav active states
  ['home','builder','mybets','results'].forEach(id=>{
    const btn=document.getElementById('bn-'+id);
    if(btn) btn.classList.toggle('active',activeTab===id);
  });
  const moreBtn=document.getElementById('bn-more');
  if(moreBtn) moreBtn.classList.toggle('active',['usettings','review','loader','odds','settler','promos','office','seasonbets'].includes(activeTab));
  // Notification dot
  renderNotifications();
  // Batch 24: keep the mobile nav drawer's list (badges, active state) in sync too.
  renderNavDrawer();
  // Batch 14: keep the bet detail modal's content in sync with S.bets across any render()
  // (e.g. an accept/reject/counter/cancel done from inside the modal itself).
  if(openBetModalId) renderBetModal();
  // Batch 29: same treatment for the squad viewer — a background FPL sync landing while it's
  // open refreshes the pitch in place rather than leaving stale form/FDR on screen.
  if(squadModalState) renderSquadModal();
  // Auto-refresh reminder on time-sensitive tabs
  clearTimeout(render._rt);
  if(['builder','review','settler'].includes(activeTab)){
    render._rt=setTimeout(render,60000);
  }
}
function go(tab){ activeTab=tab; render(); window.scrollTo(0,0); logUsage('view',tab); }

/* ================================================================
   INIT
   ================================================================ */
async function initApp(){
  const loadingEl=document.getElementById('loginLoading');
  if(loadingEl) loadingEl.style.display='block';
  try{
    await loadAuth();
    renderTeamGrid();
    setupPinInputs();
    const savedUser=sessionStorage.getItem('wlgyl_user');
    if(savedUser&&TEAMS.find(t=>t.id===savedUser)){
      S=freshState();
      me=TEAMS.find(t=>t.id===savedUser);
      document.getElementById('login').style.display='none';
      document.getElementById('app').style.display='block';
      const bn=document.getElementById('bottomNav'); if(bn) bn.style.display='';
      startListener();
    } else {
      // On mobile widths #bottomNav's CSS media query defaults it to visible; logout()/switchUser()
      // toggle it explicitly once a session exists, but nothing did on this "not logged in yet" path,
      // so it was showing (non-functionally) underneath the login screen. Hide it explicitly here too.
      const bn=document.getElementById('bottomNav'); if(bn) bn.style.display='none';
      if(loadingEl) loadingEl.style.display='none';
    }
  }catch(e){
    if(loadingEl) loadingEl.style.display='none';
    toast('Failed to connect — check your internet connection',true);
    console.error('Init error:',e);
  }
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
} else {
  initApp();
}

</script>
