<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lennon Lounge">
<meta name="theme-color" content="#0b0014">
<meta name="description" content="Lennon Lounge — private fantasy football betting league">
<title>Lennon Lounge — The Bookies</title>
<link rel="manifest" href="public/manifest.json">
<link rel="icon" type="image/svg+xml" sizes="any" href="public/icon.svg">
<link rel="apple-touch-icon" href="public/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<!-- Firebase SDK (compat v9) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg0:#0b0014; --bg1:#160026; --bg2:#1f0533;
    --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07); --line:rgba(255,255,255,.10);
    --teal:#00ff87; --cyan:#00d9ff; --pink:#ff2d78; --orange:#ff9d00; --gold:#ffc931; --violet:#9b5cff;
    --text:#f6f2fa; --muted:#a995ba; --danger:#ff4d6d;
    --grad:linear-gradient(135deg,var(--teal),var(--cyan));
    --gradHot:linear-gradient(135deg,var(--pink),var(--orange));
    --gradGold:linear-gradient(135deg,var(--gold),var(--orange));
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    /* Batch 25: safety net for the class of bug found in the Back Office FPL Sync card — a long
       unbroken string (a bare URL with no spaces, e.g. "draft.premierleague.com/league/...")
       doesn't wrap at all by default and silently pushes the whole page sideways. Only kicks in
       for a single token too wide for its box; normal text keeps wrapping at spaces as before. */
    overflow-wrap:break-word;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);min-height:100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(155,92,255,.22), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(0,217,255,.13), transparent 55%),
      radial-gradient(800px 600px at 50% 110%, rgba(255,45,120,.14), transparent 60%),
      linear-gradient(170deg,var(--bg1),var(--bg0) 70%);
    background-attachment:fixed;
  }
  .display{font-family:'Archivo Black','Inter',sans-serif;letter-spacing:-.5px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
  input,select,textarea{font-family:inherit;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font-size:14px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,255,135,.15)}
  select option{background:var(--bg2)}
  .btn{padding:11px 18px;font-weight:800;font-size:14px;background:var(--grad);color:#00210f;transition:transform .12s,box-shadow .12s,filter .12s;box-shadow:0 4px 18px rgba(0,255,135,.25)}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .btn:active{transform:translateY(0)}
  .btn.hot{background:var(--gradHot);color:#fff;box-shadow:0 4px 18px rgba(255,45,120,.3)}
  .btn.gold{background:var(--gradGold);color:#3a2300;box-shadow:0 4px 18px rgba(255,201,49,.3)}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line);box-shadow:none}
  .btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal);box-shadow:none}
  .btn.danger{background:rgba(255,77,109,.15);color:var(--danger);border:1px solid rgba(255,77,109,.4);box-shadow:none}
  .btn.small{padding:6px 12px;font-size:12px;border-radius:9px}
  .btn.big{padding:15px 26px;font-size:16px;border-radius:14px}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  /* ---------- login ---------- */
  #login{max-width:480px;margin:5vh auto;padding:20px}
  .login-card{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:36px 30px;text-align:center;box-shadow:var(--shadow)}
  .biglogo{font-size:34px;line-height:1.05}
  .biglogo .l1{display:block;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
  .gradtxt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hottxt{background:var(--gradHot);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{color:var(--muted);font-size:13px;margin:10px 0 26px}
  /* ---------- shell ---------- */
  #app{display:none;max-width:1150px;margin:0 auto;padding:0 14px 90px}
  header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;margin:10px 0 16px;background:rgba(15,0,28,.75);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;flex-wrap:wrap}
  .userswitch{display:flex;align-items:center;gap:8px}
  .userswitch select{font-weight:700;max-width:230px}
  .balancechip{font-size:12px;font-weight:800;padding:7px 13px;border-radius:20px;background:var(--card2);border:1px solid var(--line)}
  .syncdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--teal);box-shadow:0 0 6px var(--teal);transition:background .3s,box-shadow .3s}
  .syncdot.off{background:var(--danger);box-shadow:0 0 6px var(--danger);animation:pulse 1s infinite}
  nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  nav button{position:relative;background:var(--card);border:1px solid var(--line);color:var(--muted);padding:11px 17px;font-weight:800;font-size:13.5px;border-radius:14px;transition:all .15s}
  nav button:hover{color:var(--text);transform:translateY(-1px)}
  nav button.active{background:var(--grad);color:#00210f;border-color:transparent;box-shadow:0 4px 20px rgba(0,255,135,.3)}
  nav button.houseTab{border-color:rgba(255,201,49,.25);color:#d9b25c}
  nav button.houseTab.active{background:var(--gradGold);color:#3a2300;box-shadow:0 4px 20px rgba(255,201,49,.3)}
  nav .badge{position:absolute;top:-7px;right:-7px;background:var(--gradHot);color:#fff;border-radius:11px;padding:2px 8px;font-size:11px;font-weight:900;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  h2{font-size:24px;margin-bottom:6px}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card.glow{border-color:rgba(0,255,135,.3)}
  .grid2{display:grid;grid-template-columns:1fr 370px;gap:18px;align-items:start}
  @media(max-width:880px){.grid2{grid-template-columns:1fr}}
  /* Batch 25: defensive min-width:0 on the grid tracks themselves — a grid item's default
     min-width:auto means it won't shrink below its deepest descendant's intrinsic content width,
     which is exactly what let .match's overflow (see below) blow out this whole container. */
  .grid2>div{min-width:0}
  .muted{color:var(--muted);font-size:13px}
  .small{font-size:12px}
  .mono{font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;padding:9px 8px;border-bottom:1px solid var(--line)}
  td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
  tr:last-child td{border-bottom:none}
  .pos{color:var(--teal);font-weight:800}.neg{color:var(--pink);font-weight:800}
  .hr{border:none;border-top:1px solid var(--line);margin:16px 0}
  details summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:6px 0;color:var(--muted)}
  /* ---------- matches & odds ---------- */
  .gwhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .deadline{font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:20px;background:rgba(255,201,49,.12);color:var(--gold);border:1px solid rgba(255,201,49,.3)}
  .deadline.passed{background:rgba(255,45,120,.12);color:var(--pink);border-color:rgba(255,45,120,.35)}
  .match{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--card2);transition:border-color .15s}
  .match:hover{border-color:rgba(0,255,135,.25)}
  /* Batch 25: a CSS grid track defaults to min-width:auto, so the 1fr "names" column refused to
     shrink below its content's intrinsic min-content width (a long unbroken team name like
     "KapilaMockingbirds") — that alone was forcing the whole Bet Builder page to overflow
     sideways on every phone width, confirmed via a headless real-browser check (batch 23's
     static-only pass had missed it). min-width:0 lets the track actually shrink to the viewport.
     But shrinking the side-by-side layout down to fit next to 3 odds buttons squeezed the names
     column to ~60-90px, wrapping ordinary team names into an ugly single-word-per-line stack —
     technically no sideways scroll, but not "obviously grouped" either. Below 480px, stack the
     row instead: names get the full card width on their own line, odds buttons get their own
     full-width row underneath (still fits 3 buttons at their 70px min-width comfortably) — matches
     the user's stated principle that stacking onto multiple lines is fine, cramped single-word
     wrapping is not. */
  .match .names{font-weight:800;font-size:14.5px;min-width:0;overflow-wrap:break-word}
  .match .names .vs{color:var(--muted);font-weight:600;font-size:12px;padding:0 6px}
  @media(max-width:480px){
    .match{grid-template-columns:1fr}
    .match .oddsbtns{margin-top:2px}
  }
  .oddsbtns{display:flex;gap:7px}
  .oddbtn{position:relative;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:8px 12px;min-width:70px;text-align:center;font-size:11px;font-weight:700;transition:all .13s}
  .oddbtn b{display:block;font-size:15px;color:var(--text);margin-top:2px}
  .oddbtn:hover{transform:translateY(-2px);border-color:var(--teal)}
  .oddbtn.sel{background:var(--grad);color:#00210f;border-color:transparent;box-shadow:0 4px 16px rgba(0,255,135,.35)}
  .oddbtn.sel b{color:#00210f}
  .oddbtn.boost{border-color:var(--gold);box-shadow:0 0 14px rgba(255,201,49,.25)}
  .oddbtn .was{text-decoration:line-through;opacity:.55;font-size:10px;margin-right:4px}
  .oddbtn .fire{position:absolute;top:-9px;right:-6px;font-size:14px;filter:drop-shadow(0 0 6px rgba(255,157,0,.8))}
  .oddbtn.locked{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
  .oddbtn.locked:hover{transform:none;border-color:var(--line)}
  .match.soon{position:relative}
  .match.soon .oddsbtns{opacity:.35;pointer-events:none;filter:grayscale(.7)}
  .match.soon::after{content:'🚧 Coming soon';position:absolute;top:8px;right:14px;background:rgba(11,0,20,.85);border:1px solid var(--pink);color:var(--pink);font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;padding:4px 9px;border-radius:10px;pointer-events:none}
  /* Batch 25: this ribbon is fine pinned to the top-right corner when .names and .oddsbtns sit
     side by side (it overlays the empty space above the dimmed odds buttons) — but once the
     <480px breakpoint above stacks them into one column, .names now runs the full card width and
     a long team-name line can run right under this absolutely-positioned corner badge. Below that
     same breakpoint, drop it back into normal flow as its own line under the (dimmed) odds row
     instead, so it never sits on top of text. */
  @media(max-width:480px){
    .match.soon::after{position:static;display:inline-block;margin-top:8px}
  }
  .inplay-soon-banner{border:1px dashed var(--pink);text-align:center;padding:14px}
  .inplay-soon-banner b{color:var(--pink);font-size:14px}
  /* ---------- slip ---------- */
  .slip{position:sticky;top:84px}
  .slipleg{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:8px}
  /* Batch 23: icon-only remove/reset button (slip legs, algo bundles, special-market rows,
     odds-setter reset icons) — was a bare 17px glyph with 4px padding (~25px hit area);
     given an explicit min box so it's a real touch target wherever it's used. */
  .x{background:none;color:var(--pink);font-size:17px;font-weight:900;padding:0 4px;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
  .x:hover{background:rgba(255,45,120,.12)}
  /* Batch 36: weekly odds-boost toggle buttons in Odds Setter — reuses .oddbtn.boost's gold
     glow language so an active boost reads the same way admin-side as it does on the board. */
  .x.boost{color:var(--gold);background:rgba(255,201,49,.14);box-shadow:0 0 10px rgba(255,201,49,.3)}
  .bigodds{font-size:26px;font-weight:900}
  /* ---------- pills/status ---------- */
  .pill{display:inline-block;padding:4px 11px;border-radius:14px;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
  .st-pending{background:rgba(255,201,49,.15);color:var(--gold)}
  .st-accepted{background:rgba(0,255,135,.13);color:var(--teal)}
  .st-rejected,.st-expired{background:rgba(255,45,120,.13);color:var(--pink)}
  .st-cancelled{background:var(--card2);color:var(--muted)}
  .st-counter_house,.st-counter_user{background:rgba(0,217,255,.12);color:var(--cyan)}
  .st-won{background:var(--grad);color:#00210f}
  .st-lost{background:var(--gradHot);color:#fff}
  .st-void{background:#444;color:#ddd}
  /* Batch 30: small in-form/out-of-form marker for vGwBoard match rows — deliberately just
     a colored dot (not a text pill) so it stays unobtrusive next to a team name on mobile. */
  .formdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;vertical-align:middle}
  .formdot.hot{background:var(--teal);box-shadow:0 0 6px rgba(0,255,135,.7)}
  .formdot.cold{background:var(--pink);box-shadow:0 0 6px rgba(255,45,120,.7)}
  .flag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:800;margin-left:6px}
  .flag.late{background:var(--gradHot);color:#fff}
  .flag.limit{background:rgba(255,201,49,.2);color:var(--gold);border:1px solid rgba(255,201,49,.4)}
  /* Batch 49: bet-pricing-integrity flag — deliberately a solid, high-contrast danger pill (not
     the plain colored-text "overridden ×N" marker near vOffice's override tool) since this is a
     different, more serious signal: the bet's price can't be confirmed as coming from the board
     at all (bespoke) or doesn't match what the board currently implies (mismatch). */
  .flag.pricecheck{background:var(--danger);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:0 0 10px rgba(255,77,109,.55)}
  /* ---------- bet cards ---------- */
  .bet{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:var(--card2)}
  .bet.needsme{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,217,255,.15)}
  .bet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .bet .legs{font-size:13px;margin:8px 0;list-style:none}
  .bet .legs li{padding:5px 0}
  .nums{display:flex;gap:22px;font-size:12px;margin:10px 0;flex-wrap:wrap;color:var(--muted)}
  .nums b{display:block;font-size:15px;color:var(--text);margin-top:2px}
  .chat{background:rgba(0,0,0,.3);border-radius:12px;padding:12px;margin-top:10px;max-height:230px;overflow-y:auto}
  .msg{margin-bottom:9px;font-size:13px}
  .msg .who{font-weight:800;font-size:10.5px;color:var(--muted)}
  .msg.house .who{color:var(--gold)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .counterbox{background:rgba(0,0,0,.3);border-radius:12px;padding:14px;margin-top:10px;display:none}
  .counterbox.open{display:block}
  .formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
  /* Batch 25: a flex row's items default to min-width:auto, so a <div><label>+<select></div>
     wrapper won't shrink below the select's rendered width — and a <select> with no explicit
     CSS width renders as wide as its longest <option> text (e.g. "🏆 Top Scorer of the GW" in
     the Loader's special-market builder), forcing the whole row to overflow sideways on a phone
     regardless of flex-wrap. Same root cause batch 25's predecessor fixed for .grid2/.match/
     .fixrow — let every formrow child shrink, and let its select fill whatever width it's given
     instead of falling back to intrinsic content width. */
  .formrow>div{min-width:0}
  .formrow select{width:100%;min-width:0}
  .formrow label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
  textarea{width:100%;min-height:80px}
  /* ---------- section tabs (My Bets / Results) ---------- */
  .sectabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .sectabs button{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:20px;font-weight:800;font-size:12.5px;position:relative}
  .sectabs button.active{background:var(--card2);color:var(--text);border-color:var(--teal)}
  .sectabs .cnt{margin-left:6px;opacity:.7;font-weight:700}
  .sectabs .dotflag{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--gradHot);animation:pulse 1.6s infinite}
  /* ---------- THE ALGO ---------- */
  .algozone{border:1px solid rgba(155,92,255,.35);border-radius:20px;padding:22px;margin-bottom:16px;background:linear-gradient(160deg,rgba(155,92,255,.10),rgba(0,217,255,.05));box-shadow:0 0 30px rgba(155,92,255,.12)}
  .algocard{background:rgba(0,0,0,.35);border:1px solid rgba(155,92,255,.4);border-radius:18px;padding:20px;margin:14px 0;min-height:150px;display:flex;flex-direction:column;justify-content:center;transition:transform .15s}
  .algocard.spinning .roll{animation:rollblur .14s linear infinite}
  @keyframes rollblur{0%{filter:blur(0);transform:translateY(0)}50%{filter:blur(3px);transform:translateY(-7px)}100%{filter:blur(0);transform:translateY(0)}}
  .algoodds{font-size:30px;font-weight:900}
  .algoactions{display:flex;gap:10px;justify-content:center;margin-top:6px}
  /* ---------- overlays ---------- */
  #bosh{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
  #bosh.go{display:flex}
  #bosh .flashbg{position:absolute;inset:0;background:radial-gradient(circle,rgba(0,255,135,.28),transparent 65%);animation:flashin .5s ease-out}
  @keyframes flashin{from{opacity:0}to{opacity:1}}
  #bosh .ball{position:absolute;font-size:90px;animation:kick 1.5s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes kick{0%{transform:translate(-60vw,40vh) rotate(0)}45%{transform:translate(0,-4vh) rotate(540deg) scale(1.25)}60%{transform:translate(4vw,-2vh) rotate(620deg) scale(1.1)}100%{transform:translate(70vw,-45vh) rotate(1080deg) scale(.6);opacity:.3}}
  #bosh .boshtxt{font-family:'Archivo Black',sans-serif;font-size:13vw;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;transform:skew(-8deg);animation:boshpop 1.5s cubic-bezier(.2,1.6,.4,1) forwards;filter:drop-shadow(0 8px 30px rgba(0,255,135,.5));white-space:nowrap}
  @keyframes boshpop{0%{transform:scale(0) skew(-8deg);opacity:0}30%{transform:scale(1.15) skew(-8deg);opacity:1}55%{transform:scale(1) skew(-8deg)}80%{opacity:1}100%{transform:scale(1.05) skew(-8deg);opacity:0}}
  /* Batch 15: "It's a cufflink!" duplicate-bet celebration — same overlay, smaller text (longer
     phrase) + hot gradient so it reads distinctly from the green "BOSH!" of a normal placement. */
  #bosh.cufflink .boshtxt{font-size:clamp(30px,7vw,78px);background:var(--gradHot);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 8px 30px rgba(255,45,120,.5))}
  #bosh.cufflink .ball{font-size:0}
  #bosh .ball svg{display:block;width:130px;height:65px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  .confetto{position:absolute;width:10px;height:14px;top:45%;left:50%;opacity:0;animation:conf 1.5s ease-out forwards}
  @keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
  /* promo popup */
  #promoPop{position:fixed;right:18px;bottom:18px;z-index:80;width:320px;max-width:calc(100vw - 36px);display:none;border-radius:20px;padding:2px;background:conic-gradient(from var(--ang,0deg),var(--gold),var(--pink),var(--cyan),var(--gold));animation:spinborder 3s linear infinite, slidein .5s cubic-bezier(.2,1.4,.4,1)}
  @property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
  @keyframes spinborder{to{--ang:360deg}}
  @keyframes slidein{from{transform:translateY(120%)}to{transform:translateY(0)}}
  #promoPop .inner{background:var(--bg2);border-radius:18px;padding:18px}
  #promoPop .ptitle{font-family:'Archivo Black',sans-serif;font-size:18px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--grad);color:#00210f;font-weight:800;padding:13px 24px;border-radius:14px;display:none;z-index:99;box-shadow:var(--shadow);font-size:14px}
  .toast.err{background:var(--gradHot);color:#fff}
  /* ---------- loader / calendar ---------- */
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
  /* Batch 25: same grid min-width:auto trap — a day cell showing a 4-letter month abbreviation
     ("Sept") can be intrinsically wider than 1/7 of a narrow popover, which otherwise refuses to
     shrink and pushes the whole picker sideways. */
  .calgrid>*{min-width:0}
  .calgrid .dayhead{text-align:center;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}
  .daychip{padding:9px 0;min-height:38px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
  .daychip:hover{border-color:var(--teal)}
  .daychip.sel{background:var(--grad);color:#00210f;border-color:transparent}
  .daychip.off{opacity:.25;pointer-events:none}
  .timechips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
  .timechip{padding:10px 14px;min-height:38px;box-sizing:border-box;display:inline-flex;align-items:center;border-radius:20px;background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:13px;font-weight:800;cursor:pointer}
  .timechip:hover{border-color:var(--teal)}
  .timechip.sel{background:var(--grad);color:#00210f;border-color:transparent}
  /* ---------- shared date+time picker widget ---------- */
  .dtpick{display:inline-block}
  .dtpick-panel{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;max-width:min(320px,100%)}
  .fixrow{display:grid;grid-template-columns:24px 1fr 30px 1fr;gap:8px;align-items:center;margin-bottom:8px}
  .fixrow .num{color:var(--muted);font-weight:800;font-size:12px}
  .fixrow .vsmid{text-align:center;color:var(--muted);font-weight:800;font-size:11px}
  /* Batch 25: same min-width:auto grid trap as .match — a bare <select> sizes to its longest
     option text (a long team name), and the 1fr track refused to shrink below that, overflowing
     the Loader page sideways on every phone width (confirmed via headless real-browser check).
     min-width:0 lets the track shrink; width:100% makes the select actually fill it back up. */
  .fixrow select{min-width:0;width:100%}
  .dropzone{border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:border-color .15s}
  .dropzone:hover{border-color:var(--cyan)}
  .dropzone img{max-width:100%;max-height:260px;border-radius:10px;margin-top:10px}
  .codegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
  .codecard{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px}
  .helpbox{background:rgba(0,217,255,.06);border:1px solid rgba(0,217,255,.22);border-radius:14px;padding:14px;font-size:13px;margin-bottom:16px;color:var(--muted)}
  /* Batch 32: same shape as .helpbox but in the danger palette — reserved for the one place in
     the app that lets an admin edit financial history after the fact (post-settlement override). */
  .dangerbox{background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.35);border-radius:14px;padding:14px;font-size:13px;margin-bottom:16px;color:var(--text)}
  .dangerbox b{color:var(--danger)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px}
  .kpi .v{font-size:22px;font-weight:900;margin-top:4px}
  .kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
  .kpi.clickable{cursor:pointer;transition:border-color .15s,transform .15s}
  .kpi.clickable:hover{border-color:var(--violet);transform:translateY(-1px)}
  .kpi.clickable.active{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
  /* Batch 11: personal P&L breakdown grid nested inside a home card (tighter than .kpis) */
  .pnlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
  .pnlstat{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .pnlstat .v{font-size:18px;font-weight:900;margin-top:3px}
  .pnlstat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  /* Batch 16: make remaining home-page cards click targets — either navigate (.card.clickable)
     or expand in place (.hg-toggle, used on a card's <h3> for the P&L sparkline / chat history). */
  .card.clickable{cursor:pointer;transition:border-color .15s,transform .15s}
  .card.clickable:hover{border-color:var(--violet);transform:translateY(-2px)}
  .hg-toggle{cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hg-toggle:hover{color:var(--cyan)}
  .card-hint{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .pnl-spark-wrap{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .pnl-spark{width:100%;height:56px;display:block}
  /* Batch 18: home-page rewards/promotions tracker widget — unused boost/freebet tokens plus
     progress bars toward any active stake_rolling rule's next threshold. */
  .rwd-tokens{display:flex;flex-direction:column;gap:8px}
  .rwd-token{background:rgba(0,0,0,.22);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:12px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .rwd-token.freebet{border-left-color:var(--gold)}
  .rwd-token .rwd-desc{font-weight:800;font-size:13.5px}
  .rwd-progress+.rwd-progress{margin-top:12px}
  .rwd-progress-label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;flex-wrap:wrap}
  .rwd-bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
  .rwd-bar-fill{height:100%;background:var(--grad);border-radius:6px;transition:width .25s}
  /* Batch 12: home-page urgent hero (action needed / live countdown). Hot pink→gold gradient
     card with a small pulsing dot (reuses the existing pulse keyframe, same pattern as
     nav .badge / .notif-bell .dot) rather than animating the whole card's transform. */
  .hero-urgent{background:linear-gradient(135deg,rgba(255,45,120,.16),rgba(255,201,49,.09));border:1px solid rgba(255,153,0,.4);box-shadow:0 6px 28px rgba(255,45,120,.2)}
  .hero-urgent h3{display:flex;align-items:center;gap:9px;margin-bottom:2px}
  .hero-urgent .hero-dot{width:10px;height:10px;border-radius:50%;background:var(--gradHot);animation:pulse 1.6s infinite;display:inline-block;flex-shrink:0}
  .hero-item{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 0 0;border-top:1px solid rgba(255,255,255,.08);margin-top:11px}
  .hero-item:first-of-type{border-top:none;margin-top:8px;padding-top:0}
  /* Batch 22: Bet Settler "FPL scores ready to sync" banner — same hero-urgent gradient/pulse
     treatment as the batch-12 home hero, scaled down to sit inside an existing gw card. */
  .fpl-ready-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,45,120,.16),rgba(255,201,49,.09));border:1px solid rgba(255,153,0,.4);box-shadow:0 6px 28px rgba(255,45,120,.2);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .fpl-ready-banner .hero-dot{width:10px;height:10px;border-radius:50%;background:var(--gradHot);animation:pulse 1.6s infinite;display:inline-block;flex-shrink:0}
  .hero-countdown{font-weight:900;font-size:16px;background:var(--gradGold);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.4px}
  /* Batch 13: home-page live betting board — full-width section (sits outside .homegrid,
     see vHome()) with a fixed table layout so long bet labels/owner names truncate with
     an ellipsis + title tooltip instead of colliding with the £/odds/status columns. */
  .livebet-card{padding:20px 20px 6px}
  .livebet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
  .livebet-head h3{margin-bottom:0}
  .livebet-scroll{overflow-x:auto;margin:8px -4px 2px}
  .livebet-table{table-layout:fixed;width:100%;min-width:560px}
  .livebet-table th,.livebet-table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .livebet-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
  .livebet-table tbody tr:last-child td{border-bottom:none}
  .livebet-table tbody tr:hover td{background:rgba(255,255,255,.03)}
  .livebet-table td.lb-who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
  .livebet-table .lb-label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .livebet-table .lb-stake,.livebet-table .lb-odds{text-align:right}
  .livebet-table .lb-when{font-size:12px;white-space:nowrap}
  .livebet-table .lb-status .pill{font-size:9px}
  .livebet-row{cursor:pointer}
  /* Batch 14: bet detail modal — centered card + dim overlay, same fixed/outside-#view
     pattern as #notifPanel/#notifOverlay above, just centered instead of a side drawer. */
  #betModalOverlay{position:fixed;inset:0;z-index:69;background:rgba(0,0,0,.6);display:none}
  #betModalOverlay.open{display:block}
  #betModal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.97);width:600px;max-width:94vw;max-height:88vh;overflow-y:auto;z-index:70;background:rgba(15,0,28,.98);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;padding:22px;display:none;box-shadow:var(--shadow);transition:transform .15s}
  #betModal.open{display:block;transform:translate(-50%,-50%) scale(1)}
  .betmodal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
  .betmodal-close{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;flex-shrink:0;font-size:16px;line-height:1;color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s}
  .betmodal-close:hover{border-color:var(--pink);color:var(--pink)}
  .betmodal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  /* ---------- Batch 29: Squad viewer (pitch view + fixture comparison) ---------- */
  /* Exactly the #betModal/#betModalOverlay pattern above — fixed, outside #view, .open toggles
     display + a scale transition — just wider (a pitch needs horizontal room, and compare mode
     runs two of them side by side) and one z-index layer higher, so a squad opened from a team
     name inside the bet detail modal sits on top of it rather than behind it. */
  #squadModalOverlay{position:fixed;inset:0;z-index:71;background:rgba(0,0,0,.62);display:none}
  #squadModalOverlay.open{display:block}
  #squadModal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.97);width:920px;max-width:94vw;max-height:90vh;overflow-y:auto;z-index:72;background:rgba(15,0,28,.98);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;padding:22px;display:none;box-shadow:var(--shadow);transition:transform .15s}
  #squadModal.open{display:block;transform:translate(-50%,-50%) scale(1)}
  /* The pitch itself. Deliberately a dark, desaturated green tint rather than a bright turf
     colour so it still reads as part of this app's glassmorphism rather than a pasted-in
     graphic: a soft attacking-third glow at the top, faint mower stripes, and a green-black
     base. Markings (goal box + centre circle) are pseudo-elements — pointer-events:none so
     they can never swallow a tap on a player chip. */
  .sq-pitch{position:relative;border:1px solid rgba(0,255,135,.16);border-radius:18px;padding:18px 12px 16px;overflow:hidden;
    background:
      radial-gradient(120% 76% at 50% -22%, rgba(0,255,135,.13), transparent 62%),
      repeating-linear-gradient(180deg, rgba(255,255,255,.028) 0 34px, rgba(255,255,255,0) 34px 68px),
      linear-gradient(180deg, rgba(0,58,32,.40), rgba(5,0,16,.62));}
  .sq-pitch::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:min(48%,220px);height:54px;border:1.5px solid rgba(255,255,255,.11);border-top:none;border-radius:0 0 10px 10px;pointer-events:none}
  .sq-pitch::after{content:'';position:absolute;bottom:-52px;left:50%;transform:translateX(-50%);width:150px;height:150px;border:1.5px solid rgba(255,255,255,.085);border-radius:50%;pointer-events:none}
  .sq-rowwrap{position:relative;z-index:1;margin-bottom:13px}
  .sq-rowwrap:last-child{margin-bottom:0}
  .sq-rowlab{text-align:center;font-size:8.5px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:5px}
  .sq-row{display:flex;justify-content:center;align-items:stretch;gap:7px;flex-wrap:wrap}
  .sq-chip{position:relative;flex:1 1 80px;min-width:0;max-width:118px;background:rgba(6,0,16,.62);border:1px solid var(--line);border-radius:12px;padding:8px 5px 7px;text-align:center;transition:transform .13s,box-shadow .13s}
  .sq-chip:hover{transform:translateY(-2px)}
  .sq-chip .nm{font-weight:800;font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sq-chip .club{font-size:8.5px;font-weight:800;letter-spacing:.7px;color:var(--muted);margin-top:2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sq-chip .sq-fx{font-size:8.5px;font-weight:800;letter-spacing:.4px;margin-top:2px;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sq-chip .sq-fx.d1,.sq-chip .sq-fx.d2{color:var(--teal)}
  .sq-chip .sq-fx.d3{color:var(--gold)}
  .sq-chip .sq-fx.d4,.sq-chip .sq-fx.d5{color:var(--pink)}
  .sq-meta{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
  .sq-meta .fm{display:inline-block;padding:2px 6px;border-radius:8px;font-size:10px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--card2);color:var(--muted)}
  .sq-meta .tp{font-size:9.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  /* Green→red form ramp. Same colour language as batch 30's formIndicator()/.formdot (--teal
     hot, --pink cold) with --gold/--orange bridging the middle, so this reads as one continuous
     app-wide "hot vs cold" vocabulary rather than a second competing one. Tints are kept low-
     alpha over the near-black chip base so the white name text stays fully legible on the dark
     theme; the saturated colour lives on the small .fm pill, which is where the eye goes. */
  .sq-chip.f-hot{border-color:rgba(0,255,135,.5);background:linear-gradient(165deg,rgba(0,255,135,.14),rgba(6,0,16,.66))}
  .sq-chip.f-hot .fm{background:rgba(0,255,135,.20);color:var(--teal)}
  .sq-chip.f-warm{border-color:rgba(255,201,49,.45);background:linear-gradient(165deg,rgba(255,201,49,.12),rgba(6,0,16,.66))}
  .sq-chip.f-warm .fm{background:rgba(255,201,49,.19);color:var(--gold)}
  .sq-chip.f-mid{border-color:rgba(255,157,0,.42);background:linear-gradient(165deg,rgba(255,157,0,.11),rgba(6,0,16,.66))}
  .sq-chip.f-mid .fm{background:rgba(255,157,0,.18);color:var(--orange)}
  .sq-chip.f-cold{border-color:rgba(255,45,120,.42);background:linear-gradient(165deg,rgba(255,45,120,.11),rgba(6,0,16,.66))}
  .sq-chip.f-cold .fm{background:rgba(255,45,120,.18);color:var(--pink)}
  .sq-chip.f-none{opacity:.66}
  .sq-chip.out{opacity:.55}
  /* Bottom-left, not top-left: the row's position label (GK/DEF/…) sits directly above each
     chip, and a top-anchored badge visually collided with it. The crown keeps the top-right. */
  .sq-chip .sq-alert{position:absolute;bottom:4px;left:5px;font-size:10px;line-height:1;filter:drop-shadow(0 0 4px rgba(255,45,120,.9))}
  /* Top scorer(s): gold border + glow + crown, and a slightly bigger name. Overrides the form
     tint on the chip background but NOT the .fm pill, so both signals survive at a glance. */
  .sq-chip.top{border-color:var(--gold);box-shadow:0 0 18px rgba(255,201,49,.3);background:linear-gradient(160deg,rgba(255,201,49,.22),rgba(6,0,16,.72))}
  .sq-chip.top .nm{font-size:12.5px}
  .sq-chip .crown{position:absolute;top:-10px;right:-6px;font-size:14px;line-height:1;filter:drop-shadow(0 0 6px rgba(255,201,49,.95))}
  .sq-bench{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
  .sq-bench .sq-chip{opacity:.72;padding:6px 5px 5px}
  /* Single-squad mode centres its stats + pitch + fixture list in a column narrower than the
     modal. Without this the pitch stretches the full ~900px on desktop and stops reading as a
     pitch at all — the chips cap at 118px so the rows just float in a wide empty field. */
  .sq-single{max-width:640px;margin:0 auto}
  .sq-switch{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
  .sq-switch button{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:800;transition:all .13s}
  .sq-switch button:hover{color:var(--text);border-color:var(--cyan)}
  .sq-switch button.active{background:var(--grad);color:#00210f;border-color:transparent}
  .sq-stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .sq-stat{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:8px 12px;flex:1 1 96px;min-width:0}
  .sq-stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sq-stat .v{font-size:17px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
  .sq-legend{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:9.5px;color:var(--muted);font-weight:700}
  .sq-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
  .sq-legend .fdr{font-size:9px;padding:2px 7px}
  /* Fixture Difficulty Rating chip. Colour is driven ONLY by the numeric 1-5 rating the FPL API
     returns for that fixture — no real-world team is ever named in the logic. 1-2 green, 3 amber,
     4-5 red, neutral grey when there's no fixture/rating. */
  .fdr{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:10.5px;font-weight:900;letter-spacing:.5px;border:1px solid var(--line);background:var(--card2);color:var(--muted);white-space:nowrap}
  .fdr b{font-size:11.5px}
  .fdr.d1,.fdr.d2{background:rgba(0,255,135,.14);color:var(--teal);border-color:rgba(0,255,135,.42)}
  .fdr.d3{background:rgba(255,201,49,.13);color:var(--gold);border-color:rgba(255,201,49,.40)}
  .fdr.d4,.fdr.d5{background:rgba(255,45,120,.14);color:var(--pink);border-color:rgba(255,45,120,.45)}
  .sq-compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .sq-compare>div{min-width:0}
  @media(max-width:760px){.sq-compare{grid-template-columns:1fr}}
  .sq-side{border:1px solid var(--line);border-radius:18px;padding:13px;background:var(--card2)}
  .sq-side.win{border-color:rgba(0,255,135,.35);box-shadow:0 0 20px rgba(0,255,135,.10)}
  .sq-sidehead{margin-bottom:11px}
  .sq-sidehead .nm{font-family:'Archivo Black','Inter',sans-serif;font-size:15px;line-height:1.2;letter-spacing:-.3px}
  .sq-sidemeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:7px}
  /* Compact variant used inside the side-by-side comparison — same component, smaller chips, so
     two full pitches fit a desktop modal and each still fits a 375px phone once .sq-compare
     stacks them at 760px. */
  .sq-compact .sq-pitch{padding:13px 8px 11px}
  .sq-compact .sq-rowwrap{margin-bottom:10px}
  .sq-compact .sq-row{gap:5px}
  .sq-compact .sq-chip{flex:1 1 58px;max-width:88px;padding:6px 4px 5px}
  .sq-compact .sq-chip .nm{font-size:10px}
  .sq-compact .sq-chip.top .nm{font-size:10.5px}
  .sq-compact .sq-chip .club,.sq-compact .sq-chip .sq-fx{font-size:7.5px}
  .sq-compact .sq-meta{margin-top:4px;gap:4px}
  .sq-compact .sq-meta .fm{font-size:9px;padding:1px 5px}
  .sq-compact .sq-meta .tp{font-size:8.5px}
  .sq-fxlist{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
  .sq-fxrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11.5px;font-weight:700}
  .sq-fxrow .sq-fxclub{min-width:54px;font-weight:900;letter-spacing:.4px}
  .sq-fxrow .sq-fxopp{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sq-fxrow .fdr{padding:2px 8px;font-size:10px}
  /* Every team name in the app is now a click-through into that team's squad. Kept to a dotted

    // shape documented above evaluatePromoRules().
    rewardRules: [], rewards: {}, rewardGrants: [],
    // Batch 27: season-long/mid-season/bespoke special markets — a sibling to each
    // gameweek's `gw.specialMarkets[]` (batch 20) but NOT tied to any specific gameweek.
    // Full shape documented above `SEASON_MARKET_TEMPLATES`.
    seasonMarkets: [],

function migrate(s) {
  // Firebase stores arrays as {0:{}, 1:{}} — convert all back to real arrays
  const toArr = v => v == null ? [] : Array.isArray(v) ? v : Object.values(v);
  ['teams','gameweeks','bets','promos','chat','audit','history','rewardRules','rewardGrants','seasonMarkets'].forEach(k => { s[k] = toArr(s[k]); });
  // Also fix nested matches arrays inside each gameweek. Batch 20: gameweeks also carry a
  // `specialMarkets` array (admin-added special-market offers) that needs the same Firebase
  // object-vs-array fixup; defaults to [] for every gameweek loaded before this batch.
  s.gameweeks.forEach(g => { if (g && g.matches) g.matches = toArr(g.matches); if (g && !g.specialMarkets) g.specialMarkets = []; else if (g) g.specialMarkets = toArr(g.specialMarkets); });
  // Fix nested bet legs and history arrays
  s.bets.forEach(b => {
    if (b && b.legs) b.legs = toArr(b.legs);
    if (b && b.history) b.history = toArr(b.history);
    if (b && b.chat) b.chat = toArr(b.chat);
    if (b && b.flags) b.flags = toArr(b.flags);
    if (b && b.overrideHistory) b.overrideHistory = toArr(b.overrideHistory);
  });
  // De-dupe bets sharing an id. These are leftovers from a since-removed redundant Firebase
  // write in submitBet() that could create a second copy of a just-placed bet under a
  // different Firebase key; only one copy ever got mutated by houseAccept/houseReject, so the
  // other stuck around forever at status:'pending' and never cleared from Bet Review. Keep
  // whichever copy has moved past 'pending' (i.e. actually had an action taken on it); if
  // several have, or none have, keep the one with the most history entries as the best guess
  // at "the one that was actually interacted with".
  if (s.bets.length) {
    const byId = {};
    s.bets.forEach(b => { if (!b || !b.id) return; (byId[b.id] = byId[b.id] || []).push(b); });
    s.bets = Object.values(byId).map(group => {
      if (group.length === 1) return group[0];
      const acted = group.filter(b => b.status !== 'pending');
      const pool = acted.length ? acted : group;
      return pool.reduce((best, b) => (b.history || []).length > (best.history || []).length ? b : best, pool[0]);
    });
  }
  // Batch 17: migrate the old `boosters[tid]` ({id,pct,used}) ledger — from the now-removed
  // auto-grant-every-2nd-bet mechanic — into the new unified `rewards[tid]` ledger as kind:'boost'
  // tokens, so nobody's already-earned unused boosts vanish. One-time; `s.boosters` is dropped
  // afterwards so there's a single source of truth going forward.
  if (!s.rewards) s.rewards = {};
  if (s.boosters) {
    Object.keys(s.boosters).forEach(tid => {
      const toks = Array.isArray(s.boosters[tid]) ? s.boosters[tid] : Object.values(s.boosters[tid]||{});
      if (!toks.length) return;
      if (!s.rewards[tid]) s.rewards[tid] = [];
      toks.forEach(t => { if (t) s.rewards[tid].push({id:t.id, kind:'boost', pct:t.pct, used:!!t.used, grantedAt:t.grantedAt||Date.now(), ruleId:null, ruleName:'Legacy booster'}); });
    });
    delete s.boosters;
  }
  Object.keys(s.rewards).forEach(tid => { s.rewards[tid] = Array.isArray(s.rewards[tid]) ? s.rewards[tid] : Object.values(s.rewards[tid]||{}); });
  if (!s.rewardRules) s.rewardRules = [];
  if (!s.rewardGrants) s.rewardGrants = [];
  if (!s.fpl) s.fpl = {leagueId:'', entryMap:{}, events:{}, lastSync:null, proxyUrl:''};
  if (s.fpl && s.fpl.proxyUrl == null) s.fpl.proxyUrl = '';
  // Batch 29: squad-viewer fields. Backfilled empty for any state saved before this batch (the
  // UI has its own explicit "no squad data pulled yet" state, so empty is a valid resting
  // position, not an error). The per-team squad/lineup lists are plain arrays of player ids and
  // hit Firebase's usual array→{0:…,1:…} stringification on the way back, so they get the same
  // toArr() treatment every other nested array in this function gets.
  ['players','plTeams','squads','lineups','plFixtures'].forEach(k => { if (!s.fpl[k]) s.fpl[k] = {}; });
  Object.keys(s.fpl.squads).forEach(tid => { s.fpl.squads[tid] = toArr(s.fpl.squads[tid]).map(Number).filter(n => !isNaN(n)); });
  Object.keys(s.fpl.lineups).forEach(tid => { s.fpl.lineups[tid] = toArr(s.fpl.lineups[tid]).map(Number).filter(n => !isNaN(n)); });
  Object.keys(s.fpl.plFixtures).forEach(ev => { s.fpl.plFixtures[ev] = toArr(s.fpl.plFixtures[ev]).filter(Boolean); });
  if (s.fpl.squadEvent === undefined) s.fpl.squadEvent = null;
  if (s.fpl.squadSync === undefined) s.fpl.squadSync = null;
  if (!s.fplFixtures) s.fplFixtures = {};
  // Bugfix: this only ever checked `!s.sim` (the whole object missing), not whether `s.sim`
  // existed but was missing its `events` sub-field — which is exactly the shape real production
  // data had (`{holdback:0}`, no `events` key, likely from some path that wrote `sim.holdback`
  // via a full-object assignment rather than a single-field one). Every real S.sim.events[...]
  // read site (fplScoresReady, importFplEvent, syncAndStage) assumed it always existed, so this
  // threw "Cannot read properties of undefined" the moment any of them ran — including
  // fplScoresReady() inside vSettler()'s normal per-gameweek render, which crashed the ENTIRE
  // Settler tab blank for any admin as soon as a real FPL-linked gameweek went live. Backfill the
  // sub-field independently now, same defensive pattern migrate() already uses for s.fpl's
  // sub-keys just above.
  if (!s.sim) s.sim = {holdback:5, events:{}};
  if (!s.sim.events) s.sim.events = {};
  if (s.settings && s.settings.algoEdgePct == null) s.settings.algoEdgePct = 20;
  // Batch 31: backfill accaEdgeByLegs for settings saved before this batch, and normalise
  // Firebase's object-key stringification (accaEdgeByLegs[3] still works fine against string
  // keys via JS property coercion, this is just a defensive fill for any missing leg-count key).
  if (s.settings && !s.settings.accaEdgeByLegs) s.settings.accaEdgeByLegs = {...DEFAULT_SETTINGS.accaEdgeByLegs};
  else if (s.settings) { for (let i=1;i<=10;i++){ if (s.settings.accaEdgeByLegs[i]==null) s.settings.accaEdgeByLegs[i]=DEFAULT_SETTINGS.accaEdgeByLegs[i]; } }
  // Batch 48: house competitiveness (published-odds overround). Backfilled to the "normal" 10 for
  // any settings blob saved before this batch, and defensively clamped/rounded to the 1-20 integer
  // range houseEdgePct() expects (a hand-edited Firebase value could otherwise be anything).
  if (s.settings) {
    let oc = Math.round(Number(s.settings.oddsCompetitiveness));
    if (isNaN(oc)) oc = DEFAULT_SETTINGS.oddsCompetitiveness;
    s.settings.oddsCompetitiveness = Math.max(1, Math.min(20, oc));
  }
  if (s.settings && s.settings.maxPayout === 1000) s.settings.maxPayout = 10000;
  if (s.settings && s.settings.maxPayout === 10000) s.settings.maxPayout = 2000;
  if (!s.seq) s.seq = 1;
  // Backfill fplName (the owner's real full name) onto teams synced before this field
  // existed. Auto-sync matching anchors on this instead of the FPL team name, which owners
  // can rename mid-season and silently break name-based matching.
  s.teams.forEach(t => { const src = TEAMS.find(x => x.id === t.id); if (src && !t.fplName) t.fplName = src.fplName; });
  // Usage/engagement analytics — backfilled empty for any state saved before this feature (an
  // empty usage picture is a valid resting position, not an error). `events` is the one true
  // array in here (same Firebase array-as-object quirk as every other list this function fixes);
  // `daily`/`hourly`/`lastSeen` are keyed by date-string/teamId/teamId respectively, never by a
  // contiguous integer index, so Firebase round-trips them as plain objects with no toArr() needed.
  if (!s.usage) s.usage = {events:[],daily:{},hourly:{},lastSeen:{}};
  s.usage.events = toArr(s.usage.events);
  if (!s.usage.daily) s.usage.daily = {};
  if (!s.usage.hourly) s.usage.hourly = {};
  if (!s.usage.lastSeen) s.usage.lastSeen = {};
  return s;
}

function nid(p) { return p + '_' + (S.seq++); }

/* ================================================================
   FIREBASE SAVE / LOAD
   ================================================================ */
let _saveTimer = null;
function save() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    if (!S) return;
    db.ref(ROOT).set(S).catch(e => console.error('Save failed:', e));
  }, 300);
}

function saveNow() {
  // Cancel any pending debounced write so it can't land later with a stale
  // copy of S and clobber this immediate, synchronous-as-possible write.
  clearTimeout(_saveTimer);
  _saveTimer = null;
  if (!S) return Promise.resolve();
  return db.ref(ROOT).set(S).catch(e => { console.error('Save failed:', e); throw e; });
}

function load() {
  S = freshState();
}

function startListener() {
  if (dbListener) return;
  dbListener = db.ref(ROOT).on('value', snap => {
    const data = snap.val();
    if (!data) {
      S = freshState();
      db.ref(ROOT).set(S);
    } else {
      S = migrate(data);
    }
    if (me) render();
  }, err => {
    toast('Connection error: ' + err.message, true);
  });
  startConnectionMonitor();
}

// Uses Firebase's own '.info/connected' — a special server-maintained ref that reflects the
// SDK's actual websocket state, unlike navigator.onLine (which only knows about the network
// interface, not whether Firebase itself is connected). Drives the header's live/reconnecting
// dot, and forces a one-off fresh read on reconnect + on the tab/PWA becoming visible again —
// belt-and-braces alongside the SDK's own auto-resync, since mobile Safari/PWA can suspend a
// backgrounded tab's socket for long enough that a manual nudge is worth having.
let _connMonitorStarted = false, _everConnected = false;
function startConnectionMonitor() {
  if (_connMonitorStarted) return;
  _connMonitorStarted = true;
  db.ref('.info/connected').on('value', snap => {
    const connected = !!snap.val();
    setSyncDot(connected);
    if (connected) {
      if (_everConnected) { db.ref(ROOT).once('value'); toast('Back online — synced'); }
      _everConnected = true;
    } else if (_everConnected) {
      toast('Connection lost — reconnecting…', true);
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && me) db.ref(ROOT).once('value');
  });
}
function setSyncDot(connected) {
  const d = document.getElementById('syncDot');
  if (!d) return;
  d.classList.toggle('off', !connected);
  d.title = connected ? 'Live — connected' : 'Reconnecting…';
}
// Batch 38: re-render only when a resize actually crosses the mobile/desktop layout breakpoint
// (isMobileLayout's 880px, matching .grid2's own media query) — not on every resize event, so a
// mobile virtual keyboard opening (which changes innerHeight, not innerWidth) never triggers a
// spurious re-render mid-typing.
let _wasMobileLayout = null, _resizeTimer = null;
function watchLayoutBreakpoint() {
  _wasMobileLayout = isMobileLayout();
  window.addEventListener('resize', () => {
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(() => {
      const nowMobile = isMobileLayout();
      if (nowMobile !== _wasMobileLayout) { _wasMobileLayout = nowMobile; if (me) render(); }
    }, 200);
  });
}
watchLayoutBreakpoint();

/* ================================================================
   AUTH — 6-digit PIN
   ================================================================ */
function genPin() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

async function loadAuth() {
  const snap = await db.ref(AUTH_ROOT).once('value');
  const data = snap.val() || {};
  if (Object.keys(data).length === 0) {
    authPins = {};
    TEAMS.forEach(t => { authPins[t.id] = genPin(); });
    await db.ref(AUTH_ROOT).set(authPins);
  } else {
    authPins = data;
  }
}

function getPinFromInputs() {
  return [0,1,2,3,4,5].map(i => {
    const el = document.getElementById('pin'+i);
    return el ? el.value : '';
  }).join('');
}

function doLogin() {
  const selectedChip = document.querySelector('.team-chip.sel');
  if (!selectedChip) { toast('Please select your team first', true); return; }
  const tid = selectedChip.dataset.id;
  const pin = getPinFromInputs();
  if (pin.length !== 6) { toast('Enter your full 6-digit PIN', true); return; }

  // Check if entered PIN matches the target team's PIN
  const correctPin = authPins[tid] === pin;

  // Admin override: admins can access any account with their own PIN
  const adminOverride = TEAMS.filter(t => t.admin).some(t => authPins[t.id] === pin);

  if (correctPin || adminOverride) {
    switchUser(tid);
  } else {
    document.getElementById('loginErr').style.display = 'block';
    [0,1,2,3,4,5].forEach(i => {
      const el = document.getElementById('pin'+i);
      if (el) el.value = '';
    });
    const p0 = document.getElementById('pin0');
    if (p0) p0.focus();
  }
}

function changePin(newPin) {
  if (!me || newPin.length !== 6 || !/^\d{6}$/.test(newPin)) return Promise.reject('Invalid PIN');
  authPins[me.id] = newPin;
  return db.ref(AUTH_ROOT + '/' + me.id).set(newPin);
}

function switchUser(tid) {
  const t = TEAMS.find(x => x.id === tid);
  if (!t) return;
  me = S ? S.teams.find(x => x.id === tid) : null;
  if (!me) me = {id:t.id, name:t.name, owner:t.owner, admin:t.admin};
  sessionStorage.setItem('wlgyl_user', tid);
  slip = []; slipBundles = []; algoCurrent = null;
  activeTab = 'home'; myBetsSec = 'auto'; builderSec = 'pre';
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const bn = document.getElementById('bottomNav');
  if (bn) bn.style.display = '';
  startListener();
  if (S) render();
  // Usage tracking: no-ops via logUsage()'s own guard on the rare cold-start case where S hasn't
  // loaded from Firebase yet (startListener() above is async) — that one login goes unlogged
  // rather than adding complexity to wait for it; every subsequent login/switch has S loaded.
  logUsage('login');
  setTimeout(maybeShowPromo, 900);
}

function logout() {
  if (dbListener) {
    db.ref(ROOT).off('value', dbListener);
    dbListener = null;
  }
  me = null;
  sessionStorage.removeItem('wlgyl_user');
  document.getElementById('login').style.display = '';
  document.getElementById('app').style.display = 'none';
  const bn = document.getElementById('bottomNav');
  if (bn) bn.style.display = 'none';
  closeNotifPanel();
  closeNavDrawer();
  closeSquadModal();
}

const team = id => S && S.teams ? S.teams.find(t=>t.id===id) : TEAMS.find(t=>t.id===id);
const gw = id => S.gameweeks.find(g=>g.id===id);
const GBP = n => (n<0?'-£':'£') + Math.abs(n).toFixed(2);
const fmtOdds = n => { const cents=Math.round(Number(n)*100); return cents%10===0 ? (cents/100).toFixed(1) : (cents/100).toFixed(2); };
const fmtDT = ts => ts ? new Date(ts).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}) : '—';
// Batch 12: countdown formatter for the home-page urgent hero's live-ticking deadline —
// mm:ss once under an hour away, otherwise "Xh YYm". `ms` is a duration (deadline - now).
const fmtCountdown = ms => {
  if(ms<=0) return 'cutoff passed';
  const totalSec=Math.floor(ms/1000);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  return h>0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
};

function ukOffsetMin(ts){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(ts);
  const g=t=>+p.find(x=>x.type===t).value;
  return (Date.UTC(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'))-ts)/60000;
}
function ukWallToTs(y,mo,d,hh,mm){
  let ts=Date.UTC(y,mo-1,d,hh,mm);
  ts=Date.UTC(y,mo-1,d,hh,mm)-ukOffsetMin(ts)*60000;
  ts=Date.UTC(y,mo-1,d,hh,mm)-ukOffsetMin(ts)*60000;
  return ts;
}
function ukToday(){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(Date.now());
  const g=t=>+p.find(x=>x.type===t).value;
  return {y:g('year'), m:g('month'), d:g('day')};
}
function parseDTLocal(val){
  const m=String(val).match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);
  return m? ukWallToTs(+m[1],+m[2],+m[3],+m[4],+m[5]) : null;
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================================================================
   SHARED DATE+TIME PICKER WIDGET — click-to-select day + time,
   no raw digit typing required. Backed by `dtPickState[key]`
   ({day:{y,m,d}|null, time:'HH:MM'|null}); one popover open at a

   Odds Setter cutoff/in-play-close fields. Final value is handed
   back through `parseDTLocal()` (same `ukWallToTs` UK→UTC
   conversion under the hood) so callers see the same string shape
   a native datetime-local input used to produce.
   ================================================================ */
const DT_TIME_CHIPS=['11:00','12:30','14:00','15:00','17:30','19:45','20:00'];
let dtPickOpen=null;
let dtPickState={};
function dtPartsFromTs(ts){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(ts);
  const g=t=>+p.find(x=>x.type===t).value;
  return {day:{y:g('year'),m:g('month'),d:g('day')}, time:String(g('hour')).padStart(2,'0')+':'+String(g('minute')).padStart(2,'0')};
}
function dtPickInit(key, ts){
  if(!(key in dtPickState)) dtPickState[key]= ts!=null ? dtPartsFromTs(ts) : {day:null,time:null};
  return dtPickState[key];
}
function dtPickToggle(key, ts){

  else { dtPickState[key]= ts!=null ? dtPartsFromTs(ts) : (dtPickState[key]||{day:null,time:null}); dtPickOpen=key; }

function dtPickSetDay(key,y,m,d){ if(!dtPickState[key]) dtPickState[key]={day:null,time:null}; dtPickState[key].day={y,m,d}; render(); }
function dtPickSetTime(key,t){ if(!dtPickState[key]) dtPickState[key]={day:null,time:null}; dtPickState[key].time=t; render(); }
function dtPickValStr(key){

  return `${st.day.y}-${p(st.day.m)}-${p(st.day.d)}T${st.time}`;
}
function dtPickConfirm(key, fn){

function calGrid(key,sel){
  const t=ukToday();
  const todayUTC=Date.UTC(t.y,t.m-1,t.d);
  const dow=(new Date(todayUTC).getUTCDay()+6)%7;
  let html='<div class="calgrid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span class="dayhead">${d}</span>`).join('');
  for(let i=0;i<21;i++){
    const ts=todayUTC+(i-dow)*864e5;
    const dt=new Date(ts);
    const y=dt.getUTCFullYear(),mo=dt.getUTCMonth()+1,da=dt.getUTCDate();
    const off=ts<todayUTC?'off':'';
    const s=sel&&sel.y===y&&sel.m===mo&&sel.d===da?'sel':'';
    html+=`<span class="daychip ${off} ${s}" onclick="dtPickSetDay('${key}',${y},${mo},${da})">${da}<div class="small muted" style="font-size:9px">${dt.toLocaleString('en-GB',{month:'short',timeZone:'UTC'})}</div></span>`;
  }
  return html+'</div>';
}
function dtPickerPanelInner(key, opts){

    <div class="timechips">${chips.map(t=>`<span class="timechip ${st.time===t?'sel':''}" onclick="dtPickSetTime('${key}','${t}')">${t}</span>`).join('')}

/* Popover-style picker: a trigger button showing the current value that
   expands into a `dtPickerPanelInner` with Confirm/Cancel. `opts.onConfirm`
   is a JS expression string invoked on confirm (typically calling
   `dtPickConfirm(key, v=>yourSetter(id,v))`). `opts.label` is the trigger's
   empty-state text. */
function dtPicker(key, currentTs, opts){
  opts=opts||{};
  dtPickInit(key, currentTs);
  const st=dtPickState[key];
  const isOpen=dtPickOpen===key;
  const previewTs=(st.day&&st.time)? ukWallToTs(st.day.y,st.day.m,st.day.d,...st.time.split(':').map(Number)) : currentTs;
  const btnLabel=previewTs? fmtDT(previewTs) : (opts.label||'Pick date & time');
  return `<div class="dtpick">
    <button type="button" class="btn secondary small" onclick="dtPickToggle('${key}',${currentTs!=null?currentTs:'null'})">🗓️ ${btnLabel}</button>
    ${isOpen?`<div class="dtpick-panel">
      ${dtPickerPanelInner(key,opts)}
      <div class="actions" style="margin-top:8px">
        <button type="button" class="btn small" onclick="${opts.onConfirm}">✓ Set</button>
        <button type="button" class="btn secondary small" onclick="dtPickOpen=null;render()">Cancel</button>
      </div>
    </div>`:''}
  </div>`;
}

  const t=document.getElementById('toast');
  if (!t) return;
  t.textContent=msg; t.className='toast'+(err?' err':''); t.style.display='block';

}
