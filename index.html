/* ================================================================
   PROMOTIONS / REWARDS SYSTEM (Batch 17)
   ----------------------------------------------------------------
   NOT to be confused with `S.promos` above — that's the older house-
   wide flash odds-boost mechanic (createPromoForGw/maybeShowPromo,
   one boosted price on one match, admin-triggered per gameweek,
   shown to everyone as a pop-up). This is a completely separate
   system: admin-authored RULES that watch each team's own betting
   activity and grant that team a personal reward when a trigger
   condition is met, replacing the old blanket "booster every 2nd
   bet" mechanic.

   Data model on `S`:
     S.rewardRules  : RewardRule[]
       { id, name, active, trigger, reward, createdAt, createdBy }
       trigger (discriminated on .kind):
         {kind:'stake_rolling', thresholdGBP, windowDays}
           — fires once per full multiple of thresholdGBP that a
             team's summed stake over the trailing windowDays crosses
             (re-fires as they keep betting — see grantReward below).
         {kind:'fold_size', minLegs}
           — fires once per individual bet placed with >= minLegs legs.
         {kind:'odds_threshold', minOdds}
           — fires once per individual bet placed with effOdds >= minOdds.
       reward (discriminated on .kind):
         {kind:'boost', pct}    — grants a {kind:'boost',pct,used} token
         {kind:'freebet', amount} — grants a {kind:'freebet',amount,used} token

     S.rewards[teamId] : RewardToken[]  — the per-team ledger of every
       token ever granted (rule-triggered AND manual), oldest first.
       {id, kind:'boost'|'freebet', pct?|amount?, used, grantedAt,
        ruleId (null for a manual grant), ruleName}
       A boost token is the same {id,pct,used} shape the old ad-hoc
       booster system used — batch 18's tracker widget can read
       `(S.rewards[teamId]||[]).filter(t=>!t.used)` directly.

     S.rewardGrants : Grant[] — idempotency log, one row per
       (ruleId, teamId, eventKey) that has ever paid out, so the same
       qualifying event (the same bet, or the same rolling-stake
       "level") can never grant twice. {id, ruleId, teamId, eventKey,
       rewardId, at}. `ruleId==='manual'` for ad-hoc admin grants.

   Evaluation is called from two places, both idempotent by construction:
     - submitBet(), right after a bet is pushed — checks the placing
       team's rules against that new bet.
     - settleGw(), after settlement — re-checks every team (mainly to
       catch stake_rolling levels; fold_size/odds_threshold need a
       bet in `opts` and are no-ops here).
   ================================================================ */
function rollingStake(teamId, windowDays){
  const cutoff=Date.now()-windowDays*86400000;
  return S.bets.filter(b=>b.teamId===teamId && b.placedAt>=cutoff && !['cancelled','rejected'].includes(b.status))
    .reduce((s,b)=>s+b.stake,0);
}
// Grants one reward token from `rule` to `teamId` for qualifying event `eventKey`, unless that
// exact (ruleId, teamId, eventKey) combination has already been granted — the idempotency check
// that makes rule evaluation safe to re-run freely. `rule` can be a real S.rewardRules entry, or
// a throwaway {id:'manual', name, reward} object for an admin's ad-hoc grant. Returns the new
// token, or null if nothing was granted (already paid out, or an unrecognised reward kind).
function grantReward(teamId, rule, eventKey){
  if(!teamId || !rule || !rule.reward) return null;
  const already=S.rewardGrants.some(gr=>gr.ruleId===rule.id && gr.teamId===teamId && gr.eventKey===eventKey);
  if(already) return null;
  let tok=null;
  if(rule.reward.kind==='boost'){
    tok={id:nid('rwd'), kind:'boost', pct:rule.reward.pct, used:false, grantedAt:Date.now(), ruleId:rule.id==='manual'?null:rule.id, ruleName:rule.name};
  } else if(rule.reward.kind==='freebet'){
    tok={id:nid('rwd'), kind:'freebet', amount:rule.reward.amount, used:false, grantedAt:Date.now(), ruleId:rule.id==='manual'?null:rule.id, ruleName:rule.name};
  } else return null;
  if(!S.rewards[teamId]) S.rewards[teamId]=[];
  S.rewards[teamId].push(tok);
  S.rewardGrants.push({id:nid('grant'), ruleId:rule.id, teamId, eventKey, rewardId:tok.id, at:Date.now()});
  const desc=tok.kind==='boost'?`+${tok.pct}% odds boost`:`£${tok.amount} free bet`;
  pushNotif(teamId,'reward_granted',`🎁 You unlocked a reward — ${desc} (${rule.name})!`);
  audit('reward_grant', `${team(teamId)?team(teamId).name:teamId} — "${rule.name}" — ${desc}`);
  return tok;
}
// Checks every active rule against `teamId`'s recent activity and grants whatever newly
// qualifies. `opts.bet` — pass the just-placed bet so fold_size/odds_threshold rules (which are
// evaluated per-bet) can see it; omit for a activity-only sweep (e.g. from settleGw) where only
// stake_rolling rules (which look at aggregate history, not one bet) can still fire. Returns the
// array of tokens newly granted this call (each already appended to S.rewards/S.rewardGrants).
function evaluatePromoRules(teamId, opts){
  if(!teamId || !S.rewardRules || !S.rewardRules.length) return [];
  opts=opts||{};
  const granted=[];
  S.rewardRules.filter(r=>r.active).forEach(rule=>{
    if(rule.trigger.kind==='fold_size'){
      if(opts.bet && opts.bet.legs.length>=rule.trigger.minLegs){
        const g=grantReward(teamId, rule, 'bet:'+opts.bet.id);
        if(g) granted.push(g);
      }
    } else if(rule.trigger.kind==='odds_threshold'){
      if(opts.bet && opts.bet.effOdds>=rule.trigger.minOdds){
        const g=grantReward(teamId, rule, 'bet:'+opts.bet.id);
        if(g) granted.push(g);
      }
    } else if(rule.trigger.kind==='stake_rolling'){
      const sum=rollingStake(teamId, rule.trigger.windowDays);
      const level=Math.floor(sum/rule.trigger.thresholdGBP);
      for(let L=1; L<=level; L++){
        const g=grantReward(teamId, rule, 'lvl:'+L);
        if(g) granted.push(g);
      }
    }
  });
  return granted;
}
// Admin ad-hoc grant, outside any rule — used by the Promotions tab's "Manual grant" panel.
function manualGrantReward(teamId, kind, val, note){
  const ruleLike={id:'manual', name:note||'Manual grant', reward: kind==='boost'?{kind:'boost',pct:val}:{kind:'freebet',amount:val}};
  return grantReward(teamId, ruleLike, 'manual:'+nid('evt'));
}
// Batch 17 bet-builder integration: the old manual "pick a booster" chip UI is gone (players no
// longer choose) — instead the single best unused reward of each kind is auto-applied at
// placement. Boost: highest % wins (never stacks). Free bet: the largest token that still fits
// fully inside the stake (so a big free bet isn't wasted covering a tiny bet) — capped at the
// stake either way, see placeBet()/submitBet()'s stakeCredit handling.
function autoBoostToken(teamId){
  return (S.rewards[teamId]||[]).filter(t=>t.kind==='boost'&&!t.used).sort((a,b)=>b.pct-a.pct)[0]||null;
}
function autoFreeBetToken(teamId, stake){
  if(!(stake>0)) return null;
  const fits=(S.rewards[teamId]||[]).filter(t=>t.kind==='freebet'&&!t.used&&t.amount<=stake);
  if(fits.length) return fits.sort((a,b)=>b.amount-a.amount)[0];
  return null;
}
// Batch 18: home-page tracker widget data — the team's unused reward tokens (ready to auto-apply
// on their next bet, see autoBoostToken/autoFreeBetToken above) plus progress toward each active
// stake_rolling rule's next threshold. Pure/read-only, no grants happen here (that's
// evaluatePromoRules(), called from submitBet()/settleGw() — this just reports where a team
// currently stands). `into` is how far the team is past the last fully-crossed threshold level
// (so a team that's already crossed a level or two still shows sensible 0-100% progress toward
// the NEXT one, not a number >100%).
function rewardsTrackerData(teamId){
  const tokens=(S.rewards[teamId]||[]).filter(t=>!t.used).slice().sort((a,b)=>b.grantedAt-a.grantedAt);
  const progress=(S.rewardRules||[]).filter(r=>r.active && r.trigger.kind==='stake_rolling').map(rule=>{
    const thr=rule.trigger.thresholdGBP, windowDays=rule.trigger.windowDays;
    const sum=rollingStake(teamId, windowDays);
    const into=sum - Math.floor(sum/thr)*thr;
    const pct=thr>0?Math.min(100,(into/thr)*100):0;
    const rewDesc=rule.reward.kind==='boost'?`+${rule.reward.pct}% odds boost`:`${GBP(rule.reward.amount)} free bet`;
    return {rule, thr, windowDays, into, pct, rewDesc, remaining:Math.max(0,thr-into)};
  });
  return {tokens, progress};
}
function rewardsTrackerWidget(teamId){
  const {tokens,progress}=rewardsTrackerData(teamId);
  if(!tokens.length && !progress.length) return `<div class="card"><h3>🎁 My rewards</h3><p class="muted small">No rewards yet — keep betting and any active house promotions will credit you automatically.</p></div>`;
  return `<div class="card">
    <h3>🎁 My rewards</h3>
    ${tokens.length?`<div class="rwd-tokens">${tokens.map(t=>`
      <div class="rwd-token ${t.kind}">
        <span class="rwd-desc">${t.kind==='boost'?'🚀 +'+t.pct+'% odds boost':'🎟️ '+GBP(t.amount)+' free bet'}</span>
        <span class="muted small">${esc(t.ruleName||'Manual grant')} · ready to use</span>
      </div>`).join('')}</div>`
      :`<p class="muted small">No unused rewards right now.</p>`}
    ${progress.length?`<div style="${tokens.length?'margin-top:14px;padding-top:12px;border-top:1px solid var(--line)':''}">${progress.map(p=>`
      <div class="rwd-progress">
        <div class="rwd-progress-label"><span>${esc(p.rule.name)}</span><span class="muted">${GBP(p.into)} / ${GBP(p.thr)} wagered this ${p.windowDays}d</span></div>
        <div class="rwd-bar"><div class="rwd-bar-fill" style="width:${p.pct}%"></div></div>
        <p class="muted small" style="margin-top:4px">${p.remaining>0?GBP(p.remaining)+' more unlocks '+esc(p.rewDesc):'Threshold hit — reward on its way!'}</p>
      </div>`).join('')}</div>`:''}
  </div>`;
}

async function loadNotifications() {
  if (!me) return [];
  const snap = await db.ref('lennon-lounge-notifs/' + me.id).once('value');
  const data = snap.val();
  return data ? Object.keys(data).map(k => ({...data[k], key: k})) : [];
}

async function pushNotif(teamId, type, msg) {
  const notif = {id: Date.now()+'_'+Math.random().toString(36).slice(2), type, msg, ts: Date.now(), read: false};
  return db.ref('lennon-lounge-notifs/' + teamId).push(notif);
}

async function markAllRead() {
  if (!me) return;
  const snap = await db.ref('lennon-lounge-notifs/' + me.id).once('value');
  const data = snap.val();
  if (!data) return;
  const updates = {};
  Object.keys(data).forEach(k => { updates[k + '/read'] = true; });
  await db.ref('lennon-lounge-notifs/' + me.id).update(updates);
  renderNotifications();
  const dot = document.getElementById('notifDot');
  if (dot) dot.style.display = 'none';
}

async function renderNotifications() {
  const notifs = await loadNotifications();
  const list = document.getElementById('notifList');

  notifs.sort((a,b) => b.ts - a.ts);
  const unread = notifs.filter(n => !n.read).length;
  const dot = document.getElementById('notifDot');
  if (dot) {
    dot.style.display = unread > 0 ? 'flex' : 'none';
    dot.textContent = unread > 9 ? '9+' : String(unread);
  }
  list.innerHTML = notifs.length === 0
    ? '<div class="muted" style="text-align:center;padding:30px">No notifications yet</div>'
    : notifs.map(n => `<div class="notif-item ${n.read?'':'unread'}">
        <div class="notif-del" title="Delete" onclick="event.stopPropagation();deleteNotif('${n.key}')">✕</div>

}

async function deleteNotif(key) {
  if (!me || !key) return;
  await db.ref('lennon-lounge-notifs/' + me.id + '/' + key).remove();

}

async function clearAllNotifs() {

}

/* ---- Anti-match-fixing integrity check ----
   A leg "on" a player's own team is only allowed if it's a straight win pick for
   that team, or a top_score special naming that team. Anything else touching the
   player's own team (draw, backing the opponent, team_pts/haul/match_total specials
   on their own team) makes the ENTIRE slip/bundle unsubmittable — not just that leg. */
function slipViolatesIntegrity(legs, myTeamId){
  if(!myTeamId || !legs || !legs.length) return false;
  return legs.some(leg=>{
    if(leg.type==='match'){
      const g=gw(leg.gwId); const m=g&&g.matches.find(x=>x.id===leg.matchId);
      if(!m) return false;
      const involved = m.home===myTeamId || m.away===myTeamId;
      if(!involved) return false;
      const ownWin = (m.home===myTeamId && leg.pick==='home') || (m.away===myTeamId && leg.pick==='away');
      return !ownWin;
    }
    if(leg.type==='special'){
      if(leg.kind==='top_score') return false; // top-scorer picks (own team included) are always fine
      // Batch 20: bottom_score is a new special-market kind (mirrors top_score) but is NOT exempt —
      // only top_score gets the carve-out per batch 3's rule, so backing your own team to finish
      // bottom is still treated as a disallowed against-your-own-team bet, same as team_pts/haul.
      if(leg.kind==='team_pts' || leg.kind==='haul' || leg.kind==='bottom_score') return leg.teamId===myTeamId;
      if(leg.kind==='match_total'){
        const g=gw(leg.gwId); const m=g&&g.matches.find(x=>x.id===leg.matchId);
        if(!m) return false;
        return m.home===myTeamId || m.away===myTeamId;
      }
    }
    return false;
  });
}

function submitBet({gwId, legs, effOdds, stake, viaAlgo, boostPct, freeBetAmount, message, duplicateOf}){
  // Batch 28: a season-market bet has no gwId — legs are ALL type:'season' (batch 27's
  // settleSeasonBet() requires that uniformity, and addSeasonLeg() below never mixes a season
  // leg into the gameweek `slip`), so it skips the gw/bettableNow gating entirely and instead
  // just re-checks that every referenced market is still open (belt-and-braces — vSeasonBets()
  // already only offers open markets as clickable buttons).
  const isSeason = !!(legs && legs.length && legs.every(l=>l.type==='season'));
  let g=null, mode='pre';
  if(isSeason){
    if(legs.some(l=>{ const m=(S.seasonMarkets||[]).find(x=>x.id===l.marketId); return !m||m.status!=='open'; })){
      toast('One or more of these season markets is no longer open', true); render(); return false;
    }
  } else {
    g=gw(gwId); mode=bettableNow(g);
    if(!mode){ toast('Betting is closed for '+g.name+' right now', true); render(); return false; }
    if(mode==='inplay'){
      toast("In-play betting is coming soon — new in-play bets can't be placed yet.", true);
      render(); return false;
    }
  }
  if(slipViolatesIntegrity(legs, me.id)){
    toast("Can't place this bet — it includes a pick against/on your own match that isn't a straight win or top-scorer bet.", true);
    render(); return false;
  }
  const now=Date.now();
  const bet={
    id:nid('bet'), teamId:me.id, gwId: isSeason?null:gwId, legs, stake, effOdds,
    status:'pending', placedAt:now, inplay: isSeason?false:mode==='inplay', afterCutoff:false,
    algo:!!viaAlgo, boostPct:boostPct||0,
    // Batch 28: explicit marker (also derivable via isSeasonBet(bet) from legs alone — kept as a
    // real field too for cheap filtering/debugging without re-walking legs every time).
    seasonBet: isSeason,
    // Batch 17: amount of this bet's stake that was covered by an auto-applied free-bet reward
    // (0 for a normal bet). It's the player's OWN money at risk that's reduced by this amount —
    // see computePnl()'s stakeCredit handling for exactly how that plays out on win/loss.
    stakeCredit: freeBetAmount||0,
    // Batch 14: set when this bet was placed via "duplicate bet" from the click-into-bet modal
    // (holds the original bet's id). Batch 15 uses this to trigger its alternate "cufflink"
    // celebration in place of the normal one — untouched/unused by this batch otherwise.
    duplicateOf: duplicateOf||null,
    limitFlags:betLimitFlags(stake, stake*effOdds, S.settings),
    history:[{by:me.id, role:'player', action:'placed'+(viaAlgo?' via The Algo':'')+(mode==='inplay'?' (in-play)':''), stake, odds:effOdds, message:message||'', at:now}],
  };
  S.bets.push(bet);
  // NOTE: previously there was also a separate db.ref(ROOT+'/bets').push(bet) write here
  // "for concurrent safety". That was the actual root cause of the Bet Review "accept/reject
  // doesn't remove the bet" bug: save()/saveNow() below already does a full db.ref(ROOT).set(S)
  // that persists this bet as part of the whole state tree, so the extra push() created a
  // second, differently-keyed copy of the same bet (same id, separate object identity) once a
  // client's local S got refreshed from a listener snapshot taken between the two writes and
  // then saved again. houseAccept/houseReject only mutated whichever copy .find() happened to
  // return, leaving the other stuck at status:'pending' forever. Removed — save() is the single
  // source of truth for persisting a newly placed bet.
  // Batch 17: rule-based promotion grants replace the old maybeGrantBooster() every-2nd-bet
  // mechanic. Only the placing team's rules are checked here (fold_size/odds_threshold read
  // straight off this new bet; stake_rolling re-sums their recent activity including it).
  const grantedRewards=evaluatePromoRules(me.id,{bet});
  // Notify admins
  TEAMS.filter(t=>t.admin&&t.id!==me.id).forEach(t=>{
    pushNotif(t.id,'bet_placed',`${me.name} placed a bet — ${legs.length} leg(s) @ ${fmtOdds(effOdds)} · £${stake}`);
  });
  save(); bosh(!!bet.duplicateOf);
  setTimeout(()=>{
    let msg='Bet placed — the house is on it';
    if(grantedRewards.length===1){
      const r=grantedRewards[0];
      msg = r.kind==='boost' ? `🎁 Reward unlocked: +${r.pct}% odds boost for a future bet!` : `🎁 Reward unlocked: £${r.amount} free bet credit!`;
    } else if(grantedRewards.length>1){
      msg = `🎁 ${grantedRewards.length} new rewards unlocked — check your rewards!`;
    }
    toast(msg); go('mybets');
  },1200);
  return true;
}

// In-play boards lock everything (same "coming soon" treatment batch 4 gave match odds). Otherwise

// (only top_score is exempt — see slipViolatesIntegrity) — same lock-icon-plus-tooltip pattern
// vGwBoard already uses for the draw/opponent-win match buttons.
function specialMarketsBoard(g, inplay){
  const rows=(g.specialMarkets||[]).map(m=>{
    if(inplay){
      return `<button class="oddbtn locked" disabled title="🚧 In-play betting is coming soon">${esc(m.label)}<b>${fmtOdds(m.odds)}</b></button>`;
    }

    if(slipViolatesIntegrity([leg], me.id)){

    }

/* ---- Slip ---- */
function addMatchLeg(gwId,matchId,pick){
  const g=gw(gwId); const m=g.matches.find(m=>m.id===matchId);
  const i=slip.findIndex(l=>l.type==='match'&&l.matchId===matchId);
  slipDuplicateOf=null; // batch 14: any manual edit un-flags the slip as a straight duplicate
  if(i>-1&&slip[i].pick===pick){ slip.splice(i,1); render(); return; }
  const boosted=promoPrice(gwId,matchId,pick);
  const label=pick==='draw'?`Draw — ${team(m.home).name} v ${team(m.away).name}`:`${team(pick==='home'?m.home:m.away).name} to WIN v ${team(pick==='home'?m.away:m.home).name}`;
  const leg={type:'match',gwId,matchId,pick,odds:boosted??m.odds[pick],label:label+(boosted?' 🔥BOOSTED':'')};
  if(i>-1) slip[i]=leg; else slip.push(leg);
  render();
}

function addSpecialLeg(leg){
  slipDuplicateOf=null; // batch 14: see addMatchLeg
  slip.push(leg); render();
}

// Batch 20: first manual UI caller of addSpecialLeg — picks an admin-added special market
// (gw.specialMarkets[], built in the Loader's "🎲 Special markets" card) off the board and adds
// it to the slip as a leg. Toggles off if already in the slip (same UX as addMatchLeg). Re-checks
// slipViolatesIntegrity() here too (defense in depth — vGwBoard/specialMarketsBoard already greys
// out/disables the button for a blocked market, this is the belt-and-braces backstop matching the
// pattern batch 3 set for match-winner legs).
function addMarketLeg(gwId, marketId){
  const g=gw(gwId); const m=g&&g.specialMarkets&&g.specialMarkets.find(x=>x.id===marketId);
  if(!m) return;
  const i=slip.findIndex(l=>l.type==='special'&&l.marketId===marketId);
  if(i>-1){ slip.splice(i,1); slipDuplicateOf=null; render(); return; }
  const leg={type:'special', gwId, marketId:m.id, kind:m.kind, teamId:m.teamId||undefined, matchId:m.matchId||undefined, line:m.line, dir:m.dir, odds:m.odds, label:m.label};
  if(slipViolatesIntegrity([leg], me.id)){
    toast("Can't add this — it's a special market on/against your own team.", true);
    return;
  }
  addSpecialLeg(leg);
}

function removeFromSlip(i){ slipDuplicateOf=null; slip.splice(i,1); render(); }

function slipOdds(){
  if(slip.length===0) return 0;
  if(slip.length===1) return slip[0].odds;
  return combinedOdds(slip.map(l=>l.odds),S.settings);
}

function slipOddsFinal(){ const t=autoBoostToken(me.id); const o=slipOdds(); return t?Math.round(o*(1+t.pct/100)*100)/100:o; }

function slipContext(){
  const gwIds=[...new Set(slip.map(l=>l.gwId))];
  if(gwIds.length===0) return {ok:false,reason:'empty'};
  if(gwIds.length>1) return {ok:false,reason:'All legs must be in the same gameweek'};
  const g=gw(gwIds[0]); const mode=bettableNow(g);
  if(!mode) return {ok:false,reason:'Betting is closed for '+g.name+' right now'};
  return {ok:true,g,mode};
}

function placeBet(){
  const stake=parseFloat(document.getElementById('stakeInput').value);
  if(!stake||stake<S.settings.minStake){ toast('Enter a stake',true); return; }
  const ctx=slipContext();
  if(!ctx.ok){ toast(ctx.reason,true); return; }
  const tok=autoBoostToken(me.id);
  const freeTok=autoFreeBetToken(me.id, stake);
  const eff=slipOddsFinal();
  const msg=document.getElementById('betMsg').value.trim();
  if(submitBet({gwId:ctx.g.id,legs:slip.map(l=>({...l})),effOdds:eff,stake,boostPct:tok?tok.pct:0,freeBetAmount:freeTok?Math.min(freeTok.amount,stake):0,message:msg,duplicateOf:slipDuplicateOf})){
    if(tok) tok.used=true;
    if(freeTok) freeTok.used=true;
    slip=[]; slipDuplicateOf=null; save();
  }
}

function pushHist(b,action,extra={}){

function legLiveInfo(leg,g){
  // Batch 28: season-market legs aren't tied to a gameweek at all (g is always null for a
  // season bet, see submitBet()), so they need their own branch ahead of the `!g` bail-out
  // below — graded via evalSeasonLeg()/S.seasonMarkets instead of evalLeg()/g.matches.
  if(leg.type==='season'){
    const m=(S.seasonMarkets||[]).find(x=>x.id===leg.marketId);
    const out=evalSeasonLeg(leg);
    const score=m&&m.status==='settled'?('result: '+String(m.result).toUpperCase()):'';
    return {out,score};
  }
  if(!g) return {out:null,score:''};
  const out=evalLeg(leg,g);
  let score='';
  if(leg.type==='match'||leg.kind==='match_total'){
    const m=g.matches.find(m=>m.id===leg.matchId);
    if(m&&m.result) score=m.result.homePts+'–'+m.result.awayPts+(leg.kind==='match_total'?' ('+(m.result.homePts+m.result.awayPts)+' total)':'');
  } else if(leg.kind==='top_score'){
    const played=g.matches.filter(m=>m.home&&m.away&&m.result);
    if(played.length){
      let best=null;
      played.forEach(m=>{[[m.home,m.result.homePts],[m.away,m.result.awayPts]].forEach(([t,p])=>{ if(!best||p>best[1]) best=[t,p]; });});
      if(best) score='top: '+team(best[0]).name+' '+best[1];
    }
  } else if(leg.kind==='bottom_score'){
    const played=g.matches.filter(m=>m.home&&m.away&&m.result);
    if(played.length){
      let worst=null;
      played.forEach(m=>{[[m.home,m.result.homePts],[m.away,m.result.awayPts]].forEach(([t,p])=>{ if(!worst||p<worst[1]) worst=[t,p]; });});
      if(worst) score='bottom: '+team(worst[0]).name+' '+worst[1];
    }
  } else if(leg.teamId){
    const m=g.matches.find(m=>m.home===leg.teamId||m.away===leg.teamId);
    if(m&&m.result) score=(m.home===leg.teamId?m.result.homePts:m.result.awayPts)+' pts';
  }
  return {out,score};
}

function legChip(info){

  return '<span class="lr pend">·</span>';
}

function betCard(b,perspective){
  const g=gw(b.gwId);
  const seasonBet=isSeasonBet(b);
  // Batch 28: a season bet has no gw deadline to check — "locked in, can't cancel" instead means
  // at least one of its referenced season markets has already been settled (its outcome is fixed).
  // Non-season bets keep the exact prior gwDeadlinePassed() behavior, untouched.
  const passed=seasonBet

        ${b.inplay?'<span class="flag late">🔴 IN-PLAY</span>':''}
        ${b.afterCutoff?'<span class="flag late">AFTER CUTOFF</span>':''}
        ${b.boostPct?`<span class="flag limit">🚀 +${b.boostPct}% BOOST</span>`:''}
        ${b.stakeCredit?`<span class="flag limit">🎟️ £${b.stakeCredit.toFixed(2)} FREE BET</span>`:''}
        ${(b.limitFlags||[]).length?'<span class="flag limit">OVER LIMIT</span>':''}</div>
      <span class="pill st-${b.status}">${stLabel}</span>
    </div>
    <ul class="legs">${b.legs.map(l=>{
      const info=legLiveInfo(l,g);
      return `<li>${legChip(info)}${esc(l.label)} <b class="mono">@ ${fmtOdds(l.odds)}</b>${info.score?`<div class="legresult ${info.out||''}">${esc(info.score)}</div>`:''}</li>`;
    }).join('')}</ul>
    <div class="nums">
      <span>Stake<b class="mono">${GBP(b.stake)}</b></span>
      <span>Odds<b class="mono">${fmtOdds(b.effOdds)}</b></span>
      <span>Returns<b class="mono" style="color:var(--teal)">${GBP(b.stake*b.effOdds)}</b></span>
      ${houseEdgeInfo}
      ${b.status==='won'?`<span>Paid<b class="mono" style="color:var(--teal)">${GBP(b.settledPayout)}</b></span>`:''}

function toggleBox(id){ document.getElementById(id).classList.toggle('open'); }

function sendCounter(id){
  const b=getBet(id);
  const stake=parseFloat(document.getElementById('cs_'+id).value);
  const odds=parseFloat(document.getElementById('co_'+id).value);
  const msg=document.getElementById('cm_'+id).value.trim();
  if(!stake||!odds){ toast('Need stake and odds',true); return; }
  const fromHouse=me.admin&&b.teamId!==me.id;
  b.offer={stake,effOdds:odds,by:fromHouse?'house':'player'};
  b.status=fromHouse?'counter_house':'counter_user';
  pushHist(b,'counter-offer',{stake,odds,message:msg});
  save(); render(); toast('Counter-offer sent 📨');
  if(fromHouse) pushNotif(b.teamId,'counter_offer',`The house sent a counter-offer: £${stake} @ ${fmtOdds(odds)}${msg?' — "'+msg+'"':''}`);
}

function acceptOffer(id){
  const b=getBet(id);
  b.stake=b.offer.stake; b.effOdds=b.offer.effOdds; b.offer=null;
  b.status='accepted'; pushHist(b,'accepted house offer'); save(); render(); bosh();
  setTimeout(()=>toast('Deal! Bet is ON'),1100);
}

function declineOffer(id){
  const b=getBet(id); b.status='rejected'; b.offer=null;
  pushHist(b,'declined house offer'); save(); render();
}

function cancelBet(id){
  const b=getBet(id);
  // Batch 28: season bets have no gw (gw(b.gwId) is undefined for them — see submitBet()), so
  // gwDeadlinePassed() can't be called directly here; mirror betCard()'s "passed" definition
  // instead (locked once any referenced season market has already settled).
  if(isSeasonBet(b)){
    if(b.legs.some(l=>{ const m=(S.seasonMarkets||[]).find(x=>x.id===l.marketId); return !m||m.status!=='open'; })){
      toast('One of this bet\'s season markets has already settled — locked in',true); return;
    }
  } else if(gwDeadlinePassed(gw(b.gwId))){ toast('Cutoff passed — locked in',true); return; }
  b.status='cancelled'; b.offer=null; pushHist(b,'cancelled'); save(); render(); toast('Bet cancelled');
}

function sendMsg(id){
  const b=getBet(id); const msg=document.getElementById('mm_'+id).value.trim();
  if(!msg) return; pushHist(b,'message',{message:msg}); save(); render(); toast('Sent 💬');
}

function vStandings(){
  const {pnl,house}=computePnl(S);
  const rows=S.teams.map(t=>({t,p:pnl[t.id]||0})).sort((a,b)=>b.p-a.p);
  const lt={}; S.teams.forEach(t=>lt[t.id]={p:0,w:0,d:0,l:0,pf:0,pts:0});
  const addRes=(hid,aid,hp,ap)=>{
    const h=lt[hid],a=lt[aid]; if(!h||!a) return;
    h.p++;a.p++;h.pf+=hp;a.pf+=ap;
    if(hp>ap){h.w++;h.pts+=3;a.l++;}
    else if(hp<ap){a.w++;a.pts+=3;h.l++;}
    else{h.d++;a.d++;h.pts++;a.pts++;}
  };
  const localEvents=new Set(S.gameweeks.filter(g=>g.event&&g.matches.some(m=>m.result)).map(g=>g.event));
  (S.history||[]).forEach(h=>{ if(!localEvents.has(h.event)) addRes(h.a,h.b,h.ap,h.bp); });
  S.gameweeks.forEach(g=>g.matches.forEach(m=>{
    if(!m.result||!m.home||!m.away) return;
    addRes(m.home,m.away,m.result.homePts,m.result.awayPts);

  const ltRows=S.teams.map(t=>({t,...lt[t.id]})).sort((a,b)=>b.pts-a.pts||b.pf-a.pf);

  <div class="card"><h3>⚽ FPL League table</h3>
    <div style="overflow-x:auto"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PF</th><th>Pts</th></tr>

/* ================================================================
   Batch 19: Insights / analytics — new read-only nav tab. All functions below are
   pure reads over S (no mutation, no side effects) feeding vInsights(). Reuses
   aiPerfSummary()/aiLeagueSummary() (built in an earlier batch, never called until
   now) as narrative building blocks, plus new computed stats.
   ================================================================ */
// Which single team a leg "backs" (for the most/least-backed tally below), or null if
// the leg doesn't back one specific team (a draw pick, or a match_total O/U which is
// about the whole fixture rather than either side).
function legBackedTeamId(leg, g){
  if(leg.type==='match'){
    if(!g) return null;
    const m=g.matches.find(x=>x.id===leg.matchId);
    if(!m) return null;
    if(leg.pick==='home') return m.home;
    if(leg.pick==='away') return m.away;
    return null;
  }
  return leg.teamId||null; // team_pts / haul / top_score all carry an explicit teamId
}
// Leg count by backed team across every bet ever placed (any status) — most/least backed.
function mostLeastBackedTeams(){
  const counts={}; S.teams.forEach(t=>counts[t.id]=0);
  S.bets.forEach(b=>{
    const g=gw(b.gwId);
    b.legs.forEach(l=>{ const tid=legBackedTeamId(l,g); if(tid&&tid in counts) counts[tid]++; });
  });
  const rows=S.teams.map(t=>({t,n:counts[t.id]||0})).sort((a,b)=>b.n-a.n);
  return {most:rows[0]||null, least:rows[rows.length-1]||null, rows};
}
// Biggest single win on record, by profit (settledPayout minus the player's own — i.e.
// non-free-bet-covered — stake, matching computePnl()'s definition of profit).
function biggestSingleWin(){
  const wins=S.bets.filter(b=>b.status==='won');
  if(!wins.length) return null;
  return wins.map(b=>({b, profit:b.settledPayout-(b.stake-(b.stakeCredit||0))}))
    .sort((a,b)=>b.profit-a.profit)[0];
}
const MARKET_LABELS={match:'Match winner', team_pts:'Team points O/U', haul:'Haul (points threshold)', match_total:'Match total O/U', top_score:'Top scorer', bottom_score:'Bottom scorer'};
// Leg count by market type across every bet ever placed — most common market.
function marketTypeMix(){
  const counts={};
  S.bets.forEach(b=>b.legs.forEach(l=>{
    const key=l.type==='match'?'match':(l.kind||'other');
    counts[key]=(counts[key]||0)+1;
  }));
  return Object.entries(counts).map(([k,n])=>({key:k,label:MARKET_LABELS[k]||k,n})).sort((a,b)=>b.n-a.n);
}
// For each team, tally graded (won/lost) leg outcomes across the WHOLE league's bet history
// in matches/markets involving that team — i.e. whose on-pitch results are the biggest driver
// of punters winning or losing bets. Match-winner and match_total legs credit BOTH sides of the
// fixture (the result is a joint event for that match); team-specific specials (team_pts/haul/
// top_score) credit only the named team. Evaluated leg-by-leg via evalLeg(), independent of the
// bet's overall status, so a losing leg inside an otherwise-winning acca still counts correctly.
function teamOutcomeCorrelation(){
  const counts={}; S.teams.forEach(t=>counts[t.id]={wins:0,losses:0});
  S.bets.forEach(b=>{
    const g=gw(b.gwId); if(!g) return;
    b.legs.forEach(l=>{
      const out=evalLeg(l,g);
      if(out!=='won'&&out!=='lost') return;
      let tids;
      if(l.type==='match'||l.kind==='match_total'){
        const m=g.matches.find(x=>x.id===l.matchId);
        tids=m?[m.home,m.away].filter(Boolean):[];
      } else {
        tids=l.teamId?[l.teamId]:[];
      }
      tids.forEach(tid=>{ if(counts[tid]) (out==='won'?counts[tid].wins++:counts[tid].losses++); });
    });
  });
  const rows=S.teams.map(t=>({t,...counts[t.id]})).filter(r=>r.wins+r.losses>0);
  const byWins=rows.slice().sort((a,b)=>b.wins-a.wins);
  const byLosses=rows.slice().sort((a,b)=>b.losses-a.losses);
  return {rows, topWins:byWins[0]||null, topLosses:byLosses[0]||null};
}

/* ================================================================
   Batch 30: recent form guide — purely computed from S.history + gw.matches[].result,
   no new FPL pull. Mirrors vStandings()'s pattern of merging S.history (for events not
   yet covered by a local gameweek's own results) with S.gameweeks results, but scoped
   to one team and kept sorted by event so "most recent N" is well-defined.
   ================================================================ */
function teamForm(state, teamId, n=5){
  const localEvents=new Set(state.gameweeks.filter(g=>g.event&&g.matches.some(m=>m.result)).map(g=>g.event));
  const games=[];
  (state.history||[]).forEach(h=>{
    if(localEvents.has(h.event)) return;
    if(h.a===teamId) games.push({event:h.event,pts:h.ap,oppPts:h.bp,oppId:h.b});
    else if(h.b===teamId) games.push({event:h.event,pts:h.bp,oppPts:h.ap,oppId:h.a});
  });
  state.gameweeks.forEach(g=>g.matches.forEach(m=>{
    if(!m.result||!m.home||!m.away) return;
    if(m.home===teamId) games.push({event:g.event||0,pts:m.result.homePts,oppPts:m.result.awayPts,oppId:m.away});
    else if(m.away===teamId) games.push({event:g.event||0,pts:m.result.awayPts,oppPts:m.result.homePts,oppId:m.home});
  }));
  games.sort((a,b)=>a.event-b.event);
  games.forEach(gm=>{ gm.res = gm.pts>gm.oppPts?'W':(gm.pts<gm.oppPts?'L':'D'); });
  const recent=games.slice(-n);
  const record={w:0,d:0,l:0};
  recent.forEach(gm=>{ if(gm.res==='W')record.w++; else if(gm.res==='D')record.d++; else record.l++; });
  // Same 3/1/0 scoring the FPL League table (vStandings) already uses, so "hottest" reads
  // as "who'd top the table if you only counted their last N gameweeks".
  const formPts=recent.reduce((s,gm)=>s+(gm.res==='W'?3:gm.res==='D'?1:0),0);
  const seasonAvg=games.length?games.reduce((s,gm)=>s+gm.pts,0)/games.length:0;
  const recentAvg=recent.length?recent.reduce((s,gm)=>s+gm.pts,0)/recent.length:0;
  const trendDiff=recent.length?recentAvg-seasonAvg:0;
  const trend = recent.length<2 ? 'flat' : (trendDiff>3?'up':(trendDiff<-3?'down':'flat'));
  return {teamId, games:recent, record, formPts, seasonAvg, recentAvg, trendDiff, trend, played:games.length};
}
// Shared hot/cold classification (3+ of the last 5 results the same way) driving both the
// Insights form-guide card and the small dot marker on the gameweek board, so the two
// surfaces never disagree with each other. Needs at least 3 games played to call it either
// way — early season, nobody gets marked.
function formIndicator(f){
  if(f.played<3) return null;
  if(f.record.w>=3&&f.record.w>f.record.l) return 'hot';
  if(f.record.l>=3&&f.record.l>f.record.w) return 'cold';
  return null;
}
// Small colored-dot marker for vGwBoard match rows (batch 30 spec: "some sort of marker...
// who's in form and who's not", kept small/unobtrusive — a dot, not a redesigned row).
function formDot(teamId){
  const f=teamForm(S,teamId,5);
  const ind=formIndicator(f);
  if(!ind) return '';
  const strip=f.games.map(g=>g.res).join('');
  return `<span class="formdot ${ind}" title="${ind==='hot'?'🔥 In form':'❄️ Out of form'} — last ${f.games.length}: ${strip}"></span>`;
}
function formGuideCard(n=5){
  const rows=S.teams.map(t=>({t,f:teamForm(S,t.id,n)})).filter(r=>r.f.played>0)
    .sort((a,b)=>b.f.formPts-a.f.formPts||b.f.trendDiff-a.f.trendDiff);
  if(!rows.length) return '';
  return `<div class="card"><h3>📈 Form guide</h3>
    <p class="muted small">Last ${n} results per team (oldest → most recent), ranked hottest to coldest, plus how their scoring lately compares to their own season average.</p>
    <div style="overflow-x:auto"><table><tr><th>Team</th><th>Form</th><th style="text-align:right">Trend</th></tr>
    ${rows.map(r=>{
      const ind=formIndicator(r.f);
      const strip=r.f.games.map(gm=>`<span class="pill ${gm.res==='W'?'st-won':gm.res==='L'?'st-lost':'st-void'}" style="padding:2px 8px;font-size:9px;margin-right:2px">${gm.res}</span>`).join('');
      const trendTxt=r.f.games.length<2?'—':(r.f.trendDiff>=0?'+':'')+r.f.trendDiff.toFixed(1)+' pts';
      const trendCls=r.f.trendDiff>3?'pos':r.f.trendDiff<-3?'neg':'';
      return `<tr><td><b>${teamLink(r.t.id)}</b>${ind?`<span class="formdot ${ind}" title="${ind==='hot'?'In form':'Out of form'}"></span>`:''}</td>
      <td>${strip}</td>
      <td style="text-align:right" class="mono ${trendCls}">${trendTxt}</td></tr>`;
    }).join('')}
    </table></div>
  </div>`;
}

/* Batch 12: home-page "Action needed" hero — gathers, for the current viewer, bets
   requiring their action plus the soonest relevant open-gameweek deadline. Kept as a
   standalone pure-ish read (uses global S/me like the rest of the app, no writes) so
   both vHome() (initial render) and render() (live countdown tick target, see below)
   can call it without duplicating the selection logic. */
function urgentActions(){
  const adminNeeds=me.admin ? S.bets.filter(b=>['pending','counter_user'].includes(b.status)).sort((a,b)=>a.placedAt-b.placedAt) : [];
  const counterOffers=S.bets.filter(b=>b.teamId===me.id&&b.status==='counter_house').sort((a,b)=>a.placedAt-b.placedAt);
  const now=Date.now();
  const APPROACH_MS=3*24*60*60*1000; // an open gw counts as "approaching" within 3 days of deadline
  const relevantGwIds=new Set([...adminNeeds,...counterOffers].map(b=>b.gwId));
  const candidateGws=S.gameweeks
    .filter(g=>g.deadline && g.deadline>now && (relevantGwIds.has(g.id) || (g.status==='open' && (g.deadline-now)<=APPROACH_MS)))
    .sort((a,b)=>a.deadline-b.deadline);
  return {adminNeeds, counterOffers, soonestGw: candidateGws[0]||null};
}
// Renders the hero card HTML, or '' when there's nothing urgent to show. The gw-deadline
// item's countdown span carries id="heroCountdown" — render() (below) ticks it live via
// setInterval, targeting the same soonestGw.deadline this function renders the initial value from.
function urgentHero(u){
  if(!u.adminNeeds.length && !u.counterOffers.length && !u.soonestGw) return '';
  const items=[];
  if(u.adminNeeds.length) items.push(`<div class="hero-item"><span>🏠 <b>${u.adminNeeds.length}</b> bet${u.adminNeeds.length===1?'':'s'} awaiting your accept/reject call</span><button class="btn gold small" onclick="go('review')">Review now →</button></div>`);
  if(u.counterOffers.length) items.push(`<div class="hero-item"><span>📨 <b>${u.counterOffers.length}</b> counter-offer${u.counterOffers.length===1?'':'s'} waiting on your response</span><button class="btn hot small" onclick="go('mybets')">Respond →</button></div>`);
  if(u.soonestGw) items.push(`<div class="hero-item"><span>⏰ <b>${esc(u.soonestGw.name)}</b> cutoff in <span id="heroCountdown" class="hero-countdown mono">${fmtCountdown(u.soonestGw.deadline-Date.now())}</span></span><button class="btn secondary small" onclick="go('builder')">Get a bet on →</button></div>`);
  return `<div class="card hero-urgent"><h3><span class="hero-dot"></span>Action needed</h3>${items.join('')}</div>`;
}

// Batch 21: home-page "new odds released" banner — sourced from publishGw()/releaseOdds()
// stamping g.oddsReleasedAt. Shown for the most-recently-released still-open, not-yet-deadline
// gameweek, dismissible per browser session; keyed by gwId+oddsReleasedAt so a LATER re-release
// (releaseOdds() again after more tweaks) re-surfaces it even if an earlier release was dismissed.
function oddsReleaseBanner(){

    <span>🎯 <b>New odds released</b> for ${esc(g.name)} — review before they lock at ${fmtDT(g.deadline)}.</span>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button class="btn gold small" onclick="go('builder')">Review odds →</button>

// Batch 13: compact relative-time label for the live betting table below — fmtDT()
// elsewhere renders a full weekday+date+time string, too wide for a table column here.
function timeAgo(ts){
  if(!ts) return '—';
  const diff=Date.now()-ts;
  if(diff<60000) return 'just now';
  if(diff<3600000) return Math.floor(diff/60000)+'m ago';
  if(diff<86400000) return Math.floor(diff/3600000)+'h ago';
  return Math.floor(diff/86400000)+'d ago';
}
// Batch 13: home-page "live betting board" — replaces the old cramped "Latest action"
// card/table (which used an unconstrained browser table layout and let long bet labels/
// owner names collide with the £/odds/status columns). Rendered as its own full-width

// truncates with an ellipsis + title tooltip instead of overlapping neighbouring cells.

    const shortLabel=b.legs.length===1?b.legs[0].label:`${b.legs.length}-leg acca`;
    const flags=`${b.algo?' ⚡':''}${b.inplay?' 🔴':''}`;

      <td class="lb-who" title="${esc(who)}">${esc(who)}</td>

      <thead><tr><th>Who</th><th>Bet</th><th style="text-align:right">Stake</th><th style="text-align:right">Odds</th><th>When</th><th>Status</th></tr></thead>

/* Batch 14: click-into-bet detail modal. Opened from a live-betting-table row (data-bet-id,
   above) via openBetModal(id). Reuses betCard() for the actual detail/actions rendering —
   for admins that's perspective 'house' (same accept/reject/counter/cancel/message controls
   as Bet Review, so there's exactly one place that logic lives), for non-admins it's
   perspective 'player' (only shows accept/decline/counter/cancel/message when it's their own
   bet, same as My Bets — no-op display otherwise). On top of betCard's own actions we add:
   admins get a shortcut into Bet Review; non-admins get "place duplicate bet". */
/* ================================================================
   BATCH 29 — SQUAD VIEWER
   Reads S.fpl.players / .plTeams / .squads / .lineups / .plFixtures (all written by the FPL
   Data Sync GitHub Action, or partially by fplSyncSquads() in-app — see the FPL SYNC section).
   Everything here is a pure read of that cached data: no fetching, no state mutation.
   ================================================================ */
const FPL_POS = {1:'GK', 2:'DEF', 3:'MID', 4:'FWD'};

function fplPlayers(){ return (S && S.fpl && S.fpl.players) || {}; }
function plTeam(id){ const m=(S&&S.fpl&&S.fpl.plTeams)||{}; return m[id]||m[String(id)]||null; }
function plTeamShort(id){ const t=plTeam(id); return t&&t.s?t.s:'???'; }
function plTeamName(id){ const t=plTeam(id); return t&&t.n?t.n:'Unknown club'; }
function squadIds(teamId){ const s=((S&&S.fpl&&S.fpl.squads)||{})[teamId]; return Array.isArray(s)?s:(s?Object.values(s):[]); }
function lineupIds(teamId){ const l=((S&&S.fpl&&S.fpl.lineups)||{})[teamId]; return Array.isArray(l)?l:(l?Object.values(l):[]); }
function hasSquadData(){ return Object.keys(fplPlayers()).length>0 && Object.keys((S&&S.fpl&&S.fpl.squads)||{}).length>0; }

// Which real-life gameweek the squad/fixture view should be showing. A specific gameweek always
// wins (that's the whole point of opening this from a fixture); otherwise fall back to whatever
// event the last sync was focused on, then to the earliest event that still has an unplayed
// fixture, then to the last event we know about at all.
function squadFocusEvent(gwId){
  if(gwId){ const g=gw(gwId); if(g&&g.event) return g.event; }
  if(S.fpl&&S.fpl.squadEvent) return S.fpl.squadEvent;
  const fx=(S.fpl&&S.fpl.plFixtures)||{};
  const evs=Object.keys(fx).map(Number).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  const now=Date.now();
  for(const ev of evs){ if(plFixturesFor(ev).some(f=>!f.k||f.k>now)) return ev; }
  return evs.length?evs[evs.length-1]:null;
}
function plFixturesFor(ev){
  const fx=((S&&S.fpl&&S.fpl.plFixtures)||{})[ev];
  return Array.isArray(fx)?fx:(fx?Object.values(fx):[]);
}
// A real-life club's fixture in a given gameweek. Blank gameweeks (no fixture) and double
// gameweeks (two) are both normal in the PL calendar, so this returns null for a blank and
// reports `count` for a double rather than pretending every club plays exactly once.
function clubFixture(plTeamId, ev){
  if(!plTeamId||!ev) return null;
  const list=plFixturesFor(ev).filter(f=>f&&(f.h===plTeamId||f.a===plTeamId));
  if(!list.length) return null;
  const f=list[0], home=f.h===plTeamId, oppId=home?f.a:f.h;
  return {home, oppId, oppShort:plTeamShort(oppId), oppName:plTeamName(oppId),
          fdr:Number(home?f.hd:f.ad)||0, count:list.length, k:f.k||null};
}
// FDR colour, driven ONLY by the numeric 1-5 rating the FPL API returns for that fixture — no
// real-world club is named anywhere in this logic. Green 1-2 (easy), amber 3, red 4-5 (tough).
function fdrClass(d){ const n=Math.round(Number(d)||0); return (n>=1&&n<=5)?('d'+n):''; }
function fdrLabel(d){ const n=Math.round(Number(d)||0); return n<=2?'kind':(n===3?'even':'tough'); }
function fdrChip(fx){
  if(!fx) return `<span class="fdr" title="Blank gameweek — this club has no fixture">BLANK</span>`;
  const title=`${fx.oppName} ${fx.home?'at home':'away'} — difficulty ${fx.fdr||'?'}/5 (${fdrLabel(fx.fdr)})`
    +(fx.count>1?` · double gameweek (${fx.count} fixtures)`:'');
  return `<span class="fdr ${fdrClass(fx.fdr)}" title="${esc(title)}">${fx.home?'v':'@'} ${esc(fx.oppShort)}${fx.fdr?` <b>${fx.fdr}</b>`:''}${fx.count>1?' ×'+fx.count:''}</span>`;
}
// Green→red form ramp. FPL's `form` field is a player's average points per game over the last
// 30 days (roughly a 0-10 range), so these buckets are calibrated to that, not to a 0-1 scale.
// Colour language is deliberately batch 30's: --teal hot ... --pink cold, with --gold/--orange
// bridging the middle so this and formIndicator()/.formdot speak the same visual language.
function formClass(f){
  const n=Number(f)||0;
  if(n<=0) return 'f-none';
  if(n>=5) return 'f-hot';
  if(n>=3.5) return 'f-warm';
  if(n>=2) return 'f-mid';
  return 'f-cold';
}
// Joins a manager's owned player ids to their master data + this gameweek's real-life fixture.
// `starter` is true/false when a published lineup is known for that team, null when it isn't
// (pre-gameweek, or the picks endpoint had nothing) — callers treat null as "put them on the
// pitch", so a squad with no lineup data still renders as a full 15-man formation.
function squadPlayers(teamId, ev){
  const P=fplPlayers();
  const start=new Set(lineupIds(teamId));
  return squadIds(teamId).map(id=>{
    const p=P[id]||P[String(id)];
    if(!p) return null;
    const club=Number(p.t)||0;
    return {id:Number(id), name:p.n||'?', pos:Number(p.p)||0, posName:FPL_POS[Number(p.p)]||'?',
            club, form:Number(p.f)||0, pts:Number(p.tp)||0, ep:Number(p.ep)||0, status:p.st||'a',
            starter: start.size ? start.has(Number(id)) : null,
            fx: clubFixture(club, ev)};
  }).filter(Boolean);
}
// Squad-level roll-up. avgFdr is the mean fixture difficulty across the players who'll actually
// be on the pitch — that's the number the side-by-side comparison leads with ("who's got the
// kinder week"). Blank gameweeks are excluded from the mean rather than scored as 0 (a 0 would
// drag an average toward "easy", which is the opposite of what a blank means) and counted
// separately so the UI can say so out loud.
function squadSummary(teamId, ev){
  const players=squadPlayers(teamId, ev);
  const pool=players.filter(p=>p.starter!==false);
  const withFx=pool.filter(p=>p.fx&&p.fx.fdr);
  return {
    players, count:players.length,
    avgFdr: withFx.length?withFx.reduce((s,p)=>s+p.fx.fdr,0)/withFx.length:0,
    totalPts: players.reduce((s,p)=>s+p.pts,0),
    avgForm: players.length?players.reduce((s,p)=>s+p.form,0)/players.length:0,
    blanks: pool.filter(p=>!p.fx).length,
    doubles: pool.filter(p=>p.fx&&p.fx.count>1).length,
    flagged: players.filter(p=>p.status&&p.status!=='a').length
  };
}
// "Who's carrying this team" — the highest season points total gets the gold crown, and a second
// player only joins them if it's genuinely close (within 15%), so a squad with one obvious
// talisman lights up exactly one chip rather than diluting the signal.
function squadTopScorers(players){
  const sorted=players.filter(p=>p.pts>0).sort((a,b)=>b.pts-a.pts);
  if(!sorted.length) return new Set();
  const top=new Set([sorted[0].id]);
  if(sorted[1]&&sorted[1].pts>=sorted[0].pts*0.85) top.add(sorted[1].id);
  return top;
}
function squadChip(p, tops, opts){
  opts=opts||{};
  const isTop=tops.has(p.id), unavailable=!!(p.status&&p.status!=='a');
  const cls='sq-chip '+formClass(p.form)+(isTop?' top':'')+(unavailable?' out':'');
  const sub = opts.showFixture

            : `<div class="sq-fx">blank gw</div>`)
    : `<div class="club">${esc(plTeamShort(p.club))}</div>`;
  const title=`${p.name} — ${p.posName}, ${plTeamName(p.club)} · form ${p.form.toFixed(1)} · ${p.pts} pts this season`
    +(p.fx?` · ${p.fx.home?'home to':'away at'} ${p.fx.oppName} (difficulty ${p.fx.fdr||'?'}/5)`:' · no fixture this gameweek')
    +(isTop?' · 👑 top scorer':'')+(unavailable?' · ⚠ doubtful or unavailable':'');
  return `<div class="${cls}" title="${esc(title)}">${isTop?'<span class="crown">👑</span>':''}${unavailable?'<span class="sq-alert">⚠</span>':''}
    <div class="nm">${esc(p.name)}</div>${sub}

  </div>`;
}
// The actual pitch: GK at the back, then DEF / MID / FWD rows centred beneath, plus a bench
// strip below the pitch when a published lineup tells us who's actually starting. Within each
// row players are ordered by season points so the crowned talisman sits nearest the middle.
function squadPitch(teamId, ev, opts){
  opts=opts||{};
  const sum=squadSummary(teamId, ev);
  if(!sum.count) return '';
  const tops=squadTopScorers(sum.players);
  const onPitch=sum.players.filter(p=>p.starter!==false);
  const bench=sum.players.filter(p=>p.starter===false).sort((a,b)=>a.pos-b.pos||b.pts-a.pts);
  const row=pos=>{
    const list=onPitch.filter(p=>p.pos===pos).sort((a,b)=>b.pts-a.pts);
    if(!list.length) return '';
    return `<div class="sq-rowwrap"><div class="sq-rowlab">${FPL_POS[pos]}</div>
      <div class="sq-row">${list.map(p=>squadChip(p,tops,opts)).join('')}</div></div>`;
  };
  const unknownPos=onPitch.filter(p=>!FPL_POS[p.pos]);
  return `<div class="sq-pitch">${[1,2,3,4].map(row).join('')}
    ${unknownPos.length?`<div class="sq-rowwrap"><div class="sq-rowlab">Other</div><div class="sq-row">${unknownPos.map(p=>squadChip(p,tops,opts)).join('')}</div></div>`:''}</div>
    ${bench.length?`<div class="sq-bench"><div class="sq-rowlab">Bench</div><div class="sq-row">${bench.map(p=>squadChip(p,tops,opts)).join('')}</div></div>`:''}`;
}
// Which real-life clubs a manager is exposed to this gameweek, one row per club, with that
// club's opponent and FDR chip — the "who are they actually playing" half of the comparison.
function squadFixtureList(teamId, ev){
  const sum=squadSummary(teamId, ev);
  const byClub={};
  sum.players.filter(p=>p.starter!==false).forEach(p=>{
    if(!byClub[p.club]) byClub[p.club]={club:p.club, fx:p.fx, n:0};
    byClub[p.club].n++;
  });
  const rows=Object.values(byClub).sort((a,b)=>(a.fx?a.fx.fdr||9:9)-(b.fx?b.fx.fdr||9:9)||b.n-a.n);
  if(!rows.length) return '';
  return `<div class="sq-fxlist"><div class="sq-rowlab" style="text-align:left;margin-bottom:6px">Their real-life fixtures</div>
    ${rows.map(r=>`<div class="sq-fxrow">
      <span class="sq-fxclub">${esc(plTeamShort(r.club))}<span class="muted" style="font-weight:700"> ×${r.n}</span></span>
      <span class="sq-fxopp">${r.fx?esc((r.fx.home?'v ':'away at ')+r.fx.oppName):'no fixture'}</span>
      ${r.fx?`<span class="fdr ${fdrClass(r.fx.fdr)}" title="Difficulty ${r.fx.fdr||'?'}/5 — ${fdrLabel(r.fx.fdr)}"><b>${r.fx.fdr||'?'}</b></span>`:'<span class="fdr">BLANK</span>'}
    </div>`).join('')}</div>`;
}

function squadCompareBody(st){
  const g=st.gwId?gw(st.gwId):null;
  const ev=squadFocusEvent(st.gwId);
  const evLabel=ev?('GW '+ev):(g?g.name:'—');
  const ready=hasSquadData();
  const sums=ready?{[st.teamId]:squadSummary(st.teamId,ev), [st.teamB]:squadSummary(st.teamB,ev)}:null;
  // Lower average difficulty = the kinder week. Only called when both sides actually have a
  // rated fixture, so a blank/unsynced side never wins by default.
  const easier = (sums&&sums[st.teamId].avgFdr&&sums[st.teamB].avgFdr)
    ? (sums[st.teamId].avgFdr<sums[st.teamB].avgFdr?st.teamId:(sums[st.teamB].avgFdr<sums[st.teamId].avgFdr?st.teamB:null))
    : null;
  const side=tid=>{
    const t=team(tid), s=sums[tid];
    return `<div class="sq-side sq-compact${easier===tid?' win':''}">
      <div class="sq-sidehead">

      ${s.count?squadFixtureList(tid, ev):''}
    </div>`;
  };
  const a=team(st.teamId), b=team(st.teamB);
  return `<div class="betmodal-head">

// Re-renders the modal's content from the live S.bets state. Called on open, and again from
// render() (see below) whenever the modal is open — so an action taken inside it (accept,
// reject, counter, cancel, message — all via the reused betCard()) refreshes the modal in
// place instead of leaving it showing stale buttons/status after its own render() completes.
function renderBetModal(){
  const panel=document.getElementById('betModal'), overlay=document.getElementById('betModalOverlay'), body=document.getElementById('betModalBody');
  if(!panel||!overlay||!body) return;
  const b=openBetModalId?getBet(openBetModalId):null;

  const g=gw(b.gwId);
  const seasonBet=isSeasonBet(b);
  const perspective=me.admin?'house':'player';
  let dupBtn='';
  if(!me.admin){
    if(seasonBet){
      // Batch 28: a season bet has no gw/bettableNow gate — duplicateBet() below checks
      // per-market openness itself and toasts if nothing's left to duplicate.
      dupBtn=`<button class="btn hot" onclick="duplicateBet('${b.id}')">📋 Place duplicate bet</button>`;
    } else {
      const mode=g?bettableNow(g):null;
      if(mode==='pre'){
        dupBtn=`<button class="btn hot" onclick="duplicateBet('${b.id}')">📋 Place duplicate bet</button>`;
      } else {
        dupBtn=`<button class="btn hot" disabled>📋 Place duplicate bet</button>
          <div class="small muted" style="width:100%;margin-top:4px">${mode==='inplay'?"🚧 In-play betting is coming soon — can't duplicate this one yet.":'Betting is closed for '+esc(g?g.name:'this gameweek')+'.'}</div>`;
      }
    }
  }
  const reviewBtn=me.admin?`<button class="btn secondary" onclick="closeBetModal();reviewFilter='all';go('review')">🏠 Open in Bet Review →</button>`:'';
  body.innerHTML=`
    <div class="betmodal-head">
      <div><h3 style="margin:0">🎫 Bet detail</h3><div class="muted small">${esc(team(b.teamId)?.name||'?')} · ${esc(seasonBet?'🏆 Season':(g?g.name:'?'))}</div></div>
      <button class="betmodal-close" onclick="closeBetModal()">✕</button>
    </div>
    ${betCard(b,perspective)}
    ${dupBtn||reviewBtn?`<div class="betmodal-actions">${dupBtn}${reviewBtn}</div>`:''}`;
  panel.classList.add('open'); overlay.classList.add('open');
}
// Pre-fills the bet builder slip with a fresh copy of another bet's legs so the viewer can
// pick their OWN stake and place it as a new bet (still funnels through submitBet()'s
// slipViolatesIntegrity() check like every other placement path — batch 3's anti-match-fixing
// rule applies here exactly as it does everywhere else). Tags slipDuplicateOf so placeBet()/
// submitBet() can flag the resulting bet as a duplicate placement (for batch 15's alternate
// celebration) without this function needing to know anything about that animation.
function duplicateBet(id){
  const b=getBet(id); if(!b) return;
  // Batch 28: a season bet duplicates into the separate seasonSlip/vSeasonBets() flow instead of
  // the gameweek builder slip — only legs whose market is still open can carry over (a settled
  // market can't be re-bet on).
  if(isSeasonBet(b)){
    const openLegs=b.legs.filter(l=>{ const m=(S.seasonMarkets||[]).find(x=>x.id===l.marketId); return m&&m.status==='open'; });
    if(!openLegs.length){ toast('Every market in this bet has already settled — nothing to duplicate', true); return; }
    seasonSlip=openLegs.map(l=>({...l}));
    closeBetModal();
    go('seasonbets');
    toast('Bet duplicated — set your stake and place it 📋');
    return;
  }
  const g=gw(b.gwId); const mode=g?bettableNow(g):null;
  if(mode!=='pre'){
    toast(mode==='inplay'?"In-play betting is coming soon — can't duplicate this one yet.":'Betting is closed for that gameweek', true);
    return;
  }
  slip=b.legs.map(l=>({...l}));
  slipBundles=[];
  slipDuplicateOf=id;
  closeBetModal();
  builderSec='pre';
  go('builder');
  toast('Bet duplicated — set your stake and place it 📋');
  setTimeout(()=>{ const el=document.getElementById('stakeInput'); if(el) el.focus(); },80);
}

function houseAccept(id){
  if(!requireAdmin()) return;
  // Defensive: act on every bet sharing this id, not just the first .find() hit — belt-and-braces
  // against any leftover duplicate from the now-fixed dual-write bug (see migrate()'s dedupe pass,
  // which should mean this is normally a group of exactly one by the time this runs).
  const matches=S.bets.filter(x=>x.id===id);
  if(!matches.length) return;
  matches.forEach(b=>{
    if(b.status==='counter_user'&&b.offer){ b.stake=b.offer.stake; b.effOdds=b.offer.effOdds; b.offer=null; }
    b.status='accepted'; b.acceptedAt=Date.now();
    b.history.push({by:me.id,role:'house',action:'accepted',stake:b.stake,odds:b.effOdds,at:Date.now()});
  });
  const b=matches[0];
  audit('accept',b.id);
  pushNotif(b.teamId,'bet_accepted',`✅ Your bet accepted! ${b.legs.length} leg(s) @ ${fmtOdds(b.effOdds)} · £${b.stake}`);
  saveNow(); render(); toast('Bet accepted ✓');
}
function houseReject(id){
  if(!requireAdmin()) return;
  const matches=S.bets.filter(x=>x.id===id);
  if(!matches.length) return;
  matches.forEach(b=>{
    b.status='rejected'; b.offer=null;
    b.history.push({by:me.id,role:'house',action:'rejected',at:Date.now()});
  });
  const b=matches[0];
  audit('reject',b.id);
  pushNotif(b.teamId,'bet_rejected',`❌ Your bet was rejected · ${b.legs.length} leg(s) @ ${fmtOdds(b.effOdds)}`);
  saveNow(); render(); toast('Bet rejected');
}
function houseCancel(id){
  if(!requireAdmin()) return;
  const matches=S.bets.filter(x=>x.id===id);
  if(!matches.length) return;
  const b0=matches[0];
  const g=gw(b0.gwId);
  if(g&&gwDeadlinePassed(g)){ toast('Cutoff passed — bet is locked in, cannot cancel',true); return; }
  // Batch 28: same season-bet lock rule as cancelBet()/betCard() — once any referenced market
  // has already settled, the house can't cancel it either.
  if(isSeasonBet(b0) && b0.legs.some(l=>{ const m=(S.seasonMarkets||[]).find(x=>x.id===l.marketId); return !m||m.status!=='open'; })){
    toast('One of this bet\'s season markets has already settled — cannot cancel',true); return;
  }
  if(!confirm('Cancel this bet? The player will be notified.')) return;
  matches.forEach(b=>{
    b.status='cancelled'; b.offer=null;
    b.history.push({by:me.id,role:'house',action:'cancelled',at:Date.now()});
  });
  const b=b0;
  audit('cancel',b.id);
  pushNotif(b.teamId,'bet_cancelled',`🚫 The house cancelled your bet · ${b.legs.length} leg(s) @ ${fmtOdds(b.effOdds)} · £${b.stake}`);
  saveNow(); render(); toast('Bet cancelled');
}

/* ================================================================
   HOUSE · OVERRIDE (Batch 32)
   A deliberate, deep-warning-gated failsafe for editing a bet's status/payout by hand — the
   only place in the app that can touch a bet AFTER it's already been settled/paid out. Every
   other admin action (accept/reject/cancel/settle) works on live, unsettled bets; this one
   exists specifically for "we settled wrong, or missed something" post-hoc corrections. Two
   things make it safe to leave lying around in Back Office rather than a bug waiting to
   happen: (1) it only ever mutates the ONE targeted bet — it never reopens a gameweek, re-runs
   settleGw(), or touches any other bet, so it can't cascade; (2) computePnl()/vStandings()
   read live off S.bets on every render (confirmed by reading both — no separate cached
   standings/PnL object exists anywhere), so editing a bet's fields here is sufficient on its
   own to correct every downstream view, with nothing else to keep in sync.
   ================================================================ */
function overrideBetRow(b){
  const t=team(b.teamId);

      <span class="pill st-${b.status}">${esc(b.status)}</span>
    </div>
    ${hist.length?`<details class="small" style="margin-top:6px"><summary class="muted">Override history (${hist.length})</summary>
      <div class="chat">${hist.map(h=>`<div class="msg"><span class="who">${fmtDT(h.at)} · ${esc(team(h.by)?team(h.by).owner:h.by)}</span><div>${esc(h.before.status)}${h.before.status==='won'?' (£'+Number(h.before.settledPayout||0).toFixed(2)+')':''} → <b>${esc(h.after.status)}</b>${h.after.status==='won'?' (£'+Number(h.after.settledPayout||0).toFixed(2)+')':''} — "${esc(h.reason)}"</div></div>`).join('')}</div>
    </details>`:''}
    <div class="actions" style="margin-top:8px"><button class="btn ghost small" onclick="toggleBox('ov_${b.id}')">⚠️ Override this bet</button></div>
    <div class="counterbox" id="ov_${b.id}">
      <div class="formrow">
        <div><label>New status</label><select id="ovStatus_${b.id}">
          ${['pending','accepted','counter_house','counter_user','rejected','cancelled','expired','won','lost','void'].map(s=>`<option value="${s}" ${s===b.status?'selected':''}>${s}</option>`).join('')}
        </select></div>
        <div><label>Settled payout £ <span class="muted small">(used only if status = won)</span></label>
          <input type="number" step="0.01" min="0" id="ovPayout_${b.id}" value="${(b.status==='won'?b.settledPayout:b.stake*b.effOdds).toFixed(2)}" style="width:120px"></div>
      </div>
      <div><label class="small muted" style="display:block;margin-bottom:4px">Reason (required — goes in the permanent audit trail)</label>
        <textarea id="ovReason_${b.id}" placeholder="e.g. GW3 result was re-synced after a wrong FPL score, this bet was settled on the old figure" style="width:100%;min-height:56px"></textarea>
      </div>
      <div style="margin-top:8px"><label class="small muted" style="display:block;margin-bottom:4px">Type <b class="mono">OVERRIDE</b> to confirm</label>
        <input id="ovConfirm_${b.id}" placeholder="OVERRIDE" style="width:160px">
      </div>
      <div class="actions" style="margin-top:10px">
        <button class="btn danger small" onclick="applyOverride('${b.id}')">Apply override</button>
        <button class="btn secondary small" onclick="toggleBox('ov_${b.id}')">Cancel</button>
      </div>
    </div>
  </div>`;
}
function applyOverride(betId){
  if(!requireAdmin()) return;
  const b=S.bets.find(x=>x.id===betId);
  if(!b){ toast('Bet not found',true); return; }
  const statusEl=document.getElementById('ovStatus_'+betId);
  const payoutEl=document.getElementById('ovPayout_'+betId);
  const reasonEl=document.getElementById('ovReason_'+betId);
  const confirmEl=document.getElementById('ovConfirm_'+betId);
  if(!statusEl||!payoutEl||!reasonEl||!confirmEl) return;
  const newStatus=statusEl.value;
  const reason=(reasonEl.value||'').trim();
  if(!reason){ toast('A reason is required for an override',true); return; }
  if((confirmEl.value||'').trim()!=='OVERRIDE'){ toast('Type OVERRIDE exactly (all caps) to confirm',true); return; }
  const before={status:b.status,settledPayout:b.settledPayout!=null?b.settledPayout:null};
  const teamName=team(b.teamId)?team(b.teamId).name:'?';
  let newPayout=before.settledPayout;
  if(newStatus==='won') newPayout=Math.max(0,parseFloat(payoutEl.value)||0);
  else if(newStatus==='void') newPayout=b.stake;
  else if(newStatus==='lost') newPayout=0;
  const warn='⚠️ OVERRIDE BET — AFTER-THE-FACT FINANCIAL EDIT\n\n'
    +'Team: '+teamName+'\n'
    +'Current: '+before.status+(before.status==='won'?' · paid £'+Number(before.settledPayout||0).toFixed(2):'')+'\n'
    +'New: '+newStatus+(newStatus==='won'?' · pay £'+newPayout.toFixed(2):newStatus==='void'?' · stake £'+newPayout.toFixed(2)+' returned':'')+'\n\n'
    +'This immediately changes this player\'s P&L and the house standings, retroactively, everywhere they\'re shown. There is no automatic undo except applying another override or restoring an older backup (Back Office → Backups). This does NOT reopen betting or touch any other bet.\n\n'
    +'Reason being logged: "'+reason+'"\n\n'
    +'This should only ever be used to correct a genuine mistake — continue?';
  if(!confirm(warn)) return;
  b.status=newStatus;
  if(['won','lost','void'].includes(newStatus)){ b.settledPayout=newPayout; if(!b.settledAt) b.settledAt=Date.now(); }
  if(!b.overrideHistory) b.overrideHistory=[];
  b.overrideHistory.push({by:me.id,at:Date.now(),before,after:{status:b.status,settledPayout:b.settledPayout},reason});
  audit('bet override', b.id+' ('+teamName+'): '+before.status+' → '+b.status+(newStatus==='won'?' · £'+newPayout.toFixed(2):'')+' — "'+reason+'"');
  toggleBox('ov_'+betId);
  saveNow(); render(); toast('Override applied ⚠️');
}

   picks as a target ('team' or 'match' — the only shapes the current data model supports;
   there's no goals/clean-sheet/bench-points data anywhere in state, only per-match
   home/away fantasy points, so every template is a parameterised instance of the four
   settleable special kinds rather than inventing new unsettleable ones), and — for
   line-based kinds — a default threshold. Admin picks a template + target in the Loader's
   "🎲 Special markets" card, sees a suggested price computed by suggestSpecialOdds() below
   (same teamAvg()/pOver()/phi() form model recOdds() and genAlgoBet() already use, just
   generalised to an explicit target+line instead of a random one), can edit it, then adds
   it to gw.specialMarkets[] as an offered market. */
const SPECIAL_MARKET_TEMPLATES = [
  {id:'top_scorer',   name:'🏆 Top Scorer of the GW',            kind:'top_score',    target:'team',
    blurb:'This team scores the most points of any team in the gameweek.'},

    blurb:'This team scores 45 or more points this gameweek.'},

    blurb:'This team scores 65 or more points this gameweek — a genuine outlier week.'},

    blurb:'This team scores over the chosen points line.'},

    blurb:'This team scores under the chosen points line.'},

    blurb:'The two teams in this fixture combine for a high points total.'},

    blurb:'The two teams in this fixture combine for a low points total.'},

// Sane starting threshold for a line-based template, given its target — admin can still edit it.
function specialMarketDefaultLine(state, gwId, tpl, params){
  if(!['haul','team_pts','match_total'].includes(tpl.kind)) return null;
  if(tpl.kind==='haul') return tpl.line!=null ? tpl.line : Math.round(teamAvg(state, params.teamId)*1.3);
  if(tpl.kind==='team_pts'){
    if(!params.teamId) return null;
    return Math.round(teamAvg(state, params.teamId) + (tpl.lineOffset||0)) + 0.5;
  }
  if(tpl.kind==='match_total'){
    const g=gw(gwId); const fixtures=g?g.matches.filter(m=>m.home&&m.away):[];
    const m=fixtures.find(x=>x.id===params.matchId);
    if(!m) return null;
    const tot=teamAvg(state,m.home)+teamAvg(state,m.away);
    return Math.round(tot + (tpl.dir==='under'?-12:12)) + 0.5;
  }
  return null;
}
// Heuristic suggested odds for a template+target(+line), reusing the exact same probability
// shapes as genAlgoBet()'s per-kind makers and recOdds() — not real ML, a reasonable form-based
// heuristic, editable by the admin before saving. Returns null when there isn't enough info yet
// (no target picked) to price it.
function suggestSpecialOdds(state, gwId, tpl, params){
  const g=gw(gwId);
  const edge=(state.settings&&state.settings.algoEdgePct)||20;
  const fixtures=g?g.matches.filter(m=>m.home&&m.away):[];
  if(tpl.kind==='top_score'||tpl.kind==='bottom_score'){
    const tids=[...new Set(fixtures.flatMap(m=>[m.home,m.away]))];
    if(!tids.length||!params.teamId) return null;
    const sign=tpl.kind==='top_score'?1:-1;
    const ws=tids.map(tid=>({tid,w:Math.exp(sign*0.12*teamAvg(state,tid))}));
    const tot=ws.reduce((s,x)=>s+x.w,0);
    const mine=ws.find(x=>x.tid===params.teamId);
    return mine?edgedOdds(mine.w/tot,edge):null;
  }
  if(tpl.kind==='haul'){
    if(!params.teamId||params.line==null) return null;
    return edgedOdds(pOver(params.line-0.5, teamAvg(state,params.teamId)), edge);
  }
  if(tpl.kind==='team_pts'){
    if(!params.teamId||params.line==null) return null;
    const avg=teamAvg(state,params.teamId);
    const p=tpl.dir==='under'?1-pOver(params.line,avg):pOver(params.line,avg);
    return edgedOdds(p, edge);
  }
  if(tpl.kind==='match_total'){
    if(params.line==null) return null;
    const m=fixtures.find(x=>x.id===params.matchId);
    if(!m) return null;
    const tot=teamAvg(state,m.home)+teamAvg(state,m.away);
    const p=tpl.dir==='under'?phi((params.line-tot)/(SD*1.414)):1-phi((params.line-tot)/(SD*1.414));
    return edgedOdds(p, edge);
  }
  return null;
}
// Player-facing label for a template+target(+line) — same phrasing style as genAlgoBet()'s legs.
function specialMarketLabel(gwId, tpl, params){
  const t=params.teamId?team(params.teamId):null;
  if(tpl.kind==='top_score') return t?`${t.name} — TOP SCORE of the week`:tpl.name;
  if(tpl.kind==='bottom_score') return t?`${t.name} — BOTTOM SCORE of the week`:tpl.name;
  if(tpl.kind==='haul') return (t&&params.line!=null)?`${t.name} BIG HAUL — ${params.line}+ pts`:tpl.name;
  if(tpl.kind==='team_pts') return (t&&params.line!=null)?`${t.name} ${(tpl.dir||'over').toUpperCase()} ${params.line} pts`:tpl.name;
  if(tpl.kind==='match_total'){
    const g=gw(gwId); const m=g&&g.matches.find(x=>x.id===params.matchId);
    if(!m||params.line==null) return tpl.name;
    return `${team(m.home).name} v ${team(m.away).name} — combined ${(tpl.dir||'over').toUpperCase()} ${params.line}`;
  }
  return tpl.name;
}

/* ================================================================
   BATCH 27 — SEASON-LONG / MID-SEASON / BESPOKE SPECIAL MARKETS
   ================================================================
   Sibling to the batch-20 gw.specialMarkets[] system above, but NOT tied to any specific
   gameweek — lives in S.seasonMarkets[] instead. Same "template → target team → suggested
   odds → admin can edit → publish" shape as SPECIAL_MARKET_TEMPLATES for the 3 season-long
   templates below, plus a bespoke/custom builder (free-text name + a settle-by date via the
   existing dtPicker widget from batch 2) for one-off markets like "Top of the table at
   midnight 25 Dec". Each market is priced on ONE side of a yes/no proposition (mirrors
   top_score/haul in the gw system) — settling it just records won/lost/void for THAT
   specific market, not a shared "who actually won" fact applied across every market of the
   same kind. Player-facing bet placement (a vSeasonBets() view + addSeasonLeg()) is
   explicitly deferred to batch 28 per the spec — this batch only builds creation/viewing/
   settling. settleSeasonBet()/evalSeasonLeg() below are wired up as forward-compatible
   plumbing so batch 28 doesn't need to touch settlement at all, but they're dead code today
   since nothing places a `leg.type==='season'` leg yet anywhere in the app. */
const SEASON_MARKET_TEMPLATES = [
  {id:'most_points', name:'📊 Most Points — full season',      kind:'most_points',
    blurb:'This team finishes with the most total FPL points of anyone in the league.'},
  {id:'most_wins',   name:'🏅 Most Wins',                       kind:'most_wins',
    blurb:'This team racks up the most gameweek match wins across the season.'},
  {id:'wins_draft',  name:'👑 League Winner (wins the Draft)',  kind:'league_winner',
    blurb:'This team finishes top of the actual FPL Draft league standings at season end.'},
];
// Tally of pf (points for)/w (wins)/pts (league points, 3/1/0) per team from exactly the same
// data vStandings()'s FPL League table loops — reused here as a strength proxy for suggested
// odds and as a "who's currently ahead" hint at settle time. Cheap to recompute each render,
// same small gameweeks/history arrays vStandings already loops every render too.
function seasonStandingsTally(){
  const lt={}; S.teams.forEach(t=>lt[t.id]={pf:0,w:0,pts:0});
  const localEvents=new Set(S.gameweeks.filter(g=>g.event&&g.matches.some(m=>m.result)).map(g=>g.event));
  const addRes=(hid,aid,hp,ap)=>{
    const h=lt[hid],a=lt[aid]; if(!h||!a) return;
    h.pf+=hp;a.pf+=ap;
    if(hp>ap){h.w++;h.pts+=3;} else if(hp<ap){a.w++;a.pts+=3;} else {h.pts++;a.pts++;}
  };
  (S.history||[]).forEach(h=>{ if(!localEvents.has(h.event)) addRes(h.a,h.b,h.ap,h.bp); });
  S.gameweeks.forEach(g=>g.matches.forEach(m=>{ if(m.result&&m.home&&m.away) addRes(m.home,m.away,m.result.homePts,m.result.awayPts); }));
  return lt;
}
function seasonKindKey(kind){ return kind==='most_points'?'pf':(kind==='most_wins'?'w':'pts'); }
// Suggested odds for a template+team — same softmax-off-a-strength-number shape as batch 20's
// suggestSpecialOdds() top_score branch, not real ML, editable by the admin before saving.
function suggestSeasonOdds(tpl, teamId){
  if(!tpl||!teamId) return null;
  const lt=seasonStandingsTally(); const key=seasonKindKey(tpl.kind);
  const edge=(S.settings&&S.settings.algoEdgePct)||20;
  const scale= key==='pf' ? 0.05 : 0.35;
  const ws=S.teams.map(t=>({tid:t.id,w:Math.exp(scale*(lt[t.id][key]||0))}));
  const tot=ws.reduce((s,x)=>s+x.w,0);
  const mine=ws.find(x=>x.tid===teamId);
  return mine&&tot?edgedOdds(mine.w/tot, edge):null;
}
// Which team currently leads on the relevant metric — surfaced only as a settle-time hint,
// never auto-applied; the admin still explicitly picks won/lost/void per market below.
function seasonMarketActualLeader(kind){
  const lt=seasonStandingsTally(); const key=seasonKindKey(kind);
  let best=null;
  S.teams.forEach(t=>{ if(!best||lt[t.id][key]>lt[best][key]) best=t.id; });
  return best;
}

  if(tpl.kind==='most_wins')     return `${t.name} — Most Wins${scopeTxt}`;
  if(tpl.kind==='league_winner') return `${t.name} — League Winner`;
  return `${t.name} — ${tpl.name}`;
}

function removeSeasonMarket(marketId){

function openSznSettle(marketId){ sznSettleMktId = sznSettleMktId===marketId ? null : marketId; render(); }
// Leg-level outcome for a placed season-market bet leg — the market itself IS the
// proposition being priced, so grading is a direct lookup of its recorded result.
function evalSeasonLeg(leg){
  const m=(S.seasonMarkets||[]).find(x=>x.id===leg.marketId);
  if(!m||m.status!=='settled') return null;
  return m.result==='void' ? 'void' : m.result;
}
// Mirrors settleBet()'s payout math (combinedOdds/accaEdgeByLegs ratio-of-effOdds) but for a
// bet whose legs are ALL season-market legs — a season leg isn't tied to any gw.matches, so
// it can't reuse settleBet() directly (that one keys off a single bet.gwId). Batch 28's
// addSeasonLeg() is expected to keep season legs and gw legs on separate bets, matching how
// gw.specialMarkets legs already coexist with match legs today (same bet, same evalLeg()).
function settleSeasonBet(bet){
  if(!bet.legs||!bet.legs.length||!bet.legs.every(l=>l.type==='season')) return null;
  const evals=bet.legs.map(l=>({odds:l.odds, out:evalSeasonLeg(l)}));
  if(evals.some(e=>e.out===null)) return null;
  let outcome,payout;
  if(evals.some(e=>e.out==='lost')){ outcome='lost'; payout=0; }
  else{
    const active=evals.filter(e=>e.out==='won');
    if(!active.length){ outcome='void'; payout=bet.stake; }
    else{
      const orig=combinedOdds(bet.legs.map(l=>l.odds), S.settings);
      const recomputed=combinedOdds(active.map(e=>e.odds), S.settings);
      const ratio=bet.effOdds/orig;
      outcome='won'; payout=bet.stake*Math.max(1, recomputed*ratio);
    }
  }
  bet.status=outcome; bet.settledPayout=payout; bet.settledAt=Date.now();
  bet.history=bet.history||[]; bet.history.push({at:Date.now(),by:'system',action:'season-settled',note:outcome});
  return {outcome,payout};
}
// The lightweight settle action: admin marks ONE season market won/lost/void, which grades
// only bets/legs referencing that specific market — nothing else. Kept simple deliberately
// (a plain confirm(), matching settleGw()'s own safety gate) since this isn't the financially-
// sensitive override tool that's batch 32.
function settleSeasonMarket(marketId, result){
  if(!requireAdmin()) return;
  const m=(S.seasonMarkets||[]).find(x=>x.id===marketId); if(!m) return;
  if(m.status==='settled'){ toast('Already settled',true); return; }
  if(!confirm(`Settle "${m.name}" as ${result.toUpperCase()}? This grades any bets placed on it.`)) return;
  m.status='settled'; m.result=result; m.settledAt=Date.now(); m.settledBy=me.id;
  let graded=0;
  S.bets.forEach(b=>{
    if(!b.legs||!b.legs.some(l=>l.type==='season'&&l.marketId===m.id)) return;
    const r=settleSeasonBet(b);
    if(r){
      graded++;
      const msg=r.outcome==='won'?`🎉 SEASON BET WON! £${r.payout.toFixed(2)} incoming · ${m.name}`
        :r.outcome==='void'?`↩️ Season bet voided — stake of £${b.stake} returned · ${m.name}`
        :`❌ Season bet lost · £${b.stake} · ${m.name}`;
      pushNotif(b.teamId,'bet_settled',msg);
    }
  });
  audit('season market settled', m.name+' → '+result.toUpperCase());
  sznSettleMktId=null;
  saveNow(); render();
  toast('Settled: '+m.name+(graded?` (${graded} bet(s) graded)`:''));
}

}
