// Batch 15: original inline SVG of two linked handcuffs (brand colors, not a stock image) for
// the "It's a cufflink!" duplicate-bet celebration — swapped in for the ⚽ ball via bosh(true).
const CUFFLINK_SVG = `<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <rect x="24" y="5" width="13" height="10" rx="3" fill="#9b5cff"/>
  <rect x="83" y="5" width="13" height="10" rx="3" fill="#ff2d78"/>
  <circle cx="30" cy="30" r="19" fill="none" stroke="#00ff87" stroke-width="8"/>
  <circle cx="90" cy="30" r="19" fill="none" stroke="#00d9ff" stroke-width="8"/>
  <rect x="45" y="25" width="30" height="9" rx="4.5" fill="#ffc931"/>
</svg>`;
// Batch 15: bosh(isDuplicate) — pass a truthy duplicateOf to celebrate a "duplicate bet" placement
// with "IT'S A CUFFLINK!" + the handcuffs graphic instead of the normal "BOSH!" + ball. Every other
// caller (e.g. house-accepts-counter-offer) still calls bosh() with no arg and gets normal Bosh.
function bosh(isDuplicate){
  const el=document.getElementById('bosh');
  const conf=document.getElementById('confetti');
  const txt=document.getElementById('boshText');
  const ball=document.getElementById('boshBall');
  const cols=['#00ff87','#00d9ff','#ff2d78','#ffc931','#9b5cff'];
  conf.innerHTML=Array.from({length:28},()=>{
    const dx=(Math.random()*2-1)*60+'vw', dy=(Math.random()*-1)*55-5+'vh', rot=Math.random()*720-360+'deg';
    const c=cols[Math.floor(Math.random()*cols.length)];
    return `<span class="confetto" style="--dx:${dx};--dy:${dy};--rot:${rot};background:${c};left:${30+Math.random()*40}%"></span>`;
  }).join('');
  el.classList.toggle('cufflink', !!isDuplicate);
  txt.textContent = isDuplicate ? "IT'S A CUFFLINK!" : 'BOSH!';
  ball.innerHTML = isDuplicate ? CUFFLINK_SVG : '⚽';
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  setTimeout(()=>el.classList.remove('go'),1600);
}

/* ================================================================
   NOTIFICATIONS
   ================================================================ */
async function loadNotifications() {
  if (!me) return [];
  const snap = await db.ref('lennon-lounge-notifs/' + me.id).once('value');
  const data = snap.val();
  return data ? Object.keys(data).map(k => ({...data[k], key: k})) : [];
}

async function pushNotif(teamId, type, msg) {
  const notif = {id: Date.now()+'_'+Math.random().toString(36).slice(2), type, msg, ts: Date.now(), read: false};
  return db.ref('lennon-lounge-notifs/' + teamId).push(notif);
}

async function markAllRead() {
  if (!me) return;
  const snap = await db.ref('lennon-lounge-notifs/' + me.id).once('value');
  const data = snap.val();
  if (!data) return;
  const updates = {};
  Object.keys(data).forEach(k => { updates[k + '/read'] = true; });
  await db.ref('lennon-lounge-notifs/' + me.id).update(updates);
  renderNotifications();
  const dot = document.getElementById('notifDot');
  if (dot) dot.style.display = 'none';
}

async function renderNotifications() {
  const notifs = await loadNotifications();
  const list = document.getElementById('notifList');
  if (!list) return;
  notifs.sort((a,b) => b.ts - a.ts);
  const unread = notifs.filter(n => !n.read).length;
  const dot = document.getElementById('notifDot');
  if (dot) {
    dot.style.display = unread > 0 ? 'flex' : 'none';
    dot.textContent = unread > 9 ? '9+' : String(unread);
  }
  list.innerHTML = notifs.length === 0
    ? '<div class="muted" style="text-align:center;padding:30px">No notifications yet</div>'
    : notifs.map(n => `<div class="notif-item ${n.read?'':'unread'}">
        <div class="notif-del" title="Delete" onclick="event.stopPropagation();deleteNotif('${n.key}')">✕</div>
        <div>${esc(n.msg)}</div>
        <div class="nt">${fmtDT(n.ts)}</div>
      </div>`).join('');
}

async function deleteNotif(key) {
  if (!me || !key) return;
  await db.ref('lennon-lounge-notifs/' + me.id + '/' + key).remove();
  renderNotifications();
}

async function clearAllNotifs() {
  if (!me) return;
  await db.ref('lennon-lounge-notifs/' + me.id).remove();
  renderNotifications();
}

/* Batch 24: single shared source for every nav destination — used by the desktop #topbar
   nav, the mobile hamburger drawer, and vUserSettings' "More pages" card, so the tab list
   never has to be maintained in more than one place. */
function navTabs(){

  const tabs=[
    {id:'home',label:'🏟️ Home'},
    {id:'builder',label:'⚽ Bet Builder'},
    {id:'mybets',label:'🧾 My Bets',badge:needsActionCount()},
    {id:'results',label:'🏆 Results'},

  if(me.admin) tabs.push(

function toggleNavDrawer() {
  const panel = document.getElementById('navDrawer');
  const overlay = document.getElementById('navDrawerOverlay');
  const isOpen = panel.classList.contains('open');
  if (isOpen) {
    closeNavDrawer();
  } else {
    panel.classList.add('open');
    overlay.classList.add('open');
    renderNavDrawer();
  }
}
function closeNavDrawer() {
  const panel = document.getElementById('navDrawer');
  const overlay = document.getElementById('navDrawerOverlay');
  if (panel) panel.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
}
function renderNavDrawer() {
  const list = document.getElementById('navDrawerList');
  if (!list || !me) return;
  const tabs = navTabs();
  list.innerHTML = `<nav class="navdrawer-list">${tabs.map(t=>`<button class="${t.house?'houseTab':''} ${activeTab===t.id?'active':''}" onclick="closeNavDrawer();go('${t.id}')">${t.label}${t.badge?`<span class="badge">${t.badge}</span>`:''}</button>`).join('')}</nav>`;
}

function toggleNotifPanel() {
  const panel = document.getElementById('notifPanel');
  const overlay = document.getElementById('notifOverlay');
  const isOpen = panel.classList.contains('open');
  if (isOpen) {
    panel.classList.remove('open');
    overlay.classList.remove('open');
  } else {
    panel.classList.add('open');
    overlay.classList.add('open');
    renderNotifications();
  }
}

function closeNotifPanel() {
  const panel = document.getElementById('notifPanel');
  const overlay = document.getElementById('notifOverlay');
  if (panel) panel.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
}

function selectTeamChip(el, tid) {
  document.querySelectorAll('.team-chip').forEach(c => c.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('loginErr').style.display = 'none';
  const p0 = document.getElementById('pin0');

function setupPinInputs() {
  [0,1,2,3,4,5].forEach(i => {
    const el = document.getElementById('pin'+i);
    if (!el) return;
    el.addEventListener('input', () => {
      el.value = el.value.replace(/\D/g, '').slice(0, 1);
      if (el.value.length === 1 && i < 5) document.getElementById('pin'+(i+1)).focus();
      if (el.value.length === 1 && i === 5) doLogin();
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !el.value && i > 0) document.getElementById('pin'+(i-1)).focus();
    });
  });
}

function spinAlgo(){

function acceptAlgo(){
  if(!algoCurrent) return;
  slipBundles.push({gwId:algoCurrent.gwId, legs:algoCurrent.legs.map(l=>({...l})), odds:algoCurrent.odds, stake:algoStakeVal||10});
  algoCurrent=null; render(); toast('Algo bet added to your slip as its own bet ⚡');
}

function placeAlgoBet(){
  if(!algoCurrent) return;
  const stake=parseFloat(document.getElementById('algoStake').value)||0;
  if(stake<S.settings.minStake){ toast('Enter a stake',true); return; }
  algoStakeVal=stake;
  submitBet({gwId:algoCurrent.gwId, legs:algoCurrent.legs.map(l=>({...l})), effOdds:algoCurrent.odds, stake, viaAlgo:true});
  algoCurrent=null;
}

function placeBundle(i){
  const bd=slipBundles[i];
  if(!bd||!(bd.stake>=S.settings.minStake)){ toast('Enter a stake',true); return; }
  if(submitBet({gwId:bd.gwId, legs:bd.legs.map(l=>({...l})), effOdds:bd.odds, stake:bd.stake, viaAlgo:true})) slipBundles.splice(i,1);
}

/* ---- Anti-match-fixing integrity check ----
   A leg "on" a player's own team is only allowed if it's a straight win pick for
   that team, or a top_score special naming that team. Anything else touching the
   player's own team (draw, backing the opponent, team_pts/haul/match_total specials
   on their own team) makes the ENTIRE slip/bundle unsubmittable — not just that leg. */
function slipViolatesIntegrity(legs, myTeamId){
  if(!myTeamId || !legs || !legs.length) return false;
  return legs.some(leg=>{
    if(leg.type==='match'){
      const g=gw(leg.gwId); const m=g&&g.matches.find(x=>x.id===leg.matchId);
      if(!m) return false;
      const involved = m.home===myTeamId || m.away===myTeamId;
      if(!involved) return false;
      const ownWin = (m.home===myTeamId && leg.pick==='home') || (m.away===myTeamId && leg.pick==='away');
      return !ownWin;
    }
    if(leg.type==='special'){
      if(leg.kind==='top_score') return false; // top-scorer picks (own team included) are always fine
      // Batch 20: bottom_score is a new special-market kind (mirrors top_score) but is NOT exempt —
      // only top_score gets the carve-out per batch 3's rule, so backing your own team to finish
      // bottom is still treated as a disallowed against-your-own-team bet, same as team_pts/haul.
      if(leg.kind==='team_pts' || leg.kind==='haul' || leg.kind==='bottom_score') return leg.teamId===myTeamId;
      if(leg.kind==='match_total'){
        const g=gw(leg.gwId); const m=g&&g.matches.find(x=>x.id===leg.matchId);
        if(!m) return false;
        return m.home===myTeamId || m.away===myTeamId;
      }
    }
    return false;
  });
}

function submitBet({gwId, legs, effOdds, stake, viaAlgo, boostPct, freeBetAmount, message, duplicateOf}){
  // Usage tracking: logs every submit attempt regardless of outcome (covers the manual builder,
  // Algo bundles, season and bespoke bets — every caller routes through here) — Back Office's
  // "built vs placed" conversion is bet_attempt count vs the bet_placed count logged below, once
  // the bet actually clears every validation gate.
  logUsage('bet_attempt');
  // Batch 28: a season-market bet has no gwId — legs are ALL type:'season' (batch 27's
  // settleSeasonBet() requires that uniformity, and addSeasonLeg() below never mixes a season
  // leg into the gameweek `slip`), so it skips the gw/bettableNow gating entirely and instead
  // just re-checks that every referenced market is still open (belt-and-braces — vSeasonBets()
  // already only offers open markets as clickable buttons).
  const isSeason = !!(legs && legs.length && legs.every(l=>l.type==='season'));
  // Batch 39: a player-requested bespoke bet — free-text description + their own proposed
  // odds, always exactly one leg (never mixed into an acca — see isBespokeBet()). Like a
  // season bet it has no gwId and skips the gw/bettableNow gate, but it's never auto-gradable
  // (evalLeg/legLiveInfo have no idea what the free text means) so it stays 'pending' until
  // the house accepts/counters it like any other bet, then sits 'accepted' until an admin
  // manually settles it via the Settler tab (settleBespokeBet()) — it's never touched by
  // settleGw()'s sweep since that only ever looks at bets with a matching gwId.
  const isBespoke = !!(legs && legs.length===1 && legs[0].type==='bespoke');
  let g=null, mode='pre';
  if(isSeason){
    if(legs.some(l=>{ const m=(S.seasonMarkets||[]).find(x=>x.id===l.marketId); return !m||m.status!=='open'; })){
      toast('One or more of these season markets is no longer open', true); render(); return false;
    }
  } else if(isBespoke){
    if(!legs[0].description||!legs[0].description.trim()){ toast('Describe the bet you want', true); render(); return false; }
    if(!(effOdds>=1.1)){ toast('Enter proposed odds of at least 1.1', true); render(); return false; }
  } else {
    g=gw(gwId); mode=bettableNow(g);
    if(!mode){ toast('Betting is closed for '+g.name+' right now', true); render(); return false; }
    if(mode==='inplay'){
      toast("In-play betting is coming soon — new in-play bets can't be placed yet.", true);
      render(); return false;
    }
  }
  if(slipViolatesIntegrity(legs, me.id)){
    toast("Can't place this bet — it includes a pick against/on your own match that isn't a straight win or top-scorer bet.", true);
    render(); return false;
  }
  const now=Date.now();
  const bet={
    id:nid('bet'), teamId:me.id, gwId: (isSeason||isBespoke)?null:gwId, legs, stake, effOdds,
    status:'pending', placedAt:now, inplay: (isSeason||isBespoke)?false:mode==='inplay', afterCutoff:false,
    algo:!!viaAlgo, boostPct:boostPct||0,
    // Batch 28: explicit marker (also derivable via isSeasonBet(bet) from legs alone — kept as a
    // real field too for cheap filtering/debugging without re-walking legs every time).
    seasonBet: isSeason,
    // Batch 39: same idea for a bespoke bet request (also derivable via isBespokeBet(bet)).
    bespokeBet: isBespoke,
    // Batch 17: amount of this bet's stake that was covered by an auto-applied free-bet reward
    // (0 for a normal bet). It's the player's OWN money at risk that's reduced by this amount —
    // see computePnl()'s stakeCredit handling for exactly how that plays out on win/loss.
    stakeCredit: freeBetAmount||0,
    // Batch 14: set when this bet was placed via "duplicate bet" from the click-into-bet modal
    // (holds the original bet's id). Batch 15 uses this to trigger its alternate "cufflink"
    // celebration in place of the normal one — untouched/unused by this batch otherwise.
    duplicateOf: duplicateOf||null,
    limitFlags:betLimitFlags(stake, stake*effOdds, S.settings),
    history:[{by:me.id, role:'player', action:'placed'+(viaAlgo?' via The Algo':'')+(mode==='inplay'?' (in-play)':''), stake, odds:effOdds, message:message||'', at:now}],
  };
  S.bets.push(bet);
  logUsage('bet_placed');
  // NOTE: previously there was also a separate db.ref(ROOT+'/bets').push(bet) write here
  // "for concurrent safety". That was the actual root cause of the Bet Review "accept/reject
  // doesn't remove the bet" bug: save()/saveNow() below already does a full db.ref(ROOT).set(S)
  // that persists this bet as part of the whole state tree, so the extra push() created a
  // second, differently-keyed copy of the same bet (same id, separate object identity) once a
  // client's local S got refreshed from a listener snapshot taken between the two writes and
  // then saved again. houseAccept/houseReject only mutated whichever copy .find() happened to
  // return, leaving the other stuck at status:'pending' forever. Removed — save() is the single
  // source of truth for persisting a newly placed bet.
  // Batch 17: rule-based promotion grants replace the old maybeGrantBooster() every-2nd-bet
  // mechanic. Only the placing team's rules are checked here (fold_size/odds_threshold read
  // straight off this new bet; stake_rolling re-sums their recent activity including it).
  const grantedRewards=evaluatePromoRules(me.id,{bet});
  // Notify admins
  TEAMS.filter(t=>t.admin&&t.id!==me.id).forEach(t=>{
    pushNotif(t.id,'bet_placed',`${me.name} placed a bet — ${legs.length} leg(s) @ ${fmtOdds(effOdds)} · £${stake}`);
  });
  save(); bosh(!!bet.duplicateOf);
  setTimeout(()=>{
    let msg='Bet placed — the house is on it';
    if(grantedRewards.length===1){
      const r=grantedRewards[0];
      msg = r.kind==='boost' ? `🎁 Reward unlocked: +${r.pct}% odds boost for a future bet!` : `🎁 Reward unlocked: £${r.amount} free bet credit!`;
    } else if(grantedRewards.length>1){
      msg = `🎁 ${grantedRewards.length} new rewards unlocked — check your rewards!`;
    }
    toast(msg); go('mybets');
  },1200);
  return true;
}

/* ---- Bet Builder ---- */
// Batch 38: on mobile the slip used to always sit at the very end of the page (as the second
// .grid2 column, which stacks below everything once the grid collapses to one column under
// 880px — the same breakpoint checked here), forcing a scroll past every other gameweek board
// to find it after adding a leg. Fix renders the ONE vSlip() instance (it carries fixed ids
// like #stakeInput — two copies in the DOM at once would break getElementById) into whichever
// of two possible slots actually matches the real viewport width: right under the current
// (first, open-by-default) gameweek board on mobile, or the sticky sidebar column on desktop.
function isMobileLayout(){ return window.innerWidth<=880; }
function vBuilder(){
  const open=publishedGws();
  const pre=open.filter(g=>bettableNow(g)==='pre');
  const inplay=open.filter(g=>bettableNow(g)==='inplay');
  const paused=open.filter(g=>!bettableNow(g));
  const list=builderSec==='pre'?pre:inplay;
  // Draft gameweeks (synced but not yet published) — shown read-only so players can see
  // what's coming, per the house's request. Sorted earliest-first since that's the order
  // they'll actually get published in.
  const upcoming=builderSec==='pre'?S.gameweeks.filter(g=>g.status==='draft').sort((a,b)=>(a.event||0)-(b.event||0)):[];
  // Only build gw-board HTML for the section actually being shown — the in-play tab renders
  // just its coming-soon banner (below), so skip the vGwBoard() calls entirely there, same as
  // before this batch.
  let currentBoard='', restBoards='';
  if(builderSec!=='inplay'){
    const ordered=list.slice().reverse();
    currentBoard=ordered.length?vGwBoard(ordered[0],true,builderSec):'';
    restBoards=ordered.slice(1).map(g=>vGwBoard(g,false,builderSec)).join('');
  }
  const slipHtml=vSlip();
  const mobile=isMobileLayout();
  return `<div class="grid2"><div>
    <h2>Bet Builder</h2>
    <div class="sub">Pick your spots, stack your legs, back yourself.</div>
    <!-- Batch 29: page-level way into the squad viewer, so it's reachable from the Bet Builder
         generally and not only via a specific match row's ⚔ Squads button. Opens on the
         viewer's own team; the modal's own switcher covers the other 11. -->
    <div class="quickrow" style="margin:0 0 14px">
      <button class="btn secondary small" onclick="openSquadModal('${me.id}')">👥 Squads &amp; fixture difficulty</button>
    </div>
    <div class="sectabs">
      <button class="${builderSec==='pre'?'active':''}" onclick="builderSec='pre';render()">📅 Pre-match<span class="cnt">${pre.length}</span></button>
      <button class="${builderSec==='inplay'?'active':''}" onclick="builderSec='inplay';render()">🔴 In-Play</button>
    </div>
    ${seasonBetsSummaryCard()}
    ${builderSec==='pre'?bespokeRequestCard():''}
    ${builderSec==='pre'?vAlgoZone():''}
    ${builderSec==='inplay'?`<div class="card inplay-soon-banner"><b>🚧 In-play betting — Coming soon</b><div class="muted small" style="margin-top:4px">Nothing to see here yet — check back once this is live.</div></div>`:`
    ${list.length===0?`<div class="card"><h3>😴 Nothing open for pre-match betting</h3><p class="muted">The house has not published a board yet.</p></div>`:''}
    ${paused.length?paused.map(g=>`<div class="card"><h3>⏸ ${esc(g.name)}</h3><p class="muted">Cutoff passed — betting is paused until first kick-off${g.kickoff?' ('+fmtDT(g.kickoff)+')':''}, then In-Play opens.</p></div>`).join(''):''}
    ${currentBoard}
    ${mobile?`<div class="slip" style="position:static;margin:14px 0">${slipHtml}</div>`:''}
    ${restBoards}
    ${upcoming.length?`<h3 style="margin:18px 0 8px">📅 Coming up (${upcoming.length})</h3>${upcoming.map(g=>vGwBoard(g,false,'upcoming')).join('')}`:''}
    `}
  </div>
  ${mobile?'':`<div class="slip">${slipHtml}</div>`}</div>`;
}

// Batch 20: renders the admin-added special markets (gw.specialMarkets[], built in the Loader's
// "🎲 Special markets" card) on the player-facing board, styled like the match odds buttons.
// In-play boards lock everything (same "coming soon" treatment batch 4 gave match odds). Otherwise
// each market is greyed/locked if it fails batch 3's integrity rule for the viewer's own team
// (only top_score is exempt — see slipViolatesIntegrity) — same lock-icon-plus-tooltip pattern
// vGwBoard already uses for the draw/opponent-win match buttons.
function specialMarketsBoard(g, inplay){
  const rows=(g.specialMarkets||[]).map(m=>{
    if(inplay){
      return `<button class="oddbtn locked" disabled title="🚧 In-play betting is coming soon">${esc(m.label)}<b>${fmtOdds(m.odds)}</b></button>`;
    }
    const leg={type:'special', gwId:g.id, marketId:m.id, kind:m.kind, teamId:m.teamId||undefined, matchId:m.matchId||undefined, line:m.line, dir:m.dir, odds:m.odds, label:m.label};
    if(slipViolatesIntegrity([leg], me.id)){
      return `<button class="oddbtn locked" disabled title="🔒 Anti-match-fixing: only top-scorer specials are allowed on your own team">🔒 ${esc(m.label)}<b>${fmtOdds(m.odds)}</b></button>`;
    }
    const sel=slip.some(l=>l.type==='special'&&l.marketId===m.id)?'sel':'';
    return `<button class="oddbtn ${sel}" onclick="addMarketLeg('${g.id}','${m.id}')">${esc(m.label)}<b>${fmtOdds(m.odds)}</b></button>`;
  }).join('');
  return `<div style="margin-top:14px">
    <div class="muted small" style="text-transform:uppercase;letter-spacing:.6px;font-weight:800;margin-bottom:6px">🎲 Special markets</div>
    <div class="oddsbtns" style="flex-wrap:wrap">${rows}</div>
  </div>`;
}
function vGwBoard(g,openByDefault,mode){
  const inplay=mode==='inplay';
  const upcoming=mode==='upcoming';
  const head=inplay
    ?`<span class="livechip">🔴 IN-PLAY${g.inplayCutoff?' · closes '+fmtDT(g.inplayCutoff):''}</span>`
    :upcoming?`<span class="deadline muted">🔒 Not published yet</span>`
    :`<span class="deadline">⏱ Cutoff ${fmtDT(g.deadline)}</span>`;
  const inner=`
    <div class="gwhead">
      <h3 style="margin:0">📅 ${esc(g.name)}</h3>
      ${head}
    </div>
    ${inplay?'<p class="muted small" style="margin-bottom:10px">🚧 <b>In-play betting is coming soon.</b> Odds and scores below keep updating live for reference, but new in-play bets can\'t be placed yet.</p>':''}
    ${upcoming?'<p class="muted small" style="margin-bottom:10px">Fixtures confirmed — odds shown are provisional. The house hasn\'t published this gameweek yet, so nothing below is bettable.</p>':''}
    ${g.matches.filter(m=>m.home&&m.away).map(m=>{
      const myWinPick = m.home===me.id ? 'home' : (m.away===me.id ? 'away' : null);
      const btn=(pick,lab)=>{
        const boosted=promoPrice(g.id,m.id,pick) ?? weekBoostPrice(g,m,pick);
        const price=boosted??m.odds[pick];
        if(inplay){
          return `<button class="oddbtn locked" disabled title="🚧 In-play betting is coming soon">${lab}<b>${fmtOdds(price)}</b></button>`;
        }
        if(upcoming){
          return `<button class="oddbtn locked" disabled title="🔒 Not published yet">${lab}<b>${fmtOdds(price)}</b></button>`;
        }
        if(myWinPick && pick!==myWinPick){
          return `<button class="oddbtn locked" disabled title="🔒 Anti-match-fixing: this match involves your team — you can only back your own team to WIN, or take a top-scorer special">🔒 ${lab}<b>${fmtOdds(price)}</b></button>`;
        }
        const sel=slip.some(l=>l.type==='match'&&l.matchId===m.id&&l.pick===pick)?'sel':'';
        return `<button class="oddbtn ${sel} ${boosted?'boost':''}" onclick="addMatchLeg('${g.id}','${m.id}','${pick}')">${boosted?'<span class="fire">🔥</span>':''}${lab}<b>${boosted?`<span class="was">${fmtOdds(m.odds[pick])}</span>`:''}${fmtOdds(price)}</b></button>`;
      };
      const liveScore=inplay&&m.result?`<span class="livechip" style="animation:none">${m.result.homePts??0}–${m.result.awayPts??0}</span>`:'';
      return `<div class="match${inplay||upcoming?' soon':''}">
        <div class="names">${teamLink(m.home)}${formDot(m.home)}<span class="vs">v</span>${teamLink(m.away)}${formDot(m.away)} ${liveScore}${squadCompareBtn(g.id,m.id)}${whyOddsBtn(g.id,m.id)}</div>
        <div class="oddsbtns">${btn('home','HOME')}${btn('draw','DRAW')}${btn('away','AWAY')}</div>
      </div>`;
    }).join('')||'<p class="muted">Fixtures coming soon.</p>'}
    ${g.specialMarkets&&g.specialMarkets.length&&!upcoming?specialMarketsBoard(g,inplay):''}`;
  return openByDefault?`<div class="card">${inner}</div>`
    :`<div class="card"><details><summary>📅 ${esc(g.name)} — view board</summary><div style="margin-top:12px">${inner}</div></details></div>`;
}

/* ---- Slip ---- */
function addMatchLeg(gwId,matchId,pick){
  const g=gw(gwId); const m=g.matches.find(m=>m.id===matchId);
  const i=slip.findIndex(l=>l.type==='match'&&l.matchId===matchId);
  slipDuplicateOf=null; // batch 14: any manual edit un-flags the slip as a straight duplicate
  if(i>-1&&slip[i].pick===pick){ slip.splice(i,1); render(); return; }
  const boosted=promoPrice(gwId,matchId,pick) ?? weekBoostPrice(g,m,pick);
  const label=pick==='draw'?`Draw — ${team(m.home).name} v ${team(m.away).name}`:`${team(pick==='home'?m.home:m.away).name} to WIN v ${team(pick==='home'?m.away:m.home).name}`;
  const leg={type:'match',gwId,matchId,pick,odds:boosted??m.odds[pick],label:label+(boosted?' 🔥BOOSTED':'')};
  if(i>-1) slip[i]=leg; else slip.push(leg);
  render(); logUsage('leg_click');
}

function addSpecialLeg(leg){
  slipDuplicateOf=null; // batch 14: see addMatchLeg
  slip.push(leg); render(); logUsage('leg_click');
}

// Batch 20: first manual UI caller of addSpecialLeg — picks an admin-added special market
// (gw.specialMarkets[], built in the Loader's "🎲 Special markets" card) off the board and adds
// it to the slip as a leg. Toggles off if already in the slip (same UX as addMatchLeg). Re-checks
// slipViolatesIntegrity() here too (defense in depth — vGwBoard/specialMarketsBoard already greys
// out/disables the button for a blocked market, this is the belt-and-braces backstop matching the
// pattern batch 3 set for match-winner legs).
function addMarketLeg(gwId, marketId){
  const g=gw(gwId); const m=g&&g.specialMarkets&&g.specialMarkets.find(x=>x.id===marketId);
  if(!m) return;
  const i=slip.findIndex(l=>l.type==='special'&&l.marketId===marketId);
  if(i>-1){ slip.splice(i,1); slipDuplicateOf=null; render(); return; }
  const leg={type:'special', gwId, marketId:m.id, kind:m.kind, teamId:m.teamId||undefined, matchId:m.matchId||undefined, line:m.line, dir:m.dir, odds:m.odds, label:m.label};
  if(slipViolatesIntegrity([leg], me.id)){
    toast("Can't add this — it's a special market on/against your own team.", true);
    return;
  }
  addSpecialLeg(leg);
}

function removeFromSlip(i){ slipDuplicateOf=null; slip.splice(i,1); render(); }

function slipOdds(){
  if(slip.length===0) return 0;
  if(slip.length===1) return slip[0].odds;
  return combinedOdds(slip.map(l=>l.odds),S.settings);
}

function slipOddsFinal(){ const t=autoBoostToken(me.id); const o=slipOdds(); return t?Math.round(o*(1+t.pct/100)*100)/100:o; }

function slipContext(){
  const gwIds=[...new Set(slip.map(l=>l.gwId))];
  if(gwIds.length===0) return {ok:false,reason:'empty'};
  if(gwIds.length>1) return {ok:false,reason:'All legs must be in the same gameweek'};
  const g=gw(gwIds[0]); const mode=bettableNow(g);
  if(!mode) return {ok:false,reason:'Betting is closed for '+g.name+' right now'};
  return {ok:true,g,mode};
}

function clearSlip(){ slip=[]; slipBundles=[]; slipDuplicateOf=null; render(); }

function vSlip(){
  if(slip.length===0&&slipBundles.length===0) return `<div class="card"><h3>🧾 Bet slip</h3><p class="muted">Tap odds to build your own bet, or fire up The Algo — Algo picks land here as their own ready-to-place bets.</p></div>`;
  let html=`<div class="card glow"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="margin:0">🧾 Bet slip</h3><button class="btn danger small" onclick="clearSlip()">Clear all</button></div>`;
  if(slip.length){
    const eff=slipOddsFinal();
    const stake=parseFloat(document.getElementById('stakeInput')?.value)||0;
    const potential=stake*eff;
    const flags=betLimitFlags(stake,potential,S.settings);
    const ctx=slipContext();
    // Batch 17: rewards are no longer manually picked — the best eligible unused boost/free-bet
    // token for this team is auto-applied at placement (see placeBet()). This just previews that.
    const boostTok=autoBoostToken(me.id);
    const freeTok=autoFreeBetToken(me.id, stake);
    html+=`<div class="muted small" style="font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:6px">Your build · ${slip.length===1?'Single':slip.length+'-leg Acca'}</div>
    ${slip.map((l,i)=>`<div class="slipleg"><span>${esc(l.label)}</span><span style="display:flex;gap:6px;align-items:center"><b class="mono">${fmtOdds(l.odds)}</b><button class="x" onclick="slipDuplicateOf=null;slip.splice(${i},1);render()">×</button></span></div>`).join('')}
    ${boostTok?`<div class="small" style="color:var(--gold);margin:10px 0 2px">🎁 Reward auto-applied: +${boostTok.pct}% odds boost</div>`:''}
    <div id="slipFreeLine">${freeTok?`<div class="small" style="color:var(--teal);margin:2px 0 2px">🎟️ Free bet credit ${GBP(Math.min(freeTok.amount,stake))} auto-applied — that much of your stake is on the house</div>`:''}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <span class="muted small">Total odds${boostTok?' (boosted 🚀)':''}</span>
      <span class="bigodds gradtxt mono">${fmtOdds(eff)}</span>
    </div>
    <div class="formrow" style="margin-top:8px">
      <div><label>Stake £</label><input id="stakeInput" type="number" min="1" step="1" value="${stake||''}" style="width:110px;font-size:16px;font-weight:800" oninput="updateSlipStakeUI()"></div>
      <div class="small muted">Potential return<br><b class="mono" id="slipPotential" style="font-size:19px;color:var(--teal)">${GBP(potential)}</b></div>
    </div>
    <div id="slipWarnings">${flags.map(f=>`<div class="small" style="color:var(--gold);margin-bottom:6px">⚠ ${f} — submit anyway and the house will review.</div>`).join('')}${ctx.ok&&ctx.mode==='inplay'?`<div class="small" style="color:var(--pink);margin-bottom:6px">🚧 In-play betting is coming soon — this slip can't be placed right now.</div>`:''}${!ctx.ok&&ctx.reason!=='empty'?`<div class="small" style="color:var(--pink);margin-bottom:6px">⚠ ${ctx.reason}</div>`:''}</div>
    <textarea id="betMsg" placeholder="Optional message to the house…" style="min-height:48px;margin:8px 0"></textarea>
    <button id="slipPlaceBtn" class="btn big" style="width:100%" onclick="placeBet()" ${stake>0&&ctx.ok&&ctx.mode!=='inplay'?'':'disabled'}>PLACE BET · ${GBP(stake)}</button>`;
  }
  slipBundles.forEach((bd,bi)=>{
    const g=gw(bd.gwId); const mode=bettableNow(g);
    html+=`<div style="margin-top:16px;border-top:1px dashed var(--line);padding-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="muted small" style="font-weight:800;text-transform:uppercase;letter-spacing:.6px">⚡ Algo bet · standalone</span><button class="x" onclick="slipBundles.splice(${bi},1);render()">×</button></div>
      ${bd.legs.map(l=>`<div class="slipleg"><span>${esc(l.label)}</span><b class="mono">${fmtOdds(l.odds)}</b></div>`).join('')}
      <div class="formrow" style="margin-top:8px;margin-bottom:6px">
        <div><label>Stake £</label><input type="number" min="1" value="${bd.stake}" style="width:90px;font-weight:800" onchange="slipBundles[${bi}].stake=parseFloat(this.value)||0;render()"></div>
        <div class="small muted">@ <b class="mono">${fmtOdds(bd.odds)}</b> · returns <b class="mono" style="color:var(--teal)">${GBP((bd.stake||0)*bd.odds)}</b></div>
      </div>
      ${!mode?`<div class="small" style="color:var(--pink);margin-bottom:6px">⚠ Betting closed for ${esc(g.name)}</div>`:''}
      ${mode==='inplay'?`<div class="small" style="color:var(--pink);margin-bottom:6px">🚧 In-play betting is coming soon — this bundle can't be placed right now.</div>`:''}
      <button class="btn hot" style="width:100%" onclick="placeBundle(${bi})" ${bd.stake>0&&mode==='pre'?'':'disabled'}>PLACE ALGO BET · ${GBP(bd.stake||0)}</button>
    </div>`;
  });
  return html+'</div>';
}

// Batch 37: #stakeInput used to run oninput="render()", which rebuilds the whole #view DOM on
// every keystroke and drops input focus — typing "10" required clicking back into the field
// after each digit. Everything the stake number actually drives (potential return, limit-flag
// warnings, the free-bet-credit preview, and the place button's enabled state/label) gets a
// stable id in vSlip() so this can patch just those nodes instead of a full re-render.
function updateSlipStakeUI(){
  if(!slip.length) return;
  const stakeEl=document.getElementById('stakeInput'); if(!stakeEl) return;
  const stake=parseFloat(stakeEl.value)||0;
  const eff=slipOddsFinal();
  const potential=stake*eff;
  const flags=betLimitFlags(stake,potential,S.settings);
  const ctx=slipContext();
  const freeTok=autoFreeBetToken(me.id, stake);
  const freeEl=document.getElementById('slipFreeLine');
  if(freeEl) freeEl.innerHTML=freeTok?`<div class="small" style="color:var(--teal);margin:2px 0 2px">🎟️ Free bet credit ${GBP(Math.min(freeTok.amount,stake))} auto-applied — that much of your stake is on the house</div>`:'';
  const potEl=document.getElementById('slipPotential');
  if(potEl) potEl.textContent=GBP(potential);
  const warnEl=document.getElementById('slipWarnings');
  if(warnEl) warnEl.innerHTML=flags.map(f=>`<div class="small" style="color:var(--gold);margin-bottom:6px">⚠ ${f} — submit anyway and the house will review.</div>`).join('')
    +(ctx.ok&&ctx.mode==='inplay'?`<div class="small" style="color:var(--pink);margin-bottom:6px">🚧 In-play betting is coming soon — this slip can't be placed right now.</div>`:'')
    +(!ctx.ok&&ctx.reason!=='empty'?`<div class="small" style="color:var(--pink);margin-bottom:6px">⚠ ${ctx.reason}</div>`:'');
  const btn=document.getElementById('slipPlaceBtn');
  if(btn){ btn.disabled=!(stake>0&&ctx.ok&&ctx.mode!=='inplay'); btn.textContent='PLACE BET · '+GBP(stake); }
}

function placeBet(){
  const stake=parseFloat(document.getElementById('stakeInput').value);
  if(!stake||stake<S.settings.minStake){ toast('Enter a stake',true); return; }
  const ctx=slipContext();
  if(!ctx.ok){ toast(ctx.reason,true); return; }
  const tok=autoBoostToken(me.id);
  const freeTok=autoFreeBetToken(me.id, stake);
  const eff=slipOddsFinal();
  const msg=document.getElementById('betMsg').value.trim();
  if(submitBet({gwId:ctx.g.id,legs:slip.map(l=>({...l})),effOdds:eff,stake,boostPct:tok?tok.pct:0,freeBetAmount:freeTok?Math.min(freeTok.amount,stake):0,message:msg,duplicateOf:slipDuplicateOf})){
    if(tok) tok.used=true;
    if(freeTok) freeTok.used=true;
    slip=[]; slipDuplicateOf=null; save();
  }
}

const getBet=id=>S.bets.find(b=>b.id===id);
function pushHist(b,action,extra={}){
  if(!b.history) b.history=[];
  b.history.push({by:me.id,role:(me.admin&&b.teamId!==me.id)?'house':'player',action,at:Date.now(),...extra});

function legLiveInfo(leg,g){
  // Batch 28: season-market legs aren't tied to a gameweek at all (g is always null for a
  // season bet, see submitBet()), so they need their own branch ahead of the `!g` bail-out
  // below — graded via evalSeasonLeg()/S.seasonMarkets instead of evalLeg()/g.matches.
  if(leg.type==='season'){
    const m=(S.seasonMarkets||[]).find(x=>x.id===leg.marketId);
    const out=evalSeasonLeg(leg);
    const score=m&&m.status==='settled'?('result: '+String(m.result).toUpperCase()):'';
    return {out,score};
  }
  if(!g) return {out:null,score:''};
  const out=evalLeg(leg,g);
  let score='';
  if(leg.type==='match'||leg.kind==='match_total'){
    const m=g.matches.find(m=>m.id===leg.matchId);
    if(m&&m.result) score=m.result.homePts+'–'+m.result.awayPts+(leg.kind==='match_total'?' ('+(m.result.homePts+m.result.awayPts)+' total)':'');
  } else if(leg.kind==='top_score'){
    const played=g.matches.filter(m=>m.home&&m.away&&m.result);
    if(played.length){
      let best=null;
      played.forEach(m=>{[[m.home,m.result.homePts],[m.away,m.result.awayPts]].forEach(([t,p])=>{ if(!best||p>best[1]) best=[t,p]; });});
      if(best) score='top: '+team(best[0]).name+' '+best[1];
    }
  } else if(leg.kind==='bottom_score'){
    const played=g.matches.filter(m=>m.home&&m.away&&m.result);
    if(played.length){
      let worst=null;
      played.forEach(m=>{[[m.home,m.result.homePts],[m.away,m.result.awayPts]].forEach(([t,p])=>{ if(!worst||p<worst[1]) worst=[t,p]; });});
      if(worst) score='bottom: '+team(worst[0]).name+' '+worst[1];
    }
  } else if(leg.teamId){
    const m=g.matches.find(m=>m.home===leg.teamId||m.away===leg.teamId);
    if(m&&m.result) score=(m.home===leg.teamId?m.result.homePts:m.result.awayPts)+' pts';
  }
  return {out,score};
}

function legChip(info){
  if(info.out==='won') return '<span class="lr won">✓</span>';
  if(info.out==='lost') return '<span class="lr lost">✗</span>';
  if(info.out==='void') return '<span class="lr void">–</span>';
  return '<span class="lr pend">·</span>';
}

function betFiltersActive(){
  return !!(betFilters.teamId||betFilters.status||betFilters.minStake!==''||betFilters.maxStake!=='');
}
function setBetFilter(key,val){ betFilters[key]=val; render(); }
function clearBetFilters(){ betFilters={teamId:'',minStake:'',maxStake:'',status:''}; render(); }
function applyBetFilters(list){
  const {teamId,status,minStake,maxStake}=betFilters;
  const min=minStake!==''&&minStake!=null&&!isNaN(minStake)?Number(minStake):null;
  const max=maxStake!==''&&maxStake!=null&&!isNaN(maxStake)?Number(maxStake):null;
  return list.filter(b=>{
    if(teamId&&b.teamId!==teamId) return false;
    if(status&&b.status!==status) return false;
    if(min!=null&&b.stake<min) return false;
    if(max!=null&&b.stake>max) return false;
    return true;
  });
}

function betCard(b,perspective,showPricingFlag){
  const g=gw(b.gwId);
  const seasonBet=isSeasonBet(b);
  const bespokeBet=isBespokeBet(b);
  // Batch 49: only computed when explicitly asked for (vReview() passes true) — every other
  // betCard() call site (My Bets, Bet Feed, Home modal, etc.) is unaffected/unchanged.
  const priceCheck = showPricingFlag ? officialOddsCheck(b, S) : null;
  // Batch 28: a season bet has no gw deadline to check — "locked in, can't cancel" instead means
  // at least one of its referenced season markets has already been settled (its outcome is fixed).
  // Non-season bets keep the exact prior gwDeadlinePassed() behavior, untouched.
  // Batch 39: a bespoke bet has no gw and nothing else to check either — it's never "passed" on
  // its own, cancel-ability is already fully gated by the b.status whitelist just below.
  const passed=seasonBet
    ? b.legs.some(l=>{ const m=(S.seasonMarkets||[]).find(x=>x.id===l.marketId); return !m||m.status!=='open'; })
    : bespokeBet ? false
    : (g?gwDeadlinePassed(g):true);
  const offer=b.offer;
  const stLabel={pending:'Pending review',accepted:'Accepted ✓',rejected:'Rejected',cancelled:'Cancelled',
    counter_house:'House offer 📨',counter_user:'Your counter sent',won:'WON 🎉',lost:'LOST',void:'Void',expired:'Expired'}[b.status]||b.status;
  let actions='';
  if(perspective==='player'&&b.teamId===me.id){
    if(b.status==='counter_house'){
      actions+=`<button class="btn small" onclick="acceptOffer('${b.id}')">Accept ${GBP(offer.stake)} @ ${fmtOdds(offer.effOdds)}</button>
                <button class="btn danger small" onclick="declineOffer('${b.id}')">Decline</button>
                <button class="btn ghost small" onclick="toggleBox('counter_${b.id}')">Counter</button>`;
    }
    if(['pending','accepted','counter_house','counter_user'].includes(b.status)&&!passed)
      actions+=`<button class="btn secondary small" onclick="cancelBet('${b.id}')">Cancel</button>`;
    if(['pending','counter_house','counter_user'].includes(b.status))
      actions+=`<button class="btn secondary small" onclick="toggleBox('msg_${b.id}')">💬</button>`;
  }
  if(perspective==='house'&&me.admin&&['pending','counter_user'].includes(b.status)){
    actions+=`<button class="btn small" onclick="houseAccept('${b.id}')">Accept</button>
              <button class="btn danger small" onclick="houseReject('${b.id}')">Reject</button>
              <button class="btn ghost small" onclick="toggleBox('counter_${b.id}')">Counter-offer</button>
              <button class="btn secondary small" onclick="toggleBox('msg_${b.id}')">💬</button>`;
  }
  if(perspective==='house'&&me.admin&&['pending','accepted','counter_user'].includes(b.status)&&!passed){
    actions+=`<button class="btn danger small" onclick="houseCancel('${b.id}')">Cancel</button>`;
  }
  const needsMe=(perspective==='player'&&b.status==='counter_house')||(perspective==='house'&&['pending','counter_user'].includes(b.status));
  const houseEdgeInfo=perspective==='house'&&b.legs.length>1
    ?`<span class="muted">Raw odds<b class="mono">${fmtOdds(b.legs.reduce((a,l)=>a*l.odds,1))}</b></span>`:'';
  return `<div class="bet ${needsMe?'needsme':''}">
    <div class="top">
      <div><b>${teamLink(b.teamId, team(b.teamId)?team(b.teamId).name:'?')}</b> <span class="muted small">· ${esc(seasonBet?'🏆 Season':bespokeBet?'📝 Bespoke':(g?g.name:'?'))} · ${b.legs.length===1?'Single':b.legs.length+'-leg Acca'}${b.algo?' · ⚡Algo':''}</span>
        ${b.inplay?'<span class="flag late">🔴 IN-PLAY</span>':''}
        ${b.afterCutoff?'<span class="flag late">AFTER CUTOFF</span>':''}
        ${b.boostPct?`<span class="flag limit">🚀 +${b.boostPct}% BOOST</span>`:''}
        ${b.stakeCredit?`<span class="flag limit">🎟️ £${b.stakeCredit.toFixed(2)} FREE BET</span>`:''}
        ${(b.limitFlags||[]).length?'<span class="flag limit">OVER LIMIT</span>':''}
        ${priceCheck&&priceCheck.flagged?`<span class="flag pricecheck" title="${esc(priceCheck.reason)}">⚠️ NOT HOUSE-PRICED</span>`:''}</div>
      <span class="pill st-${b.status}">${stLabel}</span>
    </div>
    <ul class="legs">${b.legs.map(l=>{
      const info=legLiveInfo(l,g);
      return `<li>${legChip(info)}${esc(l.label)} <b class="mono">@ ${fmtOdds(l.odds)}</b>${info.score?`<div class="legresult ${info.out||''}">${esc(info.score)}</div>`:''}</li>`;
    }).join('')}</ul>
    ${priceCheck&&priceCheck.flagged?`<div class="small" style="color:var(--danger);margin:-4px 0 8px">⚠️ ${esc(priceCheck.reason)}${bespokeBet?'':' <span class="muted">Note: odds can be edited after a bet is placed, so this may be a false positive from a legitimate later edit rather than proof of anything wrong — see officialOddsCheck() code comment.</span>'}</div>`:''}
    <div class="nums">
      <span>Stake<b class="mono">${GBP(b.stake)}</b></span>
      <span>Odds<b class="mono">${fmtOdds(b.effOdds)}</b></span>
      <span>Returns<b class="mono" style="color:var(--teal)">${GBP(b.stake*b.effOdds)}</b></span>
      ${houseEdgeInfo}
      ${b.status==='won'?`<span>Paid<b class="mono" style="color:var(--teal)">${GBP(b.settledPayout)}</b></span>`:''}
      ${b.status==='lost'?`<span>Paid<b class="mono" style="color:var(--danger)">${GBP(0)}</b></span>`:''}
      <span>Placed<b>${fmtDT(b.placedAt)}</b></span>
    </div>
    ${offer&&['counter_house','counter_user'].includes(b.status)?`<div class="small" style="color:var(--cyan);margin-bottom:6px">📨 On the table from ${offer.by==='house'?'the house':'the player'}: <b>${GBP(offer.stake)} @ ${fmtOdds(offer.effOdds)}</b> → returns ${GBP(offer.stake*offer.effOdds)}</div>`:''}
    ${(b.history||[]).length>1||(b.history||[]).some(h=>h.message)?`<details><summary>History & messages (${(b.history||[]).length})</summary>
      <div class="chat">${(b.history||[]).map(h=>`<div class="msg ${h.role==='house'?'house':''}">
        <span class="who">${h.role==='house'?'🏠 House ('+esc(team(h.by)?.owner||'?')+')':esc(team(h.by)?.name||'?')} · ${fmtDT(h.at)} · ${h.action}${h.stake!=null?` — ${GBP(h.stake)} @ ${fmtOdds(h.odds)}`:''}</span>
        ${h.message?`<div>${esc(h.message)}</div>`:''}</div>`).join('')}</div></details>`:''}
    <div class="actions">${actions}</div>
    <div class="counterbox" id="counter_${b.id}">
      <div class="formrow">
        <div><label>Stake £</label><input type="number" id="cs_${b.id}" value="${offer?offer.stake:b.stake}" style="width:100px" oninput="updCounterRet('${b.id}')"></div>
        <div><label>Odds</label><input type="number" step="0.1" min="1.1" id="co_${b.id}" value="${fmtOdds(offer?offer.effOdds:b.effOdds)}" style="width:100px" oninput="updCounterRet('${b.id}')"></div>
        <div class="small muted" style="padding-bottom:8px">Return on this offer<br><b class="mono" id="cret_${b.id}" style="font-size:16px;color:var(--teal)">${GBP((offer?offer.stake:b.stake)*(offer?offer.effOdds:b.effOdds))}</b></div>
      </div>
      <textarea id="cm_${b.id}" placeholder="Message with your offer…" style="min-height:44px;margin-bottom:8px"></textarea>
      <button class="btn small" onclick="sendCounter('${b.id}')">Send counter-offer</button>
    </div>
    <div class="counterbox" id="msg_${b.id}">
      <textarea id="mm_${b.id}" placeholder="Write a message…" style="min-height:44px;margin-bottom:8px"></textarea>
      <button class="btn small" onclick="sendMsg('${b.id}')">Send</button>
    </div>
  </div>`;
}

function toggleBox(id){ document.getElementById(id).classList.toggle('open'); }

function sendCounter(id){
  const b=getBet(id);
  const stake=parseFloat(document.getElementById('cs_'+id).value);
  const odds=parseFloat(document.getElementById('co_'+id).value);
  const msg=document.getElementById('cm_'+id).value.trim();
  if(!stake||!odds){ toast('Need stake and odds',true); return; }
  const fromHouse=me.admin&&b.teamId!==me.id;
  b.offer={stake,effOdds:odds,by:fromHouse?'house':'player'};
  b.status=fromHouse?'counter_house':'counter_user';
  pushHist(b,'counter-offer',{stake,odds,message:msg});
  save(); render(); toast('Counter-offer sent 📨');
  if(fromHouse) pushNotif(b.teamId,'counter_offer',`The house sent a counter-offer: £${stake} @ ${fmtOdds(odds)}${msg?' — "'+msg+'"':''}`);
}

function acceptOffer(id){
  const b=getBet(id);
  b.stake=b.offer.stake; b.effOdds=b.offer.effOdds; b.offer=null;
  b.status='accepted'; pushHist(b,'accepted house offer'); save(); render(); bosh();
  setTimeout(()=>toast('Deal! Bet is ON'),1100);
}

function declineOffer(id){
  const b=getBet(id); b.status='rejected'; b.offer=null;
  pushHist(b,'declined house offer'); save(); render();
}

function cancelBet(id){
  const b=getBet(id);
  // Batch 28: season bets have no gw (gw(b.gwId) is undefined for them — see submitBet()), so
  // gwDeadlinePassed() can't be called directly here; mirror betCard()'s "passed" definition
  // instead (locked once any referenced season market has already settled).
  if(isSeasonBet(b)){
    if(b.legs.some(l=>{ const m=(S.seasonMarkets||[]).find(x=>x.id===l.marketId); return !m||m.status!=='open'; })){
      toast('One of this bet\'s season markets has already settled — locked in',true); return;
    }
  } else if(isBespokeBet(b)){
    // Batch 39: no gw, nothing to check — cancel-ability is already fully gated by the status
    // whitelist in vMyBets()/betCard()'s action buttons, so just fall through.
  } else if(gwDeadlinePassed(gw(b.gwId))){ toast('Cutoff passed — locked in',true); return; }
  b.status='cancelled'; b.offer=null; pushHist(b,'cancelled'); save(); render(); toast('Bet cancelled');
}

function sendMsg(id){
  const b=getBet(id); const msg=document.getElementById('mm_'+id).value.trim();
  if(!msg) return; pushHist(b,'message',{message:msg}); save(); render(); toast('Sent 💬');
}

function vStandings(){
  const {pnl,house}=computePnl(S);
  const rows=S.teams.map(t=>({t,p:pnl[t.id]||0})).sort((a,b)=>b.p-a.p);
  const lt={}; S.teams.forEach(t=>lt[t.id]={p:0,w:0,d:0,l:0,pf:0,pts:0});
  const addRes=(hid,aid,hp,ap)=>{
    const h=lt[hid],a=lt[aid]; if(!h||!a) return;
    h.p++;a.p++;h.pf+=hp;a.pf+=ap;
    if(hp>ap){h.w++;h.pts+=3;a.l++;}
    else if(hp<ap){a.w++;a.pts+=3;h.l++;}
    else{h.d++;a.d++;h.pts++;a.pts++;}
  };
  const localEvents=new Set(S.gameweeks.filter(g=>g.event&&g.matches.some(m=>m.result)).map(g=>g.event));
  (S.history||[]).forEach(h=>{ if(!localEvents.has(h.event)) addRes(h.a,h.b,h.ap,h.bp); });
  S.gameweeks.forEach(g=>g.matches.forEach(m=>{
    if(!m.result||!m.home||!m.away) return;
    addRes(m.home,m.away,m.result.homePts,m.result.awayPts);
  }));
  const ltRows=S.teams.map(t=>({t,...lt[t.id]})).sort((a,b)=>b.pts-a.pts||b.pf-a.pf);
  return `<div class="card">
    <h3>💷 Money table</h3>
    <p class="muted small">Settled bets only. Green = the house owes you. Pink = pay up.</p>
    <div style="overflow-x:auto"><table><tr><th>#</th><th>Team</th><th style="text-align:right">P&L</th></tr>
    ${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${teamLink(r.t.id)}</b> <span class="muted small">${esc(r.t.owner)}</span></td><td style="text-align:right" class="mono ${r.p>0?'pos':r.p<0?'neg':''}">${GBP(r.p)}</td></tr>`).join('')}
    <tr><td></td><td><b>🏠 The House</b> <span class="muted small">Dan & Jack</span></td><td style="text-align:right" class="mono ${house>0?'pos':house<0?'neg':''}">${GBP(house)}</td></tr></table></div>
  </div>
  <div class="card"><h3>⚽ FPL League table</h3>
    <div style="overflow-x:auto"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PF</th><th>Pts</th></tr>
    ${ltRows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${teamLink(r.t.id)}</b>${formDot(r.t.id)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.pf}</td><td><b>${r.pts}</b></td></tr>`).join('')}</table></div>
  </div>`;
}

function vBetFeed(){
  const graded=S.bets.filter(b=>['won','lost','void'].includes(b.status)).sort((a,b)=>(b.settledAt||0)-(a.settledAt||0));
  if(!graded.length) return '<div class="card"><p class="muted">No settled bets yet. The book is still open…</p></div>';

function aiPerfSummary(tid){
  const bets=S.bets.filter(b=>b.teamId===tid);
  if(!bets.length) return "👻 Not a single bet placed yet. The Algo is RIGHT THERE. What are you scared of — winning?";
  const settled=bets.filter(b=>['won','lost'].includes(b.status));
  const wins=settled.filter(b=>b.status==='won');
  const {pnl}=computePnl(S); const p=pnl[tid]||0;
  const open=bets.filter(b=>['pending','accepted','counter_house','counter_user'].includes(b.status)).length;
  const accas=bets.filter(b=>b.legs.length>1).length;
  const bits=[];
  bits.push(`You've fired ${bets.length} bet${bets.length>1?'s':''} at the house${open?` (${open} still live)`:''}.`);
  if(settled.length) bits.push(`Record: ${wins.length}W–${settled.length-wins.length}L. ${p>0?`You're UP ${GBP(p)} — the house is quietly furious. 😤`:p<0?`You're down ${GBP(Math.abs(p))}. The house thanks you for your generous donations. 🙏`:`Dead level. Painfully sensible.`}`);
  if(bets.length>2){
    if(accas>bets.length/2) bits.push(`${Math.round(accas/bets.length*100)}% of your bets are accas. Bold. The maths called — it disagrees.`);
    else bits.push(`Mostly singles. Sensible. Boring, but sensible.`);
  }
  const big=wins.slice().sort((a,b)=>(b.settledPayout-b.stake)-(a.settledPayout-a.stake))[0];
  if(big) bits.push(`Best hit: ${GBP(big.settledPayout-big.stake)} profit. We remember. 🏆`);
  return bits.join(' ');
}

function aiLeagueSummary(){
  const {pnl,house}=computePnl(S);
  const rows=S.teams.map(t=>({t,p:pnl[t.id]||0})).sort((a,b)=>b.p-a.p);
  const counts={}; S.bets.forEach(b=>counts[b.teamId]=(counts[b.teamId]||0)+1);
  const active=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const bits=[];
  if(!S.bets.length) return "Twelve grown adults, one private bookmaker, zero bets placed. The bravery is overwhelming. Someone do something. 🦗";
  bits.push(house>0?`🏠 The house is up ${GBP(house)} — Dan & Jack are already browsing helicopters.`:house<0?`🚨 The house is DOWN ${GBP(Math.abs(house))}. Punters 1, capitalism 0.`:`The house is dead level, which somehow feels like everyone losing.`);
  if(rows[0]&&rows[0].p>0) bits.push(`${rows[0].t.name} (${rows[0].t.owner}) tops the money table at ${GBP(rows[0].p)} — insufferable in the group chat, presumably.`);
  const bottom=rows[rows.length-1];
  if(bottom&&bottom.p<0) bits.push(`Meanwhile ${bottom.t.name} is funding everyone's fun (${GBP(bottom.p)}). A true patron of the arts.`);
  if(active) bits.push(`Most addicted: ${team(active[0])?.name}, ${active[1]} bets and counting. Someone check on ${team(active[0])?.owner}. 📞`);
  return bits.join(' ');
}

/* ================================================================
   Batch 19: Insights / analytics — new read-only nav tab. All functions below are
   pure reads over S (no mutation, no side effects) feeding vInsights(). Reuses
   aiPerfSummary()/aiLeagueSummary() (built in an earlier batch, never called until
   now) as narrative building blocks, plus new computed stats.
   ================================================================ */
// Which single team a leg "backs" (for the most/least-backed tally below), or null if
// the leg doesn't back one specific team (a draw pick, or a match_total O/U which is
// about the whole fixture rather than either side).
function legBackedTeamId(leg, g){
  if(leg.type==='match'){
    if(!g) return null;
    const m=g.matches.find(x=>x.id===leg.matchId);
    if(!m) return null;
    if(leg.pick==='home') return m.home;
    if(leg.pick==='away') return m.away;
    return null;
  }
  return leg.teamId||null; // team_pts / haul / top_score all carry an explicit teamId
}
// Leg count by backed team across every bet ever placed (any status) — most/least backed.
function mostLeastBackedTeams(){
  const counts={}; S.teams.forEach(t=>counts[t.id]=0);
  S.bets.forEach(b=>{
    const g=gw(b.gwId);
    b.legs.forEach(l=>{ const tid=legBackedTeamId(l,g); if(tid&&tid in counts) counts[tid]++; });
  });
  const rows=S.teams.map(t=>({t,n:counts[t.id]||0})).sort((a,b)=>b.n-a.n);
  return {most:rows[0]||null, least:rows[rows.length-1]||null, rows};
}
// Biggest single win on record, by profit (settledPayout minus the player's own — i.e.
// non-free-bet-covered — stake, matching computePnl()'s definition of profit).
function biggestSingleWin(){
  const wins=S.bets.filter(b=>b.status==='won');
  if(!wins.length) return null;
  return wins.map(b=>({b, profit:b.settledPayout-(b.stake-(b.stakeCredit||0))}))
    .sort((a,b)=>b.profit-a.profit)[0];
}
const MARKET_LABELS={match:'Match winner', team_pts:'Team points O/U', haul:'Haul (points threshold)', match_total:'Match total O/U', top_score:'Top scorer', bottom_score:'Bottom scorer'};
// Leg count by market type across every bet ever placed — most common market.
function marketTypeMix(){
  const counts={};
  S.bets.forEach(b=>b.legs.forEach(l=>{
    const key=l.type==='match'?'match':(l.kind||'other');
    counts[key]=(counts[key]||0)+1;
  }));
  return Object.entries(counts).map(([k,n])=>({key:k,label:MARKET_LABELS[k]||k,n})).sort((a,b)=>b.n-a.n);
}
// For each team, tally graded (won/lost) leg outcomes across the WHOLE league's bet history
// in matches/markets involving that team — i.e. whose on-pitch results are the biggest driver
// of punters winning or losing bets. Match-winner and match_total legs credit BOTH sides of the
// fixture (the result is a joint event for that match); team-specific specials (team_pts/haul/
// top_score) credit only the named team. Evaluated leg-by-leg via evalLeg(), independent of the
// bet's overall status, so a losing leg inside an otherwise-winning acca still counts correctly.
function teamOutcomeCorrelation(){
  const counts={}; S.teams.forEach(t=>counts[t.id]={wins:0,losses:0});
  S.bets.forEach(b=>{
    const g=gw(b.gwId); if(!g) return;
    b.legs.forEach(l=>{
      const out=evalLeg(l,g);
      if(out!=='won'&&out!=='lost') return;
      let tids;
      if(l.type==='match'||l.kind==='match_total'){
        const m=g.matches.find(x=>x.id===l.matchId);
        tids=m?[m.home,m.away].filter(Boolean):[];
      } else {
        tids=l.teamId?[l.teamId]:[];
      }
      tids.forEach(tid=>{ if(counts[tid]) (out==='won'?counts[tid].wins++:counts[tid].losses++); });
    });
  });
  const rows=S.teams.map(t=>({t,...counts[t.id]})).filter(r=>r.wins+r.losses>0);
  const byWins=rows.slice().sort((a,b)=>b.wins-a.wins);
  const byLosses=rows.slice().sort((a,b)=>b.losses-a.losses);
  return {rows, topWins:byWins[0]||null, topLosses:byLosses[0]||null};
}

/* ================================================================
   Batch 30: recent form guide — purely computed from S.history + gw.matches[].result,
   no new FPL pull. Mirrors vStandings()'s pattern of merging S.history (for events not
   yet covered by a local gameweek's own results) with S.gameweeks results, but scoped
   to one team and kept sorted by event so "most recent N" is well-defined.
   ================================================================ */
function teamForm(state, teamId, n=5){
  const localEvents=new Set(state.gameweeks.filter(g=>g.event&&g.matches.some(m=>m.result)).map(g=>g.event));
  const games=[];
  (state.history||[]).forEach(h=>{
    if(localEvents.has(h.event)) return;
    if(h.a===teamId) games.push({event:h.event,pts:h.ap,oppPts:h.bp,oppId:h.b});
    else if(h.b===teamId) games.push({event:h.event,pts:h.bp,oppPts:h.ap,oppId:h.a});
  });
  state.gameweeks.forEach(g=>g.matches.forEach(m=>{
    if(!m.result||!m.home||!m.away) return;
    if(m.home===teamId) games.push({event:g.event||0,pts:m.result.homePts,oppPts:m.result.awayPts,oppId:m.away});
    else if(m.away===teamId) games.push({event:g.event||0,pts:m.result.awayPts,oppPts:m.result.homePts,oppId:m.home});
  }));
  games.sort((a,b)=>a.event-b.event);
  games.forEach(gm=>{ gm.res = gm.pts>gm.oppPts?'W':(gm.pts<gm.oppPts?'L':'D'); });
  const recent=games.slice(-n);
  const record={w:0,d:0,l:0};
  recent.forEach(gm=>{ if(gm.res==='W')record.w++; else if(gm.res==='D')record.d++; else record.l++; });
  // Same 3/1/0 scoring the FPL League table (vStandings) already uses, so "hottest" reads
  // as "who'd top the table if you only counted their last N gameweeks".
  const formPts=recent.reduce((s,gm)=>s+(gm.res==='W'?3:gm.res==='D'?1:0),0);
  const seasonAvg=games.length?games.reduce((s,gm)=>s+gm.pts,0)/games.length:0;
  const recentAvg=recent.length?recent.reduce((s,gm)=>s+gm.pts,0)/recent.length:0;
  const trendDiff=recent.length?recentAvg-seasonAvg:0;
  const trend = recent.length<2 ? 'flat' : (trendDiff>3?'up':(trendDiff<-3?'down':'flat'));
  return {teamId, games:recent, record, formPts, seasonAvg, recentAvg, trendDiff, trend, played:games.length};
}
// Shared hot/cold classification (3+ of the last 5 results the same way) driving both the
// Insights form-guide card and the small dot marker on the gameweek board, so the two
// surfaces never disagree with each other. Needs at least 3 games played to call it either
// way — early season, nobody gets marked.
function formIndicator(f){
  if(f.played<3) return null;
  if(f.record.w>=3&&f.record.w>f.record.l) return 'hot';
  if(f.record.l>=3&&f.record.l>f.record.w) return 'cold';
  return null;
}
// Small colored-dot marker for vGwBoard match rows (batch 30 spec: "some sort of marker...
// who's in form and who's not", kept small/unobtrusive — a dot, not a redesigned row).
function formDot(teamId){
  const f=teamForm(S,teamId,5);
  const ind=formIndicator(f);
  if(!ind) return '';
  const strip=f.games.map(g=>g.res).join('');
  return `<span class="formdot ${ind}" title="${ind==='hot'?'🔥 In form':'❄️ Out of form'} — last ${f.games.length}: ${strip}"></span>`;
}
function formGuideCard(n=5){

    .sort((a,b)=>b.f.formPts-a.f.formPts||b.f.trendDiff-a.f.trendDiff);
  if(!rows.length) return '';
  return `<div class="card"><h3>📈 Form guide</h3>
    <p class="muted small">Last ${n} results per team (oldest → most recent), ranked hottest to coldest, plus how their scoring lately compares to their own season average.</p>
    <div style="overflow-x:auto"><table><tr><th>Team</th><th>Form</th><th style="text-align:right">Trend</th></tr>
    ${rows.map(r=>{

      const trendTxt=r.f.games.length<2?'—':(r.f.trendDiff>=0?'+':'')+r.f.trendDiff.toFixed(1)+' pts';
      const trendCls=r.f.trendDiff>3?'pos':r.f.trendDiff<-3?'neg':'';
      return `<tr><td><b>${teamLink(r.t.id)}</b>${ind?`<span class="formdot ${ind}" title="${ind==='hot'?'In form':'Out of form'}"></span>`:''}</td>

/* Batch 12: home-page "Action needed" hero — gathers, for the current viewer, bets
   requiring their action plus the soonest relevant open-gameweek deadline. Kept as a
   standalone pure-ish read (uses global S/me like the rest of the app, no writes) so
   both vHome() (initial render) and render() (live countdown tick target, see below)
   can call it without duplicating the selection logic. */
function urgentActions(){
  const adminNeeds=me.admin ? S.bets.filter(b=>['pending','counter_user'].includes(b.status)).sort((a,b)=>a.placedAt-b.placedAt) : [];
  const counterOffers=S.bets.filter(b=>b.teamId===me.id&&b.status==='counter_house').sort((a,b)=>a.placedAt-b.placedAt);
  const now=Date.now();
  const APPROACH_MS=3*24*60*60*1000; // an open gw counts as "approaching" within 3 days of deadline
  const relevantGwIds=new Set([...adminNeeds,...counterOffers].map(b=>b.gwId));
  const candidateGws=S.gameweeks
    .filter(g=>g.deadline && g.deadline>now && (relevantGwIds.has(g.id) || (g.status==='open' && (g.deadline-now)<=APPROACH_MS)))
    .sort((a,b)=>a.deadline-b.deadline);
  return {adminNeeds, counterOffers, soonestGw: candidateGws[0]||null};
}
// Renders the hero card HTML, or '' when there's nothing urgent to show. The gw-deadline
// item's countdown span carries id="heroCountdown" — render() (below) ticks it live via
// setInterval, targeting the same soonestGw.deadline this function renders the initial value from.
function urgentHero(u){
  if(!u.adminNeeds.length && !u.counterOffers.length && !u.soonestGw) return '';
  const items=[];
  if(u.adminNeeds.length) items.push(`<div class="hero-item"><span>🏠 <b>${u.adminNeeds.length}</b> bet${u.adminNeeds.length===1?'':'s'} awaiting your accept/reject call</span><button class="btn gold small" onclick="go('review')">Review now →</button></div>`);
  if(u.counterOffers.length) items.push(`<div class="hero-item"><span>📨 <b>${u.counterOffers.length}</b> counter-offer${u.counterOffers.length===1?'':'s'} waiting on your response</span><button class="btn hot small" onclick="go('mybets')">Respond →</button></div>`);
  if(u.soonestGw) items.push(`<div class="hero-item"><span>⏰ <b>${esc(u.soonestGw.name)}</b> cutoff in <span id="heroCountdown" class="hero-countdown mono">${fmtCountdown(u.soonestGw.deadline-Date.now())}</span></span><button class="btn secondary small" onclick="go('builder')">Get a bet on →</button></div>`);
  return `<div class="card hero-urgent"><h3><span class="hero-dot"></span>Action needed</h3>${items.join('')}</div>`;
}
