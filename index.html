/* ================================================================
   USAGE / ENGAGEMENT TRACKING — Back Office "Usage" card
   ================================================================
   ukDateKey/ukHour give an Europe/London day-boundary and hour-of-day for a timestamp (en-CA
   formats as YYYY-MM-DD, a sortable date key for free) — matches the rest of the app's UK-time
   convention (fmtDT, ukWallToTs) rather than the browser's local timezone. */
function ukDateKey(ts){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(ts); }
function ukHour(ts){ return +new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',hourCycle:'h23'}).format(ts); }
// Logs one engagement event for the current team. `type` is one of login/view/leg_click/
// bet_attempt/bet_placed. Cheap and called often (every nav click, every odds tap) so it only
// ever touches `S.usage` and rides the existing DEBOUNCED save() — same "low-stakes action"
// convention batch 6 established for chat/counters, not the saveNow() used for anything
// financially sensitive. No-ops if there's no logged-in team (e.g. pre-login state) or the
// state tree hasn't loaded yet.
function logUsage(type, tab){
  if(!me||!S||!S.usage) return;
  const at=Date.now(), tid=me.id;
  S.usage.events.push(tab?{at,team:tid,type,tab}:{at,team:tid,type});
  if(S.usage.events.length>4000) S.usage.events=S.usage.events.slice(-4000);
  const dk=ukDateKey(at);
  if(!S.usage.daily[dk]) S.usage.daily[dk]={};
  if(!S.usage.daily[dk][tid]) S.usage.daily[dk][tid]={logins:0,views:0,legClicks:0,betsBuilt:0,betsPlaced:0};
  const bucket=S.usage.daily[dk][tid];
  if(type==='login') bucket.logins++;
  else if(type==='view') bucket.views++;
  else if(type==='leg_click') bucket.legClicks++;
  else if(type==='bet_attempt') bucket.betsBuilt++;
  else if(type==='bet_placed') bucket.betsPlaced++;
  if(!S.usage.hourly[tid]) S.usage.hourly[tid]={};
  const h=ukHour(at);
  S.usage.hourly[tid][h]=(S.usage.hourly[tid][h]||0)+1;
  S.usage.lastSeen[tid]=at;
  save();
}
// Client-side-only gate: stops the app's own UI from calling an admin action for a non-admin
// session (e.g. a stray button reachable by URL/state manipulation). This is NOT real
// security — Firebase rules are wide open (.read/.write: true, see SETUP.md Step 7) and every
// function here is a plain global, so anyone with devtools open can call it directly or write
// to the database with a raw HTTP request regardless of this check. It only raises the bar
// for accidental/casual misuse, not a deliberate one. Real protection needs Firebase Auth +
// server-enforced rules keyed to specific admin UIDs — out of scope for this pass; flagged to
// the user rather than silently treated as solved.
function requireAdmin(){
  if(me&&me.admin) return true;
  toast('Admins only',true);
  return false;
}
// Writes ONLY the given top-level keys straight to Firebase (a partial update, not a full
// S overwrite) and updates local S to match. Safer than the debounced save() for anything
// where the local S might be stale (e.g. a tab left open/backgrounded across an external
// change like a GitHub Action sync) — save() re-serializes the WHOLE state tree, so a stale
// local copy silently clobbers fields it never touched. This can't, because unlisted keys
// are never sent.
function saveFields(obj){
  Object.assign(S, obj);
  clearTimeout(_saveTimer); _saveTimer=null;
  return db.ref(ROOT).update(obj).catch(e=>{ console.error('Save failed:', e); throw e; });
}

/* ================================================================
   PRICING & SETTLEMENT ENGINE (pure functions — copied verbatim)
   ================================================================ */
const phi = x => 1/(1+Math.exp(-1.702*x));
function teamAvg(state, tid){
  const base = (state.stats[tid]&&state.stats[tid].base)||50;
  let sum=0,n=0;
  const localEvents=new Set(state.gameweeks.filter(g=>g.event&&g.matches.some(m=>m.result)).map(g=>g.event));
  (state.history||[]).forEach(h=>{
    if(localEvents.has(h.event)) return;
    if(h.a===tid){sum+=h.ap;n++;}
    if(h.b===tid){sum+=h.bp;n++;}
  });
  state.gameweeks.forEach(g=>g.matches.forEach(m=>{
    if(!m.result) return;
    if(m.home===tid){sum+=m.result.homePts;n++;}
    if(m.away===tid){sum+=m.result.awayPts;n++;}
  }));
  return n? (base*2+sum)/(2+n) : base;
}
function edgedOdds(fairP, edgePct){
  const k=1-edgePct/100;
  // Batch 48, two changes, both protecting the "house margin never drops below 10%" rule:
  //  1. The 1.05 minimum price used to silently eat the edge on very short markets. A 90% shot is
  //     fair at 1.11, and 1.11 × 0.837 is 0.93 — an impossible price, so the old code just returned
  //     1.05, leaving a realised margin of ~6% instead of the 16.3% the setting asked for. Capping
  //     the probability at k/1.05 instead means the shortest price the house will ever publish is
  //     exactly 1.05 AND carries exactly the full edge. In effect the house declines to price
  //     anything it thinks is more likely than ~80% (at the normal setting) — which is what a real
  //     book does when it can't make a market pay.
  //  2. Floor to 2dp rather than round. Rounding a price UP hands a sliver of the edge back.
  // The low clamp (0.03) is untouched and pre-dates this batch: it shortens an extreme longshot,
  // which moves the price in the HOUSE's favour, so it can never breach the floor either.
  const pMax=Math.min(.97, k/1.05);
  const fair=1/Math.min(pMax,Math.max(.03,fairP));
  return Math.max(1.05, Math.floor(fair*k*100)/100);
}
function pOver(line, avg){ return 1-phi((line-avg)/SD); }
// SD of the DIFFERENCE of two independent team scores (and of a two-team combined total) —
// sqrt(SD^2 + SD^2). Used by the match model and by match_total specials.
const SD_DIFF = SD*Math.SQRT2;

/* ================================================================
   BATCH 48 — DEEP ODDS MODEL (replaces the old flat-average heuristic)
   ================================================================
   What the previous model did: teamAvg() = a flat LIFETIME mean of a manager's H2H scores with a
   soft prior, a fixed 8% draw probability, a logistic on the difference with a hand-tuned divisor,
   and a flat 1.08 juice multiplier. Nothing about the specific gameweek being priced entered into
   it at all — the same two managers got the same price in GW3 and GW33, whether half their squad
   was injured or not, and whether their players had six easy fixtures or six away days at the top
   six.

   What this does instead, in four steps:
     (a) teamFormProj()   — recency-weighted H2H scoring form, not a lifetime average.
     (b) squadExpected()  — expected points from the 11 who'll actually play, using each owned
                            player's FPL ppg/form, their availability (injury/suspension/doubt) and
                            their minutes share (rotation risk).
     (c) playerFixtureMult() — each of those players' real-world club's fixture difficulty for the
                            actual gameweek being priced, including blanks and doubles.
     (d) projectTeams()   — combines them into one expected-points projection per manager-team for
                            THAT gameweek, from which fairMatchProbs() derives home/draw/away, and
                            suggestSpecialOdds() prices every special market.
   The published price is then fair × (1 - houseEdgePct()/100) — see houseEdgePct() for the
   competitiveness curve. Every knob lives in MODEL below so a future batch can re-calibrate in
   one place rather than hunting through the maths.

   Degrades gracefully at every layer: no squad data → (a) alone (which is still strictly better
   than the old flat average); no plFixtures for the event → (a)+(b) with neutral fixtures; no
   results at all → the hand-set S.stats[].base baselines, heavily shrunk toward even money.

   ----------------------------------------------------------------------------------------------
   BATCH 52 — RECALIBRATION. Real GW4 production output (Dan's Odds Setter screenshot) had every
   fixture running far too wide: 1.17/25.96/3.30, 2.04/22.97/1.51, 2.03/22.97/1.51, 1.23/24.89/2.90,
   1.70/22.72/1.77, 4.29/27.90/1.07 — every draw in the 20s, sides out to 1.07 and 4.29. Working
   backwards from those books (all at competitiveness 10 = a 16.3% edge, and a league tie rate of
   0/18) the model was running on projection gaps of +17.1, −5.0, −4.9, +14.2, +0.6 and −22.9
   points off a 12-team projection spread of 38.8→61.6. Four separate mechanisms were stacking:

     1. COMPOUNDING, NOT BLENDING. projectTeams() multiplied the two signals: proj = formProj ×
        (1 + SQUAD_W×(rel−1)). Form and squad quality are strongly POSITIVELY correlated — a good
        squad is exactly why a manager has been scoring — so multiplying them counts the same
        information twice and produces more swing than either signal alone justifies. They are now
        BLENDED: each is expressed as a deviation in points from the league's own level and combined
        as a weighted average (weights summing to 1), which is what you do with two estimates of the
        same quantity, not two independent effects.
     2. THE EVIDENCE SHRINK BELIEVED A 3-GAME SAMPLE. SHRINK_MIN 0.55 / SHRINK_K 3 was an invented
        curve; at GW4 it treated 75% of the apparent gap as real. The recency weights (1, .82, .67)
        give an effective sample size of 2.9 games, so with a per-week scoring SD of 15 the standard
        error of a team's form level is ~5.5 points — i.e. essentially the whole observed spread is
        sampling noise. That is now measured rather than assumed: formReliability() is a textbook
        empirical-Bayes/James-Stein shrink that estimates the league's REAL spread of scoring levels
        from its own data (cross-team variance minus the expected sampling variance) and believes
        each team's form deviation only in proportion to it. On the GW4 reconstruction it lands at
        ~0.11, not 0.75. It also self-corrects: a league whose teams genuinely diverge will produce
        a bigger tau and the form signal earns more weight back.
     3. THE DRAW WAS PRICED OFF A 3-4% EMPIRICAL TIE RATE. leagueDrawRate() read the league's true
        tie rate (0 in 18 → 3.7% after batch 48's 7%/20-game prior), which at a 16.3% edge is a
        22.7 draw before the gaussian taper pushed the lopsided fixtures out to 27.9. Statistically
        that was right and batch 48 flagged it as a decision for Dan; Dan has now made it — draws
        are a house-policy band (12-16), so DRAW_BASE is the anchor, DRAW_PRIOR_N is heavy enough
        that the league's own rate only nudges it, and pD is clamped to a band whose ends ARE the
        12-16 the house wants. Stated plainly because it matters: a 14.0 draw is short of fair when
        ties really run ~4%, so the house's realised margin on the draw is well above the headline
        edge. That is margin in the house's favour, never against it.
     4. NOTHING CAPPED THE BOOK. Even a perfect projection gap has to be converted to a price
        through phi(D/SD_DIFF), and the model's own uncertainty about its gap estimate is large —
        much larger than the gap itself early in a season. GAP_SOFTCAP applies a smooth tanh squash
        so D ≈ raw for the small gaps the model can actually resolve and saturates at ±4.2 points,
        which is the shape a posterior mean takes under a heavy-tailed prior on the true gap: a
        20-point projected gap in a 12-team fantasy league is far more likely to be model error than
        a real 20-point edge. In published terms the house will never price a Draft H2H fixture
        wider than about 1.52/2.12 — Dan's own stated rail — and an ordinary fixture sits near 1.78.

   BATCH 52 — SQUAD OVER FORM. Dan's instruction, verbatim: "make sure you don't weight player form
   too highly over the actual players they currently have... it doesn't necessarily mean that just
   because you've won the last two games and someone's lost the last two games, you would actually
   beat them. It all comes down primarily to the players they have." So the ordering is inverted in
   both places it lived: per player, FORM_BLEND drops 0.65 → 0.30, so season points-per-game (the
   stable estimate of a player's scoring rate) leads and the 30-day `form` window is the minor
   modifier; per team, SQUAD_W/FORM_W make squad composition 70% of the blended deviation and the
   H2H record 30% — and that 30% is then multiplied AGAIN by the empirical-Bayes reliability above,
   so at GW4 the record is worth about 3% of the price and the squad about 97%. Which is exactly
   what Dan described: two wins in a row is not evidence. */
const MODEL = {
  FORM_DECAY: 0.82,        // weight multiplier per result further back — half-life ~3.5 games
  FORM_PRIOR_W: 1.5,       // S.stats[].base counts as this many results (stops a 2-game sample running wild)
  FORM_BLEND: 0.30,        // player expected pts = 0.30*FPL 30-day form + 0.70*season points-per-game
  FDR_SENS: 0.075,         // expected-points swing per FDR point away from neutral (3)
  DOUBLE_MULT: 1.8,        // a double gameweek is worth well under 2x — rotation is near-certain
  MIN_MINUTES_SHARE: 0.35, // a fringe player is discounted, never erased
  SQUAD_W: 0.70,           // squad quality is the PRIMARY half of the projection deviation
  FORM_W: 0.30,            // the recency-weighted H2H record is the secondary half (and is shrunk again)
  SQUAD_REL_MIN: 0.75, SQUAD_REL_MAX: 1.30,
  SQUAD_TRANSFER: 0.45,    // how much of an XI's relative strength edge actually reaches the scoreboard
  SCORE_SD: 15,            // per-team per-week scoring noise (= SD), used by the evidence shrink
  TALENT_SD_MIN: 2,        // floor/ceiling on the ESTIMATED real spread of manager scoring levels
  TALENT_SD_MAX: 6,
  BASE_NOISE_VAR: 16,      // how wrong a hand-set S.stats[].base can be, as a variance (SD 4 pts)
  PROJ_DEV_MAX: 0.14,      // a team's projection can sit at most ±14% off the league level
  DRAW_BASE: 0.068,        // the house's anchor draw price on a dead-even fixture (~12.3 at edge 16.3%)
  DRAW_PRIOR_N: 20,        // leagueDrawRate() stays a genuine estimate of this league's own tie rate...
  DRAW_TILT: 0.10,         // ...but it may only move the anchor ±10% either way (see fairMatchProbs)
  DRAW_SPREAD: 10,         // how fast the draw lengthens as the fixture gets lopsided
  DRAW_P_MIN: 0.050, DRAW_P_MAX: 0.070,  // = a published draw between ~12.0 and ~16.7 at edge 16.3%
  GAP_SOFTCAP: 4.2,        // pts — the widest projected gap the house will express in a price
  XI: 11
};

// Every past score for one manager-team, most recent gameweek FIRST, optionally cut off before a
// given event (so pricing GW9 never sees GW9's own result). Merges S.history — the FPL-synced
// results for events this app has no local settled gameweek for — with locally-settled
// gw.matches[].result, exactly the same merge teamAvg()/vStandings()/teamForm() already do. The
// difference from teamAvg() is that this keeps the EVENT NUMBER attached, which is what makes
// recency weighting possible at all.
function teamResults(state, tid, beforeEvent){
  const out=[];
  const localEvents=new Set((state.gameweeks||[]).filter(g=>g.event&&g.matches.some(m=>m.result)).map(g=>g.event));
  (state.history||[]).forEach(h=>{
    if(localEvents.has(h.event)) return;
    if(h.a===tid) out.push({event:Number(h.event)||0, pts:h.ap});
    if(h.b===tid) out.push({event:Number(h.event)||0, pts:h.bp});
  });
  (state.gameweeks||[]).forEach(g=>g.matches.forEach(m=>{
    if(!m.result) return;
    if(m.home===tid) out.push({event:Number(g.event)||0, pts:m.result.homePts});
    if(m.away===tid) out.push({event:Number(g.event)||0, pts:m.result.awayPts});
  }));
  const cut=Number(beforeEvent)||0;
  // event 0 = a hand-made/test gameweek with no FPL event number; it can't be ordered against a
  // real event so it's always kept rather than silently dropped by the cutoff.
  return out.filter(r=>!cut||!r.event||r.event<cut).sort((a,b)=>(b.event||0)-(a.event||0));
}

// (a) RECENCY-WEIGHTED FORM. Each result is weighted FORM_DECAY^i by how many results ago it was
// (i=0 = most recent). At 0.82 the last five weeks carry ~62% of the total weight and anything
// older than ~10 weeks is close to noise, which is the right shape for fantasy football where a
// manager's roster genuinely changes month to month. The hand-set baseline stays in as a Bayesian
// prior worth FORM_PRIOR_W results. `weight` is the total evidence weight excluding the prior —
// it caps at 1/(1-FORM_DECAY) ≈ 5.6 no matter how long the season runs.
// Batch 52 also returns `neff` — the EFFECTIVE sample size of the weighted mean, (Σw)²/Σw², which
// caps at ~10 games however long the season runs — and `att`, the share of the posterior that came
// from real results rather than the hand-set baseline prior. formReliability() needs both to work
// out how much of a team's form deviation is signal and how much is week-to-week noise. `weight` is
// unchanged and still returned for any caller that wants the raw evidence total.
function teamFormProj(state, tid, beforeEvent){
  const res=teamResults(state, tid, beforeEvent);
  const base=(state.stats&&state.stats[tid]&&state.stats[tid].base)||50;
  let sw=MODEL.FORM_PRIOR_W, sx=base*MODEL.FORM_PRIOR_W, w1=0, w2=0;
  res.forEach((r,i)=>{ const wt=Math.pow(MODEL.FORM_DECAY,i); sw+=wt; w1+=wt; w2+=wt*wt; sx+=wt*(Number(r.pts)||0); });
  return {proj:sx/sw, weight:w1, n:res.length,
          neff: w2>0?(w1*w1)/w2:0, att: w1>0?w1/(w1+MODEL.FORM_PRIOR_W):0};
}

/* (a2) HOW MUCH OF THE FORM SPREAD IS REAL? — batch 52, and the single biggest fix in it.
   A manager's recency-weighted form level is a mean of a handful of very noisy numbers. With
   FORM_DECAY 0.82 the effective sample size is 2.9 games at GW4 and never exceeds ~10, and a Draft
   H2H score has a standard deviation of about SCORE_SD (15) week to week. So the standard error on
   a team's form level is ~5.5 points at GW4 — which is about as big as the ENTIRE observed spread
   between the best and worst manager. Batch 48's SHRINK_MIN/SHRINK_K curve believed 75% of that
   gap; it should have believed almost none of it.

   This is the textbook empirical-Bayes (James-Stein) answer, and it needs no new tuning constants
   because it reads the answer off the league's own data:
       observed cross-team variance  =  real spread (tau^2)  +  average sampling variance
   so tau^2 is what's left when you subtract the sampling variance, and each team's deviation is
   believed in the ratio tau^2 / (tau^2 + its own sampling variance). A league whose managers really
   do diverge produces a big tau and gets its form signal back; a league that just looks spread out
   because it's week 4 gets shrunk almost to the league mean. TALENT_SD_MIN/MAX only stop the
   estimate running to zero or to nonsense on a tiny sample.

   Sampling variance per team has two parts: the results half (att^2 × SCORE_SD^2/neff) and the
   baseline-prior half ((1-att)^2 × BASE_NOISE_VAR) — because a hand-typed S.stats[].base is an
   estimate too, and pre-season, when att is 0, it is the ONLY thing in the projection. */
function formReliability(ids, form){
  const rows=ids.filter(t=>form[t]);
  if(!rows.length) return {mu:50, tau2:MODEL.TALENT_SD_MIN*MODEL.TALENT_SD_MIN, r:{}};
  const mu=rows.reduce((s,t)=>s+form[t].proj,0)/rows.length;
  const varObs=rows.reduce((s,t)=>s+Math.pow(form[t].proj-mu,2),0)/rows.length;
  const noiseOf=t=>{
    const f=form[t], a=f.att;
    const res=f.neff>0 ? (MODEL.SCORE_SD*MODEL.SCORE_SD)/f.neff : 0;
    return a*a*res + (1-a)*(1-a)*MODEL.BASE_NOISE_VAR;
  };
  const meanNoise=rows.reduce((s,t)=>s+noiseOf(t),0)/rows.length;
  const lo=MODEL.TALENT_SD_MIN*MODEL.TALENT_SD_MIN, hi=MODEL.TALENT_SD_MAX*MODEL.TALENT_SD_MAX;
  const tau2=Math.max(lo, Math.min(hi, varObs-meanNoise));
  const r={};
  rows.forEach(t=>{ const nv=noiseOf(t); r[t]=nv>0?tau2/(tau2+nv):1; });
  return {mu, tau2, r, varObs, meanNoise};
}

// FPL's own status letters: a=available, d=doubtful, i=injured, s=suspended, u=unavailable (left
// the league / not registered), n=on loan or otherwise ineligible.
const FPL_AVAIL = {a:1, d:0.6, i:0, s:0, u:0, n:0};
// chance_of_playing_this_round (0/25/50/75/100, or null when FPL has nothing to say) is a far
// finer signal than the letter alone — a 75% doubt and a 25% doubt both just read as 'd'. When
// it's present it wins; the letter is the fallback. A hard-unavailable status zeroes the player
// out regardless of a stale chance figure, because those two disagreeing means the chance figure
// is the out-of-date one.
function playerAvailability(p){
  const st=(p&&p.st)||'a';
  if(st==='i'||st==='s'||st==='u'||st==='n') return 0;
  const cp=(p&&p.cp!=null)?Number(p.cp):null;
  if(cp!=null && !isNaN(cp)) return Math.max(0, Math.min(1, cp/100));
  return FPL_AVAIL[st]!=null?FPL_AVAIL[st]:1;
}
// Rotation risk, the cheap way. There is no per-gameweek minutes history in bootstrap-static (only
// a season total) and fetching it per player would be ~180 extra API calls in both the browser and
// the Action — explicitly out of scope. Instead: the largest season-minutes figure across the whole
// ingested player set belongs to a virtually ever-present player, so maxMinutes/90 is a good read
// on how many league games have actually been played, and each player's own share of that is their
// rotation profile. Returns games:0 pre-season (or if minutes were never ingested), which switches
// the whole adjustment off rather than guessing.
function squadMinutesContext(state){
  const P=(state&&state.fpl&&state.fpl.players)||{};
  let max=0; Object.keys(P).forEach(k=>{ const m=Number(P[k]&&P[k].mn)||0; if(m>max) max=m; });
  return {maxMinutes:max, games: max>0?Math.max(1,Math.round(max/90)):0};
}
function playerStartShare(p, ctx){
  if(!ctx||!ctx.games) return 1;
  const mn=Number(p&&p.mn)||0;
  return Math.max(MODEL.MIN_MINUTES_SHARE, Math.min(1, mn/(90*ctx.games)));
}
// (c) FIXTURE DIFFICULTY. clubFixture() (batch 29) resolves a real-world club id + gameweek to that
// club's actual PL fixture and its 1-5 rating. 3 is neutral; each point easier/harder moves the
// player's expected haul by FDR_SENS (so a 1 is +15%, a 5 is -15%). A blank gameweek is a genuine
// zero — the player cannot score — and a double is worth DOUBLE_MULT, not 2, because nobody plays
// 90 minutes twice in four days. Purely numeric: no real-world club is named anywhere in here.
function playerFixtureMult(club, ev){
  if(!ev) return 1;
  const fx=clubFixture(club, ev);
  if(!fx) return 0;
  let m=1+(3-(Number(fx.fdr)||3))*MODEL.FDR_SENS;
  if(fx.count>1) m*=MODEL.DOUBLE_MULT;
  return Math.max(0.5, m);
}
// (b) SQUAD STRENGTH — expected points for the 11 who'll actually play, and after batch 52 the
// PRIMARY input to the whole model. Each owned player's baseline blends `ppg` (season mean — the
// stable estimate of how good this player actually is) with FPL `form` (mean points per game over
// the last 30 days — the volatile recency signal), then multiplies by availability, minutes share
// and fixture difficulty. Batch 52 flipped FORM_BLEND from 0.65 to 0.30 on Dan's explicit
// instruction: a four-game hot streak is a much worse guide to next week than a season's scoring
// rate is, and the same logic applies to a player as to a manager. `form` keeps a real 30% share
// because it does carry genuinely new information a season average can't — a player who has just
// moved into the XI, onto penalties, or into a new role.
// If a published lineup exists we price that XI; otherwise we take the best 11 by expected points,
// which is what a rational manager does with exactly this information.
// Returns null when this manager has no squad data at all, so the caller can fall back cleanly.
function squadExpected(state, tid, ev){
  const P=(state&&state.fpl&&state.fpl.players)||{};
  const ids=squadIds(tid);
  if(!ids.length) return null;
  const ctx=squadMinutesContext(state);
  const haveFx=ev?plFixturesFor(ev).length>0:false;
  const named=new Set(lineupIds(tid).map(Number));
  const rows=ids.map(id=>{
    const p=P[id]||P[String(id)]; if(!p) return null;
    const form=Number(p.f)||0, ppg=Number(p.ppg)||0;
    const basePts=form>0 ? MODEL.FORM_BLEND*form+(1-MODEL.FORM_BLEND)*ppg : ppg;
    const av=playerAvailability(p);
    const fm=haveFx?playerFixtureMult(Number(p.t)||0, ev):1;
    return {id:Number(id), xp:Math.max(0, basePts*av*playerStartShare(p,ctx)*fm), av};
  }).filter(Boolean);
  if(!rows.length) return null;
  const namedRows=rows.filter(r=>named.has(r.id));
  const xi = namedRows.length>=MODEL.XI ? namedRows
           : rows.slice().sort((a,b)=>b.xp-a.xp).slice(0,MODEL.XI);
  return {xp: xi.reduce((s,r)=>s+r.xp,0), n: xi.length, squadSize: rows.length,
          doubts: rows.filter(r=>r.av>0&&r.av<1).length, out: rows.filter(r=>r.av===0).length};
}

/* (d) THE PROJECTION — rewritten in batch 52. Every team starts at the LEAGUE's own scoring level
   and is then moved off it by a single blended deviation, in points:

       dev = ( SQUAD_W × squadDev  +  FORM_W × formDev ) / (SQUAD_W + FORM_W)

   squadDev = (this XI's strength relative to the league's average XI − 1) × SQUAD_TRANSFER × level.
   formDev  = (this team's recency-weighted form level − the league's) × its empirical-Bayes
              reliability from formReliability().

   Three things changed from batch 48 and each of them matters:

   * BLEND, DON'T MULTIPLY. Batch 48 did proj = formProj × (1 + SQUAD_W×(rel−1)). Form and squad
     quality are the same information twice over — a good squad is WHY a manager has been scoring —
     so multiplying two positively-correlated signals inflates the spread beyond what either
     justifies. A weighted average of two estimates of the same quantity is the right operation, and
     it is also what makes the squad-over-form ordering Dan asked for expressible at all.

   * SQUAD_TRANSFER. The XI's ppg-sum ratio is a real signal but it is NOT a one-for-one points
     ratio. A squad whose starting eleven sums 15% above the league's average eleven does not score
     15% more: every manager still starts eleven players, Draft scoring has no captaincy multiplier,
     bonus/autosubs land unevenly, and FPL `form`/FDR explain only a modest slice of what a player
     actually returns in any single week. SQUAD_TRANSFER (0.38) is that regression coefficient —
     how much of the apparent edge shows up on the scoreboard — and it is the honest place to put
     that discount rather than hiding it in a clamp.

   * PROJ_DEV_MAX. A final hard rail: no team's projection may sit more than ±14% off the league
     level, however extreme its squad news. A full blank gameweek or a squad with six players out
     will hit it — and should.

   The relative-not-absolute treatment of the squad number is unchanged from batch 48 and still
   right: summing eleven players' FPL points is on a similar-but-not-identical scale to a Draft H2H
   score, so the RATIO to the league mean is trustworthy where the raw total isn't.
   Returns a map of EVERY team id, so callers can compute league-relative things in one pass. */
function projectTeams(state, ev){
  const ids=(state.teams||[]).map(t=>t.id);
  const form={}, sq={};
  ids.forEach(tid=>{ form[tid]=teamFormProj(state,tid,ev); sq[tid]=squadExpected(state,tid,ev); });
  const REL=formReliability(ids, form);
  const level=REL.mu||50;
  // A squad that HAS data but expects ~0 points (a full blank gameweek, or a squad wiped out by
  // injuries) is a real, very weak squad — it must not be mistaken for "no data" and quietly
  // given rel=1. Participation is keyed on the squad object existing, not on it being non-zero.
  const withSq=ids.filter(tid=>sq[tid]);
  const sqMean=withSq.length?withSq.reduce((s,tid)=>s+sq[tid].xp,0)/withSq.length:0;
  const cap=MODEL.PROJ_DEV_MAX*level;
  const out={};
  ids.forEach(tid=>{
    const f=form[tid];
    let rel=1;
    const haveSq=sqMean>0&&!!sq[tid];
    if(haveSq) rel=Math.max(MODEL.SQUAD_REL_MIN, Math.min(MODEL.SQUAD_REL_MAX, sq[tid].xp/sqMean));
    const r=(REL.r&&REL.r[tid]!=null)?REL.r[tid]:0;
    const devSquad=(rel-1)*MODEL.SQUAD_TRANSFER*level;
    const devForm=(f.proj-level)*r;
    // Weights are renormalised rather than fixed, so a league with no squad data pulled yet still
    // prices off form alone (at full strength) instead of quietly halving every deviation.
    const wS=haveSq?MODEL.SQUAD_W:0, wF=MODEL.FORM_W, wSum=wS+wF;
    const dev=wSum>0?(wS*devSquad+wF*devForm)/wSum:0;
    out[tid]={proj: Math.max(5, level+Math.max(-cap, Math.min(cap, dev))),
              formProj:f.proj, weight:f.weight, n:f.n, squad:sq[tid]||null, squadRel:rel,
              level, formRel:r, devSquad, devForm, dev};
  });
  return out;
}
// Convenience single-team read. Cheap enough to call in a loop (12 teams x ~15 players is a few
// hundred operations) — deliberately not cached, because a stale projection after an odds edit or
// a fresh FPL sync would be a far worse bug than the microseconds it saves.
function teamProj(state, tid, ev){
  const p=projectTeams(state, ev)[tid];
  return p?p.proj:((state.stats&&state.stats[tid]&&state.stats[tid].base)||50);
}

/* Draw probability anchor. A "draw" here is an EXACT tie on fantasy points.
   BATCH 52 — READ THIS BEFORE RE-TUNING. Batch 48 made this the league's own measured tie rate
   blended against a 7%/20-game prior, and it was statistically correct: this league has tied 0 of
   its first 18 matches, the blended rate came out at 3.7%, and a 3.7% outcome priced at a 16.3%
   edge is a 22.7 — which is exactly what every draw in the GW4 screenshot was. Batch 48 flagged the
   consequence and asked Dan to decide. He has: the draw is a house-policy price that lives between
   12 and 16, because a 25.96 draw reads as broken to the people betting it and nobody takes it.
   This function therefore still returns an HONEST estimate of the league's tie rate (the same
   0.07-prior/20-game blend batch 48 used, so the number means what it says and any future batch can
   read it straight); it is fairMatchProbs() that then treats it as a ±DRAW_TILT nudge around the
   house's DRAW_BASE anchor rather than as the price itself. Keeping the estimate honest here and
   the policy visible there is deliberate — the alternative, inflating the prior until the estimate
   itself came out at 7%, would have hidden a business decision inside a statistic.
   Said out loud rather than buried: two normal scores 21 points apart in standard deviation tie
   about 2% of the time, and this league has tied 0 of its first 18, so a 14.0 draw is well short of
   fair. That margin runs in the HOUSE's favour, never against it, and it is the price of a book
   that looks like a book. If the league's real tie rate ever climbs toward 7% it stops being a
   subsidy and becomes close to a fair price on its own terms. */
function leagueDrawRate(state){
  let d=0,n=0;
  const localEvents=new Set((state.gameweeks||[]).filter(g=>g.event&&g.matches.some(m=>m.result)).map(g=>g.event));
  (state.history||[]).forEach(h=>{ if(localEvents.has(h.event)) return; n++; if(h.ap===h.bp) d++; });
  (state.gameweeks||[]).forEach(g=>g.matches.forEach(m=>{ if(!m.result) return; n++; if(m.result.homePts===m.result.awayPts) d++; }));
  return (d + MODEL.DRAW_BASE*MODEL.DRAW_PRIOR_N)/(n + MODEL.DRAW_PRIOR_N);
}

// FAIR home/draw/away probabilities for one H2H fixture in one gameweek. `ev` is the real-world
// FPL event number (gw.event) — pass it, or the squad/fixture half of the model can't engage.
function fairMatchProbs(state, homeId, awayId, ev, projMap){
  const P=projMap||projectTeams(state, ev);
  const a=P[homeId]||{proj:50}, b=P[awayId]||{proj:50};
  const raw=a.proj-b.proj;
  /* Batch 52. The evidence shrink batch 48 applied here has MOVED — it now lives inside
     projectTeams()/formReliability(), where it can be measured from the league's data and applied
     only to the signal that actually needs it (the noisy H2H record), instead of being a single
     hand-picked haircut on the finished gap. Applying it in both places would shrink twice.

     What stays here is different in kind: a soft cap on how wide a book the house is willing to
     publish at all. The model's uncertainty about its OWN gap estimate is large — far larger than
     the gap itself in the first half of a season — so the honest posterior given a heavy-tailed
     prior on the true gap is not the raw estimate but something that saturates: small gaps pass
     through essentially unchanged, big ones are treated as mostly model error, because a 20-point
     projected gap between two 12-team Draft managers almost always is. tanh is the smooth version
     of that (no cliff, no two fixtures pinned to the same boundary price), and GAP_SOFTCAP sets
     where it saturates: ±4.2 points, i.e. the widest H2H book the house will ever print is about
     1.52/2.12, with an ordinary fixture landing near 1.78. That is Dan's stated rail, implemented
     as one named constant rather than smeared across five. */
  const cap=MODEL.GAP_SOFTCAP;
  const D=cap*Math.tanh(raw/cap);
  /* The draw. DRAW_BASE is the house's anchor (see leagueDrawRate for why this is a policy number
     and not an estimate); the league's own measured tie rate is allowed to move it by at most
     ±DRAW_TILT, so a league that genuinely ties a lot shortens its draws and one that never does
     lengthens them — but neither can drag the price out of the 12-16 band Dan asked for. Batch 48
     multiplied the raw estimate by the taper and clamped afterwards, which is why a 20-week season
     with no ties would have pinned every single draw to the band floor.
     Ties then get less likely the further apart the two projections sit. Worth being precise about
     what this taper is: the TRUE exact-tie taper has scale SD_DIFF (~21), and over the ±4.2 points
     D can now reach that is a change of under 2% — genuinely almost nothing. DRAW_SPREAD 10 is
     deliberately steeper than the truth so the draw visibly lengthens on a lopsided fixture, which
     is what Dan asked for and what a bettor expects to see; the whole effect is ~1.5 points of odds
     and it moves in the house's favour, so nothing rides on it beyond feel. */
  const anchor=Math.max(MODEL.DRAW_BASE*(1-MODEL.DRAW_TILT),
               Math.min(MODEL.DRAW_BASE*(1+MODEL.DRAW_TILT), leagueDrawRate(state)));
  const pD=Math.max(MODEL.DRAW_P_MIN, Math.min(MODEL.DRAW_P_MAX,
            anchor*Math.exp(-Math.pow(D/MODEL.DRAW_SPREAD,2)/2)));
  // phi() is the logistic approximation to the standard normal CDF already used throughout this
  // file; D/SD_DIFF is the difference expressed in standard deviations, so this is just
  // P(home outscores away) under two normal scores — no new stats primitive invented.
  const pHrel=phi(D/SD_DIFF);
  return {home:(1-pD)*pHrel, draw:pD, away:(1-pD)*(1-pHrel),
          diff:D, rawDiff:raw, shrink:(raw?D/raw:1), projHome:a.proj, projAway:b.proj};
}

/* HOUSE COMPETITIVENESS — S.settings.oddsCompetitiveness, integer 1-20, default 10.
   Do NOT confuse this with algoEdgePct/accaEdgeByLegs: those are the Algo's own discount applied
   on top of prices that are ALREADY published (batches 31/35/44/45). This is the overround baked
   INTO the published price in the first place.
   Prices are published at fair × (1 - edge/100), so `edge` is literally the house's expected margin
   on turnover, and the book's overround is 1/(1-edge) - 1.
   The curve is anchored on three points, linear between them:
     20 → 10.0%  The user's hard rule: the house never runs thinner than a 10% margin, whatever the
                 slider says. Clamped below as well as anchored, so no input can breach it.
     10 → 16.3%  "Normal", and not a guess: it is exactly the margin implied by the user's own
                 worked example of a close game. 1.8/1.8/12 is a book of 1.194, i.e. a 16.3% margin;
                 their uneven example 1.6/2.0/12 is a book of 1.208, i.e. 17.2%. Setting MID to the
                 lower of the two reproduces BOTH examples to within a penny (see the calibration
                 assertions) and errs, where they disagree, on the punter-friendly side.
      1 → 28.0%  Worst-for-punters, deliberately capped there rather than higher. At 28% an even
                 match pays 1.54 and a 7% draw pays 10.2 — visibly poor value but still a bet.
                 Past ~30% the numbers stop reading as odds at all (an evens shot under 1.4) and
                 people simply stop playing, which costs the house more turnover than the extra
                 margin earns. 28% is roughly where a real bookmaker's worst market (a 20-runner
                 outright) sits, so it's the sane end of "bad", not a punitive fantasy number. */
const ODDS_EDGE = {MIN:10, MID:16.3, MAX:28};
function houseEdgePct(settings){
  let s=Math.round(Number(settings&&settings.oddsCompetitiveness));
  if(isNaN(s)) s=DEFAULT_SETTINGS.oddsCompetitiveness;
  s=Math.max(1,Math.min(20,s));
  const e = s<=10 ? ODDS_EDGE.MAX-(s-1)*(ODDS_EDGE.MAX-ODDS_EDGE.MID)/9
                  : ODDS_EDGE.MID-(s-10)*(ODDS_EDGE.MID-ODDS_EDGE.MIN)/10;
  return Math.max(ODDS_EDGE.MIN, Math.min(ODDS_EDGE.MAX, Math.round(e*10)/10));
}

// The published recommendation for one fixture. `ev` (gw.event) is optional but strongly wanted —
// without it the squad/FDR half of the model sits out and this degrades to recency-weighted form
// only. All five call sites pass it.
function recOdds(state, homeId, awayId, ev, projMap){
  const p=fairMatchProbs(state, homeId, awayId, ev, projMap);
  const edge=houseEdgePct(state.settings);
  return {home:edgedOdds(p.home,edge), draw:edgedOdds(p.draw,edge), away:edgedOdds(p.away,edge)};
}

/* ================================================================
   BATCH 52 — "WHY THESE ODDS?"  (matchPricingRationale)
   ================================================================
   Pure, no DOM, no side effects: hand it a gameweek + match and it returns a headline plus two or
   three plain-English bullets built from the SAME numbers that actually moved that fixture's price.
   Nothing here is decorative — every bullet is generated from a real measured factor and each one
   has to clear its own threshold to be included at all. If a squad has no injuries, no bullet
   claims it does; if the two sides' fixtures are level, no bullet says one has it easier; if no
   squad data has been synced, it says exactly that instead of inventing reasons.
   Each candidate carries a weight so the most load-bearing factors are the ones that get shown,
   and the last bullet is always an honest summary of how firm the price is — including, when it
   applies, the fact that a big recent-results gap is deliberately NOT being believed yet.
   Reads the same global-backed squad helpers (squadSummary/squadPlayers/squadTopScorers/
   clubFixture) the squad viewer uses, so what a player reads here always matches what they see
   when they click through to the squads. */
function matchPricingRationale(state, gwId, matchId){
  const g=(state.gameweeks||[]).find(x=>x.id===gwId);
  if(!g) return null;
  const m=(g.matches||[]).find(x=>x.id===matchId);
  if(!m||!m.home||!m.away) return null;
  const ev=g.event||null;
  const PJ=projectTeams(state, ev);
  const pr=fairMatchProbs(state, m.home, m.away, ev, PJ);
  const nmOf=tid=>{ const t=team(tid); return t?t.name:'?'; };
  const ready=(typeof hasSquadData==='function')&&hasSquadData();
  const sums=ready?{[m.home]:squadSummary(m.home,ev), [m.away]:squadSummary(m.away,ev)}:null;
  const facts=[];
  const push=(w,text)=>{ if(text) facts.push({w, text}); };

  // ---- 1. real-world fixture difficulty, the factor Dan's own worked example leads with ----
  if(sums&&sums[m.home].avgFdr&&sums[m.away].avgFdr){
    const dh=sums[m.home].avgFdr, da=sums[m.away].avgFdr, gap=da-dh;
    if(Math.abs(gap)>=0.4){
      const kind=gap>0?m.home:m.away, tough=gap>0?m.away:m.home;
      const kf=(kind===m.home?dh:da), tf=(tough===m.home?dh:da);
      push(2.4*Math.abs(gap),
        `${nmOf(kind)} have much the kinder week of real-life fixtures — their likely XI averages `+
        `${kf.toFixed(1)}/5 for difficulty against ${nmOf(tough)}'s ${tf.toFixed(1)}/5.`);
    }
  }
  // ---- 2. blank gameweeks — a player with no fixture simply cannot score ----
  if(sums){
    [m.home,m.away].forEach(tid=>{
      const b=sums[tid].blanks;
      if(b>=2) push(0.9*b, `${nmOf(tid)} have ${b} players with no real-life fixture at all this gameweek, so that's ${b} slots that can't score.`);
    });
  }
  // ---- 3. injuries and doubts, naming the standout absentee rather than just counting ----
  if(sums){
    [m.home,m.away].forEach(tid=>{
      const ps=sums[tid].players||[];
      const gone=ps.filter(p=>p.status==='i'||p.status==='s'||p.status==='u'||p.status==='n');
      const iffy=ps.filter(p=>p.status==='d');
      if(!gone.length&&!iffy.length) return;
      const head=gone.slice().sort((a,b)=>b.pts-a.pts)[0];
      const isTalisman=head&&squadTopScorers(ps).has(head.id);
      const bits=[];
      if(gone.length) bits.push(`${gone.length} player${gone.length===1?'':'s'} out injured or suspended`);
      if(iffy.length) bits.push(`${gone.length?'another ':''}${iffy.length} carrying a fitness doubt`);
      let t=`${nmOf(tid)} have ${bits.join(' and ')}`;
      t += head ? ` — ${head.name}${isTalisman?', their highest scorer this season,':''} is unavailable.` : '.';
      push(1.1*gone.length+0.5*iffy.length, t);
    });
  }
  // ---- 4. the crowned top scorer walking into a hard fixture ----
  if(sums){
    [m.home,m.away].forEach(tid=>{
      const ps=sums[tid].players||[];
      const tops=squadTopScorers(ps);
      ps.filter(p=>tops.has(p.id)&&(!p.status||p.status==='a')).forEach(p=>{
        if(p.fx&&p.fx.fdr>=4)
          push(1.4, `${nmOf(tid)}'s highest scorer ${p.name} has a hard one — ${p.fx.home?'home to':'away at'} ${p.fx.oppName}, rated ${p.fx.fdr}/5.`);
        else if(!p.fx)
          push(1.5, `${nmOf(tid)}'s highest scorer ${p.name} has no fixture this gameweek and scores nothing.`);
      });
    });
  }
  // ---- 5. overall squad strength, the model's primary signal ----
  const rh=PJ[m.home]&&PJ[m.home].squadRel, ra=PJ[m.away]&&PJ[m.away].squadRel;
  if(ready&&rh!=null&&ra!=null&&Math.abs(rh-ra)>=0.05){
    const strong=rh>ra?m.home:m.away, weak=rh>ra?m.away:m.home;
    const sp=Math.round(((rh>ra?rh:ra)-1)*100), wp=Math.round(((rh>ra?ra:rh)-1)*100);
    push(3.0*Math.abs(rh-ra)*10,
      `On the players they actually hold, ${nmOf(strong)}'s likely eleven rates ${sp>0?'+':''}${sp}% against the league average and ${nmOf(weak)}'s ${wp>0?'+':''}${wp}% — squad quality is what the model leans on hardest.`);
  }
  // ---- 6. recent results, reported honestly INCLUDING how little they're being believed ----
  const rec=tid=>{
    const rs=teamResults(state,tid,ev).slice(0,3);
    return rs.length?{n:rs.length, avg:rs.reduce((s,r)=>s+(Number(r.pts)||0),0)/rs.length}:null;
  };
  const fh=rec(m.home), fa=rec(m.away);
  if(fh&&fa&&Math.abs(fh.avg-fa.avg)>=5){
    const hot=fh.avg>fa.avg?m.home:m.away, cold=fh.avg>fa.avg?m.away:m.home;
    const hv=Math.max(fh.avg,fa.avg), cv=Math.min(fh.avg,fa.avg);
    const rel=(PJ[hot]&&PJ[hot].formRel!=null)?PJ[hot].formRel:0;
    const weak=rel<0.35 && Math.min(fh.n,fa.n)<8;
    push(weak?0.8:1.6,
      `${nmOf(hot)} have been scoring more lately (${hv.toFixed(0)} a week against ${nmOf(cold)}'s ${cv.toFixed(0)} over the last ${Math.min(fh.n,fa.n)})`+
      (weak?` — but on only ${Math.min(fh.n,fa.n)} game${Math.min(fh.n,fa.n)===1?'':'s'} that's mostly luck, so it barely moves the price.`:`, and with enough games behind it that counts.`));
  }
  if(!ready) push(5, `No squad data has been synced yet, so this price is coming off results and hand-set baselines alone — it will sharpen once Back Office pulls the squads in.`);

  facts.sort((a,b)=>b.w-a.w);
  const bullets=facts.slice(0,3).map(f=>f.text);
  // The closing line is always true by construction: it is read straight off the priced gap.
  const gap=Math.abs(pr.projHome-pr.projAway);
  const lead=pr.projHome>pr.projAway?m.home:m.away;
  if(gap<0.75) bullets.push(`Net of all that the two project within a point of each other, which is why the price is close to even.`);
  else bullets.push(`It all nets out to about ${gap.toFixed(1)} points in ${nmOf(lead)}'s favour — a real edge, but one big haul from any single player is worth more than that, which is why the price stays close.`);
  const edge=houseEdgePct(state.settings);
  return {headline:`${nmOf(m.home)} v ${nmOf(m.away)}`, bullets,
          projHome:pr.projHome, projAway:pr.projAway, edge,
          odds:{home:edgedOdds(pr.home,edge), draw:edgedOdds(pr.draw,edge), away:edgedOdds(pr.away,edge)},
          hasSquads:!!ready};
}

// P(this team posts the highest score of anyone in the gameweek), done properly instead of the old
// softmax-of-averages (exp(0.12*avg), which had no probabilistic meaning and ignored how spread out
// the field was). Treat every team's score as normal(proj, SD) and integrate the density of team i
// against the probability that every other team came in below it — one numeric sweep prices the
// whole field at once. `sign` = -1 flips the axis to price bottom score with the identical maths.
function extremeScoreProbs(projs, sign){
  const mus=projs.map(m=>sign*m);
  if(!mus.length) return [];
  const lo=Math.min.apply(null,mus)-4*SD, hi=Math.max.apply(null,mus)+4*SD, steps=160, h=(hi-lo)/steps;
  const out=mus.map(()=>0);
  const dens=(x,mu)=>Math.exp(-Math.pow((x-mu)/SD,2)/2)/(SD*Math.sqrt(2*Math.PI));
  for(let k=0;k<=steps;k++){
    const x=lo+k*h, wt=(k===0||k===steps)?0.5:1;   // trapezium rule
    const cdf=mus.map(mu=>Math.min(1-1e-9, Math.max(1e-9, phi((x-mu)/SD))));
    let prod=1; for(let i=0;i<cdf.length;i++) prod*=cdf[i];
    for(let i=0;i<mus.length;i++) out[i]+=wt*h*dens(x,mus[i])*(prod/cdf[i]);
  }
  const tot=out.reduce((a,b)=>a+b,0);
  return tot>0?out.map(v=>v/tot):out.map(()=>1/out.length);
}
// Batch 31: replaces the old linear "margin scales with leg count" formula
// (1-(marginPct/100)*n) with a flat per-leg-count edge looked up from settings.accaEdgeByLegs —
// e.g. raw combined odds 11 on a 3-fold with a 10% edge set for 3-fold specifically → 11*(1-0.10)
// = 9.9, no multiplication by leg count baked in (the table already varies by leg count).
// Single-leg bets (n<=1) are untouched, matching the old behavior — combinedOdds() was never
// applied to a lone leg anyway (see slipOdds()'s length===1 shortcut), single-leg odds are priced
// at the point level elsewhere.
function accaFactor(n, settings){
  if(n<=1) return 1;
  const table=(settings&&settings.accaEdgeByLegs)||DEFAULT_SETTINGS.accaEdgeByLegs;
  const idx=Math.min(Math.max(Math.round(n),1),10);
  const pct=table[idx]!=null ? table[idx] : 0;
  return Math.max(.05, 1-pct/100);
}
function combinedOdds(legOdds, settings){
  const base=legOdds.reduce((a,b)=>a*b,1);
  return Math.max(1.01, base*accaFactor(legOdds.length, settings));
}
function betLimitFlags(stake, potential, settings){
  const f=[];
  if(stake>settings.maxStake) f.push('Stake over £'+settings.maxStake+' house limit');
  if(potential>settings.maxPayout) f.push('Payout over £'+settings.maxPayout+' house limit');
  return f;
}
function evalLeg(leg, g){
  if(leg.type==='match'){
    const m=g.matches.find(m=>m.id===leg.matchId);
    if(!m||!m.result) return null;
    const r=m.result.homePts===m.result.awayPts?'draw':(m.result.homePts>m.result.awayPts?'home':'away');
    return r===leg.pick?'won':'lost';
  }
  const findPts = tid => {
    const m=g.matches.find(m=>m.home===tid||m.away===tid);
    if(!m||!m.result) return null;
    return m.home===tid? m.result.homePts : m.result.awayPts;
  };
  if(leg.kind==='team_pts'){
    const pts=findPts(leg.teamId); if(pts===null) return null;
    return (leg.dir==='over'? pts>leg.line : pts<leg.line) ? 'won':'lost';
  }
  if(leg.kind==='haul'){
    const pts=findPts(leg.teamId); if(pts===null) return null;
    return pts>=leg.line?'won':'lost';
  }
  if(leg.kind==='match_total'){
    const m=g.matches.find(m=>m.id===leg.matchId);
    if(!m||!m.result) return null;
    const tot=m.result.homePts+m.result.awayPts;
    return (leg.dir==='over'? tot>leg.line : tot<leg.line)?'won':'lost';
  }
  if(leg.kind==='top_score'){
    const played=g.matches.filter(m=>m.home&&m.away);
    if(played.some(m=>!m.result)) return null;
    const scores=[];
    played.forEach(m=>{scores.push([m.home,m.result.homePts]);scores.push([m.away,m.result.awayPts]);});
    const max=Math.max(...scores.map(s=>s[1]));
    const top=scores.filter(s=>s[1]===max);
    if(top.length>1) return top.some(s=>s[0]===leg.teamId)?'void':'lost';
    return top[0][0]===leg.teamId?'won':'lost';
  }
  // Batch 20: bottom_score mirrors top_score exactly, just keyed off the minimum instead of the
  // maximum — backs a team to score the FEWEST points of any team in the gameweek.
  if(leg.kind==='bottom_score'){
    const played=g.matches.filter(m=>m.home&&m.away);
    if(played.some(m=>!m.result)) return null;
    const scores=[];
    played.forEach(m=>{scores.push([m.home,m.result.homePts]);scores.push([m.away,m.result.awayPts]);});
    const min=Math.min(...scores.map(s=>s[1]));
    const bottom=scores.filter(s=>s[1]===min);
    if(bottom.length>1) return bottom.some(s=>s[0]===leg.teamId)?'void':'lost';
    return bottom[0][0]===leg.teamId?'won':'lost';
  }
  return 'void';
}
function settleBet(bet, state){
  const g=state.gameweeks.find(x=>x.id===bet.gwId);
  const evals=bet.legs.map(l=>({odds:l.odds, out:evalLeg(l,g)}));
  if(evals.some(e=>e.out===null)) return null;
  if(evals.some(e=>e.out==='lost')) return {outcome:'lost', payout:0};
  const active=evals.filter(e=>e.out==='won');
  if(active.length===0) return {outcome:'void', payout:bet.stake};
  const orig=combinedOdds(bet.legs.map(l=>l.odds), state.settings);
  const recomputed=combinedOdds(active.map(e=>e.odds), state.settings);
  const ratio=bet.effOdds/orig;
  const payout=bet.stake*Math.max(1, recomputed*ratio);
  return {outcome:'won', payout};
}
function computePnl(state){
  const pnl={}; state.teams.forEach(t=>pnl[t.id]=0);
  let house=0;
  state.bets.filter(b=>['won','lost'].includes(b.status)).forEach(b=>{
    // Batch 17: b.stakeCredit is the slice of this bet's stake that a free-bet reward covered —
    // that portion was never the player's own money, so it doesn't count against their P&L (on
    // a loss they only lose what they actually risked; on a win the "free" slice adds straight to
    // profit). Defaults to 0/undefined for every bet placed before this batch — no behavior change
    // for them.
    const ownStake=b.stake-(b.stakeCredit||0);
    const p=b.status==='won'?(b.settledPayout-ownStake):-ownStake;
    pnl[b.teamId]+=p; house-=p;
  });
  return {pnl, house};
}
/* Batch 11: personal P&L/activity breakdown for one team, used by vHome() to give every viewer
   (players AND admins — admins are players too, on top of the house-wide figures they already see)
   a richer personal card instead of just the flat "My P&L" number.
   Note: gameweeks have no explicit "opened at" timestamp in this data model, so "amount wagered
   this week" is interpreted as stake on bets tied to a currently-open gameweek (status==='open')
   — i.e. bets placed within that gameweek's live betting window — rather than a rolling 7-day clock. */
function personalStats(state, teamId){
  const {pnl}=computePnl(state);
  const mine=state.bets.filter(b=>b.teamId===teamId);
  const settled=mine.filter(b=>['won','lost'].includes(b.status));
  const wins=settled.filter(b=>b.status==='won').length;
  const losses=settled.length-wins;
  const openGwIds=new Set(state.gameweeks.filter(g=>g.status==='open').map(g=>g.id));
  const wageredThisWeek=mine
    .filter(b=>openGwIds.has(b.gwId)&&!['cancelled','rejected','expired'].includes(b.status))
    .reduce((s,b)=>s+b.stake,0);
  const openBets=mine.filter(b=>['pending','accepted'].includes(b.status));
  const potentialWinnings=openBets.reduce((s,b)=>s+b.stake*b.effOdds,0);
  return {pnl:pnl[teamId]||0, wins, losses, wageredThisWeek, potentialWinnings, openCount:openBets.length};
}
/* Batch 16: tiny inline-SVG sparkline of cumulative P&L across a team's settled bet history,
   used by the home-page "My P&L breakdown" card's expand-in-place toggle. No charting library —
   just a hand-built polyline over normalized points. Returns '' when there's fewer than 2 settled
   bets to plot (nothing meaningful to show a trend for). Net-per-bet math mirrors computePnl(). */
function pnlSparklineSvg(teamId){
  const settled=S.bets.filter(b=>b.teamId===teamId&&['won','lost'].includes(b.status))
    .sort((a,b)=>(a.settledAt||a.placedAt)-(b.settledAt||b.placedAt));
  if(settled.length<2) return '';
  let running=0;
  const pts=settled.map(b=>{ running+=(b.status==='won'?(b.settledPayout-b.stake):-b.stake); return running; });
  const min=Math.min(0,...pts), max=Math.max(0,...pts);
  const range=(max-min)||1;
  const W=280,H=56,PAD=4;
  const stepX=pts.length>1?(W-2*PAD)/(pts.length-1):0;
  const yFor=v=>H-PAD-((v-min)/range)*(H-2*PAD);
  const zeroY=yFor(0).toFixed(1);
  const path=pts.map((v,i)=>`${i===0?'M':'L'}${(PAD+i*stepX).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
  const last=pts[pts.length-1];
  const color=last>=0?'var(--teal)':'var(--pink)';
  const lastX=(PAD+(pts.length-1)*stepX).toFixed(1), lastY=yFor(last).toFixed(1);
  return `<svg class="pnl-spark" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" role="img" aria-label="P&amp;L trend over ${pts.length} settled bets, currently ${GBP(last)}">
    <line x1="${PAD}" y1="${zeroY}" x2="${W-PAD}" y2="${zeroY}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX}" cy="${lastY}" r="3.4" fill="${color}"/>
  </svg>`;
}
// Hand-built inline-SVG bar chart, same "no charting library" convention as the sparkline above
// — used by the Back Office Usage card for the daily-activity trend and hour-of-day histogram.
// Fixed per-bar pixel width (not percentage/preserveAspectRatio-stretched) wrapped in the same
// overflow-x:auto pattern batches 23/25 already use for anything that can run wider than a phone
// screen, rather than squashing bars unreadably thin. `labels`/`values` are parallel arrays;
// `opts.labelEvery` thins x-axis labels for long series (e.g. 30 daily bars) so they don't
// collide. Returns a plain "no data" message rather than an empty/broken chart when every value
// is zero.
function usageBarChartSvg(labels, values, opts){
  opts=opts||{};
  const n=values.length;
  if(!n||!values.some(v=>v>0)) return '<p class="muted small">No data yet.</p>';
  const max=Math.max(1,...values);
  const barW=opts.barW||18, gap=opts.gap||10, H=100, PAD=6, BOTTOM=22;
  const W=PAD*2+n*(barW+gap)-gap;
  const color=opts.color||'var(--teal)';
  const labelEvery=opts.labelEvery||1;
  const bars=values.map((v,i)=>{
    const h=Math.max(v>0?2:0,(v/max)*(H-BOTTOM-PAD));
    const x=PAD+i*(barW+gap);
    const y=H-BOTTOM-h;
    const showLabel=(i%labelEvery===0)||i===n-1;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" rx="2" fill="${color}"><title>${esc(String(labels[i]))}: ${v}</title></rect>`
      +(v>0?`<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="9" fill="var(--text)" text-anchor="middle">${v}</text>`:'')
      +(showLabel?`<text x="${(x+barW/2).toFixed(1)}" y="${H-6}" font-size="9" fill="var(--muted)" text-anchor="middle">${esc(String(labels[i]))}</text>`:'');
  }).join('');
  return `<div style="overflow-x:auto"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Usage bar chart">
    <line x1="${PAD}" y1="${H-BOTTOM}" x2="${W-PAD}" y2="${H-BOTTOM}" stroke="var(--line)" stroke-width="1"/>
    ${bars}
  </svg></div>`;
}
/* Batch 9: scenario-based max exposure (worst/best net house impact), replacing the old flat
   gross sum. Match-winner legs on the same match are correlated (e.g. two players backing
   opposite sides of one match can't both win), so this enumerates every possible home/draw/away
   combination across just the matches actually referenced by a match-winner leg in `bets`, and
   for each combination sums net house P&L (stake collected minus payout owed, using each bet's
   already-agreed effOdds as its full payout on a win — a modelling simplification, not exact
   settlement math i.e. it doesn't reproduce settleBet()'s partial-void combinedOdds recompute).
   Special-market legs (team_pts/haul/match_total/top_score) aren't enumerated combinatorially —
   real-world FPL point correlation is out of scope for this estimate — so they're assumed to ALL
   win (worst-case pass) or ALL lose (best-case pass), independently of the match combination.
   Capped at 12 matches (3^12 ≈ 531k combos, already generous for a single book); beyond that,
   falls back to the fully-correlated bound (as if every bet could win at once) rather than
   attempting an unbounded enumeration — real GWs never realistically approach the cap.
   Returns {worst, best, matchCount, capped}: worst = most negative net (max house liability),
   best = most positive net (max house profit). Both are estimates, not exact figures. */
function computeMaxExposure(bets){
  const EXPOSURE_MATCH_CAP=12;
  const matchIds=[...new Set(bets.flatMap(b=>b.legs.filter(l=>l.type==='match').map(l=>l.matchId)))];
  const n=matchIds.length;
  const totalStake=bets.reduce((s,b)=>s+b.stake,0);
  if(n>EXPOSURE_MATCH_CAP){
    const naiveLiability=bets.reduce((s,b)=>s+b.stake*b.effOdds,0);
    return {worst:totalStake-naiveLiability, best:totalStake, matchCount:n, capped:true};
  }
  const betInfo=bets.map(b=>({
    stake:b.stake, effOdds:b.effOdds,
    picks:b.legs.filter(l=>l.type==='match').map(l=>({matchId:l.matchId, pick:l.pick})),
    hasSpecial:b.legs.some(l=>l.type!=='match')
  }));
  const outcomes=['home','draw','away'];
  const total=Math.pow(3,n);
  let worst=Infinity, best=-Infinity;
  for(let c=0;c<total;c++){
    const resultFor={}; let x=c;
    for(let i=0;i<n;i++){ resultFor[matchIds[i]]=outcomes[x%3]; x=Math.floor(x/3); }
    let worstNet=0, bestNet=0;
    betInfo.forEach(bi=>{
      const matchOk=bi.picks.every(p=>resultFor[p.matchId]===p.pick);
      const winContribution=bi.stake-bi.stake*bi.effOdds;
      worstNet += matchOk ? winContribution : bi.stake; // specials assumed to WIN this pass
      bestNet += (matchOk&&!bi.hasSpecial) ? winContribution : bi.stake; // specials assumed to LOSE this pass
    });
    if(worstNet<worst) worst=worstNet;
    if(bestNet>best) best=bestNet;
  }
  return {worst, best, matchCount:n, capped:false};
}

/* ================================================================
   THE ALGO — random bet generator (copied verbatim from prototype)
   ================================================================ */
// Batch 35, tightened, then re-widened post-launch (2026-08-20): every leg the Algo generates
// must trace back to a price the house has actually published — match win/draw/away odds
// (m.odds) or an offered gw.specialMarkets[] entry — never a fresh line/price invented on the
// fly. Per the latest explicit feedback: (a) each leg's displayed price now mirrors the real
// published price EXACTLY (no per-leg edge discount baked into what's shown — the house edge
// is applied exactly once, to the combined total, same principle as combinedOdds()'s
// accaEdgeByLegs already applies to a manually-built acca); (b) special markets are back in the
// pool — the earlier "match odds only" restriction was a response to real production having
// leftover test "BIG HAUL" markets that looked random, not a rule against special markets
// generally; any market actually sitting in gw.specialMarkets[] is fair game again.
// Fold count: always a 2-10 leg acca (never a single straight bet) — capped in practice by how
// many distinct real fixtures + offered specials exist in the one gameweek Algo draws from.
function genAlgoBet(state, myTeamId){
  // In-play betting is coming soon (batch 4) — Algo only generates pre-match bets for now.
  const gws=state.gameweeks.filter(g=>bettableNow(g)==='pre');
  if(gws.length===0) return null;
  const g=gws[gws.length-1];
  const fixtures=g.matches.filter(m=>m.home&&m.away);
  const offeredSpecials=g.specialMarkets||[];
  if(fixtures.length===0 && offeredSpecials.length===0) return null;
  const edge=state.settings.algoEdgePct;
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const makers=[];
  if(fixtures.length){
    makers.push(()=>{
      const m=rnd(fixtures);
      const picks=['home','home','away','away','draw'];
      const pick=rnd(picks);
      const label= pick==='draw' ? `Draw — ${team(m.home).name} v ${team(m.away).name}` : `${team(pick==='home'?m.home:m.away).name} to WIN v ${team(pick==='home'?m.away:m.home).name}`;
      // Exact published price — promo/week-boost still compose (those ARE the published price
      // for that button), just no separate algo-only discount baked into the leg itself.
      const odds=promoPrice(g.id,m.id,pick) ?? weekBoostPrice(g,m,pick) ?? m.odds[pick];
      return {type:'match', gwId:g.id, matchId:m.id, pick, odds, label};
    });
  }
  if(offeredSpecials.length){
    makers.push(()=>{
      const m=rnd(offeredSpecials);
      return {type:'special', gwId:g.id, marketId:m.id, kind:m.kind, teamId:m.teamId||undefined, matchId:m.matchId||undefined, line:m.line, dir:m.dir, odds:m.odds, label:m.label};
    });
  }
  const n=Math.min(fixtures.length+offeredSpecials.length, rnd([2,2,2,2,3,3,3,4,4,5,6,7,8,9,10]));
  const legs=[]; let guard=0;
  while(legs.length<n && guard++<40){
    const leg=rnd(makers)();
    if(leg.type==='match' && legs.some(l=>l.type==='match'&&l.matchId===leg.matchId)) continue;
    if(leg.type==='special' && legs.some(l=>l.type==='special'&&l.marketId===leg.marketId)) continue;
    // Anti-match-fixing: never generate a leg against the integrity rule for the acting player's own team
    if(myTeamId && slipViolatesIntegrity([leg], myTeamId)) continue;
    legs.push(leg);
  }
  if(legs.length<2) return null; // never offer a single-leg Algo bet
  // The house edge is applied exactly once, here, to the raw combined product — never baked
  // into an individual leg's displayed price.
  const rawProduct=legs.reduce((a,l)=>a*l.odds,1);
  const odds=Math.max(1.05, Math.round(rawProduct*(1-edge/100)*100)/100);
  return {gwId:g.id, legs, odds, n:legs.length};
}

   PROMOS (copied verbatim from prototype)

function promoPrice(gwId, matchId, pick){
  const p=S.promos.find(p=>p.active&&p.gwId===gwId&&p.matchId===matchId&&p.pick===pick);
  return p? p.odds : null;
}
/* ================================================================
   WEEKLY ODDS BOOSTS (batch 36, generalised post-launch 2026-08-20) — admin-set, fixed
   absolute adds, rule-capped by count but no longer restricted to a specific outcome/team.
   Distinct from the random flash-promo mechanic above (S.promos/promoPrice) — that stays
   untouched. Big boost: +2.0 flat, admin's choice of ANY one outcome (home/draw/away) on a
   match — no longer draw-only — capped app-wide to at most MAX_BIG_BOOST_GWS gameweeks
   carrying one at a time (toggleBigBoost). Small boost: +0.1 flat on ANY one team's win
   price that gameweek — no longer restricted to the league leader — one team per gameweek
   (setFavBoost). Both compose with the existing fire-icon/strikethrough display (`btn()` in
   vGwBoard, and the same `boosted` var addMatchLeg()/genAlgoBet() already read) — a boosted
   price is still just an admin-published number, never invented.
   ================================================================ */
const BIG_BOOST_AMT=2.0, SMALL_BOOST_AMT=0.1, MAX_BIG_BOOST_GWS=2;
function weekBoostPrice(g,m,pick){
  if(!g||!m) return null;
  if(m.boostSide===pick) return Math.round((m.odds[pick]+BIG_BOOST_AMT)*100)/100;
  if(g.favBoostTeamId){
    const sideTeam = pick==='home'?m.home:(pick==='away'?m.away:null);
    if(sideTeam && sideTeam===g.favBoostTeamId) return Math.round((m.odds[pick]+SMALL_BOOST_AMT)*100)/100;
  }
  return null;
}
// Big boost (+2.0): admin picks which single outcome on a match carries it (mutually
// exclusive per match — setting a new side clears any previous one on that same match).
function toggleBigBoost(gwId,mId,pick){
  if(!requireAdmin()) return;
  const g=gw(gwId); const m=g&&g.matches.find(x=>x.id===mId); if(!m) return;
  if(m.boostSide===pick){
    m.boostSide=null;
  } else {
    const boostedGws=new Set(S.gameweeks.filter(gg=>gg.matches.some(mm=>mm.boostSide)).map(gg=>gg.id));
    if(!boostedGws.has(gwId) && boostedGws.size>=MAX_BIG_BOOST_GWS){
      toast(`Boost is capped at ${MAX_BIG_BOOST_GWS} gameweeks at once — remove one first`, true); return;
    }
    m.boostSide=pick;
  }
  audit('odds boost', `${g.name}: ${team(m.home)?team(m.home).name:'?'} v ${team(m.away)?team(m.away).name:'?'} → ${m.boostSide?m.boostSide.toUpperCase()+' +2.0':'off'}`);
  save(); render();
}
// Small boost (+0.1): admin picks any one team playing that gameweek — one team per gameweek.
function setFavBoost(gwId,teamId){
  if(!requireAdmin()) return;
  const g=gw(gwId); if(!g) return;
  if(g.favBoostTeamId===teamId){ g.favBoostTeamId=null; audit('team boost', g.name+': cleared'); save(); render(); return; }
  g.favBoostTeamId=teamId;
  audit('team boost', `${g.name}: ${team(teamId)?team(teamId).name:'?'} win +0.1 🔥`);
  save(); render();
}

/* ================================================================
   PROMOTIONS / REWARDS SYSTEM (Batch 17)
   ----------------------------------------------------------------
   NOT to be confused with `S.promos` above — that's the older house-
   wide flash odds-boost mechanic (createPromoForGw/maybeShowPromo,
   one boosted price on one match, admin-triggered per gameweek,
   shown to everyone as a pop-up). This is a completely separate
   system: admin-authored RULES that watch each team's own betting
   activity and grant that team a personal reward when a trigger
   condition is met, replacing the old blanket "booster every 2nd
   bet" mechanic.

   Data model on `S`:
     S.rewardRules  : RewardRule[]
       { id, name, active, trigger, reward, createdAt, createdBy }
       trigger (discriminated on .kind):
         {kind:'stake_rolling', thresholdGBP, windowDays}
           — fires once per full multiple of thresholdGBP that a
             team's summed stake over the trailing windowDays crosses
             (re-fires as they keep betting — see grantReward below).
         {kind:'fold_size', minLegs}
           — fires once per individual bet placed with >= minLegs legs.
         {kind:'odds_threshold', minOdds}
           — fires once per individual bet placed with effOdds >= minOdds.
       reward (discriminated on .kind):
         {kind:'boost', pct}    — grants a {kind:'boost',pct,used} token
         {kind:'freebet', amount} — grants a {kind:'freebet',amount,used} token

     S.rewards[teamId] : RewardToken[]  — the per-team ledger of every
       token ever granted (rule-triggered AND manual), oldest first.
       {id, kind:'boost'|'freebet', pct?|amount?, used, grantedAt,
        ruleId (null for a manual grant), ruleName}
       A boost token is the same {id,pct,used} shape the old ad-hoc
       booster system used — batch 18's tracker widget can read
       `(S.rewards[teamId]||[]).filter(t=>!t.used)` directly.

     S.rewardGrants : Grant[] — idempotency log, one row per
       (ruleId, teamId, eventKey) that has ever paid out, so the same
       qualifying event (the same bet, or the same rolling-stake
       "level") can never grant twice. {id, ruleId, teamId, eventKey,
       rewardId, at}. `ruleId==='manual'` for ad-hoc admin grants.

   Evaluation is called from two places, both idempotent by construction:
     - submitBet(), right after a bet is pushed — checks the placing
       team's rules against that new bet.
     - settleGw(), after settlement — re-checks every team (mainly to
       catch stake_rolling levels; fold_size/odds_threshold need a
       bet in `opts` and are no-ops here).
   ================================================================ */
function rollingStake(teamId, windowDays){
  const cutoff=Date.now()-windowDays*86400000;
  return S.bets.filter(b=>b.teamId===teamId && b.placedAt>=cutoff && !['cancelled','rejected'].includes(b.status))
    .reduce((s,b)=>s+b.stake,0);
}
// Grants one reward token from `rule` to `teamId` for qualifying event `eventKey`, unless that
// exact (ruleId, teamId, eventKey) combination has already been granted — the idempotency check
// that makes rule evaluation safe to re-run freely. `rule` can be a real S.rewardRules entry, or
// a throwaway {id:'manual', name, reward} object for an admin's ad-hoc grant. Returns the new
// token, or null if nothing was granted (already paid out, or an unrecognised reward kind).
function grantReward(teamId, rule, eventKey){
  if(!teamId || !rule || !rule.reward) return null;
  const already=S.rewardGrants.some(gr=>gr.ruleId===rule.id && gr.teamId===teamId && gr.eventKey===eventKey);
  if(already) return null;
  let tok=null;
  if(rule.reward.kind==='boost'){
    tok={id:nid('rwd'), kind:'boost', pct:rule.reward.pct, used:false, grantedAt:Date.now(), ruleId:rule.id==='manual'?null:rule.id, ruleName:rule.name};
  } else if(rule.reward.kind==='freebet'){
    tok={id:nid('rwd'), kind:'freebet', amount:rule.reward.amount, used:false, grantedAt:Date.now(), ruleId:rule.id==='manual'?null:rule.id, ruleName:rule.name};
  } else return null;
  if(!S.rewards[teamId]) S.rewards[teamId]=[];
  S.rewards[teamId].push(tok);
  S.rewardGrants.push({id:nid('grant'), ruleId:rule.id, teamId, eventKey, rewardId:tok.id, at:Date.now()});
  const desc=tok.kind==='boost'?`+${tok.pct}% odds boost`:`£${tok.amount} free bet`;
  pushNotif(teamId,'reward_granted',`🎁 You unlocked a reward — ${desc} (${rule.name})!`);
  audit('reward_grant', `${team(teamId)?team(teamId).name:teamId} — "${rule.name}" — ${desc}`);
  return tok;
}
// Checks every active rule against `teamId`'s recent activity and grants whatever newly
// qualifies. `opts.bet` — pass the just-placed bet so fold_size/odds_threshold rules (which are
// evaluated per-bet) can see it; omit for a activity-only sweep (e.g. from settleGw) where only
// stake_rolling rules (which look at aggregate history, not one bet) can still fire. Returns the
// array of tokens newly granted this call (each already appended to S.rewards/S.rewardGrants).
function evaluatePromoRules(teamId, opts){
  if(!teamId || !S.rewardRules || !S.rewardRules.length) return [];
  opts=opts||{};
  const granted=[];
  S.rewardRules.filter(r=>r.active).forEach(rule=>{
    if(rule.trigger.kind==='fold_size'){
      if(opts.bet && opts.bet.legs.length>=rule.trigger.minLegs){
        const g=grantReward(teamId, rule, 'bet:'+opts.bet.id);
        if(g) granted.push(g);
      }
    } else if(rule.trigger.kind==='odds_threshold'){
      if(opts.bet && opts.bet.effOdds>=rule.trigger.minOdds){
        const g=grantReward(teamId, rule, 'bet:'+opts.bet.id);
        if(g) granted.push(g);
      }
    } else if(rule.trigger.kind==='stake_rolling'){
      const sum=rollingStake(teamId, rule.trigger.windowDays);
      const level=Math.floor(sum/rule.trigger.thresholdGBP);
      for(let L=1; L<=level; L++){
        const g=grantReward(teamId, rule, 'lvl:'+L);
        if(g) granted.push(g);
      }
    }
  });
  return granted;
}
// Admin ad-hoc grant, outside any rule — used by the Promotions tab's "Manual grant" panel.
function manualGrantReward(teamId, kind, val, note){
  const ruleLike={id:'manual', name:note||'Manual grant', reward: kind==='boost'?{kind:'boost',pct:val}:{kind:'freebet',amount:val}};
  return grantReward(teamId, ruleLike, 'manual:'+nid('evt'));
}
// Batch 17 bet-builder integration: the old manual "pick a booster" chip UI is gone (players no
// longer choose) — instead the single best unused reward of each kind is auto-applied at
// placement. Boost: highest % wins (never stacks). Free bet: the largest token that still fits
// fully inside the stake (so a big free bet isn't wasted covering a tiny bet) — capped at the
// stake either way, see placeBet()/submitBet()'s stakeCredit handling.
function autoBoostToken(teamId){
  return (S.rewards[teamId]||[]).filter(t=>t.kind==='boost'&&!t.used).sort((a,b)=>b.pct-a.pct)[0]||null;
}
function autoFreeBetToken(teamId, stake){
  if(!(stake>0)) return null;
  const fits=(S.rewards[teamId]||[]).filter(t=>t.kind==='freebet'&&!t.used&&t.amount<=stake);
  if(fits.length) return fits.sort((a,b)=>b.amount-a.amount)[0];
  return null;
}
// Batch 18: home-page tracker widget data — the team's unused reward tokens (ready to auto-apply
// on their next bet, see autoBoostToken/autoFreeBetToken above) plus progress toward each active
// stake_rolling rule's next threshold. Pure/read-only, no grants happen here (that's
// evaluatePromoRules(), called from submitBet()/settleGw() — this just reports where a team
// currently stands). `into` is how far the team is past the last fully-crossed threshold level
// (so a team that's already crossed a level or two still shows sensible 0-100% progress toward
// the NEXT one, not a number >100%).
function rewardsTrackerData(teamId){
  const tokens=(S.rewards[teamId]||[]).filter(t=>!t.used).slice().sort((a,b)=>b.grantedAt-a.grantedAt);
  const progress=(S.rewardRules||[]).filter(r=>r.active && r.trigger.kind==='stake_rolling').map(rule=>{
    const thr=rule.trigger.thresholdGBP, windowDays=rule.trigger.windowDays;
    const sum=rollingStake(teamId, windowDays);
    const into=sum - Math.floor(sum/thr)*thr;
    const pct=thr>0?Math.min(100,(into/thr)*100):0;
    const rewDesc=rule.reward.kind==='boost'?`+${rule.reward.pct}% odds boost`:`${GBP(rule.reward.amount)} free bet`;
    return {rule, thr, windowDays, into, pct, rewDesc, remaining:Math.max(0,thr-into)};
  });
  return {tokens, progress};
}
function rewardsTrackerWidget(teamId){
  const {tokens,progress}=rewardsTrackerData(teamId);
  if(!tokens.length && !progress.length) return `<div class="card"><h3>🎁 My rewards</h3><p class="muted small">No rewards yet — keep betting and any active house promotions will credit you automatically.</p></div>`;
  return `<div class="card">
    <h3>🎁 My rewards</h3>
    ${tokens.length?`<div class="rwd-tokens">${tokens.map(t=>`
      <div class="rwd-token ${t.kind}">
        <span class="rwd-desc">${t.kind==='boost'?'🚀 +'+t.pct+'% odds boost':'🎟️ '+GBP(t.amount)+' free bet'}</span>
        <span class="muted small">${esc(t.ruleName||'Manual grant')} · ready to use</span>
      </div>`).join('')}</div>`
      :`<p class="muted small">No unused rewards right now.</p>`}
    ${progress.length?`<div style="${tokens.length?'margin-top:14px;padding-top:12px;border-top:1px solid var(--line)':''}">${progress.map(p=>`
      <div class="rwd-progress">
        <div class="rwd-progress-label"><span>${esc(p.rule.name)}</span><span class="muted">${GBP(p.into)} / ${GBP(p.thr)} wagered this ${p.windowDays}d</span></div>
        <div class="rwd-bar"><div class="rwd-bar-fill" style="width:${p.pct}%"></div></div>
        <p class="muted small" style="margin-top:4px">${p.remaining>0?GBP(p.remaining)+' more unlocks '+esc(p.rewDesc):'Threshold hit — reward on its way!'}</p>
      </div>`).join('')}</div>`:''}
  </div>`;
}
