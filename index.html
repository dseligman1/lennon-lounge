<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lennon Lounge">
<meta name="theme-color" content="#0b0014">
<meta name="description" content="Lennon Lounge — private fantasy football betting league">
<title>Lennon Lounge — The Bookies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<!-- Firebase SDK (compat v9) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg0:#0b0014; --bg1:#160026; --bg2:#1f0533;
    --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07); --line:rgba(255,255,255,.10);
    --teal:#00ff87; --cyan:#00d9ff; --pink:#ff2d78; --orange:#ff9d00; --gold:#ffc931; --violet:#9b5cff;
    --text:#f6f2fa; --muted:#a995ba; --danger:#ff4d6d;
    --grad:linear-gradient(135deg,var(--teal),var(--cyan));
    --gradHot:linear-gradient(135deg,var(--pink),var(--orange));
    --gradGold:linear-gradient(135deg,var(--gold),var(--orange));
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);min-height:100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(155,92,255,.22), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(0,217,255,.13), transparent 55%),
      radial-gradient(800px 600px at 50% 110%, rgba(255,45,120,.14), transparent 60%),
      linear-gradient(170deg,var(--bg1),var(--bg0) 70%);
    background-attachment:fixed;
  }
  .display{font-family:'Archivo Black','Inter',sans-serif;letter-spacing:-.5px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
  input,select,textarea{font-family:inherit;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font-size:14px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,255,135,.15)}
  select option{background:var(--bg2)}
  .btn{padding:11px 18px;font-weight:800;font-size:14px;background:var(--grad);color:#00210f;transition:transform .12s,box-shadow .12s,filter .12s;box-shadow:0 4px 18px rgba(0,255,135,.25)}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .btn:active{transform:translateY(0)}
  .btn.hot{background:var(--gradHot);color:#fff;box-shadow:0 4px 18px rgba(255,45,120,.3)}
  .btn.gold{background:var(--gradGold);color:#3a2300;box-shadow:0 4px 18px rgba(255,201,49,.3)}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line);box-shadow:none}
  .btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal);box-shadow:none}
  .btn.danger{background:rgba(255,77,109,.15);color:var(--danger);border:1px solid rgba(255,77,109,.4);box-shadow:none}
  .btn.small{padding:6px 12px;font-size:12px;border-radius:9px}
  .btn.big{padding:15px 26px;font-size:16px;border-radius:14px}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  /* ---------- login ---------- */
  #login{max-width:480px;margin:5vh auto;padding:20px}
  .login-card{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:36px 30px;text-align:center;box-shadow:var(--shadow)}
  .biglogo{font-size:34px;line-height:1.05}
  .biglogo .l1{display:block;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
  .gradtxt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hottxt{background:var(--gradHot);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{color:var(--muted);font-size:13px;margin:10px 0 26px}
  /* ---------- shell ---------- */
  #app{display:none;max-width:1150px;margin:0 auto;padding:0 14px 90px}
  header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;margin:10px 0 16px;background:rgba(15,0,28,.75);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;flex-wrap:wrap}
  .userswitch{display:flex;align-items:center;gap:8px}
  .userswitch select{font-weight:700;max-width:230px}
  .balancechip{font-size:12px;font-weight:800;padding:7px 13px;border-radius:20px;background:var(--card2);border:1px solid var(--line)}
  nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  nav button{position:relative;background:var(--card);border:1px solid var(--line);color:var(--muted);padding:11px 17px;font-weight:800;font-size:13.5px;border-radius:14px;transition:all .15s}
  nav button:hover{color:var(--text);transform:translateY(-1px)}
  nav button.active{background:var(--grad);color:#00210f;border-color:transparent;box-shadow:0 4px 20px rgba(0,255,135,.3)}
  nav button.houseTab{border-color:rgba(255,201,49,.25);color:#d9b25c}
  nav button.houseTab.active{background:var(--gradGold);color:#3a2300;box-shadow:0 4px 20px rgba(255,201,49,.3)}
  nav .badge{position:absolute;top:-7px;right:-7px;background:var(--gradHot);color:#fff;border-radius:11px;padding:2px 8px;font-size:11px;font-weight:900;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  h2{font-size:24px;margin-bottom:6px}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card.glow{border-color:rgba(0,255,135,.3)}
  .grid2{display:grid;grid-template-columns:1fr 370px;gap:18px;align-items:start}
  @media(max-width:880px){.grid2{grid-template-columns:1fr}}
  .muted{color:var(--muted);font-size:13px}
  .small{font-size:12px}
  .mono{font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;padding:9px 8px;border-bottom:1px solid var(--line)}
  td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
  tr:last-child td{border-bottom:none}
  .pos{color:var(--teal);font-weight:800}.neg{color:var(--pink);font-weight:800}
  .hr{border:none;border-top:1px solid var(--line);margin:16px 0}
  details summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:6px 0;color:var(--muted)}
  /* ---------- matches & odds ---------- */
  .gwhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .deadline{font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:20px;background:rgba(255,201,49,.12);color:var(--gold);border:1px solid rgba(255,201,49,.3)}
  .deadline.passed{background:rgba(255,45,120,.12);color:var(--pink);border-color:rgba(255,45,120,.35)}
  .match{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--card2);transition:border-color .15s}
  .match:hover{border-color:rgba(0,255,135,.25)}
  .match .names{font-weight:800;font-size:14.5px}
  .match .names .vs{color:var(--muted);font-weight:600;font-size:12px;padding:0 6px}
  .oddsbtns{display:flex;gap:7px}
  .oddbtn{position:relative;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:8px 12px;min-width:70px;text-align:center;font-size:11px;font-weight:700;transition:all .13s}
  .oddbtn b{display:block;font-size:15px;color:var(--text);margin-top:2px}
  .oddbtn:hover{transform:translateY(-2px);border-color:var(--teal)}
  .oddbtn.sel{background:var(--grad);color:#00210f;border-color:transparent;box-shadow:0 4px 16px rgba(0,255,135,.35)}
  .oddbtn.sel b{color:#00210f}
  .oddbtn.boost{border-color:var(--gold);box-shadow:0 0 14px rgba(255,201,49,.25)}
  .oddbtn .was{text-decoration:line-through;opacity:.55;font-size:10px;margin-right:4px}
  .oddbtn .fire{position:absolute;top:-9px;right:-6px;font-size:14px;filter:drop-shadow(0 0 6px rgba(255,157,0,.8))}
  /* ---------- slip ---------- */
  .slip{position:sticky;top:84px}
  .slipleg{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:8px}
  .x{background:none;color:var(--pink);font-size:17px;font-weight:900;padding:0 4px}
  .bigodds{font-size:26px;font-weight:900}
  /* ---------- pills/status ---------- */
  .pill{display:inline-block;padding:4px 11px;border-radius:14px;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
  .st-pending{background:rgba(255,201,49,.15);color:var(--gold)}
  .st-accepted{background:rgba(0,255,135,.13);color:var(--teal)}
  .st-rejected,.st-expired{background:rgba(255,45,120,.13);color:var(--pink)}
  .st-cancelled{background:var(--card2);color:var(--muted)}
  .st-counter_house,.st-counter_user{background:rgba(0,217,255,.12);color:var(--cyan)}
  .st-won{background:var(--grad);color:#00210f}
  .st-lost{background:var(--gradHot);color:#fff}
  .st-void{background:#444;color:#ddd}
  .flag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:800;margin-left:6px}
  .flag.late{background:var(--gradHot);color:#fff}
  .flag.limit{background:rgba(255,201,49,.2);color:var(--gold);border:1px solid rgba(255,201,49,.4)}
  /* ---------- bet cards ---------- */
  .bet{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:var(--card2)}
  .bet.needsme{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,217,255,.15)}
  .bet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .bet .legs{font-size:13px;margin:8px 0;list-style:none}
  .bet .legs li{padding:5px 0}
  .nums{display:flex;gap:22px;font-size:12px;margin:10px 0;flex-wrap:wrap;color:var(--muted)}
  .nums b{display:block;font-size:15px;color:var(--text);margin-top:2px}
  .chat{background:rgba(0,0,0,.3);border-radius:12px;padding:12px;margin-top:10px;max-height:230px;overflow-y:auto}
  .msg{margin-bottom:9px;font-size:13px}
  .msg .who{font-weight:800;font-size:10.5px;color:var(--muted)}
  .msg.house .who{color:var(--gold)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .counterbox{background:rgba(0,0,0,.3);border-radius:12px;padding:14px;margin-top:10px;display:none}
  .counterbox.open{display:block}
  .formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
  .formrow label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
  textarea{width:100%;min-height:80px}
  /* ---------- section tabs (My Bets / Results) ---------- */
  .sectabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .sectabs button{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:20px;font-weight:800;font-size:12.5px;position:relative}
  .sectabs button.active{background:var(--card2);color:var(--text);border-color:var(--teal)}
  .sectabs .cnt{margin-left:6px;opacity:.7;font-weight:700}
  .sectabs .dotflag{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--gradHot);animation:pulse 1.6s infinite}
  /* ---------- THE ALGO ---------- */
  .algozone{border:1px solid rgba(155,92,255,.35);border-radius:20px;padding:22px;margin-bottom:16px;background:linear-gradient(160deg,rgba(155,92,255,.10),rgba(0,217,255,.05));box-shadow:0 0 30px rgba(155,92,255,.12)}
  .algocard{background:rgba(0,0,0,.35);border:1px solid rgba(155,92,255,.4);border-radius:18px;padding:20px;margin:14px 0;min-height:150px;display:flex;flex-direction:column;justify-content:center;transition:transform .15s}
  .algocard.spinning .roll{animation:rollblur .14s linear infinite}
  @keyframes rollblur{0%{filter:blur(0);transform:translateY(0)}50%{filter:blur(3px);transform:translateY(-7px)}100%{filter:blur(0);transform:translateY(0)}}
  .algoodds{font-size:30px;font-weight:900}
  .algoactions{display:flex;gap:10px;justify-content:center;margin-top:6px}
  /* ---------- overlays ---------- */
  #bosh{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
  #bosh.go{display:flex}
  #bosh .flashbg{position:absolute;inset:0;background:radial-gradient(circle,rgba(0,255,135,.28),transparent 65%);animation:flashin .5s ease-out}
  @keyframes flashin{from{opacity:0}to{opacity:1}}
  #bosh .ball{position:absolute;font-size:90px;animation:kick 1.5s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes kick{0%{transform:translate(-60vw,40vh) rotate(0)}45%{transform:translate(0,-4vh) rotate(540deg) scale(1.25)}60%{transform:translate(4vw,-2vh) rotate(620deg) scale(1.1)}100%{transform:translate(70vw,-45vh) rotate(1080deg) scale(.6);opacity:.3}}
  #bosh .boshtxt{font-family:'Archivo Black',sans-serif;font-size:13vw;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;transform:skew(-8deg);animation:boshpop 1.5s cubic-bezier(.2,1.6,.4,1) forwards;filter:drop-shadow(0 8px 30px rgba(0,255,135,.5))}
  @keyframes boshpop{0%{transform:scale(0) skew(-8deg);opacity:0}30%{transform:scale(1.15) skew(-8deg);opacity:1}55%{transform:scale(1) skew(-8deg)}80%{opacity:1}100%{transform:scale(1.05) skew(-8deg);opacity:0}}
  .confetto{position:absolute;width:10px;height:14px;top:45%;left:50%;opacity:0;animation:conf 1.5s ease-out forwards}
  @keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
  /* promo popup */
  #promoPop{position:fixed;right:18px;bottom:18px;z-index:80;width:320px;display:none;border-radius:20px;padding:2px;background:conic-gradient(from var(--ang,0deg),var(--gold),var(--pink),var(--cyan),var(--gold));animation:spinborder 3s linear infinite, slidein .5s cubic-bezier(.2,1.4,.4,1)}
  @property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
  @keyframes spinborder{to{--ang:360deg}}
  @keyframes slidein{from{transform:translateY(120%)}to{transform:translateY(0)}}
  #promoPop .inner{background:var(--bg2);border-radius:18px;padding:18px}
  #promoPop .ptitle{font-family:'Archivo Black',sans-serif;font-size:18px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--grad);color:#00210f;font-weight:800;padding:13px 24px;border-radius:14px;display:none;z-index:99;box-shadow:var(--shadow);font-size:14px}
  .toast.err{background:var(--gradHot);color:#fff}
  /* ---------- loader / calendar ---------- */
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
  .calgrid .dayhead{text-align:center;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}
  .daychip{padding:9px 0;text-align:center;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
  .daychip:hover{border-color:var(--teal)}
  .daychip.sel{background:var(--grad);color:#00210f;border-color:transparent}
  .daychip.off{opacity:.25;pointer-events:none}
  .timechips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
  .timechip{padding:8px 14px;border-radius:20px;background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:13px;font-weight:800;cursor:pointer}
  .timechip:hover{border-color:var(--teal)}
  .timechip.sel{background:var(--grad);color:#00210f;border-color:transparent}
  .fixrow{display:grid;grid-template-columns:24px 1fr 30px 1fr;gap:8px;align-items:center;margin-bottom:8px}
  .fixrow .num{color:var(--muted);font-weight:800;font-size:12px}
  .fixrow .vsmid{text-align:center;color:var(--muted);font-weight:800;font-size:11px}
  .dropzone{border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:border-color .15s}
  .dropzone:hover{border-color:var(--cyan)}
  .dropzone img{max-width:100%;max-height:260px;border-radius:10px;margin-top:10px}
  .codegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
  .codecard{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px}
  .helpbox{background:rgba(0,217,255,.06);border:1px solid rgba(0,217,255,.22);border-radius:14px;padding:14px;font-size:13px;margin-bottom:16px;color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px}
  .kpi .v{font-size:22px;font-weight:900;margin-top:4px}
  .kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
  /* ---------- topbar ---------- */
  #topbar{position:sticky;top:0;z-index:40;background:rgba(11,0,20,.9);backdrop-filter:blur(18px);margin:0 -14px 18px;padding:8px 14px 0;border-bottom:1px solid var(--line)}
  #topbar header{position:static;background:transparent;border:none;margin:0 0 8px;padding:6px 2px;backdrop-filter:none}
  #topbar nav{margin-bottom:10px}
  .homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;align-items:start}
  .quickrow{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 18px}
  .lr{display:inline-block;min-width:22px;text-align:center;border-radius:8px;font-size:11px;font-weight:900;padding:2px 7px;margin-right:7px}
  .lr.won{background:rgba(0,255,135,.18);color:var(--teal)}
  .lr.lost{background:rgba(255,45,120,.18);color:var(--pink)}
  .lr.pend{background:var(--card2);color:var(--muted)}
  .lr.void{background:#444;color:#ddd}
  .legscore{color:var(--muted);font-size:11px;margin-left:6px}
  .livechip{background:rgba(255,45,120,.15);color:var(--pink);border:1px solid rgba(255,45,120,.4);border-radius:12px;padding:3px 10px;font-size:10.5px;font-weight:900;animation:pulse 1.6s infinite;display:inline-block}
  .chatbox{max-height:280px;overflow-y:auto;background:rgba(0,0,0,.3);border-radius:12px;padding:12px;margin-bottom:10px}
  .chatmsg{margin-bottom:10px;font-size:13px}
  .chatmsg .cwho{font-weight:800;font-size:11px;color:var(--cyan)}
  .chatmsg.h .cwho{color:var(--gold)}
  .chatrow{display:flex;gap:8px}
  .chatrow input{flex:1}
  .warnbox{border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin:10px 0}
  .warnbox.red{background:rgba(255,45,120,.12);color:var(--pink);border:1px solid rgba(255,45,120,.35)}
  .warnbox.amber{background:rgba(255,201,49,.1);color:var(--gold);border:1px solid rgba(255,201,49,.3)}
  /* ---------- Mobile Bottom Nav ---------- */
  #bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(11,0,20,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 4px env(safe-area-inset-bottom);display:none;justify-content:space-around;align-items:center}
  @media(min-width:700px){#bottomNav{display:none!important}}
  @media(max-width:699px){#bottomNav{display:flex}#app{padding-bottom:80px}#topbar nav{display:none}}
  .bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:none;border:none;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;transition:color .15s;position:relative;border-radius:12px}
  .bnav-btn.active{color:var(--teal)}
  .bnav-btn .icon{font-size:20px;line-height:1}
  .bnav-btn .badge{position:absolute;top:2px;right:calc(50% - 18px);background:var(--gradHot);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:900}
  /* ---------- Notification Bell + Panel ---------- */

/* ================================================================

function freshState() {

function migrate(s) {
  ['chat','audit','history'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  if (!s.promos) s.promos = [];
  if (!s.boosters) s.boosters = {};
  if (!s.fpl) s.fpl = {leagueId:'', entryMap:{}, events:{}, lastSync:null};
  if (!s.fplFixtures) s.fplFixtures = {};
  if (!s.sim) s.sim = {holdback:5, events:{}};
  if (s.settings && s.settings.algoEdgePct == null) s.settings.algoEdgePct = 20;
  if (s.settings && s.settings.maxPayout === 1000) s.settings.maxPayout = 10000;
  if (!s.seq) s.seq = 1;

}

function nid(p) { return p + '_' + (S.seq++); }

/* ================================================================
   FIREBASE SAVE / LOAD
   ================================================================ */
let _saveTimer = null;
function save() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    if (!S) return;
    db.ref(ROOT).set(S).catch(e => console.error('Save failed:', e));
  }, 300);
}

function saveNow() {
  if (!S) return Promise.resolve();
  return db.ref(ROOT).set(S);
}

function load() {
  S = freshState();
}

function startListener() {
  if (dbListener) return;
  dbListener = db.ref(ROOT).on('value', snap => {
    const data = snap.val();
    if (!data) {
      S = freshState();
      db.ref(ROOT).set(S);
    } else {
      S = migrate(data);
    }
    if (me) render();
  }, err => {
    toast('Connection error: ' + err.message, true);

}

/* ================================================================
   AUTH — 6-digit PIN
   ================================================================ */
function genPin() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

async function loadAuth() {
  const snap = await db.ref(AUTH_ROOT).once('value');
  const data = snap.val() || {};
  if (Object.keys(data).length === 0) {
    authPins = {};
    TEAMS.forEach(t => { authPins[t.id] = genPin(); });
    await db.ref(AUTH_ROOT).set(authPins);
  } else {
    authPins = data;
  }
}

function getPinFromInputs() {
  return [0,1,2,3,4,5].map(i => {
    const el = document.getElementById('pin'+i);
    return el ? el.value : '';
  }).join('');
}

function doLogin() {
  const selectedChip = document.querySelector('.team-chip.sel');
  if (!selectedChip) { toast('Please select your team first', true); return; }
  const tid = selectedChip.dataset.id;
  const pin = getPinFromInputs();
  if (pin.length !== 6) { toast('Enter your full 6-digit PIN', true); return; }

  // Check if entered PIN matches the target team's PIN
  const correctPin = authPins[tid] === pin;

  // Admin override: admins can access any account with their own PIN
  const adminOverride = TEAMS.filter(t => t.admin).some(t => authPins[t.id] === pin);

  if (correctPin || adminOverride) {
    switchUser(tid);
  } else {
    document.getElementById('loginErr').style.display = 'block';
    [0,1,2,3,4,5].forEach(i => {
      const el = document.getElementById('pin'+i);
      if (el) el.value = '';
    });
    const p0 = document.getElementById('pin0');
    if (p0) p0.focus();
  }
}

function changePin(newPin) {
  if (!me || newPin.length !== 6 || !/^\d{6}$/.test(newPin)) return Promise.reject('Invalid PIN');
  authPins[me.id] = newPin;
  return db.ref(AUTH_ROOT + '/' + me.id).set(newPin);
}

function switchUser(tid) {
  const t = TEAMS.find(x => x.id === tid);
  if (!t) return;
  me = S ? S.teams.find(x => x.id === tid) : null;
  if (!me) me = {id:t.id, name:t.name, owner:t.owner, admin:t.admin};
  sessionStorage.setItem('wlgyl_user', tid);
  slip = []; slipBundles = []; boosterSel = null; algoCurrent = null;
  activeTab = 'home'; myBetsSec = 'auto'; builderSec = 'pre';
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const bn = document.getElementById('bottomNav');
  if (bn) bn.style.display = '';
  startListener();
  if (S) render();
  setTimeout(maybeShowPromo, 900);
}

function logout() {
  if (dbListener) {
    db.ref(ROOT).off('value', dbListener);
    dbListener = null;
  }
  me = null;
  sessionStorage.removeItem('wlgyl_user');
  document.getElementById('login').style.display = '';
  document.getElementById('app').style.display = 'none';
  const bn = document.getElementById('bottomNav');
  if (bn) bn.style.display = 'none';
  closeNotifPanel();
}

/* ================================================================
   HELPERS
   ================================================================ */
const team = id => S && S.teams ? S.teams.find(t=>t.id===id) : TEAMS.find(t=>t.id===id);
const gw = id => S.gameweeks.find(g=>g.id===id);
const GBP = n => (n<0?'-£':'£') + Math.abs(n).toFixed(2);
const fmtOdds = n => Number(n).toFixed(2);
const fmtDT = ts => ts ? new Date(ts).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}) : '—';

function ukOffsetMin(ts){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(ts);
  const g=t=>+p.find(x=>x.type===t).value;
  return (Date.UTC(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'))-ts)/60000;
}
function ukWallToTs(y,mo,d,hh,mm){
  let ts=Date.UTC(y,mo-1,d,hh,mm);
  ts=Date.UTC(y,mo-1,d,hh,mm)-ukOffsetMin(ts)*60000;
  ts=Date.UTC(y,mo-1,d,hh,mm)-ukOffsetMin(ts)*60000;
  return ts;
}
function ukToday(){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(Date.now());
  const g=t=>+p.find(x=>x.type===t).value;
  return {y:g('year'), m:g('month'), d:g('day')};
}
function parseDTLocal(val){
  const m=String(val).match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);
  return m? ukWallToTs(+m[1],+m[2],+m[3],+m[4],+m[5]) : null;
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, err){
  const t=document.getElementById('toast');
  if (!t) return;
  t.textContent=msg; t.className='toast'+(err?' err':''); t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2800);
}
function gwDeadlinePassed(g){ return g.deadline && Date.now()>g.deadline; }
function publishedGws(){ return S.gameweeks.filter(g=>g.status==='open'); }
function bettableNow(g){
  if(g.status!=='open') return null;
  const now=Date.now();
  if(!g.deadline||now<g.deadline) return 'pre';
  if(g.kickoff&&now>=g.kickoff&&(!g.inplayCutoff||now<g.inplayCutoff)) return 'inplay';
  return null;
}
function audit(action, detail){
  S.audit.push({at:Date.now(), by:me?me.id:'system', action, detail:String(detail||'')});
  if(S.audit.length>500) S.audit=S.audit.slice(-500);
}

/* ================================================================
   PRICING & SETTLEMENT ENGINE (pure functions — copied verbatim)
   ================================================================ */
const phi = x => 1/(1+Math.exp(-1.702*x));
function teamAvg(state, tid){
  const base = (state.stats[tid]&&state.stats[tid].base)||50;
  let sum=0,n=0;
  const localEvents=new Set(state.gameweeks.filter(g=>g.event&&g.matches.some(m=>m.result)).map(g=>g.event));
  (state.history||[]).forEach(h=>{
    if(localEvents.has(h.event)) return;
    if(h.a===tid){sum+=h.ap;n++;}
    if(h.b===tid){sum+=h.bp;n++;}
  });
  state.gameweeks.forEach(g=>g.matches.forEach(m=>{
    if(!m.result) return;
    if(m.home===tid){sum+=m.result.homePts;n++;}
    if(m.away===tid){sum+=m.result.awayPts;n++;}
  }));
  return n? (base*2+sum)/(2+n) : base;
}
function recOdds(state, homeId, awayId){
  const dA=teamAvg(state,homeId), dB=teamAvg(state,awayId);
  const pD=0.08;
  const pH=(1-pD)/(1+Math.pow(10,-(dA-dB)/20));
  const pA=1-pD-pH;
  const juice=1.08;
  const o=p=>Math.max(1.05, Math.round((1/(p*juice))*100)/100);
  return {home:o(pH), draw:o(pD), away:o(pA)};
}
function edgedOdds(fairP, edgePct){
  const fair=1/Math.min(.97,Math.max(.03,fairP));
  return Math.max(1.05, Math.round(fair*(1-edgePct/100)*100)/100);
}
function pOver(line, avg){ return 1-phi((line-avg)/SD); }
function accaFactor(n, marginPct){ return n<=1 ? 1 : Math.max(.05, 1-(marginPct/100)*n); }
function combinedOdds(legOdds, marginPct){
  const base=legOdds.reduce((a,b)=>a*b,1);
  return Math.max(1.01, base*accaFactor(legOdds.length, marginPct));
}
function betLimitFlags(stake, potential, settings){
  const f=[];
  if(stake>settings.maxStake) f.push('Stake over £'+settings.maxStake+' house limit');
  if(potential>settings.maxPayout) f.push('Payout over £'+settings.maxPayout+' house limit');
  return f;
}
function evalLeg(leg, g){
  if(leg.type==='match'){
    const m=g.matches.find(m=>m.id===leg.matchId);
    if(!m||!m.result) return null;
    const r=m.result.homePts===m.result.awayPts?'draw':(m.result.homePts>m.result.awayPts?'home':'away');
    return r===leg.pick?'won':'lost';
  }
  const findPts = tid => {
    const m=g.matches.find(m=>m.home===tid||m.away===tid);
    if(!m||!m.result) return null;
    return m.home===tid? m.result.homePts : m.result.awayPts;
  };
  if(leg.kind==='team_pts'){
    const pts=findPts(leg.teamId); if(pts===null) return null;
    return (leg.dir==='over'? pts>leg.line : pts<leg.line) ? 'won':'lost';
  }
  if(leg.kind==='haul'){
    const pts=findPts(leg.teamId); if(pts===null) return null;
    return pts>=leg.line?'won':'lost';
  }
  if(leg.kind==='match_total'){
    const m=g.matches.find(m=>m.id===leg.matchId);
    if(!m||!m.result) return null;
    const tot=m.result.homePts+m.result.awayPts;
    return (leg.dir==='over'? tot>leg.line : tot<leg.line)?'won':'lost';
  }
  if(leg.kind==='top_score'){
    const played=g.matches.filter(m=>m.home&&m.away);
    if(played.some(m=>!m.result)) return null;
    const scores=[];
    played.forEach(m=>{scores.push([m.home,m.result.homePts]);scores.push([m.away,m.result.awayPts]);});
    const max=Math.max(...scores.map(s=>s[1]));
    const top=scores.filter(s=>s[1]===max);
    if(top.length>1) return top.some(s=>s[0]===leg.teamId)?'void':'lost';
    return top[0][0]===leg.teamId?'won':'lost';
  }
  return 'void';
}
function settleBet(bet, state){
  const g=state.gameweeks.find(x=>x.id===bet.gwId);
  const evals=bet.legs.map(l=>({odds:l.odds, out:evalLeg(l,g)}));
  if(evals.some(e=>e.out===null)) return null;
  if(evals.some(e=>e.out==='lost')) return {outcome:'lost', payout:0};
  const active=evals.filter(e=>e.out==='won');
  if(active.length===0) return {outcome:'void', payout:bet.stake};
  const orig=combinedOdds(bet.legs.map(l=>l.odds), state.settings.accaMarginPct);
  const recomputed=combinedOdds(active.map(e=>e.odds), state.settings.accaMarginPct);
  const ratio=bet.effOdds/orig;
  const payout=bet.stake*Math.max(1, recomputed*ratio);
  return {outcome:'won', payout};
}
function computePnl(state){
  const pnl={}; state.teams.forEach(t=>pnl[t.id]=0);
  let house=0;
  state.bets.filter(b=>['won','lost'].includes(b.status)).forEach(b=>{
    const p=b.status==='won'?(b.settledPayout-b.stake):-b.stake;
    pnl[b.teamId]+=p; house-=p;
  });
  return {pnl, house};
}

/* ================================================================
   THE ALGO — random bet generator (copied verbatim from prototype)
   ================================================================ */
function genAlgoBet(state){
  const gws=state.gameweeks.filter(g=>bettableNow(g));
  if(gws.length===0) return null;
  const g=gws[gws.length-1];
  const fixtures=g.matches.filter(m=>m.home&&m.away);
  if(fixtures.length===0) return null;
  const edge=state.settings.algoEdgePct;
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const makers=[
    ()=>{
      const m=rnd(fixtures);
      const picks=['home','home','away','away','draw'];
      const pick=rnd(picks);
      const label= pick==='draw' ? `Draw — ${team(m.home).name} v ${team(m.away).name}` : `${team(pick==='home'?m.home:m.away).name} to WIN v ${team(pick==='home'?m.away:m.home).name}`;
      const board=promoPrice(g.id,m.id,pick) ?? m.odds[pick];
      return {type:'match', gwId:g.id, matchId:m.id, pick, odds:Math.max(1.05, Math.round(board*(1-edge/100)*100)/100), label};
    },
    ()=>{
      const m=rnd(fixtures); const tid=rnd([m.home,m.away]);
      const avg=teamAvg(state,tid);
      const off=rnd([-10,-5,0,5,10,15]);
      const line=Math.round(avg+off)+0.5;
      const dir=rnd(['over','over','under']);
      const p=dir==='over'?pOver(line,avg):1-pOver(line,avg);
      return {type:'special', gwId:g.id, kind:'team_pts', teamId:tid, line, dir,
        odds:edgedOdds(p,edge), label:`${team(tid).name} ${dir.toUpperCase()} ${line} pts`};
    },
    ()=>{
      const m=rnd(fixtures); const tid=rnd([m.home,m.away]);
      const avg=teamAvg(state,tid);
      const line=Math.round(avg*rnd([1.2,1.3,1.45]));
      const p=pOver(line-0.5,avg);
      return {type:'special', gwId:g.id, kind:'haul', teamId:tid, line,
        odds:edgedOdds(p,edge), label:`${team(tid).name} BIG HAUL — ${line}+ pts`};
    },
    ()=>{
      const m=rnd(fixtures);
      const tot=teamAvg(state,m.home)+teamAvg(state,m.away);
      const off=rnd([-12,-6,6,12,20]);
      const line=Math.round(tot+off)+0.5;
      const dir=rnd(['over','under']);
      const p=dir==='over'?1-phi((line-tot)/(SD*1.414)):phi((line-tot)/(SD*1.414));
      return {type:'special', gwId:g.id, kind:'match_total', matchId:m.id, line, dir,
        odds:edgedOdds(p,edge), label:`${team(m.home).name} v ${team(m.away).name} — combined ${dir.toUpperCase()} ${line}`};
    },
    ()=>{
      const tids=[...new Set(fixtures.flatMap(m=>[m.home,m.away]))];
      const ws=tids.map(tid=>({tid,w:Math.exp(0.12*teamAvg(state,tid))}));
      const tot=ws.reduce((s,x)=>s+x.w,0);
      const x=rnd(ws);
      return {type:'special', gwId:g.id, kind:'top_score', teamId:x.tid,
        odds:edgedOdds(x.w/tot,edge), label:`${team(x.tid).name} — TOP SCORE of the week`};
    },
  ];
  const n=rnd([1,1,1,2,2,2,2,3,3,4]);
  const legs=[]; const seen=new Set(); let guard=0;
  while(legs.length<n && guard++<40){
    const leg=rnd(makers)();
    const key=leg.label;
    if(seen.has(key)) continue;
    if(leg.type==='match' && legs.some(l=>l.type==='match'&&l.matchId===leg.matchId)) continue;
    seen.add(key); legs.push(leg);
  }
  const odds=legs.length===1? legs[0].odds : Math.max(1.05, Math.round(legs.reduce((a,l)=>a*l.odds,1)*100)/100);
  return {gwId:g.id, legs, odds, n:legs.length};
}

function promoPrice(gwId, matchId, pick){
  const p=S.promos.find(p=>p.active&&p.gwId===gwId&&p.matchId===matchId&&p.pick===pick);
  return p? p.odds : null;
}
const PROMO_LINES=['🚀 ODDS BOOST!','🔥 SUPER BOOST!','💎 LOUNGE SPECIAL!','⚡ FLASH BOOST!'];
function createPromoForGw(g){
  const fixtures=g.matches.filter(m=>m.home&&m.away);
  if(!fixtures.length) return;
  const m=fixtures[Math.floor(Math.random()*fixtures.length)];
  const pick=['draw','draw','home','away'][Math.floor(Math.random()*4)];
  const pct = pick==='draw' ? 15 : 5;
  const old=m.odds[pick];
  const boosted=Math.round(old*(1+pct/100)*100)/100;
  const who= pick==='draw' ? 'THE DRAW' : team(pick==='home'?m.home:m.away).name.toUpperCase();
  S.promos.push({id:nid('promo'), gwId:g.id, matchId:m.id, pick, pct, oldOdds:old, odds:boosted, active:true,
    title:PROMO_LINES[Math.floor(Math.random()*PROMO_LINES.length)],
    text:`+${pct}% on ${who} in ${team(m.home).name} v ${team(m.away).name} — now ${fmtOdds(boosted)} (was ${fmtOdds(old)})`});
}
function maybeShowPromo(){
  if(!me) return;
  if(me.admin && activeTab!=='builder') return;
  const gws=publishedGws().filter(g=>!gwDeadlinePassed(g)).map(g=>g.id);
  const p=S.promos.find(p=>p.active&&gws.includes(p.gwId)&&!sessionStorage.getItem('seen_'+p.id));
  if(!p) return;
  const el=document.getElementById('promoPop');
  el.innerHTML=`<div class="inner">
    <div class="ptitle hottxt">${esc(p.title)}</div>
    <div style="font-size:13.5px;margin:8px 0 12px">${esc(p.text)}</div>
    <div style="display:flex;gap:8px">

      <button class="btn secondary small" onclick="dismissPromo('${p.id}')">Maybe later</button>
    </div></div>`;
  el.style.display='block';
}
function claimPromo(pid){

  sessionStorage.setItem('seen_'+pid,'1');
  document.getElementById('promoPop').style.display='none';

function dismissPromo(pid){

  document.getElementById('promoPop').style.display='none';
}

async function loadNotifications() {
  if (!me) return [];
  const snap = await db.ref('lennon-lounge-notifs/' + me.id).once('value');
  const data = snap.val();
  return data ? Object.values(data) : [];
}

async function pushNotif(teamId, type, msg) {
  const notif = {id: Date.now()+'_'+Math.random().toString(36).slice(2), type, msg, ts: Date.now(), read: false};
  return db.ref('lennon-lounge-notifs/' + teamId).push(notif);
}

async function markAllRead() {
  if (!me) return;
  const snap = await db.ref('lennon-lounge-notifs/' + me.id).once('value');
  const data = snap.val();
  if (!data) return;
  const updates = {};
  Object.keys(data).forEach(k => { updates[k + '/read'] = true; });
  await db.ref('lennon-lounge-notifs/' + me.id).update(updates);
  renderNotifications();
  const dot = document.getElementById('notifDot');
  if (dot) dot.style.display = 'none';
}

async function renderNotifications() {
  const notifs = await loadNotifications();
  const list = document.getElementById('notifList');
  if (!list) return;
  notifs.sort((a,b) => b.ts - a.ts);
  const unread = notifs.filter(n => !n.read).length;
  const dot = document.getElementById('notifDot');
  if (dot) {
    dot.style.display = unread > 0 ? 'flex' : 'none';
    dot.textContent = unread > 9 ? '9+' : String(unread);
  }
  list.innerHTML = notifs.length === 0
    ? '<div class="muted" style="text-align:center;padding:30px">No notifications yet</div>'
    : notifs.map(n => `<div class="notif-item ${n.read?'':'unread'}">
        <div>${esc(n.msg)}</div>
        <div class="nt">${fmtDT(n.ts)}</div>
      </div>`).join('');
}

function toggleNotifPanel() {
  const panel = document.getElementById('notifPanel');
  const overlay = document.getElementById('notifOverlay');
  const isOpen = panel.classList.contains('open');
  if (isOpen) {
    panel.classList.remove('open');
    overlay.classList.remove('open');
  } else {
    panel.classList.add('open');
    overlay.classList.add('open');
    renderNotifications();
  }
}

function closeNotifPanel() {
  const panel = document.getElementById('notifPanel');
  const overlay = document.getElementById('notifOverlay');
  if (panel) panel.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
}

function spinAlgo(){
  const b=genAlgoBet(S);
  if(!b){ toast('No live gameweek to generate from', true); return; }
  algoCurrent=b; render();
  const card=document.getElementById('algoCard');
  if(card){ card.classList.add('spinning'); setTimeout(()=>{const c=document.getElementById('algoCard');c&&c.classList.remove('spinning');},650); }
}

function acceptAlgo(){
  if(!algoCurrent) return;
  slipBundles.push({gwId:algoCurrent.gwId, legs:algoCurrent.legs.map(l=>({...l})), odds:algoCurrent.odds, stake:algoStakeVal||10});
  algoCurrent=null; render(); toast('Algo bet added to your slip as its own bet ⚡');
}

function placeAlgoBet(){
  if(!algoCurrent) return;
  const stake=parseFloat(document.getElementById('algoStake').value)||0;
  if(stake<S.settings.minStake){ toast('Enter a stake',true); return; }
  algoStakeVal=stake;
  submitBet({gwId:algoCurrent.gwId, legs:algoCurrent.legs.map(l=>({...l})), effOdds:algoCurrent.odds, stake, viaAlgo:true});
  algoCurrent=null;
}

function placeBundle(i){
  const bd=slipBundles[i];
  if(!bd||!(bd.stake>=S.settings.minStake)){ toast('Enter a stake',true); return; }
  if(submitBet({gwId:bd.gwId, legs:bd.legs.map(l=>({...l})), effOdds:bd.odds, stake:bd.stake, viaAlgo:true})) slipBundles.splice(i,1);
}

function submitBet({gwId, legs, effOdds, stake, viaAlgo, boostPct, message}){
  const g=gw(gwId); const mode=bettableNow(g);
  if(!mode){ toast('Betting is closed for '+g.name+' right now', true); render(); return false; }
  const now=Date.now();
  const bet={
    id:nid('bet'), teamId:me.id, gwId, legs, stake, effOdds,
    status:'pending', placedAt:now, inplay:mode==='inplay', afterCutoff:false,
    algo:!!viaAlgo, boostPct:boostPct||0,
    limitFlags:betLimitFlags(stake, stake*effOdds, S.settings),
    history:[{by:me.id, role:'player', action:'placed'+(viaAlgo?' via The Algo':'')+(mode==='inplay'?' (in-play)':''), stake, odds:effOdds, message:message||'', at:now}],
  };
  S.bets.push(bet);
  // Also push to Firebase for concurrent safety
  db.ref(ROOT+'/bets').push(bet).catch(e=>console.error('Bet push error:',e));
  const granted=maybeGrantBooster(me.id);
  // Notify admins
  TEAMS.filter(t=>t.admin&&t.id!==me.id).forEach(t=>{
    pushNotif(t.id,'bet_placed',`${me.name} placed a bet — ${legs.length} leg(s) @ ${fmtOdds(effOdds)} · £${stake}`);
  });
  save(); bosh();
  setTimeout(()=>{ toast(granted?`🎁 Booster unlocked: +${granted}% on a future bet!`:'Bet placed — the house is on it'); go('mybets'); },1200);
  return true;
}

function maybeGrantBooster(tid){
  const n=S.bets.filter(b=>b.teamId===tid).length;
  if(n>=2&&n%2===0){
    const tier=[5,10,15][Math.min(2,n/2-1)];
    if(!S.boosters[tid]) S.boosters[tid]=[];
    S.boosters[tid].push({id:nid('boost'),pct:tier,used:false});
    return tier;
  }
  return 0;
}

/* ---- Slip ---- */
function addMatchLeg(gwId,matchId,pick){
  const g=gw(gwId); const m=g.matches.find(m=>m.id===matchId);
  const i=slip.findIndex(l=>l.type==='match'&&l.matchId===matchId);
  if(i>-1&&slip[i].pick===pick){ slip.splice(i,1); render(); return; }
  const boosted=promoPrice(gwId,matchId,pick);
  const label=pick==='draw'?`Draw — ${team(m.home).name} v ${team(m.away).name}`:`${team(pick==='home'?m.home:m.away).name} to WIN v ${team(pick==='home'?m.away:m.home).name}`;
  const leg={type:'match',gwId,matchId,pick,odds:boosted??m.odds[pick],label:label+(boosted?' 🔥BOOSTED':'')};
  if(i>-1) slip[i]=leg; else slip.push(leg);
  render();
}

function addSpecialLeg(leg){
  slip.push(leg); render();
}

function removeFromSlip(i){ slip.splice(i,1); render(); }

function slipOdds(){
  if(slip.length===0) return 0;
  if(slip.length===1) return slip[0].odds;
  return combinedOdds(slip.map(l=>l.odds),S.settings.accaMarginPct);
}

function selectedBooster(){ return (S.boosters[me.id]||[]).find(t=>t.id===boosterSel&&!t.used)||null; }
function slipOddsFinal(){ const t=selectedBooster(); const o=slipOdds(); return t?Math.round(o*(1+t.pct/100)*100)/100:o; }

function slipContext(){
  const gwIds=[...new Set(slip.map(l=>l.gwId))];
  if(gwIds.length===0) return {ok:false,reason:'empty'};
  if(gwIds.length>1) return {ok:false,reason:'All legs must be in the same gameweek'};
  const g=gw(gwIds[0]); const mode=bettableNow(g);
  if(!mode) return {ok:false,reason:'Betting is closed for '+g.name+' right now'};
  return {ok:true,g,mode};
}

function clearSlip(){ slip=[]; slipBundles=[]; boosterSel=null; render(); }

function vSlip(){
  if(slip.length===0&&slipBundles.length===0) return `<div class="card"><h3>🧾 Bet slip</h3><p class="muted">Tap odds to build your own bet, or fire up The Algo — Algo picks land here as their own ready-to-place bets.</p></div>`;
  let html=`<div class="card glow"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="margin:0">🧾 Bet slip</h3><button class="btn danger small" onclick="clearSlip()">Clear all</button></div>`;
  if(slip.length){
    const eff=slipOddsFinal();
    const stake=parseFloat(document.getElementById('stakeInput')?.value)||0;
    const potential=stake*eff;
    const flags=betLimitFlags(stake,potential,S.settings);
    const ctx=slipContext();
    const toks=(S.boosters[me.id]||[]).filter(t=>!t.used);

function placeBet(){
  const stake=parseFloat(document.getElementById('stakeInput').value);
  if(!stake||stake<S.settings.minStake){ toast('Enter a stake',true); return; }
  const ctx=slipContext();
  if(!ctx.ok){ toast(ctx.reason,true); return; }
  const tok=selectedBooster();
  const eff=slipOddsFinal();
  const msg=document.getElementById('betMsg').value.trim();
  if(submitBet({gwId:ctx.g.id,legs:slip.map(l=>({...l})),effOdds:eff,stake,boostPct:tok?tok.pct:0,message:msg})){
    if(tok) tok.used=true;
    boosterSel=null; slip=[]; save();
  }
}

function pushHist(b,action,extra={}){
  if(!b.history) b.history=[];
  b.history.push({by:me.id,role:(me.admin&&b.teamId!==me.id)?'house':'player',action,at:Date.now(),...extra});
}

function legLiveInfo(leg,g){
  if(!g) return {out:null,score:''};
  const out=evalLeg(leg,g);
  let score='';
  if(leg.type==='match'||leg.kind==='match_total'){
    const m=g.matches.find(m=>m.id===leg.matchId);
    if(m&&m.result) score=m.result.homePts+'–'+m.result.awayPts+(leg.kind==='match_total'?' ('+(m.result.homePts+m.result.awayPts)+' total)':'');
  } else if(leg.kind==='top_score'){
    const played=g.matches.filter(m=>m.home&&m.away&&m.result);
    if(played.length){
      let best=null;
      played.forEach(m=>{[[m.home,m.result.homePts],[m.away,m.result.awayPts]].forEach(([t,p])=>{ if(!best||p>best[1]) best=[t,p]; });});
      if(best) score='top: '+team(best[0]).name+' '+best[1];
    }
  } else if(leg.teamId){
    const m=g.matches.find(m=>m.home===leg.teamId||m.away===leg.teamId);
    if(m&&m.result) score=(m.home===leg.teamId?m.result.homePts:m.result.awayPts)+' pts';
  }
  return {out,score};
}

function legChip(info){
  if(info.out==='won') return '<span class="lr won">✓</span>';
  if(info.out==='lost') return '<span class="lr lost">✗</span>';
  if(info.out==='void') return '<span class="lr void">–</span>';
  return '<span class="lr pend">·</span>';
}

        ${b.inplay?'<span class="flag late">🔴 IN-PLAY</span>':''}

      <span class="pill st-${b.status}">${stLabel}</span>
    </div>
    <ul class="legs">${b.legs.map(l=>{

      return `<li>${legChip(info)}${esc(l.label)} <b class="mono">@ ${fmtOdds(l.odds)}</b>${info.score?`<span class="legscore">(${esc(info.score)})</span>`:''}</li>`;
    }).join('')}</ul>
    <div class="nums">

      <span>Odds<b class="mono">${fmtOdds(b.effOdds)}</b></span>
      <span>Returns<b class="mono" style="color:var(--teal)">${GBP(b.stake*b.effOdds)}</b></span>

function toggleBox(id){ document.getElementById(id).classList.toggle('open'); }

function houseAccept(id){
  const b=getBet(id);
  if(b.status==='counter_user'&&b.offer){ b.stake=b.offer.stake; b.effOdds=b.offer.effOdds; b.offer=null; }
  b.status='accepted'; pushHist(b,'accepted'); save(); render(); toast('Bet accepted ✓');
  pushNotif(b.teamId,'bet_accepted',`Your bet was accepted by the house! ${b.legs.length===1?b.legs[0].label:b.legs.length+'-leg acca'} @ ${fmtOdds(b.effOdds)} · £${b.stake}`);
}

function houseReject(id){
  const b=getBet(id); b.status='rejected'; b.offer=null; pushHist(b,'rejected'); save(); render(); toast('Bet rejected');
  pushNotif(b.teamId,'bet_rejected',`Your bet was rejected by the house. ${b.legs.length===1?b.legs[0].label:b.legs.length+'-leg acca'}`);
}

function sendCounter(id){
  const b=getBet(id);
  const stake=parseFloat(document.getElementById('cs_'+id).value);
  const odds=parseFloat(document.getElementById('co_'+id).value);
  const msg=document.getElementById('cm_'+id).value.trim();
  if(!stake||!odds){ toast('Need stake and odds',true); return; }
  const fromHouse=me.admin&&b.teamId!==me.id;
  b.offer={stake,effOdds:odds,by:fromHouse?'house':'player'};
  b.status=fromHouse?'counter_house':'counter_user';
  pushHist(b,'counter-offer',{stake,odds,message:msg});
  save(); render(); toast('Counter-offer sent 📨');
  if(fromHouse) pushNotif(b.teamId,'counter_offer',`The house sent a counter-offer: £${stake} @ ${fmtOdds(odds)}${msg?' — "'+msg+'"':''}`);
}

function acceptOffer(id){
  const b=getBet(id);
  b.stake=b.offer.stake; b.effOdds=b.offer.effOdds; b.offer=null;
  b.status='accepted'; pushHist(b,'accepted house offer'); save(); render(); bosh();
  setTimeout(()=>toast('Deal! Bet is ON'),1100);
}

function declineOffer(id){
  const b=getBet(id); b.status='rejected'; b.offer=null;
  pushHist(b,'declined house offer'); save(); render();
}

function cancelBet(id){
  const b=getBet(id);
  if(gwDeadlinePassed(gw(b.gwId))){ toast('Cutoff passed — locked in',true); return; }
  b.status='cancelled'; b.offer=null; pushHist(b,'cancelled'); save(); render(); toast('Bet cancelled');
}

function sendMsg(id){
  const b=getBet(id); const msg=document.getElementById('mm_'+id).value.trim();
  if(!msg) return; pushHist(b,'message',{message:msg}); save(); render(); toast('Sent 💬');
}

function vStandings(){
  const {pnl,house}=computePnl(S);
  const rows=S.teams.map(t=>({t,p:pnl[t.id]||0})).sort((a,b)=>b.p-a.p);
  const lt={}; S.teams.forEach(t=>lt[t.id]={p:0,w:0,d:0,l:0,pf:0,pts:0});
  const addRes=(hid,aid,hp,ap)=>{
    const h=lt[hid],a=lt[aid]; if(!h||!a) return;
    h.p++;a.p++;h.pf+=hp;a.pf+=ap;
    if(hp>ap){h.w++;h.pts+=3;a.l++;}
    else if(hp<ap){a.w++;a.pts+=3;h.l++;}
    else{h.d++;a.d++;h.pts++;a.pts++;}
  };
  const localEvents=new Set(S.gameweeks.filter(g=>g.event&&g.matches.some(m=>m.result)).map(g=>g.event));
  (S.history||[]).forEach(h=>{ if(!localEvents.has(h.event)) addRes(h.a,h.b,h.ap,h.bp); });
  S.gameweeks.forEach(g=>g.matches.forEach(m=>{
    if(!m.result||!m.home||!m.away) return;
    addRes(m.home,m.away,m.result.homePts,m.result.awayPts);
  }));
  const ltRows=S.teams.map(t=>({t,...lt[t.id]})).sort((a,b)=>b.pts-a.pts||b.pf-a.pf);
  return `<div class="card">
    <h3>💷 Money table</h3>
    <p class="muted small">Settled bets only. Green = the house owes you. Pink = pay up.</p>
    <table><tr><th>#</th><th>Team</th><th style="text-align:right">P&L</th></tr>
    ${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.t.name)}</b> <span class="muted small">${esc(r.t.owner)}</span></td><td style="text-align:right" class="mono ${r.p>0?'pos':r.p<0?'neg':''}">${GBP(r.p)}</td></tr>`).join('')}
    <tr><td></td><td><b>🏠 The House</b> <span class="muted small">Dan & Jack</span></td><td style="text-align:right" class="mono ${house>0?'pos':house<0?'neg':''}">${GBP(house)}</td></tr></table>
  </div>
  <div class="card"><h3>⚽ FPL League table</h3>
    <table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PF</th><th>Pts</th></tr>
    ${ltRows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.t.name)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.pf}</td><td><b>${r.pts}</b></td></tr>`).join('')}</table>
  </div>`;
}

function aiPerfSummary(tid){
  const bets=S.bets.filter(b=>b.teamId===tid);
  if(!bets.length) return "👻 Not a single bet placed yet. The Algo is RIGHT THERE. What are you scared of — winning?";
  const settled=bets.filter(b=>['won','lost'].includes(b.status));
  const wins=settled.filter(b=>b.status==='won');
  const {pnl}=computePnl(S); const p=pnl[tid]||0;
  const open=bets.filter(b=>['pending','accepted','counter_house','counter_user'].includes(b.status)).length;
  const accas=bets.filter(b=>b.legs.length>1).length;
  const bits=[];
  bits.push(`You've fired ${bets.length} bet${bets.length>1?'s':''} at the house${open?` (${open} still live)`:''}.`);
  if(settled.length) bits.push(`Record: ${wins.length}W–${settled.length-wins.length}L. ${p>0?`You're UP ${GBP(p)} — the house is quietly furious. 😤`:p<0?`You're down ${GBP(Math.abs(p))}. The house thanks you for your generous donations. 🙏`:`Dead level. Painfully sensible.`}`);
  if(bets.length>2){
    if(accas>bets.length/2) bits.push(`${Math.round(accas/bets.length*100)}% of your bets are accas. Bold. The maths called — it disagrees.`);
    else bits.push(`Mostly singles. Sensible. Boring, but sensible.`);
  }
  const big=wins.slice().sort((a,b)=>(b.settledPayout-b.stake)-(a.settledPayout-a.stake))[0];
  if(big) bits.push(`Best hit: ${GBP(big.settledPayout-big.stake)} profit. We remember. 🏆`);
  return bits.join(' ');
}

function aiLeagueSummary(){
  const {pnl,house}=computePnl(S);
  const rows=S.teams.map(t=>({t,p:pnl[t.id]||0})).sort((a,b)=>b.p-a.p);
  const counts={}; S.bets.forEach(b=>counts[b.teamId]=(counts[b.teamId]||0)+1);
  const active=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const bits=[];
  if(!S.bets.length) return "Twelve grown adults, one private bookmaker, zero bets placed. The bravery is overwhelming. Someone do something. 🦗";
  bits.push(house>0?`🏠 The house is up ${GBP(house)} — Dan & Jack are already browsing helicopters.`:house<0?`🚨 The house is DOWN ${GBP(Math.abs(house))}. Punters 1, capitalism 0.`:`The house is dead level, which somehow feels like everyone losing.`);
  if(rows[0]&&rows[0].p>0) bits.push(`${rows[0].t.name} (${rows[0].t.owner}) tops the money table at ${GBP(rows[0].p)} — insufferable in the group chat, presumably.`);
  const bottom=rows[rows.length-1];
  if(bottom&&bottom.p<0) bits.push(`Meanwhile ${bottom.t.name} is funding everyone's fun (${GBP(bottom.p)}). A true patron of the arts.`);
  if(active) bits.push(`Most addicted: ${team(active[0])?.name}, ${active[1]} bets and counting. Someone check on ${team(active[0])?.owner}. 📞`);
  return bits.join(' ');
}

/* ---- Test data seeder ---- */
function seedTestData(){
  const ids=S.teams.map(t=>t.id);
  const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const pair=()=>{const a=shuffle(ids);const f=[];for(let i=0;i<12;i+=2)f.push({home:a[i],away:a[i+1]});return f;};
  const mk=(name,deadline,kickoff,extra={})=>({id:nid('gw'),name,deadline,kickoff,status:'open',event:null,
    matches:pair().map(f=>({id:nid('m'),home:f.home,away:f.away,odds:recOdds(S,f.home,f.away),result:null})),...extra});
  const now=Date.now();
  const g1=mk('GW Test 1 · settled',now-3*864e5,now-3*864e5+90*60000);
  S.gameweeks.push(g1);
  ['murov','fride','dunny','kapil','henry'].forEach((tid,i)=>{
    const m=g1.matches[i%6]; const pick=['home','away','draw'][i%3];
    const odds=m.odds[pick];
    const label=pick==='draw'?`Draw — ${team(m.home).name} v ${team(m.away).name}`:`${team(pick==='home'?m.home:m.away).name} to WIN`;
    const stake=[20,50,10,100,25][i];
    S.bets.push({id:nid('bet'),teamId:tid,gwId:g1.id,legs:[{type:'match',gwId:g1.id,matchId:m.id,pick,odds,label}],
      stake,effOdds:odds,status:'accepted',placedAt:now-3.2*864e5,inplay:false,afterCutoff:false,limitFlags:[],
      history:[{by:tid,role:'player',action:'placed',stake,odds,at:now-3.2*864e5}]});
  });
  g1.matches.forEach(m=>m.result={homePts:35+Math.floor(Math.random()*50),awayPts:35+Math.floor(Math.random()*50)});
  S.bets.filter(b=>b.gwId===g1.id).forEach(b=>{ const r=settleBet(b,S); if(r){b.status=r.outcome;b.settledPayout=r.payout;b.settledAt=now-2.8*864e5;} });
  g1.status='settled';
  const g2=mk('GW Test 2 · open',now+24*36e5,now+25.5*36e5);
  S.gameweeks.push(g2); createPromoForGw(g2);
  const m2=g2.matches[0];
  S.bets.push({id:nid('bet'),teamId:'blank',gwId:g2.id,legs:[{type:'match',gwId:g2.id,matchId:m2.id,pick:'home',odds:m2.odds.home,label:`${team(m2.home).name} to WIN`}],
    stake:30,effOdds:m2.odds.home,status:'pending',placedAt:now-36e5,inplay:false,afterCutoff:false,limitFlags:[],
    history:[{by:'blank',role:'player',action:'placed',stake:30,odds:m2.odds.home,at:now-36e5}]});
  save(); toast('Test data loaded 🧪'); render();
}

function calGrid(sel){
  const t=ukToday();
  const todayUTC=Date.UTC(t.y,t.m-1,t.d);
  const dow=(new Date(todayUTC).getUTCDay()+6)%7;
  let html='<div class="calgrid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span class="dayhead">${d}</span>`).join('');
  for(let i=0;i<21;i++){
    const ts=todayUTC+(i-dow)*864e5;
    const dt=new Date(ts);
    const y=dt.getUTCFullYear(),mo=dt.getUTCMonth()+1,da=dt.getUTCDate();
    const off=ts<todayUTC?'off':'';
    const s=sel&&sel.y===y&&sel.m===mo&&sel.d===da?'sel':'';
    html+=`<span class="daychip ${off} ${s}" onclick="loaderDraft.koDay={y:${y},m:${mo},d:${da}};render()">${da}<div class="small muted" style="font-size:9px">${dt.toLocaleString('en-GB',{month:'short',timeZone:'UTC'})}</div></span>`;
  }
  return html+'</div>';
}
function matchTeamName(str){
  const s=str.toLowerCase().trim(); if(!s) return null;
  let t=S.teams.find(t=>t.name.toLowerCase()===s); if(t) return t.id;
  t=S.teams.find(t=>t.name.toLowerCase().includes(s)||s.includes(t.name.toLowerCase())); if(t) return t.id;
  t=S.teams.find(t=>t.owner.toLowerCase()===s); if(t) return t.id;
  const words=s.split(/\s+/).filter(w=>w.length>3);
  t=S.teams.find(t=>words.some(w=>t.name.toLowerCase().includes(w)));
  return t?t.id:null;
}
function parseBulkFixtures(){
  const lines=document.getElementById('bulkFix').value.split('\n').map(l=>l.trim()).filter(Boolean);
  let filled=0,failed=[];
  const fixtures=Array.from({length:6},()=>({home:'',away:''}));
  lines.slice(0,6).forEach((line,i)=>{
    const parts=line.split(/\s+vs?\.?\s+|\s+-\s+|,/i);
    if(parts.length<2){ failed.push(line); return; }
    const h=matchTeamName(parts[0]),a=matchTeamName(parts[1]);
    if(h&&a&&h!==a){ fixtures[i]={home:h,away:a}; filled++; } else failed.push(line);
  });
  if(filled){ loaderDraft.fixtures=fixtures; render(); }
  toast(filled+' fixture(s) parsed'+(failed.length?' · couldn\'t read: '+failed.join(' | '):''),failed.length>0&&filled===0);
}
function copyFixturePrompt(){
  const names=S.teams.map(t=>t.name).join(', ');
  const p=`Here is a screenshot of this week's draft fantasy league fixtures. The 12 teams are: ${names}.\n\nRead the fixtures from the image and output ONLY 6 lines in exactly this format (home team v away team), using the exact team names above:\nTeam A v Team B`;
  navigator.clipboard.writeText(p).then(()=>toast('Prompt copied 📋'));
}
function attachShot(input,which){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ if(which==='loader') loaderDraft.shot=e.target.result; else settlerShots[which]=e.target.result; render(); };
  r.readAsDataURL(f);
}
function saveLoader(){
  const d=loaderDraft;
  const fixtures=d.fixtures.filter(f=>f.home&&f.away);
  if(!fixtures.length){ toast('Pick at least one fixture',true); return; }
  let ko=null;
  if(d.koDay&&d.koTime){ const [hh,mm]=d.koTime.split(':').map(Number); ko=ukWallToTs(d.koDay.y,d.koDay.m,d.koDay.d,hh,mm); }

}

function fillScoresFromFpl(gwId){

function setScore(gwId,mId,k,val){
  const g=gw(gwId); const m=g.matches.find(m=>m.id===mId); if(!m) return;
  if(!m.result) m.result={homePts:null,awayPts:null};
  m.result[k]=val===''?null:parseInt(val);
  if(m.result.homePts===null&&m.result.awayPts===null) m.result=null;
  audit('score edit',`${g.name}: ${k} → ${val}`); save();
}
function parseBulkScores(gwId){
  const g=gw(gwId);
  const lines=document.getElementById('bulkScores_'+gwId).value.split('\n').map(l=>l.trim()).filter(Boolean);
  let n=0;
  lines.forEach((line,i)=>{
    const m=line.match(/(\d+)\s*[-–:]\s*(\d+)/);
    if(m&&g.matches[i]){ g.matches[i].result={homePts:+m[1],awayPts:+m[2]}; n++; }
  });
  save(); render(); toast(n+' score(s) filled');
}
function settleGw(gwId){
  const g=gw(gwId);
  const incomplete=g.matches.filter(m=>m.home&&m.away&&(!m.result||m.result.homePts===null||m.result.awayPts===null));
  if(incomplete.length){ toast(incomplete.length+' score(s) missing',true); return; }
  if(!confirm('Settle '+g.name+'? Accepted bets grade now; unaccepted bets expire.')) return;
  let won=0,lost=0;
  S.bets.filter(b=>b.gwId===gwId).forEach(b=>{
    if(b.status==='accepted'){
      const r=settleBet(b,S);
      if(r){
        b.status=r.outcome; b.settledPayout=r.payout; b.settledAt=Date.now();
        r.outcome==='won'?won++:lost++;
        const msg=r.outcome==='won'
          ?`🎉 BET WON! £${r.payout.toFixed(2)} incoming · ${b.legs.length} leg(s) @ ${fmtOdds(b.effOdds)}`
          :r.outcome==='void'
          ?`↩️ Bet voided — stake of £${b.stake} returned`
          :`❌ Bet lost · £${b.stake} · ${b.legs.length} leg(s) @ ${fmtOdds(b.effOdds)}`;
        pushNotif(b.teamId,'bet_settled',msg);
      }
    } else if(['pending','counter_house','counter_user'].includes(b.status)){
      b.status='expired';
    }
  });
  g.status='settled';
  S.promos.forEach(p=>{ if(p.gwId===gwId) p.active=false; });
  audit('settled',`${g.name}: ${won} won, ${lost} lost`);
  save(); render();
  toast(`${g.name} settled ⚖️ — ${won} winner(s), ${lost} loser(s)`);
}

    ${S.audit.slice(-60).reverse().map(a=>`<tr><td class="small mono">${fmtDT(a.at)}</td><td class="small">${team(a.by)?esc(team(a.by).owner):esc(a.by)}</td><td class="small"><b>${esc(a.action)}</b></td><td class="small muted">${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted small">No edits yet.</td></tr>'}</table></div>
  </details></div>
  <div class="card">
    <h3>💾 Data</h3>
    <div class="actions">
      <button class="btn secondary" onclick="exportData()">⬇ Export JSON</button>
      <button class="btn danger" onclick="resetAll()">Reset everything</button>
    </div>
  </div>`;
}
function saveSettings(){
  S.settings.maxStake=parseFloat(document.getElementById('setMaxStake').value)||300;
  S.settings.maxPayout=parseFloat(document.getElementById('setMaxPayout').value)||10000;
  S.settings.accaMarginPct=parseFloat(document.getElementById('setMargin').value)||10;
  S.settings.algoEdgePct=parseFloat(document.getElementById('setAlgoEdge').value)||20;
  audit('settings',`stake £${S.settings.maxStake} · payout £${S.settings.maxPayout} · acca ${S.settings.accaMarginPct}% · algo ${S.settings.algoEdgePct}%`);
  save(); render(); toast('Settings saved');
}

/* ================================================================
   FPL SYNC
   ================================================================ */
async function fplFetch(url){ const r=await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function fplSync(){
  const inp=document.getElementById('fplLeagueId');
  const id=((inp?inp.value:'')||S.fpl.leagueId||'').trim();
  if(!id){ toast('Enter your draft league ID',true); return; }
  S.fpl.leagueId=id; save(); toast('Syncing from FPL…');
  try{
    const det=await fplFetch('https://draft.premierleague.com/api/league/'+id+'/details');
    let boot=null;
    try{ boot=await fplFetch('https://draft.premierleague.com/api/bootstrap-static'); }catch(e){}
    ingestFpl(det,boot);
  }catch(e){
    const fb=document.getElementById('fplFallback'); if(fb) fb.style.display='block';
    toast('Direct fetch blocked (CORS) — GitHub Action handles this automatically. Use paste fallback below.',true);
  }
}
function fplPaste(){
  try{ ingestFpl(JSON.parse(document.getElementById('fplPasteBox').value),null); }
  catch(e){ toast('Could not parse JSON',true); }
}
function ingestFpl(det,boot){
  if(!det||!det.league_entries||!det.matches){ toast('Does not look like league details JSON',true); return; }
  const hbInp=document.getElementById('fplHoldback');
  if(hbInp) S.sim.holdback=Math.max(0,parseInt(hbInp.value)||0);
  const unmatched=[];
  det.league_entries.forEach(en=>{
    const tid=matchTeamName(en.entry_name||'')||matchTeamName(((en.player_first_name||'')+' '+(en.player_last_name||'')).trim());
    if(tid) S.fpl.entryMap[en.id]=tid; else if(en.entry_name) unmatched.push(en.entry_name);
  });
  const em=S.fpl.entryMap;
  S.history=[]; S.fplFixtures={}; S.sim.events={};
  const finished=det.matches.filter(m=>m.finished);
  const maxEv=finished.length?Math.max(...finished.map(m=>m.event)):0;
  const simFrom=maxEv-S.sim.holdback+1;
  det.matches.forEach(m=>{
    const a=em[m.league_entry_1],b=em[m.league_entry_2];
    if(!a||!b) return;
    if(m.finished){
      if(S.sim.holdback>0&&m.event>=simFrom){
        (S.sim.events[m.event]=S.sim.events[m.event]||[]).push({a,b,ap:m.league_entry_1_points,bp:m.league_entry_2_points});
        (S.fplFixtures[m.event]=S.fplFixtures[m.event]||[]).push({home:a,away:b});
      } else {
        S.history.push({event:m.event,a,b,ap:m.league_entry_1_points,bp:m.league_entry_2_points});
      }
    } else {
      (S.fplFixtures[m.event]=S.fplFixtures[m.event]||[]).push({home:a,away:b});
    }
  });
  const evList=boot?(Array.isArray(boot.events)?boot.events:(boot.events&&boot.events.data)||[]):[];
  evList.forEach(ev=>{ S.fpl.events[ev.id]={deadline:ev.deadline_time?new Date(ev.deadline_time).getTime():null,name:ev.name}; });
  S.fpl.lastSync=Date.now();
  audit('FPL sync','league '+S.fpl.leagueId+': '+S.history.length+' results'+(unmatched.length?' · UNMATCHED: '+unmatched.join(', '):''));
  save(); render();
  toast('✅ FPL synced — '+S.history.length+' results powering the odds'+(unmatched.length?' · unmatched: '+unmatched.join(', '):''));
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='lennon-lounge-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function resetAll(){
  if(!confirm('Wipe ALL gameweeks, bets, promos and settings?')) return;
  db.ref(ROOT).remove().then(()=>{ S=freshState(); save(); render(); toast('Fresh start'); });
}

/* ================================================================
   TEST DATA
   ================================================================ */
function seedTestData(){
  const ids=S.teams.map(t=>t.id);
  const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const pair=()=>{const a=shuffle(ids);const f=[];for(let i=0;i<12;i+=2)f.push({home:a[i],away:a[i+1]});return f;};
  const mk=(name,deadline,kickoff,extra)=>({id:nid('gw'),name,deadline,kickoff,status:'open',event:null,
    matches:pair().map(f=>({id:nid('m'),home:f.home,away:f.away,odds:recOdds(S,f.home,f.away),result:null})),...extra});
  const now=Date.now();
  const g1=mk('GW T1 · settled',now-3*864e5,now-3*864e5+90*60000);
  S.gameweeks.push(g1);
  ['murov','fride','dunny','kapil','henry'].forEach((tid,i)=>{
    const m=g1.matches[i%6]; const pick=['home','away','draw'][i%3];
    const odds=m.odds[pick];
    const label=pick==='draw'?`Draw — ${team(m.home).name} v ${team(m.away).name}`:`${team(pick==='home'?m.home:m.away).name} to WIN`;
    S.bets.push({id:nid('bet'),teamId:tid,gwId:g1.id,legs:[{type:'match',gwId:g1.id,matchId:m.id,pick,odds,label}],
      stake:[20,50,10,100,25][i],effOdds:odds,status:'accepted',placedAt:now-3.2*864e5,inplay:false,afterCutoff:false,limitFlags:[],
      history:[{by:tid,role:'player',action:'placed',stake:[20,50,10,100,25][i],odds,at:now-3.2*864e5}]});
  });
  g1.matches.forEach(m=>m.result={homePts:35+Math.floor(Math.random()*50),awayPts:35+Math.floor(Math.random()*50)});
  S.bets.filter(b=>b.gwId===g1.id).forEach(b=>{const r=settleBet(b,S);if(r){b.status=r.outcome;b.settledPayout=r.payout;b.settledAt=now-2.8*864e5;}});
  g1.status='settled';
  const g2=mk('GW T2 · open',now+24*36e5,now+25.5*36e5);
  S.gameweeks.push(g2); createPromoForGw(g2);
  const m2=g2.matches[0];
  S.bets.push({id:nid('bet'),teamId:'blank',gwId:g2.id,legs:[{type:'match',gwId:g2.id,matchId:m2.id,pick:'home',odds:m2.odds.home,label:`${team(m2.home).name} to WIN`}],
    stake:30,effOdds:m2.odds.home,status:'pending',placedAt:now-36e5,inplay:false,afterCutoff:false,limitFlags:[],
    history:[{by:'blank',role:'player',action:'placed',stake:30,odds:m2.odds.home,at:now-36e5}]});
  const g3=mk('GW T3 · in-play',now-3*36e5,now-90*60000,{inplayCutoff:now+30*36e5});
  g3.matches.slice(0,3).forEach(m=>m.result={homePts:10+Math.floor(Math.random()*40),awayPts:10+Math.floor(Math.random()*40)});
  S.gameweeks.push(g3);
  audit('test data','loaded GW T1 (settled), GW T2 (open), GW T3 (in-play)');
  save(); render();
  toast('🧪 Test gameweeks loaded — pre-match, live in-play, settled with graded bets');
}

/* ================================================================
   RENDER & NAVIGATION
   ================================================================ */
function needsActionCount(){ if(!me||!S) return 0; return (S.bets||[]).filter(b=>b.teamId===me.id&&b.status==='counter_house').length; }
function reviewCount(){ if(!S) return 0; return (S.bets||[]).filter(b=>['pending','counter_user'].includes(b.status)).length; }

function render(){
  if(!me||!S) return;
  const {pnl}=computePnl(S);
  const p=pnl[me.id]||0;
  const pnlEl=document.getElementById('myPnl');
  if(pnlEl) pnlEl.innerHTML=`P&L <span class="${p>0?'pos':p<0?'neg':''} mono">${GBP(p)}</span>`;
  const tabs=[
    {id:'home',label:'🏟️ Home'},
    {id:'builder',label:'⚽ Bet Builder'},
    {id:'mybets',label:'🧾 My Bets',badge:needsActionCount()},
    {id:'results',label:'🏆 Results'},
    {id:'usettings',label:'⚙️ Settings'},
  ];
  if(me.admin) tabs.push(
    {id:'review',label:'🏠 Bet Review',house:true,badge:reviewCount()},
    {id:'loader',label:'📥 GW Loader',house:true},
    {id:'odds',label:'🎯 Odds Setter',house:true},
    {id:'settler',label:'⚖️ Settler',house:true},
    {id:'office',label:'🗄️ Back Office',house:true},
  );
  const navEl=document.getElementById('nav');
  if(navEl) navEl.innerHTML=tabs.map(t=>`<button class="${t.house?'houseTab':''} ${activeTab===t.id?'active':''}" onclick="go('${t.id}')">${t.label}${t.badge?`<span class="badge">${t.badge}</span>`:''}</button>`).join('');
  const views={home:vHome,builder:vBuilder,mybets:vMyBets,results:vResults,usettings:vUserSettings,
    review:vReview,loader:vLoader,odds:vOddSetter,settler:vSettler,office:vOffice};
  const viewEl=document.getElementById('view');
  if(viewEl) viewEl.innerHTML=(views[activeTab]||vHome)();
  const cb=document.getElementById('chatBox'); if(cb) cb.scrollTop=cb.scrollHeight;
  // Mobile bottom nav active states
  ['home','builder','mybets','results'].forEach(id=>{
    const btn=document.getElementById('bn-'+id);
    if(btn) btn.classList.toggle('active',activeTab===id);
  });
  const moreBtn=document.getElementById('bn-more');
  if(moreBtn) moreBtn.classList.toggle('active',['usettings','review','loader','odds','settler','office'].includes(activeTab));
  // Notification dot
  renderNotifications();
  // Auto-refresh reminder on time-sensitive tabs
  clearTimeout(render._rt);
  if(['builder','review','settler'].includes(activeTab)){
    render._rt=setTimeout(render,60000);
  }
}
function go(tab){ activeTab=tab; render(); window.scrollTo(0,0); }

/* ================================================================
   INIT
   ================================================================ */
async function initApp(){
  const loadingEl=document.getElementById('loginLoading');
  if(loadingEl) loadingEl.style.display='block';
  try{
    await loadAuth();
    renderTeamGrid();
    setupPinInputs();
    const savedUser=sessionStorage.getItem('wlgyl_user');
    if(savedUser&&TEAMS.find(t=>t.id===savedUser)){
      S=freshState();
      me=TEAMS.find(t=>t.id===savedUser);
      document.getElementById('login').style.display='none';
      document.getElementById('app').style.display='block';
      const bn=document.getElementById('bottomNav'); if(bn) bn.style.display='';
      startListener();
    } else {
      if(loadingEl) loadingEl.style.display='none';
    }
  }catch(e){
    if(loadingEl) loadingEl.style.display='none';
    toast('Failed to connect — check your internet connection',true);
    console.error('Init error:',e);
  }
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
} else {
  initApp();
}
