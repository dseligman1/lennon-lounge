<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lennon Lounge">
  <!--
    Maskable variant: full-bleed background (no rounded corners baked in — the OS
    applies its own mask shape), with all meaningful content kept inside the
    circular "safe zone" (an inscribed circle covering the middle ~80% of the
    canvas, per the W3C maskable icon spec) so nothing important gets cropped.
  -->
  <defs>
    <linearGradient id="bgm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0533"/>
      <stop offset="70%" stop-color="#160026"/>
      <stop offset="100%" stop-color="#0b0014"/>
    </linearGradient>
    <linearGradient id="monom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>
    <linearGradient id="barm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffc931"/>
      <stop offset="100%" stop-color="#ff9d00"/>
    </linearGradient>
    <radialGradient id="glowVm" cx="80%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#9b5cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPm" cx="10%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#ff2d78" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff2d78" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bgm)"/>
  <rect width="512" height="512" fill="url(#glowVm)"/>
  <rect width="512" height="512" fill="url(#glowPm)"/>

  <text x="256" y="300" text-anchor="middle"
        font-family="'Archivo Black','Arial Black',sans-serif"
        font-weight="900" font-size="200" letter-spacing="-6"
        fill="url(#monom)">LL</text>

  <rect x="176" y="332" width="160" height="14" rx="7" fill="url(#barm)"/>
</svg>
